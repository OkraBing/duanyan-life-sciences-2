      `<option value="${esc(o)}" ${String(v[r])===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>
      <span class="car" aria-hidden="true"></span></span>`).join('')}</div>`};

/* 老字段没写 ty：按它带的标记推。area/opts/num 是改造前就有的写法。 */
function fldType(f){return f.ty||(f.area?'area':f.opts?'sel':'text')}
/* 一张表单的字段 = 主字段 + 高级参数。两边是同一批值，发起时一起交。 */
function allFields(c){return (c.fields||[]).concat(c.adv||[])}
function fldOf(cid,k){const c=cardById(cid);return c?allFields(c).find(x=>x.k===k)||null:null}
function fieldHTML(c,f){
  const fn=FLD[fldType(f)]||FLD.text;
  /* chips / tier / 滑块 这些里面自己有按钮，用 label 包住会把点击吞掉 */
  const bare=f.act||(f.acts&&f.acts.length)
    ||/^(chips|tier|dual|switch|step|file|map|range)$/.test(fldType(f));
  const acts=f.acts||(f.act?[f.act]:[]);
  /* 「下载模板」「填入示例数据」这类动作靠右：挨着字段名写，读起来像名字的一部分，
     上一版就出现过「模板序列 * 填入示例数据」连成一行的样子。 */
  const inner=`<span class="label label-r">${esc(f.label)}${
      f.req?' <i style="color:var(--err);font-style:normal">*</i>':''}
      ${acts.length?`<span class="grow"></span>`+acts.map(a=>
        `<button class="btn btn-gh" type="button" data-kact="${c.id}|${f.k}|${a.a}"
        style="min-height:1.375rem;padding:0 8px;font-size:0.6875rem;
        font-weight:400">${esc(a.n)}</button>`).join(''):''}</span>
    ${fn(c,f)}
    ${f.hint&&!(fldType(f)==='file'&&f.v)?`<span class="t-xs mut2">${esc(f.hint)}</span>`:''}`;
  const cls='field'+(f.wide?' wide':'');
  return bare?`<div class="${cls}">${inner}</div>`:`<label class="${cls}">${inner}</label>`;
}

/* 表单发起之后就收起来。
   一张已经提交的表单还张着输入框，读起来像「这里还要填点什么」——
   往下翻的时候，三四张这样的框摞在一起，对话就看不成对话了。
   收起之后值还在，只是换成一行行读的，而不是一格格填的。 */
function fmtFV(f){
  const v=f.v;
  if(v==null||v==='')return '—';
  if(Array.isArray(v))return v.length?v.join('、'):'—';
  if(typeof v==='boolean')return v?'开':'关';
  if(typeof v==='object')return Object.keys(v).filter(k=>v[k]&&v[k]!=='不用')
    .map(k=>k+'→'+v[k]).join('　')||'—';
  return String(v);
}

/* 输入框。@ 已经去掉：靠记符号召唤工具，要先知道有哪些工具才用得上。
   改成一个下拉框，打开就是一张能力与工具的清单，选中挂成 chip。 */

   上一版把这套删干净了，因为面板的 DOM 被摘走、事件还留着，Enter 会被截走。
   这次面板跟着输入框一起渲染，事件也在同一次绑定里挂——要么都在，要么都不在。 */
/* 输入框里两个触发符，各管一类：
     @ 引资料——这个课题的知识库、上传的文件、任务产出的文件
     / 唤技能——能力、我的模型、注册表里已启用的工具

   混在一个面板里，想引一份文件得先翻过十条能力。
   符号的分工也和大多数人手上的工具一致（/ 是命令，@ 是引用）。 */
const AT={open:false,q:'',i:0,list:[],pos:null,mode:'cap'};
function atSkills(){
  /* 能用的技能 = 产品自己的能力 + 自己训的、已启用的模型 + 注册表里已启用的工具。
     三类分开标，因为它们不是一回事：能力唤起一整段流程，工具是流程里的一步，
     我的模型是这个项目自己攒出来的打分器——它的来历（训在哪、留出 ρ 多少）
     要写在条目上，不然看的人没法判断该不该用它。 */
  const on=ENABLED();

      kind:'我的模型',hue:'dry'})))
    .concat(on.map(n=>{const t=toolBy(n);
      return {k:'tool:'+n,n:n,s:(t&&t.s)||'',kind:'工具',hue:(t&&t.cap==='wet')?'wet':'dry'}}));
}
/* 这个课题手上有哪些资料：知识库里的、上传的、任务产出的。 */
function atDocs(){
  const p=PRJ();const out=[];
  (DB.projects.find(x=>x.id===(S.bind||S.pid))||{kb:[]}).kb.forEach(f=>
    out.push({k:'doc:'+f,n:f,s:'上传到这个课题的',kind:'资料'}));
  (FILES(S.bind||S.pid)||[]).slice(0,40).forEach(f=>
    out.push({k:'doc:'+f.name,n:f.name,s:f.from||'',kind:'资料'}));
  const seen={};
  return out.filter(x=>seen[x.n]?false:(seen[x.n]=1));
}
function atToken(ta){
  const v=ta.value.slice(0,ta.selectionStart);
  /* 光标前只要有一个触发符就认。原先要求它前面是开头或空格，
     于是「帮我设计一对引物@」唤不起来——打了字又没敲空格的时候，
     等于这个入口不存在。匹配不到东西时面板本来就不显示。 */
  const m=v.match(/([@\/])([^\s@\/]*)$/);
  if(!m)return null;
  return {sym:m[1],mode:m[1]==='/'?'cap':'doc',q:m[2],start:v.length-m[2].length-1};
}
function atFilter(q,mode){
  const k=String(q||'').trim().toLowerCase();
  if(mode==='doc'){
    const L=atDocs().filter(x=>!k||(x.n+' '+x.s).toLowerCase().indexOf(k)>=0);
    return L.slice(0,8);
  }
  const L=atSkills().filter(x=>!k||(x.n+' '+x.s).toLowerCase().indexOf(k)>=0);
  if(k)return L.slice(0,7);
  /* 什么都没打的时候别让能力把名额占满：注册表里的工具也在这个面板里，
     一条都不露的话，不知道有这回事的人永远不会去打它的名字。 */
  const cap=L.filter(x=>x.kind==='能力').slice(0,5);
  const tool=L.filter(x=>x.kind!=='能力').slice(0,3);
  return cap.concat(tool);
}

/* 插入符在输入框里的像素位置：拿一个和输入框同字体、同宽、同内边距的影子 div，
   把光标前的文字放进去，末尾插一个零宽字符，量它的位置。
   textarea 没有别的办法拿到这个坐标。 */
function caretXY(ta){
  const st=getComputedStyle(ta);
  const d=document.createElement('div');
  ['boxSizing','width','paddingTop','paddingRight','paddingBottom','paddingLeft',
   'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth',
   'fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight',
   'textTransform','wordSpacing','tabSize'].forEach(k=>{d.style[k]=st[k]});
  d.style.position='absolute';d.style.left='-9999px';d.style.top='0';
  d.style.visibility='hidden';d.style.height='auto';
  d.style.whiteSpace='pre-wrap';d.style.overflowWrap='break-word';
  d.textContent=ta.value.slice(0,ta.selectionStart);
  const sp=document.createElement('span');sp.textContent='\u200b';d.appendChild(sp);
  document.body.appendChild(d);
  const x=sp.offsetLeft, y=sp.offsetTop;
  d.remove();
  return {x:x-ta.scrollLeft, y:y-ta.scrollTop,
    lh:parseFloat(st.lineHeight)||18};
}
function atPlace(){
  const box=document.querySelector('.atbox'), ta=document.getElementById('ask');
  if(!box||!ta)return;
  const wrap=box.parentElement;                       // .ask-b，它是定位参照
  if(!wrap)return;
  const c=caretXY(ta);
  const taX=ta.offsetLeft, taY=ta.offsetTop;
  const w=box.offsetWidth, maxX=wrap.clientWidth-w-8;
  box.style.left=Math.max(8,Math.min(taX+c.x-12,maxX))+'px';
  /* 面板开在光标那一行的上方：开在下方会盖住你正在打的这一行。 */
  box.style.top=(taY+c.y-6)+'px';
  box.style.transform='translateY(-100%)';
}
function atSync(ta){
  AT.pos=ta.selectionStart;

  if(!tok){if(AT.open){AT.open=false;render()}return}
  const L=atFilter(tok.q,tok.mode);
  const was=AT.open, old=AT.list.map(x=>x.k).join('|'), oldM=AT.mode;
  AT.mode=tok.mode;
  AT.open=L.length>0;AT.list=L;AT.i=Math.min(AT.i,Math.max(0,L.length-1));
  if(was!==AT.open||old!==L.map(x=>x.k).join('|')||oldM!==AT.mode)render();
}

  const before=ta.value.slice(0,tok.start), after=ta.value.slice(ta.selectionStart);
  S.ask=(before+after).replace(/[ \t]{2,}/g,' ');

/* ================= 两个管理面 =================
   检索、预测、设计是「动作」，说一句话就跑，不需要常驻入口。
   实验和模型不一样：批次会堆着等结果，模型训完要被别的任务挑来用——
   它们是会积累的资产，需要一个地方看全部。所以这两个留在导航里，
   和项目管理同一类，而不是功能直达入口。 */

/* 训出来的模型存在项目上，跟着项目走 */
function PMODELS(pid){const p=DB.projects.find(x=>x.id===(pid||S.pid));
  if(!p)return [];if(!p.models)p.models=[];return p.models}
/* 「模型制备」挂在导航的「资源」下，回答的是「我手上一共有哪些模型」，
   不是「这个项目里有哪些」——和数据集那一屏同一个道理。所以这三张表跨项目，
   每行标关联项目，点一下回到那个项目；上面给一个项目筛选器。
   底层存储不动：模型确实是从某个项目长出来的。 */
function ALL_MODELS(){
  const out=[];
  DB.projects.forEach(p=>PMODELS(p.id).forEach(m=>out.push(Object.assign({_pid:p.id,_pn:p.name},m))));
  return out;
}
/* 按编号找一条，不管它在哪个项目下 */
function mdlFind(id){return ALL_MODELS().find(m=>m.id===id)||null}
/* 在不在「我的模型」里。训练产出的默认不在——训完要自己挑一个同步进来，
   和 bootcamp 一样。导入进来的直接就在（人特地去导的，不用再确认一次）。 */
function inLib(m){return m&&m.lib!==false&&m.st!=='failed'}
function syncLib(id){const m=mdlFind(id);if(!m)return false;
  const real=PMODELS(m._pid).find(x=>x.id===id);if(!real)return false;
  real.lib=true;return true}
/* 当前筛选下的那一批，新的在前 */
function MDL_LIST(){
  const F=S.mdlProj||'all',A=ALL_MODELS();
  return (F==='all'?A:A.filter(m=>m._pid===F))
    .slice().sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));

/* 名称和编号合成一列（照 bootcamp）：名称在上，编号在下。
   原先编号单占一列，可人找一行是按名字找的，编号只在要引用它的时候才看——

   完整时间放在 title 里，鼠标停上去还是能看到年。 */

/* 跑得多快是量出来的，不是估的。performance.now() 没有的时候退回 Date.now()。 */
function now(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now()}
function addModel(pid,m){
  const L=PMODELS(pid);
  let n=0;DB.projects.forEach(x=>PMODELS(x.id).forEach(y=>{
    const g=/^M-(\d+)$/.exec(y.id||'');if(g)n=Math.max(n,+g[1])}));
  L.unshift(Object.assign({id:'M-'+String(n+1).padStart(3,'0'),at:nowStamp()},m));
  return L[0];
}
/* 评测报告：数都在模型记录里，这里只是把它们按人读的顺序排一遍。
   基线那几行是训练当时在同一个留出集上算的，不是现在重算的。 */
function mdlReport(m){
  const L=[];const w=x=>L.push(x);
  w('# 留出集评测报告　'+m.id);
  w('');
  w('- 模型：'+m.id+'（预测 '+m.target+'）');
  w('- 训练数据：'+(m.ds||'本项目实测'));
  w('- 基础模型：'+(m.base||'Descriptor Baseline'));
  w('- 训练方法：'+(m.method||'SFT')+'　参数更新：'+(m.upd||'—'));
  w('- 解法：'+((methodOf(m.method)||{}).algo||'—')+'　用时：'+(m.ms==null?'—':m.ms+' ms'));
  w('- 正则 λ：'+m.lam+(m.lamBy?'（'+m.lamBy+'）':''));
  w('- 切分：训练 '+m.nTrain+' 条，留出 '+m.nTest+' 条');
  w('- 生成时间：'+m.at);
  w('');
  w('## 留出集上的指标');
  w('');
  w('| 指标 | 值 |');
  w('| --- | --- |');
  w('| Spearman ρ | '+m.rho.toFixed(4)+' |');
  w('| RMSE | '+m.rmse.toFixed(4)+' |');
  w('| 留出集 SD | '+(m.sd==null?'—':m.sd.toFixed(4))+' |');
  w('| RMSE ÷ SD | '+(m.sd?(m.rmse/m.sd).toFixed(3):'—')+' |');
  w('');
  if(m.prosp){
    const q=m.prosp, g=prospGap(m);
    w('## 前瞻测试：第 '+q.round+' 轮（训练时没见过）');
    w('');
    w('留出集是从同一批数据里随机切的，分布和训练集一样；下一轮的候选是模型自己挑出来的，');
    w('分布不一样。这一段比的就是这两件事。');
    w('');
    w('| 在哪一批上 | 样本 | Spearman ρ | RMSE | RMSE ÷ SD |');
    w('| --- | --- | --- | --- | --- |');
    w('| 留出集 | '+m.nTest+' | '+m.rho.toFixed(4)+' | '+m.rmse.toFixed(4)+' | '
      +(m.sd?(m.rmse/m.sd).toFixed(3):'—')+' |');
    w('| 第 '+q.round+' 轮 | '+q.n+' | '+q.rho.toFixed(4)+' | '+q.rmse.toFixed(4)+' | '
      +(q.sd?(q.rmse/q.sd).toFixed(3):'—')+' |');
    w('');
    if(g)w('ρ 差 '+(g.d>=0?'+':'')+g.d.toFixed(4)+'。'+g.say);
    w('');
    w('第 '+q.round+' 轮里另有 '+q.inTrain+' 条训练时见过（已排除）、'
      +q.noY+' 条没有实测值、'+q.noP+' 条打不出分。测于 '+q.at+'。');
    w('');
  }
  if(m.bl&&m.bl.length){
    w('## 和基线比');
    w('');
    w('| 基线 | RMSE | ÷SD | ρ |');
    w('| --- | --- | --- | --- |');
    m.bl.forEach(b=>w('| '+b.n+' | '+b.rmse.toFixed(4)+' | '
      +(m.sd?(b.rmse/m.sd).toFixed(3):'—')+' | '+(b.rho==null?'不适用':b.rho.toFixed(4))+' |'));
    w('');
    w('结论：'+(m.vd||'—')+'。');
  }
  w('');
  w('留出集从头到尾没有参与标准化、选 λ 和特征选择中的任何一步。');
  w('ρ 衡量的是排序，RMSE 衡量的是数值。只赢排序的模型可以拿去挑候选，不能拿去报具体数值。');
  return L.join('\n');
}

/* 批次的进度：log 走到哪一步就是百分之多少。
   不是估的——EXP_STATUS 里一共几步，log 里记了几步，两个数一除。 */
function batchPg(b){
  const n=(b.log||[]).length, all=EXP_STATUS.length||8;
  if(b.status==='done')return 100;
  if(b.status==='canceled')return Math.round(n/all*100);
  return Math.min(95,Math.round(n/all*100));
}
/* 实验编号自动生成：B- 加年份后两位加月份，再加一个本月的流水号。

}

const LAB_FLT=[['all','全部'],['run','进行中'],['past','已结束']];
function labBatches(k){

  const F=S.dsProj||'all';

/* 数据源详情：看一眼就走的东西，用弹窗，不占一个路由。

function srcDetail(ab){

  const row=(k,v,dim)=>`<div class="krow"><span class="t-sm mut2" style="flex:0 0 5.5rem">${esc(k)}</span>

  modal(d.n,`<div class="col" style="gap:var(--s3)">
    <p class="t-md mut" style="margin:0">${esc(d.s)}</p>
    <div class="col" style="gap:0">

/* 模型制备分四屏，顺序就是这件事本身的顺序：
   手上有哪些模型 → 拿什么数据训 → 训练跑到哪一步 → 训出来的到底行不行。
   右上角的动作跟着当前这一屏走。只有「我的数据集」和「模型训练任务」有新建动作——
   模型是训出来的，评测是训练顺带产出的，这两屏凭空「新建」没有意义。 */
/* 「我的数据集」那一页和导航栏的「数据集」是同一屏，留两个入口只会让人以为是两样东西。
   这里只留和模型直接相关的三屏；要建数据集，新建训练任务的表单里有直达的入口。 */
/* 后两格是大模型那条线：选哪一家（在线推理）、整份数据集怎么跑（批量推理）。
   它们和前三格不是一类模型——前三格是自己训的打分器，后两格是接进来的大模型——
   但都是「模型这件事在哪儿办」，所以收在同一页，用副标题把这件事说清楚。 */
const MDL_TABS=[['cur','我的模型'],['job','模型训练'],['eval','模型评测'],
  ['infer','在线推理'],['batch','批量推理']];
const MDL_SUB={
  cur:'训练出的打分模型。部署后可在对话和排序任务中使用',
  job:'训练任务的进度与结果',
  eval:'模型在留出集上的评测结果',
  infer:'与已接入的模型对话，或并排比较回答',
  batch:'让模型逐条处理一份数据集，输出结果文件'};
/* 训练这件事新手最常漏的是第三步：训出来的模型默认是停用的，
   不启用就 @ 不到、排序任务里也选不着，而界面上看不出「它还没被挂上去」。
   所以这三步里真正要写的是那一步。 */
const TRAIN_STEPS=[
  ['选训练数据','用这个项目已回流的实测值，或选一份已发布的数据集。数据集发布后内容锁定，训练引用的才是确定的那一版。'],
  ['配置并训练','选基础模型和训练方法。闭式解一次算完，同时在留出集上评一次，并和两条基线比。'],
  ['启用后才能被调用','去「我的模型」把它打开。启用之后对话里 @ 得到，设计任务排序时也能选它；不启用它只是一条记录。']];
/* 两件事各有一张表单页：发起训练要同时看基础模型、方法、数据和切分；
   建数据集要同时看文件、列、目标列和切分。 */
/* 第二项是路由名；前面加 @ 表示它是一个动作，不是一页。
   评测不另开一页：挑一个模型、挑一轮，就这两件事。 */
/* 每一格的主操作都从这张表出，样式、位置、重量一致。
   「导入模型」原先是单独写死在页头里的一颗次级按钮，于是三格里只有它长得不一样——
   它是「我的模型」这一格唯一的主操作，就该和「新建训练任务」一个样子。 */
const MDL_ACT={cur:['导入模型','@mdlimport'],job:['新建训练任务','trainnew'],
  eval:['新建评测任务','@prospnew'],batch:['新建批量推理任务','bnew']};
/* 全产品一套运行态：排队中 / 进行中 / 已完成 / 异常 / 已取消。
   原先训练任务叫「异常」、通用任务叫「失败」，同一件事两个名字。
   统一到 bootcamp 的「异常」——跑挂的任务留在列表里，并写清在哪一步停的，
   这和 bootcamp 那一行的做法一致。
   另外补上运行态：原先训练任务只有两个终态，跑起来显示什么没有定义过。 */
const TRAIN_ST={queued:['排队中','c-mut'],running:['进行中','c-dry'],
  done:['已完成','c-ok'],failed:['异常','c-err'],canceled:['已取消','c-mut']};
/* 读一个文件进来。本产品导出的 JSON 走 importModel（能直接打分）；
   别的格式登记成一条「未接入」的记录——知道有这条路、只是这儿跑不了，本身是有用的。 */
function importFromFile(nm,file){
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result||'');
    let res=null;
    try{ res=importModel(txt,file.name) }catch(e){ res={ok:false,why:e.message} }
    if(res&&res.ok){ if(nm)res.model.name=nm; render();
      toast('已导入 '+res.model.id+'　现在就能拿它打分'); return }
    /* 跑不了的也收下，但标清楚 */
    const m=addModel(S.pid,{name:nm,st:'failed',lib:true,
      target:'—',src:'导入自 '+file.name,
      why:'这一版只能跑本产品导出的打分器 JSON。'+(res&&res.why?('读的时候：'+res.why):''),
      imported:true});
    render();
    toast(nm+' 已导入，但无法运行：'+(res&&res.why?res.why:'不是本产品导出的格式'));
  };
  r.onerror=()=>toast('这个文件读不出来');
  r.readAsText(file);
}
/* 从链接取模型卡。能不能跨域取，只有真发一次请求才知道（R17）——
   所以这里不预先断言，取到什么说什么。 */
function importFromUrl(nm,u){
  const out=document.getElementById('imout');
  const say=h=>{const o=document.getElementById('imout');if(o)o.innerHTML=h};
  say('<div class="row t-md mut" style="gap:var(--s3)"><span class="skel" style="width:13px;height:0.8125rem;border-radius:50%"></span>正在取…</div>');
  const m=/huggingface\.co\/([^\/?#]+\/[^\/?#]+)/.exec(u);
  const api=m?('https://huggingface.co/api/models/'+m[1]):u;
  fetch(api).then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
    .then(j=>{
      const mm=addModel(S.pid,{name:nm,st:'failed',lib:true,target:'—',
        src:'导入自 '+u,imported:true,
        why:'取到了模型卡，但权重要在后端跑——浏览器里没有推理后端，所以这里只是一条记录。'
          +(j.pipeline_tag?('任务类型 '+j.pipeline_tag+'。'):'')
          +(j.downloads!=null?('下载量 '+j.downloads+'。'):'')});
      render();toast(nm+' 已导入模型卡，权重无法在本机运行');
    })
    .catch(e=>{
      say('<span class="t-sm" style="color:var(--err)">取不到：'+esc(e.message)
        +'。</span>');

}
/* ---- 导入模型 ----
   这个产品本来就会导出一份模型 JSON，但导出的文件里标准化常数只有一句话、
   没有数，所以那份文件谁也用不了——包括它自己。补上数之后，再把读回来这一半接上：
   同事发你一个打分器，你就能直接拿来给自己的候选排序。
   **只认这个产品自己导出的格式**。PyTorch / ONNX 的权重这里跑不了，
   与其装作能读，不如直接说不能。 */
function importModel(txt,fname){
  let j; try{ j=JSON.parse(txt) }catch(e){ return {ok:false,why:'不是合法的 JSON：'+e.message} }
  const sc=j.scoring;
  if(!sc)return {ok:false,why:'这个文件里没有 scoring 段，不是本产品导出的打分器。'
    +'暂不支持 PyTorch、ONNX、safetensors 格式的权重。'};
  const st=sc.standardization||{};
  const w=j.weights, mu=st.mean, sg=st.sd;
  if(!Array.isArray(w)||!Array.isArray(mu)||!Array.isArray(sg))
    return {ok:false,why:'weights / standardization.mean / standardization.sd 必须都是数组'};
  if(w.length!==mu.length||w.length!==sg.length)
    return {ok:false,why:'长度对不上：权重 '+w.length+'、均值 '+mu.length+'、标准差 '+sg.length};
  if(!w.every(x=>isFinite(x))||!mu.every(x=>isFinite(x))||!sg.every(x=>isFinite(x)))
    return {ok:false,why:'里面有不是数的值'};
  const kind=sc.kind==='ds'?'ds':'proj';
  if(kind==='proj'&&!Array.isArray(sc.site_columns))
    return {ok:false,why:'这是按序列特征训的，但没带 site_columns，算不出特征'};
  if(kind==='ds'&&!(Array.isArray(sc.feature_columns)&&sc.feature_columns.length))
    return {ok:false,why:'这是按数据表列训的，但没带 feature_columns，不知道该取哪几列'};
  const m=addModel(S.pid,{target:j.target||'（没写目标）',
    name:(j.model||'导入')+'（导入）',
    rho:j.holdout_metrics?j.holdout_metrics.spearman_rho:null,
    rmse:j.holdout_metrics?j.holdout_metrics.rmse:null,
    sd:j.holdout_metrics?j.holdout_metrics.holdout_sd:null,
    nTrain:j.split?j.split.train:null,nTest:j.split?j.split.holdout:null,
    lam:j.lambda==null?null:j.lambda,lamBy:j.lambda_chosen_by||null,
    seed:j.seed==null?null:j.seed,
    /* 来历照抄文件里写的，不替它补。指标也是文件里的，不是这儿重新评的——
       这一点要让看的人知道，所以 src 里写明「来自导入的文件」。 */
    src:'导入自 '+(fname||'一个文件')+(j.dataset?('　原训练数据 '+j.dataset):''),
    imported:true,at:nowStamp(),
    base:'—',method:'—',upd:'—',
    kind:kind,w:w,mu:mu,sg:sg,
    sites:kind==='proj'?sc.site_columns:null,
    featK:kind==='ds'?sc.feature_columns:null,
    cols:j.features||null});
  return {ok:true,m:m,n:w.length};
}
function mdlCount(k){
  /* 在线推理没有「几条」这个概念：它是一张台子，不是一份清单。
     批量推理有，报任务数。 */
  if(k==='infer')return null;
  if(k==='batch')return BJ().length||null;

/* ---- 当前模型 ----

/* ================= 前瞻评测 =================
   留出集是从同一批数据里随机切出来的，分布和训练集一样；
   而下一轮的候选是模型自己挑出来的，分布不一样。
   **留出集上好看、下一轮崩掉，是定向进化里最常见的翻车方式**——
   所以这个领域真正信的不是留出集，是前瞻测试：
   用第 1..k 轮训，拿第 k+1 轮刚回流的实测值去验。
   前提是知道这个模型训练时见过哪些候选（trainIds）。不知道就说不知道。 */
function prospPool(m,pid,round){
  const seen={};(m.trainIds||[]).forEach(id=>seen[id]=1);
  const tf=fieldOfCol(m.target)||m.target;
  const mm=Object.assign({},m,{pid:pid});
  const rows=[];let noY=0,noP=0,inTrain=0;
  CANDS(pid).forEach(c=>{
    if(round!=null&&(c.firstRound||1)!==round)return;
    if(seen[c.id]){inTrain++;return}
    const y=mv(c,tf);
    if(y==null||!isFinite(+y)){noY++;return}
    const p=scoreWith(mm,c);
    if(p==null){noP++;return}
    rows.push({id:c.id,y:+y,p:p});
  });
  return {rows:rows,noY:noY,noP:noP,inTrain:inTrain};
}
function prospRun(m,pid,round){
  if(!canScore(m))return {ok:false,why:whyNoScore(m)};
  if(!m.trainIds||!m.trainIds.length)
    return {ok:false,why:'这个模型没记下训练时用了哪些候选，分不清哪一轮是它没见过的。'
      +'拿它训过的数据去验它，验出来的是记忆力不是预测力——所以这里不给数。重训一次就有了。'};
  const q=prospPool(m,pid,round), rows=q.rows, N=rows.length;
  if(N<3)return {ok:false,n:N,
    why:'第 '+round+' 轮里它没见过、又有实测值、又打得出分的候选只有 '+N+' 条'
      +'（训练时见过 '+q.inTrain+' 条，没有实测值 '+q.noY+' 条，打不出分 '+q.noP+' 条）。'
      +'少于 3 条算不出可信的相关性。'};
  const ys=rows.map(r=>r.y), ps=rows.map(r=>r.p);
  const rho=spearman(ps,ys);
  /* 打分和实测值是同一个量纲：岭回归直接拟合 y，scoreWith 返回的就是 y 的预测值。
     所以这里的 RMSE 和留出集那个 RMSE 可以直接并排比。 */
  const rmse=Math.sqrt(ps.reduce((t,p,i)=>t+(p-ys[i])*(p-ys[i]),0)/N);
  const my=ys.reduce((a,b)=>a+b,0)/N;
  const sd=Math.sqrt(ys.reduce((t,y)=>t+(y-my)*(y-my),0)/N);
  if(!isFinite(rho)||!isFinite(rmse))return {ok:false,why:'指标算不出来'};
  return {ok:true,n:N,rho:rho,rmse:rmse,sd:sd,
    inTrain:q.inTrain,noY:q.noY,noP:q.noP};
}
/* 哪几轮能拿来做前瞻：它没见过、而且够得上 3 条的那几轮 */
function prospRounds(m,pid){
  const p=DB.projects.find(x=>x.id===pid);
  if(!p||!m.trainIds||!m.trainIds.length||!canScore(m))return [];
  return p.rounds.map(r=>r.i)
    .map(i=>({i:i,n:prospPool(m,pid,i).rows.length}))
    .filter(x=>x.n>=3);
}
/* 两个数差多少才算「掉下来」？不给阈值下结论——
   只把差值摆出来，并说清它意味着什么。 */
function prospGap(m){
  const q=m.prosp; if(!q||m.rho==null)return null;
  const d=q.rho-m.rho;
  return {d:d,
    say:d<=-0.15?'前瞻比留出低得多：这个模型大概只学到了训练那批候选的特征，'
        +'拿它挑下一轮要当心。'
      :d>=0.1?'前瞻反而比留出高。样本少的时候这种事会发生，别当成它更准了。'
      :'前瞻和留出差不多：在这一轮上它没有明显掉下来。'};
}

/* 项目里已经有的表：任务产物、服务商回传、归档、上传到知识库的文件。
   只列此刻真能读出正文的那些——「本会话导出过」那一类只留了登记没留正文，
   列出来点开是空的，不如不列。 */
function dsFileText(e){
  try{
    if(e.kind==='arch')return e.arch&&e.arch.body!=null?String(e.arch.body):null;
    if(e.kind==='art')return String(e.art.make());
    if(e.kind==='kb'){const t=KBTEXT[e.pid+'|'+e.name];return t==null?null:String(t)}
    if(e.kind==='in'){const b=BATCHES.find(x=>x.id===e.batch);if(!b)return null;
      const rows=CANDS(b.pid).filter(c=>c.batch===b.id);
      return rows.length?artVariantsCsv(b.pid,rows):null}
  }catch(x){return null}
  return null;
}
function dsFiles(){
  return FILES(S.pid).filter(e=>{const x=kbExt(e.name);
    return (x==='csv'||x==='tsv')&&dsFileText(e)!=null});
}
function dsRead(txt,name){
  const q=parseTable(txt,name);
  NEWDS.fileName=name;NEWDS.text=txt;
  if(!q.ok){NEWDS.parsed=null;NEWDS.err=q.why;return}
  NEWDS.err='';NEWDS.parsed=q;
  if(!NEWDS.name)NEWDS.name=String(name).replace(/\.[^.]+$/,'');
  const nums=q.cols.filter(x=>x.type==='数值').map(x=>x.k);
  NEWDS.target='';NEWDS.feats=nums.slice();
}
/* 清单那份 JSON 两条路共用，免得两边各写一份、各自飘。 */
function dsManifest(ds,q,sp){
  return {name:'数据集_'+ds.id+'_清单.json',n:'数据集清单',
    note:ds.name+'　'+q.rows.length+' 行',kind:'dat',mime:'application/json',
    make:()=>JSON.stringify({dataset:ds.id,name:ds.name,description:ds.desc||'',
      source:ds.src,file:ds.file,
      fingerprint:ds.fp,rows:q.rows.length,
      columns:q.cols.map(x=>({name:x.k,type:x.type,missing_pct:+x.missPct.toFixed(2),
        distinct:x.uniq})),
      target:ds.target,features:ds.feats,task:ds.task,
      split:{ratio:ds.ratio,seed:ds.seed,
        train:sp.train.length,val:sp.val.length,test:sp.test.length},
      note:'切分存的是行号，在建集这一步定死；指纹对规范化后的正文算 FNV-1a，'
        +'只用来认是不是同一份，不是密码学哈希。',
      at:ds.at},null,2)};
}

/* ================= 真实氨基酸标度 =================
   训练那条能力要算真指标，就得有真特征。这三组标度都是文献里的标准值：
   Kyte–Doolittle 疏水性、Zamyatnin 残基体积(Å³)、pH 7 近似净电荷。 */
const AA_HYD={A:1.8,R:-4.5,N:-3.5,D:-3.5,C:2.5,Q:-3.5,E:-3.5,G:-0.4,H:-3.2,I:4.5,
  L:3.8,K:-3.9,M:1.9,F:2.8,P:-1.6,S:-0.8,T:-0.7,W:-0.9,Y:-1.3,V:4.2};
const AA_VOL={A:88.6,R:173.4,N:114.1,D:111.1,C:108.5,Q:143.8,E:138.4,G:60.1,H:153.2,
  I:166.7,L:166.7,K:168.6,M:162.9,F:189.9,P:112.7,S:89.0,T:116.1,W:227.8,Y:193.6,V:140.0};
const AA_CHG={D:-1,E:-1,K:1,R:1,H:0.1};

/* 可复现的伪随机：切分必须每次一样，否则同一份数据两次训练报两个指标。 */
function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function spearman(a,b){
  const rk=v=>{const ix=v.map((x,i)=>[x,i]).sort((p,q)=>p[0]-q[0]);
    const r=new Array(v.length);let i=0;
    while(i<ix.length){let j=i;while(j+1<ix.length&&ix[j+1][0]===ix[i][0])j++;
      const avg=(i+j)/2+1;for(let k=i;k<=j;k++)r[ix[k][1]]=avg;i=j+1}
    return r};
  const x=rk(a),y=rk(b),n=a.length;
  const mx=x.reduce((s,v)=>s+v,0)/n, my=y.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=x[i]-mx,dy=y[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}
  return sxx&&syy?sxy/Math.sqrt(sxx*syy):0;
}
/* 岭回归闭式解：特征少、样本少，没必要上梯度下降。 */
function ridge(X,y,lam){
  const n=X.length,d=X[0].length;
  const A=Array.from({length:d},(_,i)=>Array.from({length:d},(_,j)=>{
    let s=i===j?lam:0;for(let k=0;k<n;k++)s+=X[k][i]*X[k][j];return s}));
  const b=Array.from({length:d},(_,i)=>{let s=0;for(let k=0;k<n;k++)s+=X[k][i]*y[k];return s});
  for(let i=0;i<d;i++){
    let p=i;for(let r=i+1;r<d;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    [A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
    const pv=A[i][i]||1e-9;
    for(let r=i+1;r<d;r++){const f=A[r][i]/pv;
      for(let c=i;c<d;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}
  const w=new Array(d).fill(0);
  for(let i=d-1;i>=0;i--){let s=b[i];
    for(let c=i+1;c<d;c++)s-=A[i][c]*w[c];w[i]=s/(A[i][i]||1e-9)}
  return w;
}
/* 把一条变体变成特征。
   真实工程里的「打分模型」做的是一件具体的事：拿实测值去校准计算打分。
   所以第一组特征就是候选身上已有的计算量（ipTM、自洽 RMSD、可开发性），
   第二组是突变本身的理化变化量——这部分信息少，但不要白不要。
   （先只按理化特征训过一版，留出 ρ 在 0 附近：这些量确实预测不了实测值。
     计算打分里才有信号，ipTM 对 ΔTm 的单变量 ρ 就有 0.50。） */
function featOf(c,wt){
  const ms=mutsOf(c).map(parseMut).filter(m=>m&&m.wt&&m.to&&isFinite(m.pos));
  let dh=0,dv=0,dq=0;
  ms.forEach(m=>{
    dh+=(AA_HYD[m.to]||0)-(AA_HYD[m.wt]||0);
    dv+=(AA_VOL[m.to]||0)-(AA_VOL[m.wt]||0);
    dq+=(AA_CHG[m.to]||0)-(AA_CHG[m.wt]||0);});
  const f=[1,
    typeof c.iptm==='number'?c.iptm:0,
    typeof c.rmsd==='number'?c.rmsd:0,
    typeof c.dev==='number'?c.dev:0,
    dh/10, dv/100, dq, ms.length];
  return f.every(isFinite)?f:null;
}
const FEAT_N2=['截距','ipTM','自洽 RMSD','可开发性','Δ疏水性','Δ体积','Δ净电荷','突变个数'];
/* 用这个项目已经测出来的数据训一个打分器，并在留出集上报真指标。
   特征两部分：
   ① 理化变化量（疏水性、体积、净电荷）、突变个数、平均位置；
   ② 位点身份——同一个位点上的突变往往同涨同落，这是蛋白工程里真正带信息的一维。
   位点表只能从训练集里统计，否则留出集的位点信息提前漏进了模型。
   指标必须是算出来的；算不出来就说算不出来，不许报一个看着合理的数（R3）。 */
function trainRun(pid,target,ratio,lam,seed){
  const wt=PRJ_WT[pid]||'';
  const rows=CANDS(pid).map(c=>{
      const ms=mutsOf(c).map(parseMut).filter(m=>m&&m.wt&&m.to&&isFinite(m.pos));
      return {c:c,ms:ms,base:featOf(c,wt),y:mv(c,target)};
    }).filter(r=>r.base&&r.ms.length&&r.y!=null&&isFinite(r.y));
  if(rows.length<8)return {ok:false,n:rows.length};
  const r=rng(seed||20260113);
  const ix=rows.map((_,i)=>i).sort(()=>r()-0.5);
  const nTe=Math.max(3,Math.round(rows.length*(1-(ratio||0.75))));
  const te=ix.slice(0,nTe), tr=ix.slice(nTe);
  if(tr.length<5)return {ok:false,n:rows.length,why:'训练集太小'};
  /* 位点表只数训练集。按出现次数取前若干个，剩下的归到「其它」。 */
  const cnt={};tr.forEach(i=>rows[i].ms.forEach(m=>{cnt[m.pos]=(cnt[m.pos]||0)+1}));
  const sites=Object.keys(cnt).filter(k=>cnt[k]>=3)
    .sort((a,b)=>cnt[b]-cnt[a]).slice(0,10).map(Number);
  const vec=rw=>{const v=rw.base.slice();
    sites.forEach(p=>v.push(rw.ms.some(m=>m.pos===p)?1:0));
    v.push(rw.ms.some(m=>sites.indexOf(m.pos)<0)?1:0);
    return v};
  /* 标准化：ipTM 在 0–1，RMSD 在 0–5，位点是 0/1——量纲差这么多，
     单一个 λ 对它们的惩罚就不是一回事，强特征反而被压掉。
     均值方差只能从训练集算，再原样套到留出集上。
     （没做标准化那一版，ipTM 对 ΔTm 的单变量 ρ 有 0.50，模型反而只有 0.17。） */
  const Xr=tr.map(i=>vec(rows[i])), Y=tr.map(i=>rows[i].y), d=Xr[0].length;
  const mu=new Array(d).fill(0), sg=new Array(d).fill(1);
  for(let k=1;k<d;k++){
    mu[k]=Xr.reduce((s,r)=>s+r[k],0)/Xr.length;
    const v=Xr.reduce((s,r)=>s+(r[k]-mu[k])*(r[k]-mu[k]),0)/Xr.length;
    sg[k]=Math.sqrt(v)||1;
  }
  const z=r=>r.map((v,k)=>k?(v-mu[k])/sg[k]:1);
  const X=Xr.map(z);
  /* λ 只能在训练集内部选。拿留出集去挑 λ，等于让它偷看了答案，
     再报出来的指标就不是「没见过的数据上的表现」了。
     这里做 5 折交叉验证，选折内 RMSE 最小的那个 λ。 */
  let lamUsed=lam, cv=null;
  if(lam==null||!isFinite(lam)||lam<0){
    const grid=[0.1,0.3,1,3,10,30,100,300];
    const K=Math.min(5,X.length);
    const fold=X.map((_,i)=>i%K);
    let bestL=grid[0],bestE=Infinity;
    grid.forEach(g=>{
      let se=0,m=0;
      for(let k=0;k<K;k++){
        const trX=[],trY=[],vaX=[],vaY=[];
        X.forEach((r,i)=>{if(fold[i]===k){vaX.push(r);vaY.push(Y[i])}else{trX.push(r);trY.push(Y[i])}});
        if(trX.length<2||!vaX.length)continue;
        const ww=ridge(trX,trY,g);
        if(!ww.every(isFinite))continue;
        vaX.forEach((r,i)=>{const pv=r.reduce((t,v,q)=>t+v*ww[q],0);
          if(isFinite(pv)){se+=(pv-vaY[i])*(pv-vaY[i]);m++}});
      }
      if(m){const e=Math.sqrt(se/m);if(e<bestE){bestE=e;bestL=g}}
    });
    lamUsed=bestL;cv={lam:bestL,rmse:bestE,grid:grid.length};
  }
  const w=ridge(X,Y,lamUsed);
  const pr=te.map(i=>z(vec(rows[i])).reduce((s,v,k)=>s+v*w[k],0));
  const ac=te.map(i=>rows[i].y);
  if(!w.every(isFinite)||!pr.every(isFinite))return {ok:false,n:rows.length,why:'拟合没收敛'};
  const rmse=Math.sqrt(pr.reduce((s,v,k)=>s+(v-ac[k])*(v-ac[k]),0)/pr.length);
  const mean=ac.reduce((s,v)=>s+v,0)/ac.length;
  const sd=Math.sqrt(ac.reduce((s,v)=>s+(v-mean)*(v-mean),0)/ac.length);
  const rho=spearman(pr,ac);
  if(!isFinite(rmse)||!isFinite(rho))return {ok:false,n:rows.length,why:'指标算不出来'};
  /* ---- 基线 ----
     一个 ρ=0.25 单看是没有意义的：要知道它值不值，得和「什么都不学」比。
     两条基线都在同一个留出集上算，用的是同一批样本、同一个切分。 */
  const trY=tr.map(i=>rows[i].y);
  const trMean=trY.reduce((a,b)=>a+b,0)/trY.length;
  const rmseOf=pp=>Math.sqrt(pp.reduce((t,v,k)=>t+(v-ac[k])*(v-ac[k]),0)/pp.length);
  /* 基线一：永远预测训练集均值。它没有排序信息，所以不报 ρ——
     给一个 0 会被当成「算出来是 0」，不给才是实话。 */
  const b0={n:'常数基线（永远预测训练集均值）',rmse:rmseOf(ac.map(()=>trMean)),rho:null};
  /* 基线二：只用一个特征。哪个特征最好**在训练集上**定，不能拿留出集挑——
     拿留出集挑等于偷看答案，挑出来的基线会虚高。 */
  let b1=null;
  const D=X[0].length;
  for(let j=1;j<D;j++){
    let sx=0,sy=0,sxx=0,sxy=0;const m=X.length;
    for(let k=0;k<m;k++){sx+=X[k][j];sy+=Y[k];sxx+=X[k][j]*X[k][j];sxy+=X[k][j]*Y[k]}
    const den=m*sxx-sx*sx; if(Math.abs(den)<1e-12)continue;
    const b=(m*sxy-sx*sy)/den, a0=(sy-b*sx)/m;
    let se=0;for(let k=0;k<m;k++){const e=(a0+b*X[k][j])-Y[k];se+=e*e}
    const trRmse=Math.sqrt(se/m); if(!isFinite(trRmse))continue;
    if(!b1||trRmse<b1.trRmse)b1={j:j,a:a0,b:b,trRmse:trRmse};
  }
  let base1=null;
  if(b1){
    const pp=te.map(i=>b1.a+b1.b*z(vec(rows[i]))[b1.j]);
    if(pp.every(isFinite)){
      const colName=FEAT_N2.concat(sites.map(x=>'位点 '+x)).concat(['其它位点'])[b1.j];
      base1={n:'最好的单特征（'+(colName||('第 '+b1.j+' 列'))+'，在训练集上选的）',
        rmse:rmseOf(pp),rho:spearman(pp,ac)};
    }
  }
  return {ok:true,n:rows.length,nTrain:tr.length,nTest:te.length,nSite:sites.length,
    /* 训练集里是哪几条候选。没有这一行就做不了前瞻评测：
       分不清哪一轮是模型没见过的，拿它训过的数据去「验」它，
       验出来的是记忆力，不是预测力。 */
    trainIds:tr.map(i=>rows[i].c.id),
    trainRounds:[...new Set(tr.map(i=>rows[i].c.firstRound||1))].sort((a,b)=>a-b),
    sites:sites,
    /* 训完要能给新候选打分，所以把标准化参数和位点表一起存下来——
       少了它们，模型就只是一组没法用的权重。 */
    mu:mu,sg:sg,
    /* 导出模型时要让权重对得回特征，所以把列名按真实列序摊平带出去。 */
    cols:FEAT_N2.concat(sites.map(x=>'位点 '+x)).concat(['其它位点']),
    rho:rho,rmse:rmse,w:w,target:target,sd:sd,lam:lamUsed,cv:cv,
    /* 散点要画真点，所以预测值和实测值一起带出去 */
    pred:pr,act:ac,trainMean:trMean,
    base:[b0].concat(base1?[base1]:[])};
}


/* 实验室清单只认两种来源：批次数据里真出现过的服务商，和「自建」。
   不往里塞没接过的公司名。 */
/* 写成函数而不是常量：BATCHES 在这一段之后才声明，
   常量会在模块求值时就去读它，撞上暂时性死区。 */
function LAB_LIST(){return [...new Set(BATCHES.map(x=>x.vendor))].filter(Boolean).concat(['本地实验室'])}
/* ---- 配方库：标准测定方法，不是某一家服务商的私货 ---- */
const PROTO=[
 {id:'BLI', n:'BLI 亲和力测定', f:'kd', d:'生物膜干涉。固定一侧，梯度浓度测 kon/koff，拟合 KD。',
  need:['固定方式','浓度梯度','再生条件'], rep:'n = 3', days:'7–10 天'},
 {id:'SPR', n:'SPR 亲和力测定', f:'kd', d:'表面等离子共振。灵敏度高于 BLI，对再生条件更敏感。',
  need:['芯片类型','固定方式','浓度梯度'], rep:'n = 3', days:'10–14 天'},
 {id:'DSF', n:'DSF 热稳定性', f:'tm', d:'差示扫描荧光。升温测荧光拐点，给 Tm。',
  need:['缓冲液','升温速率'], rep:'n = 3', days:'5–7 天'},
 {id:'ENZ', n:'酶活测定', f:'kcat', d:'底物梯度测初速率，Michaelis–Menten 拟合 kcat/Km。',
  need:['底物','温度','pH'], rep:'n = 3', days:'7–12 天'},
 {id:'EXP', n:'表达量测定', f:'expr', d:'小量表达后定量可溶部分。常和上面任一项同批做。',
  need:['表达宿主','培养体积'], rep:'n = 2', days:'4–6 天'}];
function protoOf(id){return PROTO.find(x=>x.id===id)||PROTO[0]}
/* 用户自己上传的历史配方也进这张表，来源标出来——自带的和上传的不能混为一谈。 */
function protoHidden(){return LS.get('protohide',[])}
/* 内置那五份原先删不掉。但「这个实验室不用 ENZ」是真实需求，
   删不掉就只能一直看着它。做法是从清单里隐藏，不动 PROTO 本身：
   已经跑过的批次仍按编号指向它，历史记录不会因为今天删了一份配方而变成空的。 */
function protoAll(){
  const h=protoHidden();
  return PROTO.filter(x=>h.indexOf(x.id)<0).concat(LS.get('protos',[]));
}
function protoRm(id){
  const own=LS.get('protos',[]);
  if(own.some(x=>x.id===id)){LS.set('protos',own.filter(x=>x.id!==id));return}
  const h=protoHidden();if(h.indexOf(id)<0){h.push(id);LS.set('protohide',h)}
}

/* ================= 差异表达 =================
   没有 DESeq2。DESeq2 用的是负二项 GLM、离散度收缩和独立过滤，那是一整套推断，
   浏览器里没有实现，也不能拿别的东西冒充它的列名。
   这里做的是一条**说得清楚的**通路：按文库大小归一到 CPM、log2、每个基因做 Welch t 检验、
   Benjamini–Hochberg 校正。每个数都是算出来的，方法名写在界面上，不借 DESeq2 的壳。 */
function lgammaF(x){
  const g=[76.18009172947146,-86.50532032941677,24.01409824083091,
    -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);
  let q=1.000000000190015;
  for(let j=0;j<6;j++)q+=g[j]/++y;
  return -t+Math.log(2.5066282746310005*q/x);
}
function betacf(a,b,x){
  const MAXIT=200,EPS=3e-12,FPMIN=1e-300;
  const qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=1-qab*x/qap;
  if(Math.abs(d)<FPMIN)d=FPMIN;
  d=1/d;let h=d;
  for(let m=1;m<=MAXIT;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<EPS)break;
  }
  return h;
}
function betai(a,b,x){
  if(!(x>0))return 0; if(x>=1)return 1;
  const bt=Math.exp(lgammaF(a+b)-lgammaF(a)-lgammaF(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;
}
/* 双尾 t 检验的 p 值。和 R 的 2*pt(-|t|,df) 对到小数点后四位。 */
function tPval(t,df){
  if(!isFinite(t)||!isFinite(df)||df<=0)return null;
  const q=betai(df/2,0.5,df/(df+t*t));
  return isFinite(q)?Math.min(1,Math.max(0,q)):null;
}
/* Welch：两组方差不等也成立，不假设等方差。自由度按 Welch–Satterthwaite 算。 */
function welch(a,b){
  const n1=a.length,n2=b.length;
  if(n1<2||n2<2)return null;
  const m=v=>v.reduce((x,y)=>x+y,0)/v.length;
  const va=(v,mu)=>v.reduce((x,y)=>x+(y-mu)*(y-mu),0)/(v.length-1);
  const m1=m(a),m2=m(b),s1=va(a,m1),s2=va(b,m2);
  const se2=s1/n1+s2/n2;
  if(!(se2>0))return null;
  const t=(m1-m2)/Math.sqrt(se2);
  const df=se2*se2/((s1*s1)/(n1*n1*(n1-1))+(s2*s2)/(n2*n2*(n2-1)));
  const p=tPval(t,df);
  return p==null?null:{t:t,df:df,p:p,m1:m1,m2:m2};
}
/* Benjamini–Hochberg：按 p 排序，q_i = min_{j>=i}( p_j * n / j )，再按原序还原。 */
function bh(ps){
  const n=ps.length, ix=ps.map((p,i)=>[p,i]).sort((x,y)=>x[0]-y[0]);
  const q=new Array(n); let prev=1;
  for(let k=n-1;k>=0;k--){
    const v=Math.min(prev, ix[k][0]*n/(k+1));
    prev=v; q[ix[k][1]]=Math.min(1,v);
  }
  return q;
}
/* 一次差异表达。groups 是 {样本列名: '对照'|'处理'}。 */
/* 一份用来试跑的矩阵。计数是随机抽的，**没有任何真实的生物学差异**——
   这不是演示数据，是一把尺子：随机数据经过 BH 校正之后应该几乎一个基因都不剩。
   如果它留下一堆「显著」，那是统计实现有问题，不是发现了什么。
   用泊松近似生成计数（正态取整后截断），种子写死，每次一样，好复现。 */
/* 模板文件。不是截图也不是说明，是一份能直接改着用的 CSV：
   表头就是这一步真正会读的那几列，底下两行示意怎么填。 */
const TEMPLATES={
  mx:{n:'表达矩阵模板.csv',
    make:()=>['gene_id,ctrl_1,ctrl_2,ctrl_3,treat_1,treat_2,treat_3',
      'GENE0001,120,98,131,245,268,239',
      'GENE0002,45,52,39,41,47,44',
      '# 第一列是基因 ID，其余每列一个样本，格子里是原始计数（不是已经归一过的值）。',
      '# 样本列名随便取，分组在读进来之后自己指定，不靠列名猜。',
      '# 每组至少 2 个重复，否则算不出方差。'].join('\n')+'\n'},
  tab:{n:'数据集模板.csv',
    make:()=>['sample_id,feature_1,feature_2,feature_3,target',
      'S001,0.82,1.53,0.41,3.4',
      'S002,0.55,2.91,0.38,-1.2',
      '# 第一列是样本 ID，中间若干列是特征，最后一列是要预测的目标。',
      '# 列名随便取：目标列和特征列在读进来之后自己选，不靠列名猜。',
      '# 目标列必须是数值；非数值列会被认成类别列，这一版不拿它当目标。'].join('\n')+'\n'}};

function demoMatrix(nGene,nPer,seed){
  nGene=nGene||400; nPer=nPer||3;
  const r=rng(seed||20260113);
  const nor=()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const cols=[];
  for(let i=1;i<=nPer;i++)cols.push('ctrl_'+i);
  for(let i=1;i<=nPer;i++)cols.push('treat_'+i);
  const L=['gene_id,'+cols.join(',')];
  for(let g=1;g<=nGene;g++){
    /* 每个基因有自己的基线表达，跨样本只有随机波动，没有分组效应 */
    const mu=Math.exp(2+nor()*1.6);
    const row=cols.map(()=>Math.max(0,Math.round(mu*Math.exp(nor()*0.45))));
    L.push('G'+String(g).padStart(4,'0')+','+row.join(','));
  }
  return L.join('\n')+'\n';
}
function degRun(rows,cols,groups,o){
  o=o||{};
  const idCol=o.id||cols[0].k;
  const samp=Object.keys(groups).filter(k=>groups[k]==='对照'||groups[k]==='处理');
  const C=samp.filter(k=>groups[k]==='对照'), T=samp.filter(k=>groups[k]==='处理');
  if(C.length<2||T.length<2)
    return {ok:false,why:`每组至少要 2 个重复，现在对照 ${C.length} 个、处理 ${T.length} 个`};
  /* 文库大小：每个样本的总计数。归一到 CPM，否则测序深度的差异会被当成表达差异。 */
  const lib={}; samp.forEach(k=>lib[k]=0);
  const raw=[];
  rows.forEach(r=>{
    const v={}; let ok=true;
    samp.forEach(k=>{const x=+r[k]; if(!isFinite(x)||x<0){ok=false}else{v[k]=x;lib[k]+=x}});
    if(ok)raw.push({id:String(r[idCol]),v:v});
  });
  if(raw.length<10)return {ok:false,why:'能用的基因行只有 '+raw.length+' 行，太少'};
  if(samp.some(k=>!(lib[k]>0)))return {ok:false,why:'有样本的总计数是 0，归一不了'};
  const L2=x=>Math.log(x)/Math.LN2;
  const out=[];
  raw.forEach(g=>{
    const cpm=k=>g.v[k]/lib[k]*1e6;
    const a=T.map(k=>L2(cpm(k)+1)), b=C.map(k=>L2(cpm(k)+1));
    const w=welch(a,b); if(!w)return;
    const base=samp.reduce((t,k)=>t+cpm(k),0)/samp.length;
    out.push({id:g.id,base:base,lfc:w.m1-w.m2,t:w.t,df:w.df,p:w.p});
  });
  if(!out.length)return {ok:false,why:'一个基因都算不出 p 值（方差全是 0？）'};
  /* 独立过滤：表达量太低的基因噪声大，先剔掉再校正，能救回一些真信号。
     DESeq2 也做这件事，但选阈值的办法不同——这里用的是固定的 CPM 下限，不冒充它。 */
  const minCpm=o.minCpm==null?1:o.minCpm;
  const keep=o.filt===false?out:out.filter(x=>x.base>=minCpm);
  const q=bh(keep.map(x=>x.p));
  keep.forEach((x,i)=>x.q=q[i]);
  out.forEach(x=>{if(x.q===undefined)x.q=null});   // 被过滤掉的 padj 是 NA，不是 1
  const padj=o.padj==null?0.05:o.padj, lfcT=o.lfc==null?1:o.lfc;
  const sig=keep.filter(x=>x.q!=null&&x.q<padj&&Math.abs(x.lfc)>=lfcT);
  sig.sort((a,b)=>a.q-b.q||Math.abs(b.lfc)-Math.abs(a.lfc));
  return {ok:true,all:out,kept:keep.length,filtered:out.length-keep.length,
    sig:sig,up:sig.filter(x=>x.lfc>0).length,down:sig.filter(x=>x.lfc<0).length,
    nC:C.length,nT:T.length,C:C,T:T,padj:padj,lfcT:lfcT,minCpm:minCpm,
    lib:samp.map(k=>({k:k,n:lib[k]}))};
}

/* ================= 数据集 =================
   一个数据集是「一份定死了的数据 + 一份定死了的切分」。切分在建集这一步就定，
   不在训练时才切——否则同一份数据的两次训练根本不可比，比出来的差是切分的差。
   指纹对内容算，模型文件里会写上它，这样每个模型都能说清自己训在哪一版上。 */
function DSETS(pid){const q=DB.projects.find(x=>x.id===(pid||S.pid));
  if(!q)return [];if(!q.dsets)q.dsets=[];return q.dsets}
function addDset(pid,d){
  const L=DSETS(pid);
  /* 新建出来是草稿。草稿可以改目标列、改特征、重切；
     发布之后锁死，训练只认已发布的——不然同一个 DS 编号在两次训练之间悄悄变了，
     两个模型说自己训在同一版上，其实不是。 */
  let n=0;DB.projects.forEach(x=>{(x.dsets||[]).forEach(y=>{
    const m=/^DS-(\d+)$/.exec(y.id||'');if(m)n=Math.max(n,+m[1])})});
  const rec=Object.assign({id:'DS-'+String(n+1).padStart(3,'0'),
    at:nowStamp(),pid:pid||S.pid,st:'draft'},d);
  L.unshift(rec);return rec;
}
function dsPublish(id){
  const h=dsFind(id), d=h&&h.d;
  if(!d)return null;
  d.st='pub'; d.pubAt=nowStamp();
  return d;
}
const DS_ST={draft:['草稿','c-wet'],pub:['已发布','c-ok']};
function dsSt(d){return DS_ST[d&&d.st]||DS_ST.draft}
/* 跨项目的全部数据集，每条带上它从哪个项目来。
   DSETS(pid) 仍然按项目取——建集、训练那几条路要的就是本项目那一份。 */
function ALL_DSETS(){
  const out=[];
  DB.projects.forEach(p=>(p.dsets||[]).forEach(d=>out.push(Object.assign({_pid:p.id,_pn:p.name},d))));
  return out;
}
/* 按编号找一条，不管它在哪个项目下 */
function dsFind(id){
  for(const p of DB.projects){const d=(p.dsets||[]).find(x=>x.id===id);if(d)return {d:d,pid:p.id}}
  return null;
}
/* 内容指纹：对规范化后的正文算 FNV-1a。不是密码学哈希，只用来认「是不是同一份」。 */
function fp32(t){let h=0x811c9dc5;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=(h*0x01000193)>>>0}
  return h.toString(16).padStart(8,'0');
}
/* 读一份表：列名、类型、缺失率全部是数出来的。
   不接入就不编字段表——这条对上传的文件同样成立。 */
function parseTable(text,name){
  const sep=/\.tsv$/i.test(name||'')?'\t':',';
  const lines=String(text||'').split(/\r?\n/).filter(x=>x.length);
  if(lines.length<2)return {ok:false,why:'文件里不足两行，没有数据'};
  const head=csvCells(lines[0],sep).map(x=>x.trim());
  if(!head.length||head.every(x=>!x))return {ok:false,why:'第一行读不出列名'};
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const c=csvCells(lines[i],sep);
    if(c.length===1&&!c[0].trim())continue;
    const o={};head.forEach((h,j)=>{o[h]=(c[j]==null?'':c[j]).trim()});
    rows.push(o);
  }
  if(!rows.length)return {ok:false,why:'只有表头，没有数据行'};
  const cols=head.map(h=>{
    let num=0,miss=0;const seen={};let uniq=0;
    rows.forEach(r=>{const v=r[h];
      if(v===''||v==null||/^(na|nan|null|none|-)$/i.test(v)){miss++;return}
      if(isFinite(+v))num++;
      if(!seen[v]){seen[v]=1;uniq++}});
    const have=rows.length-miss;
    return {k:h,n:rows.length,miss:miss,missPct:miss/rows.length*100,uniq:uniq,
      /* 有值的里面九成以上能转成数，才算数值列。差一点就当类别列，不硬转。 */
      type:have&&num/have>=0.9?'数值':'类别'};
  });
  return {ok:true,rows:rows,cols:cols,sep:sep,
    fp:fp32(head.join('\x1f')+'\x1e'+rows.length+'\x1e'+lines.slice(1).join('\n'))};
}
/* 切分：按比例和种子定死，存的是行号，不是行本身。 */
function makeSplit(n,ratio,seed){
  const r=rng(seed||20260113);
  const ix=Array.from({length:n},(_,i)=>i).sort(()=>r()-0.5);
  const nTr=Math.round(n*ratio[0]), nVa=Math.round(n*ratio[1]);
  return {train:ix.slice(0,nTr), val:ix.slice(nTr,nTr+nVa), test:ix.slice(nTr+nVa)};
}
/* 在一个数据集上训。和项目内打分器共用岭回归与同一套评测规矩，
   区别只是特征从哪儿来：这里是用户自己选的列。 */
function dsTrain(ds,opt){
  const o=opt||{};
  const num=k=>{const c=ds.cols.find(x=>x.k===k);return c&&c.type==='数值'};
  if(!num(ds.target))return {ok:false,why:'目标列「'+ds.target+'」不是数值列，这一版只做回归'};
  const F=(ds.feats||[]).filter(num);
  if(!F.length)return {ok:false,why:'没有可用的数值特征列'};
  const use=[],Y=[];
  ds.split.train.concat(ds.split.test).forEach(()=>{});
  const row=i=>{const r=ds.rows[i];
    const y=+r[ds.target]; if(!isFinite(y))return null;
    const x=[1];for(const k of F){const v=+r[k];if(!isFinite(v))return null;x.push(v)}
    return {x:x,y:y}};
  const tr=[],te=[];
  /* 数据集如果是从候选表建的，会带一列变体编号。记下训练集里是哪几条，
     后面前瞻评测要靠它分辨「这一轮它见没见过」。
     外部传进来的表没有这一列，那就记不了——到时候如实说记不了。 */
  const vk=(ds.cols||[]).map(x=>x.k).find(k=>/^(variant|id)$/i.test(k));
  const trIds=[];
  ds.split.train.forEach(i=>{const q=row(i);if(!q)return;tr.push(q);
    if(vk&&ds.rows[i][vk]!=null)trIds.push(String(ds.rows[i][vk]))});
  ds.split.test.forEach(i=>{const q=row(i);if(q)te.push(q)});
  if(tr.length<5)return {ok:false,why:'训练集里只有 '+tr.length+' 行是完整的，少于 5 行训不了'};
  if(te.length<3)return {ok:false,why:'留出集里只有 '+te.length+' 行是完整的，少于 3 行评不了'};
  /* 标准化只用训练集 */
  const D=tr[0].x.length, mu=new Array(D).fill(0), sg=new Array(D).fill(1);
  for(let j=1;j<D;j++){
    const v=tr.map(q=>q.x[j]);
    mu[j]=v.reduce((a,b)=>a+b,0)/v.length;
    sg[j]=Math.sqrt(v.reduce((t,x)=>t+(x-mu[j])*(x-mu[j]),0)/v.length)||1;
  }
  const z=x=>x.map((v,j)=>j?(v-mu[j])/sg[j]:1);
  const X=tr.map(q=>z(q.x)), YY=tr.map(q=>q.y);
  /* λ 怎么选：有验证集就在验证集上选，没有就在训练集内部做 5 折。
     两条路都不碰留出集——碰了留出集，后面那个指标就不是留出指标了。 */
  let lam=o.lam, lamBy='手填';
  if(lam==null){
    const grid=[0.01,0.1,1,3,10,30,100,300];
    const va=[];ds.split.val.forEach(i=>{const q2=row(i);if(q2)va.push(q2)});
    if(va.length>=3){
      let best=grid[0],bE=Infinity;
      grid.forEach(g=>{const ww=ridge(X,YY,g);
        if(!ww.every(isFinite))return;
        let se=0,m2=0;
        va.forEach(q2=>{const pv=z(q2.x).reduce((t,vv,j)=>t+vv*ww[j],0);
          if(isFinite(pv)){se+=(pv-q2.y)*(pv-q2.y);m2++}});
        if(m2){const er=Math.sqrt(se/m2);if(er<bE){bE=er;best=g}}});
      lam=best;lamBy='验证集上选（'+va.length+' 行）';
    }else{
      const K=Math.min(5,X.length),fold=X.map((_,i)=>i%K);
      let best=grid[0],bE=Infinity;
      grid.forEach(g=>{let se=0,m2=0;
        for(let k=0;k<K;k++){const tX=[],tY=[],vX=[],vY=[];
          X.forEach((rr,i)=>{if(fold[i]===k){vX.push(rr);vY.push(YY[i])}else{tX.push(rr);tY.push(YY[i])}});
          if(tX.length<2||!vX.length)continue;
          const ww=ridge(tX,tY,g);if(!ww.every(isFinite))continue;
          vX.forEach((rr,i)=>{const pv=rr.reduce((t,vv,j)=>t+vv*ww[j],0);
            if(isFinite(pv)){se+=(pv-vY[i])*(pv-vY[i]);m2++}});}
        if(m2){const er=Math.sqrt(se/m2);if(er<bE){bE=er;best=g}}});
      lam=best;lamBy='训练集内 5 折交叉验证选（验证集不足 3 行）';
    }
  }
  const w=ridge(X,YY,lam);
  if(!w.every(isFinite))return {ok:false,why:'拟合没收敛'};
  const pr=te.map(q=>z(q.x).reduce((t,v,j)=>t+v*w[j],0));
  const ac=te.map(q=>q.y);
  if(!pr.every(isFinite))return {ok:false,why:'预测算不出来'};
  const rmse=Math.sqrt(pr.reduce((t,v,k)=>t+(v-ac[k])*(v-ac[k]),0)/pr.length);
  const m=ac.reduce((a,b)=>a+b,0)/ac.length;
  const sd=Math.sqrt(ac.reduce((t,x)=>t+(x-m)*(x-m),0)/ac.length);
  const rho=spearman(pr,ac);
  if(!isFinite(rmse)||!isFinite(rho))return {ok:false,why:'指标算不出来'};
  const trMean=YY.reduce((a,b)=>a+b,0)/YY.length;
  const rmseOf=pp=>Math.sqrt(pp.reduce((t,v,k)=>t+(v-ac[k])*(v-ac[k]),0)/pp.length);
  const base=[{n:'常数基线（永远预测训练集均值）',rmse:rmseOf(ac.map(()=>trMean)),rho:null}];
  /* 单特征基线同样在训练集上挑 */
  let b1=null;
  for(let j=1;j<D;j++){
    let sx=0,sy=0,sxx=0,sxy=0;const mm=X.length;
    for(let k=0;k<mm;k++){sx+=X[k][j];sy+=YY[k];sxx+=X[k][j]*X[k][j];sxy+=X[k][j]*YY[k]}
    const den=mm*sxx-sx*sx; if(Math.abs(den)<1e-12)continue;
    const bb=(mm*sxy-sx*sy)/den, aa=(sy-bb*sx)/mm;
    let se=0;for(let k=0;k<mm;k++){const e=(aa+bb*X[k][j])-YY[k];se+=e*e}
    const t=Math.sqrt(se/mm); if(isFinite(t)&&(!b1||t<b1.t))b1={j:j,a:aa,b:bb,t:t};
  }
  if(b1){const pp=te.map(q=>b1.a+b1.b*z(q.x)[b1.j]);
    if(pp.every(isFinite))base.push({n:'最好的单特征（'+F[b1.j-1]+'，在训练集上选的）',
      rmse:rmseOf(pp),rho:spearman(pp,ac)});}
  /* mu / sg / F 本来就算出来了，以前没返回，于是用数据集训出来的模型
     过不了 canScore，永远打不了分——建数据集 → 训练 → 给候选打分这条主闭环
     到这里就断了。带出来。 */
  return {ok:true,n:tr.length+te.length,nTrain:tr.length,nTest:te.length,nSite:0,
    trainIds:(vk&&trIds.length)?trIds:null,
    mu:mu,sg:sg,featK:F.slice(),
    cols:['截距'].concat(F),w:w,rho:rho,rmse:rmse,sd:sd,lam:lam,cv:lamBy!=='手填',
    lamBy:lamBy,nVal:ds.split.val.length,
    featNote:'特征是 '+ds.id+' 里你选中的 '+F.length+' 个数值列：'+F.join('、')
      +'。标准化用的是训练集的均值与标准差，原样套到验证集和留出集上——'
      +'拿全量数据算均值会把留出集的信息提前漏进模型。',
    target:ds.target,pred:pr,act:ac,trainMean:trMean,base:base,ds:ds.id,fp:ds.fp};
}

/* ================= 引物：真算，不是摆样子 =================
   最近邻热力学用 SantaLucia 1998 的统一参数（ΔH kcal/mol，ΔS cal/mol·K）。
   盐校正也按同一篇：二价离子折成等效一价 [Na+]eq = [Mono] + 120·√([Div]−[dNTP])，
   这正是 Primer3 默认 salt_corrections=1 的做法，所以数值和研究员的预期对得上。
   罚分式是本产品自己定的（下面写明了每一项），不是 Primer3 的目标函数——
   两者形状相近但权重不同，不能冒名。 */
const NN_H={AA:-7.9,TT:-7.9,AT:-7.2,TA:-7.2,CA:-8.5,TG:-8.5,GT:-8.4,AC:-8.4,
  CT:-7.8,AG:-7.8,GA:-8.2,TC:-8.2,CG:-10.6,GC:-9.8,GG:-8.0,CC:-8.0};
const NN_S={AA:-22.2,TT:-22.2,AT:-20.4,TA:-21.3,CA:-22.7,TG:-22.7,GT:-22.4,AC:-22.4,
  CT:-21.0,AG:-21.0,GA:-22.2,TC:-22.2,CG:-27.2,GC:-24.4,GG:-19.9,CC:-19.9};
function naEq(mono,div,dntp){return (mono+120*Math.sqrt(Math.max(0,div-dntp)))/1000}
function tmNN(sq,na,ct){
  na=na||naEq(50,1.5,0.6); ct=ct||50e-9;
  if(sq.length<2)return null;
  let dh=0,ds=0;
  for(let i=0;i<sq.length-1;i++){const k=sq.substr(i,2);
    if(NN_H[k]==null)return null; dh+=NN_H[k]; ds+=NN_S[k]}
  const ini=c=>(c==='G'||c==='C')?[0.1,-2.8]:[2.3,4.1];
  const a=ini(sq[0]), b=ini(sq[sq.length-1]);
  dh+=a[0]+b[0]; ds+=a[1]+b[1];
  ds+=0.368*(sq.length-1)*Math.log(na);
  const t=(1000*dh)/(ds+1.9872*Math.log(ct/4))-273.15;
  return isFinite(t)?t:null;
}
const DNA_C={A:'T',T:'A',G:'C',C:'G',N:'N'};
function rc(sq){return sq.split('').reverse().map(c=>DNA_C[c]||'N').join('')}
function gcPct(sq){return (sq.match(/[GC]/g)||[]).length/sq.length*100}
function polyX(sq){let m=1,r=1;for(let i=1;i<sq.length;i++){
  r=sq[i]===sq[i-1]?r+1:1;if(r>m)m=r}return m}
/* GC clamp：3′ 末端连续的 G/C 个数。Primer3 文档允许 0–5。 */
function gcClamp(sq){let n=0;for(let i=sq.length-1;i>=0;i--){
  if(sq[i]==='G'||sq[i]==='C')n++;else break}return n}
/* 最长互补连续碱基数。这是一个明确的结构性指标，不是 ΔG——
   没有二级结构计算后端，就不报 ΔG，省得被当成热力学值用。 */
function maxCompl(a,b){
  const B=rc(b);let best=0;
  for(let off=-(a.length-1);off<B.length;off++){
    let run=0;
    for(let i=0;i<a.length;i++){const j=i-off;
      if(j<0||j>=B.length){run=0;continue}
      if(a[i]===B[j]){run++;if(run>best)best=run}else run=0}}
  return best;
}
/* 大肠杆菌高表达基因里每个氨基酸用得最多的那个密码子。
   回译出来的是一条**本产品生成的编码序列**，不是数据库里的天然基因——
   界面上必须这么写，否则就是把构建序列当成天然序列给人。 */
const ECOLI_CODON={A:'GCG',R:'CGC',N:'AAC',D:'GAT',C:'TGC',Q:'CAG',E:'GAA',G:'GGC',
  H:'CAT',I:'ATC',L:'CTG',K:'AAA',M:'ATG',F:'TTC',P:'CCG',S:'AGC',T:'ACC',
  W:'TGG',Y:'TAT',V:'GTG'};
function backTranslate(aa){
  const q=String(aa||'').toUpperCase().replace(/[^A-Z]/g,'');
  let out='';for(const c of q){const k=ECOLI_CODON[c];if(!k)return null;out+=k}
  return out?out+'TAA':null;
}
function seqDna(t){
  return String(t||'').replace(/^>[^\n]*\n?/gm,'').toUpperCase().replace(/[^ACGTN]/g,'');
}
/* ================= sgRNA：只报真能算的 =================
   PAM 扫描、protospacer 提取、GC、poly-T 终止信号、序列内近似匹配——这些是确定性计算，
   在浏览器里就能做完，所以做。
   在靶打分（Rule Set 2 / Azimuth 2.0）是一个训练出来的模型，本产品没有它的权重，
   复现不了，就不给分——给一个编的分比不给分危险得多。
   脱靶也一样：没有参考基因组就只能在用户给的这段序列里扫，界面上必须写清楚范围。 */
function pamRe(pam){
  const m={N:'[ACGT]',R:'[AG]',Y:'[CT]',V:'[ACG]',W:'[AT]',S:'[CG]',
    K:'[GT]',M:'[AC]',B:'[CGT]',D:'[AGT]',H:'[ACT]',A:'A',C:'C',G:'G',T:'T'};
  let r='';for(const c of String(pam||'NGG').toUpperCase()){if(!m[c])return null;r+=m[c]}
  return r;
}
function mism(a,b){let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]){n++;if(n>9)return n}return n}
function sgrnaRun(o){
  const sq=seqDna(o.seq);
  const pam=String(o.pam||'NGG').toUpperCase();
  const pl=pam.length, gl=o.glen||20;
  if(sq.length<gl+pl+10)return {ok:false,why:'序列太短，装不下一个 '+gl+' nt protospacer 加 '+pam};
  const re=pamRe(pam); if(!re)return {ok:false,why:'PAM 写法看不懂：'+pam};
  const rx=new RegExp(re,'g');
  const hits=[];
  const scan=(str,strand)=>{
    rx.lastIndex=0;let m;
    while((m=rx.exec(str))!==null){
      rx.lastIndex=m.index+1;
      const ps=m.index-gl; if(ps<0)continue;
      const g=str.substr(ps,gl); if(/N/.test(g))continue;
      /* U6 启动子下 TTTT 会提前终止转录——这是确定的事实，所以标出来 */
      const polyT=/TTTT/.test(g);
      hits.push({g:g,pam:m[0],strand:strand,
        pos:strand==='+'?ps:(sq.length-(m.index+pl)),
        gc:gcPct(g),polyT:polyT,self:maxCompl(g,g)});
    }
  };
  scan(sq,'+'); scan(rc(sq),'−');
  if(!hits.length)return {ok:false,why:'这段序列里没有 '+pam+' 位点'};
  /* 序列内近似匹配：同一条 guide 在这段序列里还能对上几处。
     这不是全基因组脱靶，范围就是用户给的这一段。 */
  const pool=[];
  [sq,rc(sq)].forEach(str=>{for(let i=0;i+gl<=str.length;i++)pool.push(str.substr(i,gl))});
  hits.forEach(h=>{
    let m0=0,m1=0,m2=0,m3=0;
    pool.forEach(w=>{const d=mism(h.g,w);
      if(d===0)m0++;else if(d===1)m1++;else if(d===2)m2++;else if(d===3)m3++});
    h.near=[m0-1,m1,m2,m3];       /* 减掉它自己 */
    h.nearSum=h.near.reduce((a,b)=>a+b,0);
  });
  /* 排序只按能算的东西：GC 离 50% 越近越好、不带 poly-T、序列内近似匹配越少越好、
     自身互补段越短越好。这不是在靶打分，名字也不叫分。 */
  const rank=h=>Math.abs(h.gc-50)/10 + (h.polyT?5:0) + h.nearSum*0.8 + Math.max(0,h.self-6)*0.5;
  hits.forEach(h=>h.rk=rank(h));
  hits.sort((a,b)=>a.rk-b.rk);
  const seen={},pick=[];
  hits.forEach(h=>{if(pick.length>=(o.n||10)||seen[h.g])return;seen[h.g]=1;pick.push(h)});
  return {ok:true,guides:pick,nAll:hits.length,len:sq.length,pam:pam,glen:gl};
}

/* 一次引物设计。返回的每个数都是这里算出来的；算不出来就不返回，不补默认值。 */
function primerRun(o){
  const tpl=seqDna(o.tpl);
  const tgS=Math.max(0,(o.tgStart|0)), tgL=Math.max(1,(o.tgLen|0));
  const tgE=tgS+tgL;
  if(tpl.length<60)return {ok:false,why:'模板太短，少于 60 bp'};
  if(tgE>tpl.length)return {ok:false,why:'目标区间超出模板范围（模板 '+tpl.length+' bp）'};
  const na=naEq(o.mono==null?50:o.mono, o.div==null?1.5:o.div, o.dntp==null?0.6:o.dntp);
  const lo=o.lenMin||18, hi=o.lenMax||27, lopt=o.lenOpt||20;
  const tLo=o.tmMin||57, tHi=o.tmMax||63, tOpt=o.tmOpt||60;
  const gLo=o.gcMin||20, gHi=o.gcMax||80;
  const mx=o.polyX||5, mN=o.maxN==null?1:o.maxN, clampMax=o.clamp==null?5:o.clamp;
  const amp=o.amp&&o.amp.length?o.amp:[[150,250]];
  const dTmMax=o.dTm||1.0;
  const scan=(from,to,rev)=>{
    const out=[];
    for(let i=from;i<to;i++)for(let L=lo;L<=hi;L++){
      if(i+L>to)break;
      const raw=tpl.substr(i,L);
      const sq=rev?rc(raw):raw;
      if((sq.match(/N/g)||[]).length>mN)continue;
      const g=gcPct(sq); if(g<gLo||g>gHi)continue;
      if(polyX(sq)>mx)continue;
      const cl=gcClamp(sq); if(cl>clampMax)continue;
      const tm=tmNN(sq,na); if(tm==null||tm<tLo||tm>tHi)continue;
      out.push({sq:sq,pos:i,len:L,tm:tm,gc:g,clamp:cl,
        self:maxCompl(sq,sq), end3:sq.slice(-5)});
    }
    return out;
  };
  const L=scan(0,tgS,false), R=scan(tgE,tpl.length,true);
  if(!L.length||!R.length)return {ok:false,why:'这些条件下左右两侧都找不到合格引物'+
    (L.length?'（右侧 0 条）':R.length?'（左侧 0 条）':'（两侧都是 0 条）'),nL:L.length,nR:R.length};
  const pairs=[];
  L.forEach(a=>R.forEach(b=>{
    const prod=(b.pos+b.len)-a.pos;
    let band=-1;amp.forEach((w,k)=>{if(band<0&&prod>=w[0]&&prod<=w[1])band=k});
    if(band<0)return;
    const d=Math.abs(a.tm-b.tm); if(d>dTmMax)return;
    const cross=maxCompl(a.sq,b.sq);
    /* 罚分：每一项都写出来，权重是本产品定的。越低越好。 */
    const pen=Math.abs(a.tm-tOpt)+Math.abs(b.tm-tOpt)
      +0.5*(Math.abs(a.gc-50)+Math.abs(b.gc-50))/10
      +2*d
      +0.2*Math.abs(a.len-lopt)+0.2*Math.abs(b.len-lopt)
      +0.4*Math.max(0,a.self-4)+0.4*Math.max(0,b.self-4)+0.4*Math.max(0,cross-4)
      +band*1.5;
    pairs.push({l:a,r:b,prod:prod,dTm:d,cross:cross,pen:pen,band:band});
  }));
  if(!pairs.length)return {ok:false,why:'左右引物都有，但凑不出产物长度与 Tm 差都合格的一对',
    nL:L.length,nR:R.length};
  pairs.sort((x,y)=>x.pen-y.pen);
  /* 位置挨太近的几对其实是同一对，去掉重复 */
  const pick=[];
  pairs.forEach(q=>{
    if(pick.length>=(o.n||5))return;
    if(pick.some(w=>Math.abs(w.l.pos-q.l.pos)<3&&Math.abs(w.r.pos-q.r.pos)<3))return;
    pick.push(q);
  });
  return {ok:true,pairs:pick,nL:L.length,nR:R.length,tplLen:tpl.length,
    tg:[tgS,tgE],na:na,cond:{mono:o.mono==null?50:o.mono,div:o.div==null?1.5:o.div,
      dntp:o.dntp==null?0.6:o.dntp,ct:50}};
}

/* ================= 流程 =================
   每条能力一段确定性剧本：先出一张「要填什么」，填完出「在跑」，跑完出结果。
   数据全部来自项目里真实的那一份，不另造一套演示数据。 */
/* 两张卡之间要传一份几百行的解析结果。塞进卡片会跟着卡片一起被反复渲染，
   所以单独放一个旁置表，卡片只留一个 key。 */

   不隐藏是因为「有这条路、只是这里跑不了」本身是有用的信息；
   不可选是因为点得动就意味着能跑，那是骗人。 */

   原先写成一个下拉（「ESM-2 LoRA 微调」），三件事糊在一个名字里：
   换个参数更新方式就得新加一个选项，而且表格里看不出两个任务差在哪一维。 */

function baseOf(id){return BASE_MODELS.find(x=>x.id===id)||BASE_MODELS[0]}
function methodOf(n){return TRAIN_METHOD.find(x=>x.n===String(n||'').replace(/（.*/,''))||TRAIN_METHOD[0]}
/* 「训练数据」这一格：有数据集就写它的编号和名字——那是一条能顺着查回去的引用；
   没有就写实话。三处表格共用这一个，省得改一处漏两处。 */
/* 目标列怎么称呼：数据集里的列名带单位（dTm_℃），字段 key 不带（dTm）。
   剥掉单位再查显示名，不然表上会出现「打分器 · dTm_℃」。四处共用这一个。 */
function tgtName(t){
  if(!t)return '';
  const k=String(t).replace(/_[^_]*$/,'');
  return (FIELD[t]||FIELD[k]||{}).n||k;
}
function dsLabel(m){
  if(!m.ds)return esc('本项目实测');
  const h=(typeof dsFind==='function')?dsFind(m.ds):null;
  return esc(h?(m.ds+'　'+h.d.name):m.ds);
}

    PMODELS().filter(canScore).map(m=>m.id+'　预测 '+((FIELD[m.target]||{}).n||m.target)
      +'（'+(m.vd||'—')+'）'));
}
function SCORER_HINT(){
  const all=PMODELS(), ok=all.filter(canScore);
  if(!all.length)return '还没有模型。可以说「用这个项目的实测数据训一个打分模型」';
  const no=all.length-ok.length;
  const win=ok.filter(m=>m.winS).length;
  return (ok.length?ok.length+' 个能用于排序'+(win?('，其中 '+win+' 个排序赢过基线'):'，但没有一个排序赢过基线——用它排不一定比不用强'):'没有能用于排序的模型')
    +(no?('。另外 '+no+' 个是在上传数据集上训的，特征是那张表里的列，候选身上没有这些列，所以用不了'):'');
}

   没有 make 的条目就是没内容可下，按钮要置灰，不能点了弹一句话。 */

/* 产出条曾经贴在输入框上方，后来挪到了右上角（outBar）。旧的那一份没人叫，删掉。 */

/* ================= 一句一句地出 =================
   一次把整段话和四张卡全拍到屏幕上，人是读不过来的——他不知道该先看哪儿。
   所以回答按原来的顺序慢慢长出来：先是文字一段段出，再是卡片一张张出。

   注意不能每帧都 render()：整页重渲染会把用户正在输入的字冲掉，也白费。
   文字阶段只改最后那一个文字节点，只有新加一张卡时才整渲一次。 */
/* 节奏。原来一段话 22 下就吐完、卡片之间只隔 240ms，像一下子全贴出来，
   看不出哪句话配哪张卡。放慢到接近读的速度：
   chunk 是把全文切成多少段吐（段越多每段越短），ms 是段与段的间隔，
   cardGap 是上一张卡出完到下一张之间的停顿——这一停是给人看清上一张用的。 */
/* skel：一张卡出现之前先占位的那一段。计算早就算完了，这一段不是在等计算——
   是给人一个「下面要出东西了」的交代。没有它，卡是「唰」一下贴上来的，
   眼睛来不及跟。 */
const STREAM={ms:34, chunk:46, cardGap:620, skel:340};
function say(text,cards,then,cot){
  /* 传了就用传的；没传（undefined）就把当前轨迹收走挂上。
     显式传 null 表示「这条消息不要轨迹」——运行卡那条就是，
     它只是个占位，真正的步骤要等算完才写得出来。 */
  if(cot===undefined){
    if(TRACE.cur&&TRACE.cur.steps.length)
      traceStep({k:'write',n:'成稿',st:'ok',
        d:(text?String(text).length+' 字':'没有正文')
          +((cards&&cards.length)?'　'+cards.length+' 张卡':'')});
    cot=traceTake();
  }
  const m={role:'ai',text:'',_full:text||'',cards:[],_q:(cards||[]).slice(),
    cot:cot||null,_live:1,at:nowStamp()};
  convOf().push(m);
  render();scrollEnd();
  streamTick(m,then);
  return m;
}
function streamNode(){
  const t=document.querySelectorAll('.chat-flow .turn-ai');
  const last=t[t.length-1];
  return last?last.querySelector('.turn-p'):null;
}
/* 还在一帧一帧往外放的时候，发送键换成「直接看结果」。
   不叫「停止」：这一步的计算在点下按钮的那一刻就已经算完了，
   等的只是把它放出来，说「停止」是在描述一件没发生的事。 */
function busy(){
  return convOf().some(m=>m._live||(m.cards||[]).some(c=>c.t==='run'&&c.st==='run'));
}
function skipAll(){
  convOf().forEach(m=>{
    if(m._live)m._skip=1;
    (m.cards||[]).forEach(c=>{if(c.t==='run'&&c.st==='run'){c._skip=1;if(c._step)c._step()}});
  });
  render();
}
function streamTick(m,then){
  if(m._skip){
    m.text=m._full;
    while(m._q.length)m.cards.push(m._q.shift());
    m._skip=0;m._live=0;render();scrollEnd();if(then)then();return;
  }
  if(m.text.length<m._full.length){
    const step=Math.max(2,Math.ceil(m._full.length/STREAM.chunk));
    m.text=m._full.slice(0,m.text.length+step);
    const n=streamNode();
    if(n){n.textContent=m.text;scrollEnd()}else{render();scrollEnd()}
    setTimeout(()=>streamTick(m,then),STREAM.ms);
    return;
  }
  if(m._q.length){
    const c=m._q.shift();
    c._skel=1;m.cards.push(c);
    render();scrollEnd();
    setTimeout(()=>{
      c._skel=0;render();scrollEnd();
      /* 淡入动画跑完就把标记去掉，之后的重渲（打字、换页签）不会再放一遍 */
      setTimeout(()=>streamTick(m,then),Math.max(0,STREAM.cardGap-STREAM.skel));
    },STREAM.skel);
    return;
  }
  m._live=0;render();
  if(then)then();
}
/* 一步该停多久，看它是什么活。重活停久一点，用户才看得出卡在哪一步。 */
function stepMs(name){
  const t=String(name||'');
  if(/全基因组|比对|扫描|检索|搜索|采样|折叠|回折|交叉验证|拟合/.test(t))return 900;
  if(/归一|过滤|排序|配对|切分|提取|解析|打分|评估|校正/.test(t))return 620;
  return 460;
}
/* ---- 跑：进度是真的在走，走完才给结果 ---- */
function runStart(c,stages,done){
  c.st='run';c.pg=0;c.log=[];c.stages=stages;
  let i=0;
  const step=()=>{
    const cur=cardById(c.id);if(!cur||cur.st==='done')return;
    cur._step=step;
    cur.log.push(stages[i]);
    cur.pg=Math.round((i+1)/stages.length*100);
    i++;
    if(i>=stages.length){cur.st='done';
      /* 动画走了两秒，TRACE.cur 可能已经被别的操作换掉了。
         轨迹在发起那一刻就钉在这张卡上，这里按卡找回来。 */
      const tr=c._tr||null; if(tr)TRACE.cur=tr;
      /* 这一条要**先**写进轨迹再跑：done() 里会 say()，say() 会把轨迹收走。
         写在后面的话，算完那一步永远赶不上自己那条消息。
         耗时等 done() 回来再填——卡和轨迹共用同一个对象，改了就重画。 */
      const stp=traceStep({k:'calc',n:c.title||'本机计算',st:'ok',ms:null,
        io:[['步骤',stages.join(' → ')]]});
      const t0=now();
      try{ done(cur); stp.ms=Math.round(now()-t0); }
      catch(e){ stp.st='err'; stp.ms=Math.round(now()-t0);
        stp.d='停在这一步：'+e.message;
        TRACE.cur=null; throw e; }
      render();scrollEnd();return}
    render();scrollEnd();
    /* 每一步的耗时按它自己的名字估：带「全基因组」「扫描」「比对」「采样」这些字的
       本来就是重活，一步走 0.4 秒会让人以为它什么都没干。
       这不是在假装计算——计算是真的，只是真的太快了，快到看不见过程。 */
    if(cur._skip)step();else setTimeout(step,stepMs(stages[i-1]));
  };
  c._step=step;
  setTimeout(step,420);
}

SUBMIT.degrun=(c,v)=>{
  const src=PEND[c.src];
  if(!src){toast('这份矩阵的解析结果已经不在了，重新上传一次');return null}
  const q=src.parsed, G=v.map||{};
  const nC=Object.keys(G).filter(k=>G[k]==='对照').length;
  const nT=Object.keys(G).filter(k=>G[k]==='处理').length;
  if(nC<2||nT<2){toast(`每组至少 2 个重复，现在对照 ${nC} 个、处理 ${nT} 个`);return null}
  const run=mkCard('run',{title:'差异表达',st:'run',pg:0});
  runStart(run,['按文库大小归一到 CPM','log2 变换',
    `每个基因做 Welch t 检验（对照 ${nC} vs 处理 ${nT}）`,
    v.filt===false?'不做独立过滤':'按表达量做独立过滤','BH 校正 padj','按 padj 排序'],cur=>{
    const r=degRun(q.rows,q.cols,G,{padj:+v.padj||0.05,lfc:+v.lfc||0,
      filt:v.filt!==false,minCpm:+v.mincpm});
    if(!r.ok){say('分析未完成：'+r.why+'。');return}
    const fmt=x=>x==null?'NA':(x<1e-4?x.toExponential(2):x.toFixed(4));
    const rows=r.sig.slice(0,8).map(x=>[x.id,x.base.toFixed(1),x.lfc.toFixed(2),
      x.t.toFixed(2),fmt(x.p),fmt(x.q)]);
    cur.arts=emit(S.pid,[{name:'deg_'+nowStamp().replace(/[^\d]/g,'')+'.csv',n:'差异表达结果',
      note:r.sig.length+' 个显著（↑'+r.up+' ↓'+r.down+'）',kind:'tab',mime:'text/csv',
      make:()=>['gene,baseMean_cpm,log2FC,welch_t,df,pvalue,padj,significant']
        .concat(r.all.slice().sort((a,b)=>(a.q==null?2:a.q)-(b.q==null?2:b.q))
          .map(x=>csvRow([x.id,x.base.toFixed(3),x.lfc.toFixed(4),x.t.toFixed(4),
            x.df.toFixed(2),x.p.toExponential(4),x.q==null?'NA':x.q.toExponential(4),
            (x.q!=null&&x.q<r.padj&&Math.abs(x.lfc)>=r.lfcT)?'yes':'no']))).join('\n')+'\n'
        +'# 方法：按文库大小归一到 CPM，log2(CPM+1)，每个基因做 Welch t 检验，BH 校正。\n'
        +'# 不是 DESeq2：DESeq2 用负二项 GLM 与离散度收缩，这里没有实现。\n'
        +'# padj 为 NA 的是被独立过滤剔掉的基因（baseMean < '+r.minCpm+' CPM），不是 1。\n'}]);
    say(`${r.sig.length} 个基因显著：上调 ${r.up}，下调 ${r.down}。`
      +`阈值：padj < ${r.padj} 且 |log2FC| ≥ ${r.lfcT}。`
      +`${r.filtered?`另有 ${r.filtered} 个基因表达量低于 ${r.minCpm} CPM，已被过滤（padj 记为 NA）。`:''}`
      +`方法：CPM 归一 + log2 + Welch t 检验 + BH 校正（不是 DESeq2）。`,
      [mkCard('vol',{all:r.all,padj:r.padj,lfcT:r.lfcT,up:r.up,down:r.down,
        nC:r.nC,nT:r.nT,kept:r.kept}),
       mkCard('table',{title:'最显著的基因',note:r.sig.length+' 个显著',
         head:['基因','baseMean (CPM)','log2FC','Welch t','p','padj'],rows:rows,
         foot:'只列前 8 个，完整结果在产出文件里。padj 是 BH 校正后的值；'
           +'被独立过滤剔掉的基因 padj 写 NA，不写 1。'})]);
  });
  return run;
};

    const corpus=SEEK_CORPUS();
    /* swAlign 返回的 ident 是「对上的残基个数」，比例在 pct 上；长度字段叫 aln。
       一开始写成 ident*100 和 a.len，于是每条都被当成没对上，命中卡根本没出来。 */
    const hits=corpus.map(t=>{const a=swAlign(q,t.seq);
      return {n:t.name+(t.chain?' 链 '+t.chain:''),acc:t.acc||'',src:t.src||'内置样本库',
        seq:t.seq,pct:Math.round(a.pct),aln:a.aln}})
      .filter(h=>h.aln>0).sort((x,y)=>y.pct-x.pct).slice(0,+v.top||8);
    if(hits.length){
      cur.arts=emit(S.pid,[{name:'hits_'+nowStamp().replace(/[^\d]/g,'')+'.csv',n:'命中表',
        note:hits.length+' 条命中',kind:'tab',mime:'text/csv',
        make:()=>['name,accession,identity_pct,aligned_aa,source']
          .concat(hits.map(h=>csvRow([h.n,h.acc,h.pct,h.aln,h.src]))).join('\n')+'\n'}]);
      say(`比对完成，${hits.length} 条命中。一致度最高的是 ${hits[0].n}（${hits[0].pct}%）。`,
        [mkCard('hits',{title:'命中',hits:hits})]);
    }else say('没有命中。可更换序列库，或延长查询序列。');
  });
  return run;
};

SUBMIT.des=(c,v)=>{
  const n=Math.max(1,Math.min(400,+v.n||dfN()));
  DF.acc=v.acc||DF.acc;DF.blen=+v.blen||DF.blen;DF.n=n;
  const run=mkCard('run',{title:'生成候选 ×'+n,st:'run',pg:0});
  /* 最后一步写的是实际干了什么。选了打分器还说「按自洽 RMSD 排序」，
     就是日志和结果对不上——那比没有日志更糟。 */
  const rankId=String(v.rank||'').match(/^M-\d+/);
  runStart(run,['载入靶点','骨架生成','序列设计','回折复核',
    rankId?('按 '+rankId[0]+' 的预测值排序'):'按自洽 RMSD 排序'],cur=>{
    let L=CANDS().slice(0,n);
    /* 选了打分器就按它排。排完要说清楚排序依据换了——
       不说的话，同一批候选两次出来顺序不同，看的人会以为是生成变了。 */
    const mdl=rankId?PMODELS().find(x=>x.id===rankId[0]):null;
    let scored=0;
    if(mdl){
      L=L.map(c=>{const sc=scoreWith(mdl,c);if(sc!=null)scored++;
        return Object.assign({},c,{_pred:sc})})
        .sort((a,b)=>(b._pred==null?-Infinity:b._pred)-(a._pred==null?-Infinity:a._pred));
    }
    const D=L.filter(x=>(x.muts||[]).length);
    const nt='靶点 '+DF.acc+'　binder '+DF.blen+' AA';
    cur.arts=emit(S.pid,[
      {name:'designs_'+n+'.fasta',n:'序列',note:nt,kind:'seq',mime:'text/plain',
       make:()=>artDesignFasta(S.pid,D)},
      {name:'variants_'+n+'.csv',n:'变体表',note:nt,kind:'tab',mime:'text/csv',
       make:()=>artVariantsCsv(S.pid,D)}]);
    say(mdl
      ? `共 ${L.length} 条，按 ${mdl.id} 的预测值从高到低排序（${scored} 条有预测值）。`
        +`${mdl.winS?'该模型的排序在留出集上优于基线。'
          :'注意：该模型的排序在留出集上未优于基线，排序结果仅供参考。'}`
      : `共 ${L.length} 条，按当前项目的准入闸门排序。通过闸门的候选可以送检。`,
      [mkCard('vtab',{title:'候选',rows:L.slice(0,10),total:L.length,
        pred:mdl?mdl.id:null,predT:mdl?((FIELD[mdl.target]||{}).n||mdl.target):null})]);
  });
  return run;
};

/* 打分这件事里最容易糊弄过去的两处，都在这儿写明：
   1. 打分器训练时见过的候选也会被打上分，但那不是预测。单独标出来、单独计数。
   2. 打不出分的不许偷偷丢掉——特征缺了哪一项、缺几条，要说出来。 */
SUBMIT.rank=(c,v)=>{
  const mid=String(v.mdl||'').match(/^M-\d+/);
  const m=mid?ALL_MODELS().find(x=>x.id===mid[0]):null;
  if(!m){toast('先选一个打分器');return null}
  if(!canScore(m)){toast('该模型暂不能打分：'+whyNoScore(m));return null}
  const rm=String(v.who||'').match(/^第 (\d+) 轮/);
  const round=rm?+rm[1]:null;
  const topN=Math.max(1,Math.min(200,+v.n||10));
  const run=mkCard('run',{title:'批量打分　'+m.id,st:'run',pg:0});
  runStart(run,['取候选','抽特征','按训练集的均值与标准差标准化','代权重算分','按分数排序'],cur=>{
    const seen={};(m.trainIds||[]).forEach(id=>seen[id]=1);
    const mm=Object.assign({},m,{pid:S.pid});
    const tf=fieldOfCol(m.target)||m.target;
    const pool=CANDS().filter(x=>round==null||(x.firstRound||1)===round);
    const rows=[];let noP=0,nSeen=0;
    pool.forEach(x=>{
      const p=scoreWith(mm,x);
      if(p==null){noP++;return}
      if(seen[x.id])nSeen++;
      rows.push({id:x.id,muts:(x.muts||[x.mut]).filter(Boolean).join('/'),
        r:x.firstRound||1,p:p,y:mv(x,tf),seen:!!seen[x.id]});
    });
    if(!rows.length){
      say('无法打分：'+pool.length+' 条候选都缺少该模型需要的特征。'
        +(m.kind==='ds'
          ?'所需特征（'+(m.featK||[]).join('、')+'）不在候选表中。'
          :'')
        +'请更换模型，或补齐缺少的列。');
      return;
    }
    rows.sort((a,b)=>b.p-a.p);
    const fresh=rows.filter(x=>!x.seen);
    /* 单位字段两边带空格（「 pM」），直接拼进表头会出现「预测 KD（ pM）」 */
    const un=String((FIELD[tf]||{}).unit||'').trim();
    cur.arts=emit(S.pid,[{name:'打分_'+m.id+'_'+slug(m.target)+'.csv',n:'打分结果',
      note:rows.length+' 条　'+m.id,kind:'tab',mime:'text/csv',
      make:()=>['variant,muts,round,predicted_'+tf+',measured_'+tf+',in_training_set']
        .concat(rows.map(x=>csvRow([x.id,x.muts,x.r,x.p.toFixed(4),
          x.y==null?'':x.y,x.seen?'yes':'no']))).join('\n')+'\n'
        +'# predicted 由 '+m.id+' 在本机算出：标准化常数与权重都来自这一次训练。\n'
        +'# in_training_set=yes 的那些，这个模型训练时见过——给它们打的分不是预测。\n'}]);
    const head=['排名','变体','突变','轮次','预测 '+tgtName(m.target)+(un?'（'+un+'）':''),
      '实测','训练时见过'];
    const tbl=rows.slice(0,topN).map((x,i)=>[String(i+1),x.id,x.muts||'—',
      'R'+x.r,x.p.toFixed(3),x.y==null?'—':(+x.y).toFixed(2),x.seen?'见过':'没见过']);
    say(`${m.id} 已为 ${rows.length} 条候选打分`
      +(noP?`，另有 ${noP} 条因缺少特征未打分`:'')+`。`
      +(nSeen?`其中 ${nSeen} 条出现在训练集中，其分数不是预测值，已在 CSV 中标出。`
             :`这 ${rows.length} 条均未出现在训练集中。`)
      +(fresh.length?`未见过的 ${fresh.length} 条中，分数最高的是 ${fresh[0].id}。`:'')
      +(m.prosp?`该模型已在第 ${m.prosp.round} 轮上做过前瞻测试，ρ=${m.prosp.rho.toFixed(3)}（留出 ${m.rho.toFixed(3)}）。`
               :`该模型尚未做前瞻测试，留出集 ρ=${m.rho.toFixed(3)} 不代表在新一批候选上的表现。`),
      [mkCard('table',{title:'打分结果',note:rows.length+' 条，表里先看 '+Math.min(topN,rows.length)+' 条',
        head:head,rows:tbl,
        foot:'分数在本机计算，仅在同一模型内可比。'
          +'完整结果在产出文件里。'})]);
  });
  return run;
};
SUBMIT.train=(c,v)=>{
  /* 三栏任何一栏没接入都跑不了，而且要说清卡在哪一栏——
     只说「跑不了」，用户不知道该换基础模型还是换方法。 */
  const pickOf=(L,val)=>L.find(x=>String(val||'').indexOf(x.n)===0)||L[0];
  const bm=pickOf(BASE_MODELS,v.base), mt=pickOf(TRAIN_METHOD,v.method),
        pu=pickOf(PARAM_UPD,v.upd);
  const blocked=[['基础模型',bm],['训练方法',mt],['参数更新',pu]].filter(x=>!x[1].ok);
  if(blocked.length){
    say(blocked.map(([k,x])=>`${k}「${x.n}」未接入，无法运行：${x.why||'执行体未接入'}`).join('；')
      +`。请改用可在本机运行的配置。`,
      [mkCard('note',{title:'这一组配置无法运行',
        text:blocked.map(([k,x])=>k+'：'+x.n+'——'+(x.why||x.d)).join('\n')})]);
    c.done=1;return null;
  }
  if(mt.need==='esm'&&bm.id==='none'){
    toast('「'+mt.n+'」要有预训练主干才谈得上，基础模型不能选「Descriptor Baseline」');return null}
  if(mt.id==='ridge'&&bm.id!=='none'){
    toast('这一版的 SFT 不经过预训练主干，基础模型请选「Descriptor Baseline」');return null}
  const dsId=String(v.ds||'').match(/^DS-\d+/);
  if(dsId){
    const ds=DSETS(S.pid).find(x=>x.id===dsId[0]);
    if(!ds){toast('找不到 '+dsId[0]);return null}
    const run2=mkCard('run',{title:'训练中　'+ds.id,st:'run',pg:0});
    runStart(run2,['取 '+ds.id+' 的训练集','按训练集标准化',
      ds.split.val.length>=3?'在验证集上选 λ':'在训练集内部做 5 折选 λ',
      '闭式解拟合','在留出集上评估并和基线比'],cur=>{
      const t0=now();
      const r=dsTrain(ds,{lam:/自动/.test(String(v.lam))?null:parseFloat(v.lam)});
      const ms=Math.round(now()-t0);
      /* 没跑成的也记一条：训练任务那一屏要能回答「我上次训到底怎么了」，
         只留成功的话，失败就凭空消失了。 */
      if(!r.ok){addModel(S.pid,{st:'failed',why:r.why||'训练失败',ms:ms,ds:ds.id,
          target:ds.target,base:v.base,method:v.method,upd:v.upd});
        say('训练失败：'+r.why+'。');render();return}
      const mdl=addModel(S.pid,Object.assign({target:ds.target,rho:r.rho,rmse:r.rmse,sd:r.sd,
        nTrain:r.nTrain,nTest:r.nTest,lam:r.lam,n:r.n,ds:ds.id,ms:ms,
        /* 训练集里是哪几条候选。前瞻评测靠它分辨「这一轮它见没见过」 */
        trainIds:r.trainIds||null,
        lib:false,   /* 训完要自己同步进「我的模型」，和 bootcamp 一样 */
        base:v.base,method:v.method,upd:v.upd,lamBy:r.lamBy,bl:r.base,
        kind:'ds',w:r.w,cols:r.cols},verdictOf(r)));
      cur.arts=emit(S.pid,[{name:'模型_'+mdl.id+'_'+slug(ds.target)+'_ridge.json',n:'模型权重',
        note:ds.id+'　留出 ρ='+r.rho.toFixed(3),kind:'dat',mime:'application/json',
        make:()=>JSON.stringify({model:mdl.id,kind:'ridge',
          dataset:ds.id,dataset_name:ds.name,dataset_fingerprint:ds.fp,
          target:ds.target,features:r.cols,weights:r.w.map(x=>+x.toFixed(6)),
          lambda:r.lam,lambda_chosen_by:r.lamBy,
          split:{train:r.nTrain,val:r.nVal,holdout:r.nTest,ratio:ds.ratio,seed:ds.seed},
          holdout_metrics:{spearman_rho:+r.rho.toFixed(4),rmse:+r.rmse.toFixed(4),
            holdout_sd:+r.sd.toFixed(4),rmse_over_sd:+(r.rmse/r.sd).toFixed(3)},
          baselines:(r.base||[]).map(x=>({name:x.n,rmse:+x.rmse.toFixed(4),
            rmse_over_sd:+(x.rmse/r.sd).toFixed(3),
            spearman_rho:x.rho==null?null:+x.rho.toFixed(4)})),
          beats_all_baselines:(r.base||[]).every(x=>r.rmse<x.rmse),
          scoring:{kind:'ds',
            standardization:{mean:r.mu.map(x=>+x.toFixed(6)),sd:r.sg.map(x=>+x.toFixed(6))},
            feature_columns:r.featK,
            formula:'y = Σ wj · (xj − mean[j]) / sd[j]，j=0 是截距，x0=1。'},
          standardization:'除截距外各列按训练集的均值与标准差标准化，权重是标准化后的。',
          note:'λ 在'+r.lamBy+'；留出集没有参与任何一步。',
          at:nowStamp()},null,2)}]);
      say(`训练完成。在 ${ds.id} 的留出集上 ρ=${r.rho.toFixed(3)}，RMSE=${r.rmse.toFixed(3)}。`
        +`λ=${r.lam}，${r.lamBy}。`,
        [mkCard('metric',{r:r}),
         mkCard('scat',{pred:r.pred,act:r.act,mean:r.trainMean,target:ds.target})]);
    });
    return run2;
  }
  const run=mkCard('run',{title:'训练中',st:'run',pg:0});
  runStart(run,['取训练数据','抽特征','切分训练／留出','闭式解拟合','在留出集上评估'],cur=>{
    const lam=/自动/.test(String(v.lam))?null:parseFloat(v.lam);
    const t0=now();
    const r=trainRun(S.pid,v.target,parseFloat(v.ratio)||0.75,lam,+v.seed);
    const ms=Math.round(now()-t0);
    if(!r.ok){
      addModel(S.pid,{st:'failed',ms:ms,target:v.target,base:v.base,method:v.method,upd:v.upd,
        why:r.why||('带实测值的候选只有 '+r.n+' 条，少于 8 条')});
      say(r.why
        ?`训练失败：${r.why}。样本 ${r.n} 条。`
        :`无法训练：该项目只有 ${r.n} 条带实测值的候选，至少需要 8 条。`
          +`请先回流一批实测结果，或更换数据更多的项目。`);
      return;
    }
    const mdl=addModel(S.pid,Object.assign({target:v.target,rho:r.rho,rmse:r.rmse,sd:r.sd,
      nTrain:r.nTrain,nTest:r.nTest,lam:r.lam,n:r.n,ms:ms,trainIds:r.trainIds||null,
      lib:false,
      base:v.base,method:v.method,upd:v.upd,lamBy:r.lamBy,bl:r.base,
      seed:+v.seed,src:'本项目已回流的实测值（'+r.n+' 条）',
      kind:'proj',w:r.w,mu:r.mu,sg:r.sg,sites:r.sites,cols:r.cols},verdictOf(r)));
    cur.arts=emit(S.pid,[{name:'模型_'+mdl.id+'_'+slug(v.target)+'_ridge.json',n:'模型权重',
      note:'留出 ρ='+r.rho.toFixed(3)+'　RMSE='+r.rmse.toFixed(3),kind:'dat',
      mime:'application/json',
      make:()=>JSON.stringify({model:mdl.id,kind:'ridge',target:v.target,
        features:r.cols,
        weights:r.w.map(x=>+x.toFixed(6)),
        feature_note:'features 与 weights 按列一一对应；位点列是 0/1，'
          +'位点表只从训练集统计（出现 ≥3 次，取前 10），其余突变归入「其它位点」。',
        scoring:{kind:'proj',
          standardization:{mean:r.mu.map(x=>+x.toFixed(6)),sd:r.sg.map(x=>+x.toFixed(6))},
          site_columns:r.sites,
          formula:'y = Σ wj · (xj − mean[j]) / sd[j]，j=0 是截距，x0=1。'},
        standardization:'除截距外各列按训练集的均值与标准差标准化，权重是标准化后的。',
        split:{train:r.nTrain,holdout:r.nTest,ratio:+(v.ratio||0.75)},
        lambda:r.lam,lambda_chosen_by:r.cv?'训练集内 5 折交叉验证':'手填',
        seed:+v.seed,
        holdout_metrics:{spearman_rho:+r.rho.toFixed(4),rmse:+r.rmse.toFixed(4),
          holdout_sd:+r.sd.toFixed(4),rmse_over_sd:+(r.rmse/r.sd).toFixed(3)},
        baselines:(r.base||[]).map(x=>({name:x.n,rmse:+x.rmse.toFixed(4),
          rmse_over_sd:+(x.rmse/r.sd).toFixed(3),
          spearman_rho:x.rho==null?null:+x.rho.toFixed(4)})),
        beats_all_baselines:(r.base||[]).every(x=>r.rmse<x.rmse),
        note:'指标在留出集上算出，λ 在训练集内部选；标准化与位点表只用训练集统计。'
          +'基线和模型用的是同一个留出集；单特征基线是在训练集上挑的，没有拿留出集挑。',
        at:nowStamp()},null,2)}]);
    say(`训练完成。留出集上 Spearman ρ=${r.rho.toFixed(3)}，RMSE=${r.rmse.toFixed(3)}。`
      +`以上指标基于 ${r.nTest} 条未参与训练的候选。`,
      [mkCard('metric',{r:r}),
       mkCard('scat',{pred:r.pred,act:r.act,mean:r.trainMean,target:v.target})]);
  });
  return run;
};

      make:fileMake(x),dl:'data-fldl="'+c.id+'.'+i+'"'})).join('')}
    ${c.total>c.files.length?`<span class="t-xs mut2">还有 ${c.total-c.files.length} 个，说「全部文件」看完整列表</span>`:''}
  </div>`;

CARD.vtab=c=>`<div class="kard-h"><strong class="t-md">${esc(c.title)}</strong>
    ${c.pred?`<span class="t-xs mut2">按 ${esc(c.pred)} 的预测值排序</span>`:''}
    <span class="grow"></span><span class="t-xs mut2 num">前 ${c.rows.length} / ${c.total} 条</span></div>
  <div class="kard-b col" style="gap:var(--s3)"><div class="tbl-wrap is-prev"><table>
    <caption class="vh">候选</caption>
    <thead><tr><th scope="col">编号</th><th scope="col">突变</th>
      ${c.pred?`<th scope="col">模型预测 ${esc(c.predT||'')}</th>`:''}
      ${projFields().map(k=>`<th scope="col">${esc((FIELD[k]||{}).n||k)}${
        c.pred&&(FIELD[k]||{}).n===c.predT?'（实测）':''}</th>`).join('')}
      <th scope="col">闸门</th></tr></thead>

      ${projFields().map(k=>`<td class="t-sm num">${esc(fmtv(x,k))}</td>`).join('')}

    ${c.pred?`<span class="t-xs mut2">预测和实测并排放着：这一批测回来之后，
      就能看出模型在<b>没见过的新一批</b>上准不准——那比训练那天的留出指标更有说服力。
      已经有实测值的那几条，预测值是模型在自己训练数据上的回看，不算考验。</span>`:''}
