   照 bootcamp「12 接入模型管理」的逻辑：管的是**一批系列**，不是一组全局设置。
   每条：{id, prov, label(凭证名称), base, models:[{name, st, at}], st, at}

   **密钥不在这个对象里**。每条一个 localStorage 键 `mk_<id>`，
   和原来的 ds_key 一样单独存，绝不进系列对象、绝不被序列化（R5）。
   多了几条凭证，那三条断言一条都不能松。

   服务商目录只列有来历的：DeepSeek 本来就在这个产品里，
   Intern 和 Qwen 的接口地址取自 bootcamp 自己的设计稿。
   模型名不替用户填：除了 DeepSeek 这两个本来就在库里的，
   其余系列建出来是空的，用户自己在抽屉里「添加模型」——
   编一批模型名放进去是 R3 禁的。 */
const PROVIDERS=[
  {id:'intern',  n:'书生 Intern',base:'https://chat.intern-ai.org.cn/api/v1',seed:[],mk:'书'},
  {id:'qwen',    n:'Qwen',    base:'https://openrouter.ai/api/v1',seed:[],mk:'Q'},
  {id:'deepseek',n:'DeepSeek',base:'https://api.deepseek.com',seed:DS_MODELS.slice(),mk:'D'},
  /* 这两家的地址是各自官方文档里的 OpenAI 兼容入口。浏览器直连通不通
     取决于对方的跨域策略——不在这儿下结论，点「测试」发一次真请求看（R17）。 */
  {id:'gemini',  n:'Gemini',  base:'https://generativelanguage.googleapis.com/v1beta/openai',seed:[],mk:'G'},
  {id:'claude',  n:'Claude',  base:'https://api.anthropic.com/v1',seed:[],mk:'C'},
  {id:'custom',  n:'自定义',base:'',seed:[],mk:'＋'}
];
function provOf(id){return PROVIDERS.find(x=>x.id===id)||PROVIDERS[PROVIDERS.length-1]}
/* 系列名：自定义接入的那条用自己填的系列名称，其余就是服务商的名字。 */
function msSeries(x){return x.builtin?'后端代理':(x.sname||provOf(x.prov).n)}
/* 内置的一条：后端代理。不可删、没有密钥（密钥在后端）。
   留在表里是为了「请求从哪儿发出去」这件事仍然在一张表里看得全。 */
function msProxy(){return {id:'proxy',prov:'proxy',label:'后端代理',
  base:LS.get('modelEp',MC.ENDPOINT),models:DS_MODELS.map(n=>({name:n,st:'na'})),
  st:'na',builtin:true}}
const MS_SEED=[
  {id:'seed-deepseek',prov:'deepseek',label:'课题组共享',base:'https://api.deepseek.com',st:'ok',at:'2026-11-12 10:20',
   models:[{name:'deepseek-flash',st:'ok'},{name:'deepseek-v4-pro',st:'ok'}]},
  {id:'seed-intern',prov:'intern',label:'平台账号',base:'https://chat.intern-ai.org.cn/api/v1',st:'ok',at:'2026-11-10 15:02',
   models:[{name:'intern-s2',st:'ok'}]},
  {id:'seed-qwen',prov:'qwen',label:'个人试用',base:'https://openrouter.ai/api/v1',st:'untested',at:'2026-11-15 09:41',
   models:[{name:'qwen3-8b',st:'untested'}]}];
function MSERIES(){const raw=LS.get('mseries',null);
  const list=Array.isArray(raw)?raw:((raw===null&&MOCK())?MS_SEED:[]);
  return [msProxy()].concat(list)}
function msSave(list){LS.set('mseries',list.filter(x=>!x.builtin))}
function msFind(id){
  if(id==='legacy'){const a=mActive();return a.sid==='legacy'?a.series:null}
  return MSERIES().find(x=>x.id===id)||null}
function msAdd(o){const list=MSERIES().filter(x=>!x.builtin);
  list.push(o);msSave(list);return o}
function msSet(id,patch){const list=MSERIES().filter(x=>!x.builtin);
  const i=list.findIndex(x=>x.id===id);if(i<0)return false;
  Object.assign(list[i],patch);msSave(list);return true}
function msDel(id){const list=MSERIES().filter(x=>!x.builtin&&x.id!==id);
  /* 只删这一条的密钥。原先还顺手调了一次 MC.setKey('')——那是单密钥时代留下的，
     它删的是「当前在用的那一条」的密钥：删 B 会把正在用的 A 的密钥一起抹掉。 */
  msSave(list);
  /* 这条系列自己的那一把，加上它底下各个模型的独立密钥——别条的一把都不碰。 */
  try{localStorage.removeItem('mk_'+id);
    const pre='mk_'+id+'::';
    Object.keys(localStorage).filter(k=>k.indexOf(pre)===0).forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  if((LS.get('mactive',{})||{}).sid===id)LS.set('mactive',{});
  return true}
/* 对话用哪一个。bootcamp 没有这个概念（它是按任务选的），
   端砚的对话只走一个，所以得有一个当前项。 */
function mActive(){const a=LS.get('mactive',null)||{};
  /* 旧版兼容：没改过这一页的用户，配置里只有 modelMode='direct' + ds_key，
     没有任何「模型系列」。不接这一条的话，他们下次打开会静静地退回代理模式——
     配好的直连失效而界面上看不出来。还原成一条合成的系列。 */
  if(!a.sid&&LS.get('modelMode','proxy')==='direct'){
    const legacy={id:'legacy',prov:'deepseek',label:'DeepSeek（旧配置）',
      base:MC.DIRECT.replace(/\/chat\/completions$/,''),
      models:DS_MODELS.map(n=>({name:n,st:'untested'})),st:'untested',legacy:true};
    return {sid:'legacy',series:legacy,name:LS.get('modelName','deepseek-flash')};
  }
  const sid=a.sid||'proxy', s2=msFind(sid)||msProxy();
  const name=a.name&&(s2.models||[]).some(m=>m.name===a.name)
    ? a.name : ((s2.models||[])[0]||{}).name||LS.get('modelName','deepseek-flash');
  return {sid:s2.id,series:s2,name:name}}
function mUse(sid,name){LS.set('mactive',{sid:sid,name:name});LS.set('modelName',name)}
/* 授权状态只有三种，而且只有真发过一次请求才会变。
   bootcamp 那一列是绿标「已授权」，但凭证填完到底通不通，
   不发一次请求是不知道的——这正是 R17。 */
const MST={na:['由后端保管','c-mut'],untested:['未测试','c-mut'],
  ok:['已验证','c-ok'],fail:['连不上','c-err']};
function msChip(st){const x=MST[st||'untested']||MST.untested;
  return `<span class="chip ${x[1]}">${esc(x[0])}</span>`}
const MC={
  /* 线上那一份（GitHub Pages）没有同源后端，代理地址由旁边的 site-config.js 给；
     没有那个文件时就是同源的 /api/model/chat。里面只有公开设置，没有密钥。 */
  ENDPOINT:(window.DUANYAN_CONFIG&&window.DUANYAN_CONFIG.proxyEndpoint)||'/api/model/chat',
  DIRECT:'https://api.deepseek.com/chat/completions',
  /* 传 ov={sid,name} 就按那一条系列算，不动全局的当前项。
     模型对比要同时打两家，不能靠来回切 mactive——
     那是全局状态，并发的时候会互相覆盖。 */
  cfg(ov){const a=(ov&&ov.sid)?{sid:ov.sid,series:(msFind(ov.sid)||msProxy()),name:ov.name}
                             :mActive();
    return {mode:a.sid==='proxy'?'proxy':'direct',
            sid:a.sid,
            endpoint:a.sid==='proxy'?LS.get('modelEp',MC.ENDPOINT)
                     :(a.series.base||'').replace(/\/+$/,'')+'/chat/completions',
            name:a.name||((a.series.models||[])[0]||{}).name||''}},
  save(c){if(!c)return;
    if(c.name)LS.set('modelName',c.name);
    if(c.mode)LS.set('modelMode',c.mode);
    if(c.endpoint!=null)LS.set('modelEp',c.endpoint)},
  /* 密钥单独走原生 localStorage，不经过 LS 那一层——LS 会把值塞进一个大对象里
     跟别的设置一起存，密钥不该和别的东西混在一个键里。 */
  /* 密钥走原生 localStorage，一条凭证一个键。
     不进 LS 那一层（它会把值塞进一个大对象跟别的设置混在一起），
     也不进系列对象（那个会被 JSON.stringify）。
     不传 sid 时指当前对话用的那一条；'ds_key' 是旧版的单键，留着兼容。 */
  keyOf(sid){try{return localStorage.getItem(sid&&sid!=='legacy'?'mk_'+sid:'ds_key')||''}catch(e){return ''}},
  setKeyOf(sid,v){try{const k=sid&&sid!=='legacy'?'mk_'+sid:'ds_key';
    v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}},
  key(sid,name){const id=sid||mActive().sid;
    if(id==='proxy')return '';
    const own=(name&&id!=='legacy')?MC.keyOfM(id,name):'';
    return own||MC.keyOf(id)||MC.keyOf('legacy')},
  /* 模型自己的那一把（bootcamp「使用独立密钥」）。键名 mk_<系列 id>::<模型名>。 */
  keyOfM(sid,name){try{return localStorage.getItem('mk_'+sid+'::'+name)||''}catch(e){return ''}},
  setKeyOfM(sid,name,v){try{const k='mk_'+sid+'::'+name;
    v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}},
  setKey(v){MC.setKeyOf(mActive().sid,v)},
  hasKey(){return !!MC.key()},
  ready(){return mActive().sid==='proxy'||MC.hasKey()},
  /* 加载态在调用方：这是取数助手，挂起指示由发起取数的页面给。[LOADING_BY_CALLER] */
  async chat(messages,opt){
    const c=MC.cfg(opt&&opt.on);
    const direct=c.mode==='direct';
    /* 这一次调用要进执行轨迹。轨迹对象在这儿抓住，不靠 await 之后还在不在
       ——中间隔着网络往返，TRACE.cur 早可能被下一次操作换掉了。 */
    const tr=TRACE.cur, t0=now();
    const mx=(opt&&opt.max)||900, tp=(opt&&opt.temp)!=null?opt.temp:0.2;
    /* 单请求超时。批量跑几百条时，一条卡住会把整个并发位占死，
       所以超时必须能从调用方传进来，而且要真的把请求掐掉（AbortController），
       不是等它自己回来再忽略——那样连接还占着。 */
    const tms=(opt&&opt.timeout)|0;
    const ac=(tms>0&&typeof AbortController!=='undefined')?new AbortController():null;
    let timedOut=false;
    const tmr=ac?setTimeout(()=>{timedOut=true;ac.abort()},tms):0;
    const chars=messages.reduce((a,m)=>a+String(m.content||'').length,0);
    const io0=[['入参',(direct?'浏览器直连':'后端代理')+'　提示 '+chars+' 字符　'
      +'temperature '+tp+'　max_tokens '+mx]];
    const log=(st,extra,d)=>{if(tr)tr.steps.push({k:'model',n:c.name,st:st,
      ms:Math.round(now()-t0),d:d,io:io0.concat(extra||[])})};
    /* [LOADING_BY_CALLER] 这个函数只负责取数，不碰界面。
       「正在想…」那条占位消息由调用方（agentSend / freeAsk）在调它之前就推上去，
       所以挂起态不在这里做。 */
    /* 生成参数是用户在抽屉里自己填的 JSON，原样透传。
       平台不替它校兼容性：哪些参数这家服务认，只有发一次才知道。
       model / messages / stream 不让覆盖——这三个是这次调用本身。 */
    const reqBody={model:c.name,messages:messages,stream:false,
      max_tokens:mx,temperature:tp};
    const ex=opt&&opt.params;
    if(ex&&typeof ex==='object'&&!Array.isArray(ex))
      Object.keys(ex).forEach(k=>{if(k!=='model'&&k!=='messages'&&k!=='stream')reqBody[k]=ex[k]});
    const h={'Content-Type':'application/json'};
    if(direct){
      const k=MC.key(c.sid,c.name);
      if(!k){log('skip',null,'还没填 API Key，一次请求都没发出去');throw new Error('NOKEY')}
      h['Authorization']='Bearer '+k;      // 只在这一次请求的头里出现，别处一律不碰
    }
    /* 直连打这条凭证自己的 BASE URL，不再写死 DeepSeek。
       没填 BASE 的（旧配置）回落到 MC.DIRECT。
       [LOADING_BY_CALLER] 挂起态由调用方给，这个函数只负责取数。 */
    const res=await fetch(direct?(c.endpoint||MC.DIRECT):c.endpoint,{
      method:'POST',
      headers:h,
      body:JSON.stringify(reqBody),
      signal:ac?ac.signal:undefined
    }).catch(e=>{if(tmr)clearTimeout(tmr);
      if(timedOut){log('err',null,'等了 '+tms+' 毫秒没回来，掐了');throw new Error('TIMEOUT:'+tms)}
      log('err',null,'请求没送出去：'+e.message);throw new Error('NET:'+e.message)});
    if(tmr)clearTimeout(tmr);
    if(!res.ok){const t=await res.text().catch(()=>'');
      log('err',null,'HTTP '+res.status);
      throw new Error('HTTP '+res.status+' '+t.slice(0,180))}
    const j=await res.json();
    const out=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    const u=j.usage||null;
    log('ok',[['出参',out.length>60?out.slice(0,60)+'…':(out||'（空）')],
      u?['token','入 '+(u.prompt_tokens||'—')+'　出 '+(u.completion_tokens||'—')]:null]
      .filter(Boolean));
    return {text:out,usage:u};
  }
};
/* 容量这条规则不能写死在提示词里：它取决于板型、对照数和本轮重复数，
   写死 88 会让编排器给出一个这块板子根本放不下的候选数。 */
function sysPlan(){return `你是蛋白质工程平台的任务编排器。用户用一句话描述需求，你把它翻成一次可执行的任务配置。
只输出 JSON，不要解释，字段固定为：
{"target":"靶点","objective":"优化目标","sites":"设计位点或 auto","n":候选数整数,"models":["模型名"],"assay":"建议的测定方法","gate":{"metric":"ipTM","min":0.7},"missing":["还需要用户补充的信息"]}
规则：候选数不得超过 ${plateCap()}（${plateNote()}）。置信度只能作为准入阈值，不要用它排序。信息不足时写进 missing，不要编造靶点或数值。`}
function modelErr(e){
  const m=String(e.message||e);
  if(m==='NOKEY')return '选了直连但还没填 API Key。到侧栏的「模型接入」里填一把。它只存在这台机器上。';
  if(m.indexOf('TIMEOUT:')===0)
    return '等了 '+(+m.slice(8)/1000)+' 秒没回来，这一次请求被掐断了。';
  if(m.indexOf('NET:')===0)
    return '连不上模型服务：'+m.slice(4)+'。请求没有送达，没有产生任何改动。';
  if(/HTTP 4\d\d/.test(m))return '模型服务拒绝了这次请求：'+m;
  if(/HTTP 5\d\d/.test(m))return '模型服务出错：'+m;
  return '模型返回错误：'+m;
}

/* 系列下的模型列表。照 bootcamp 12.07：右侧抽屉，
   模型名 | 授权状态 | 编辑删除，底下「添加模型」。

/* 凭证弹窗。照 bootcamp 12.03（主流服务商）/ 12.04（自定义）/
   12.05（字段校验）/ 12.06（编辑）——四个界面其实是同一个表单的四种状态。
   API Key 是 password 型，存进 `mk_<id>`，不进系列对象（R5）。
   编辑时不把已存的密钥回填进 DOM：留空 = 不改。 */
function msCred(pv,exist){
  const isEdit=!!exist;
  const id=isEdit?exist.id:(pv.id+'-'+Math.random().toString(36).slice(2,7));
  const hasKey=isEdit&&!!MC.keyOf(id);
  modal(isEdit?('编辑「'+exist.label+'」凭证'):('添加 '+pv.n+' 凭证'),
    `<div class="col" style="gap:var(--s4)">
      ${pv.id==='custom'?`<div class="field">
        <label class="label" for="mcs">系列名称<span class="c-err">　*</span></label>
        <input id="mcs" class="input" maxlength="30" spellcheck="false"
          value="${esc(isEdit?(exist.sname||''):'')}" placeholder="组里自己部署的 vLLM">
        <span class="t-xs mut2">显示在模型系列列表中的名称</span>
      </div>`:''}
      <div class="field">
        <label class="label" for="mcn">凭证名称</label>
        <input id="mcn" class="input" maxlength="50" spellcheck="false"
          value="${esc(isEdit?exist.label:pv.n)}" placeholder="比如：组里的 ${esc(pv.n)}">
        <span class="t-xs mut2" data-count="mcn"></span>
      </div>
      <div class="field">
        <label class="label" for="mck">API Key<span class="c-err">　*</span></label>
        <input id="mck" class="input" type="password" autocomplete="off" spellcheck="false"
          placeholder="${hasKey?'已保存，留空不改':'粘贴 API Key'}">
        <span class="t-xs mut2">只存在这台机器上，不随页面分发</span>

/* ---------------- 在线推理 ---------------- */
/* 照 bootcamp「10 在线推理」：一条输入同时发给几个模型，并排看回答，
   每列可以单独配生成参数。上限 3 列。

   为什么这一页存在（R16）：接入页的「已验证」只说明通得上，不说明答得好。
   「对话走哪个模型」这个决定要在这里做——把同一句真实的请求并排打一次。

   状态存这台机器（dy_infer），刷新不丢。每列只记 sid + 模型名，
   密钥一个字都不在里面：发请求时由 MC 按 sid 去取那一条自己的 mk_<id>（R5）。 */
const INF_MAX=3;
const INF_SEED={mode:'cmp',turns:['用两三句话说明 Spearman 相关系数和 Pearson 相关系数的区别'],cols:[
  {k:'s1',sid:'proxy',name:'deepseek-flash',from:0,a:{0:{t:'Pearson 相关系数衡量两个变量之间线性关系的强弱，对数值本身敏感，容易受离群值影响。\nSpearman 相关系数先把数值换成名次再计算，衡量的是单调关系，只要一个变量增大时另一个也跟着增大，即使不是直线也能得到高相关。\n所以数据有离群值、或关系单调但非线性时，更适合用 Spearman。',u:'入 31　出 96 token'}}},
  {k:'s2',sid:'proxy',name:'deepseek-v4-pro',from:0,a:{0:{t:'两者的差别在于“比什么”。\n· Pearson 比的是原始数值，回答“是否成线性比例”，取值受量纲变换（线性变换除外）和极端值影响。\n· Spearman 比的是排序名次，回答“次序是否一致”，对单调的非线性关系同样有效，也更稳健。\n如果关心的是排序对不对（例如给候选排先后），看 Spearman；如果关心预测值和实测值是否成比例，看 Pearson。',u:'入 31　出 128 token'}}}]};
/* 一张台子上只有一份问句清单（turns），每一列只记自己对第 i 轮的答复。
   做成「每列各存一段对话」的话，后加进来的那一列历史更短，两边的第 i 条就不是同一个问题，
   横着读的时候对不上——而横着读正是这一页的用途。 */
function infCol(o){
  o=o||{};const a=mActive();
  return {k:o.k||('c'+Math.random().toString(36).slice(2,7)),
    sid:o.sid||a.sid, name:o.name||a.name||'',
    sys:typeof o.sys==='string'?o.sys:'',
    par:typeof o.par==='string'?o.par:'',
    from:o.from|0,                                   // 这一列是从第几轮加进来的
    a:(o.a&&typeof o.a==='object'&&!Array.isArray(o.a))?o.a:{},
    busy:false};
}
function INF(){
  if(!S.inf){
    const raw=LS.get('infer',null)||((LS.get('infer',null)===null&&MOCK())?INF_SEED:{});
    const cols=(Array.isArray(raw.cols)?raw.cols:[]).slice(0,INF_MAX).map(infCol);
    S.inf={mode:raw.mode==='cmp'?'cmp':'single',
           turns:Array.isArray(raw.turns)?raw.turns.map(String):[],
           cols:cols.length?cols:[infCol(null)], q:''};
  }
  return S.inf;
}
/* 单模型只用第一列。切回单模型不丢后面几列——回来还在，
   省得为了看一眼单列就把对比的现场拆掉。 */
function infCols(){const x=INF();return x.mode==='cmp'?x.cols:x.cols.slice(0,1)}
function infSave(){const x=INF();
  LS.set('infer',{mode:x.mode,turns:x.turns,
    cols:x.cols.map(c=>({k:c.k,sid:c.sid,name:c.name,sys:c.sys,par:c.par,from:c.from,a:c.a}))})}
function infFind(k){return INF().cols.find(c=>c.k===k)||null}
/* 台子上只留最近 INF_KEEP 轮。扔掉最旧的几轮要把下标一起平移，
   否则每一列的答复会错位到别的问题下面。
   20 是照 localStorage 的容量定的：一个源就几 MB，三列长回答攒到四五十轮
   能把它写满，而写满是**静默失败**——人要到刷新之后才发现东西没了。
   内存里也只留这 20 轮，所以看到的就是存下的。 */
const INF_KEEP=20;
function infTrim(){const x=INF();
  const d=x.turns.length-INF_KEEP;if(d<=0)return;
  x.turns=x.turns.slice(d);
  x.cols.forEach(c=>{const m={};
    Object.keys(c.a).forEach(k=>{const i=(+k)-d;if(i>=0)m[i]=c.a[k]});
    c.a=m;c.from=Math.max(0,c.from-d)});
}
/* 生成参数只接一个 JSON 对象，原样透传给服务。拦三类：
   1) model / messages / stream —— 这三个是这次调用本身，不让覆盖；
   2) 任何像凭证的字段 —— 凭证只在「模型接入」里管，写到这儿会跟着对话
      一起存进这台机器的设置里（R5）；
   3) 值看着像一把 key 的字段 —— 同上，哪怕字段名起得人畜无害。
   除此之外一律不校验：哪些参数这家服务认，只有真发一次才知道。 */
const INF_BAN=/^(api[_-]?key|key|token|secret|authorization|auth|bearer|password|passwd)$/i;
const INF_MAXLEN=4000;
/* 凭证扫描要往下钻：只看最外层的话，{"extra_body":{"api_key":"sk-…"}} 直接就过去了。
   深度封到 6 层，再深的嵌套这里也用不上。 */
function infScan(v,d){
  if(d>6||!v||typeof v!=='object')return null;
  if(Array.isArray(v)){for(const y of v){const r=infScan(y,d+1);if(r)return r}return null}
  for(const k of Object.keys(v)){
    if(INF_BAN.test(k))return '不能在参数中填写凭证字段「'+k+'」，密钥请在「模型接入」中配置';
    if(typeof v[k]==='string'&&/^sk-\S{8}/.test(v[k]))
      return '「'+k+'」的值疑似 API Key，请在「模型接入」中配置';
    const r=infScan(v[k],d+1);if(r)return r;
  }
  return null;
}
function infParse(raw){
  if(raw.length>INF_MAXLEN)
    return {ok:false,why:'这段 JSON 太长了（'+raw.length+' 字符，上限 '+INF_MAXLEN+'）'};
  let v;
  try{v=JSON.parse(raw)}catch(e){return {ok:false,why:'这段 JSON 解析不了：'+String(e.message||e).slice(0,70)}}
  if(!v||typeof v!=='object'||Array.isArray(v))return {ok:false,why:'最外层要是一个对象，像 {"temperature":0.2}'};
  const own=Object.keys(v).find(k=>k==='model'||k==='messages'||k==='stream');
  if(own)return {ok:false,why:'「'+own+'」由这一列自己定，去掉它'};
  const bad=infScan(v,0);
  if(bad)return {ok:false,why:bad};
  return {ok:true,v:v};
}
/* 这一列现在真正生效的那份参数——不是一份「推荐模板」。
   编一组推荐值放进去，人会照着它调参，然后以为这是这家服务的建议。 */
function infLive(){return JSON.stringify({temperature:0.2,max_tokens:900},null,2)}

const INF_HIST=12;

          placeholder='{"temperature":0.2}'>${esc(c.par||'')}</textarea>
        <div class="row wrap" style="gap:var(--s3);margin-top:var(--s2)">
          <button class="lnk" type="button" data-act="infparlive"
            style="min-height:1.5rem;display:inline-flex;align-items:center">填入现在生效的参数</button>
          ${cpBtn('infpar-'+k,c.par||infLive())}
        </div>
        <span class="t-xs mut2">参数原样传给模型服务，平台不校验兼容性</span>
      </div>
      <div class="col" style="gap:var(--s3)">
        <div id="inferr"></div>
        <div class="row" style="gap:var(--s3);justify-content:flex-end">
          <button class="btn" type="button" data-act="infparreset">重置</button>
          <button class="btn btn-pri" type="button" data-act="infparok">应用</button>
        </div>
      </div>
    </div>`});
}
/* 一条输入打到每一列，列与列之间互不等待：谁先回来谁先落到自己那一格。
   一列失败只落在那一格里——「这家连不上」只能由这一列自己的请求来说（R17）。 */
function inferSend(){
  const x=INF(), ta=document.getElementById('infq');
  const txt=((ta&&ta.value)||x.q||'').trim();
  if(!txt){toast('请输入内容');return}
  const cols=infCols();
  if(!cols.length){toast('请先添加模型');return}
  if(cols.some(c=>c.busy)){toast('上一条还在回答');return}
  x.turns.push(txt);x.q='';
  /* 先裁再定下标。裁剪会把所有下标往左移，放到后面做的话，
     这一次在飞的答复回来时按老下标落座，落到别的问题那一行去。 */
  infTrim();
  const t=x.turns.length-1;
  const plan=cols.map(c=>{
    /* 系列可能在这期间被删了。不拦的话 MC.cfg 会回落到后端代理，
       于是界面写着 qwen3-8b，请求其实打去了代理——比报错更糟。 */
    /* 「我的模型」是这个平台上训出来的打分器：输入是候选、输出是分数，不做文本生成。
       选得到，但回的是它能做什么、怎么用——不假装它会聊天。 */
    if(c.sid==='mine'){const m=mdlFind(c.name);
      c.a[t]={t:m?('「'+(m.name||m.id)+'」是打分模型，预测目标是 '+tgtName(m.target)+'，留出集排序准确度 '
        +(typeof m.rho==='number'?m.rho.toFixed(3):'—')+'。它给候选打分，不做文本回答。'
        +'要用它，在对话里说「用 '+m.id+' 给这个项目的候选打一遍分」。')
        :'该模型已不在「我的模型」中，请重新选择。',err:m?0:1};return null}
    if(c.sid!=='proxy'&&c.sid!=='legacy'&&!msFind(c.sid)){
      c.a[t]={t:'该模型系列已删除，请重新选择模型。',err:1};return null}
    const raw=(c.par||'').trim();
    const v=raw?infParse(raw):{ok:true,v:null};
    if(!v.ok){c.a[t]={t:v.why+'（在这一列的「生成参数」里改）',err:1};return null}
    const msgs=[];
    if((c.sys||'').trim())msgs.push({role:'system',content:c.sys.trim()});
    /* 只带这一列自己答过的那几轮。没答上的那一轮整轮跳过——
       留下一个没有答复的提问，会让这次请求出现两条连着的 user。 */
    for(let i=c.from;i<t;i++){
      const an=c.a[i];if(!an||an.err)continue;
      msgs.push({role:'user',content:x.turns[i]});
      msgs.push({role:'assistant',content:an.t});
    }
    msgs.push({role:'user',content:txt});
    c.busy=true;
    return {c:c,msgs:msgs,par:v.v,t:t};
  });
  render();infSave();
  plan.filter(Boolean).forEach(j=>{
    MC.chat(j.msgs,{on:{sid:j.c.sid,name:j.c.name},params:j.par,max:900})
      .then(r=>{j.c.busy=false;
        j.c.a[j.t]={t:r.text||'（这次返回是空的）',
          u:r.usage?('入 '+(r.usage.prompt_tokens||'—')+'　出 '+(r.usage.completion_tokens||'—')+' token'):''};
        render();infSave()})
      .catch(e=>{j.c.busy=false;
        j.c.a[j.t]={t:modelErr(e),err:1};
        render();infSave()});
  });
}

/* ---------------- 批量推理 ---------------- */
/* 照 bootcamp「09 批量推理」：一份已发布的数据集逐条跑完，出一个结果文件。
   在线推理是一条一条问，几百条走不完；这一页是那之后的动作。

   数据从哪儿来：这个产品的「我的数据集」是一张表（建集时列和切分就定死了），
   所以输入 = 一份**已发布**的数据集 + 一个**提示词列**。
   只认已发布的，理由和训练那条路一样：发布之后内容锁死，这一跑才说得清跑的是哪一版。

   执行是真的：并发池、单请求超时（掐断，不是等它自己回来）、失败重试、
   中途终止、重跑只补没成的那几条。结果文件是逐行 JSONL，按真实返回写。 */
/* 部分失败也是红的：它和全败一样是个要处理的问题，只是数量不同——
   数量由旁边的「22 / 24」说。不拿紫色去标它，紫色在这个产品里是「湿实验」的语义色，
   借来表示一个和实验无关的状态，等于把配色读坏。 */
const B_ST={draft:['草稿','c-mut'],run:['执行中','c-dry'],done:['已完成','c-ok'],
  part:['部分失败','c-err'],fail:['失败','c-err'],stop:['已终止','c-mut']};
function bSt(j){return B_ST[j&&j.st]||B_ST.draft}
const B_CONC_MAX=8, B_TMO=[5,600], B_RETRY_MAX=5;
let BJOBS=null;
function BJ(){
  if(!BJOBS){
    const raw=LS.get('bjobs',null);
    BJOBS=(Array.isArray(raw)?raw:((raw===null&&MOCK())?bSeed():[])).map(bHydrate);
  }
  return BJOBS;
}
/* 示例任务：挂在真实存在的已发布数据集上，行数、列名都取自那份数据集。 */
function bSeed(){
  const ds=bDsets();if(!ds.length)return [];
  const mk=(d,bad)=>(d.rows||[]).map((r,i)=>bad&&i%7===3
    ?{i:i,ok:false,err:'单请求超时（60 秒）',tries:3}
    :{i:i,ok:true,t:'已完成，第 '+(i+1)+' 行',ms:420+(i*137)%900,pt:118+(i*13)%60,ct:46+(i*7)%40,tries:1});
  const d0=ds[0], d1=ds[1]||ds[0];
  const col=d=>((d.cols||[])[0]||{}).k||'';
  return [
    {id:'B-003',name:'R5_候选注释',desc:'给 R5 的每条候选写一句改造意图',sid:'proxy',mdl:'deepseek-v4-pro',
     ds:d0.id,col:col(d0),sys:'只输出一句话，不超过 40 个字。',par:'{"temperature":0.2}',conc:4,tmo:60,retry:3,
     st:'done',at:'2026-11-17 09:12',ms:38200,n:(d0.rows||[]).length,out:mk(d0,false)},
    {id:'B-002',name:'实测记录_格式整理',desc:'把备注列整理成统一写法',sid:'proxy',mdl:'deepseek-flash',
     ds:d1.id,col:col(d1),sys:'',par:'',conc:8,tmo:60,retry:3,
     st:'part',at:'2026-11-16 17:40',ms:21600,n:(d1.rows||[]).length,out:mk(d1,true)},
    {id:'B-001',name:'KD_异常值复核',desc:'',sid:'proxy',mdl:'deepseek-flash',
     ds:d0.id,col:col(d0),sys:'',par:'',conc:1,tmo:60,retry:3,
     st:'draft',at:'2026-11-15 14:05',ms:0,n:(d0.rows||[]).length,out:[]}];
}
function bHydrate(o){
  o=o||{};
  return {id:o.id||'B-001',name:String(o.name||''),desc:String(o.desc||''),
    sid:o.sid||'proxy',mdl:String(o.mdl||''),ds:o.ds||'',col:o.col||'',
    sys:String(o.sys||''),par:String(o.par||''),
    conc:+o.conc||1,tmo:+o.tmo||60,retry:o.retry==null?3:+o.retry,
    st:B_ST[o.st]?o.st:'draft',at:o.at||nowStamp(),ms:+o.ms||0,n:+o.n||0,
    err:String(o.err||''),dropped:!!o.dropped,
    out:Array.isArray(o.out)?o.out:[],
    stop:false,t0:0};
}
/* 存这台机器。结果可能很大：配额满了就从最旧的任务开始丢结果，丢一个试一次，
   并且把「丢了」这件事记在那条任务上（dropped）——
   悄悄存不下，等人下次来下载才发现是空的，那比直接说出来糟得多。 */
function bSave(){
  const pack=()=>JSON.stringify(BJ().map(j=>({id:j.id,name:j.name,desc:j.desc,sid:j.sid,
    mdl:j.mdl,ds:j.ds,col:j.col,sys:j.sys,par:j.par,conc:j.conc,tmo:j.tmo,retry:j.retry,
    st:j.st,at:j.at,ms:j.ms,n:j.n,err:j.err,dropped:j.dropped,out:j.dropped?[]:j.out})));
  try{localStorage.setItem('dy_bjobs',pack());return true}catch(e){}
  const L=BJ();
  for(let i=L.length-1;i>=0;i--){
    if(L[i].dropped||!(L[i].out||[]).length)continue;
    L[i].dropped=1;
    try{localStorage.setItem('dy_bjobs',pack());
      toast('这台机器的存储满了，丢掉了「'+L[i].name+'」的结果');return true}catch(e2){}
  }
  return false;
}
function bFind(id){return BJ().find(x=>x.id===id)||null}
function bNextId(){
  let n=0;BJ().forEach(j=>{const m=/^B-(\d+)$/.exec(j.id||'');if(m)n=Math.max(n,+m[1])});
  return 'B-'+String(n+1).padStart(3,'0');
}
/* 只认已发布的数据集，而且得有行 */
function bDsets(){return ALL_DSETS().filter(d=>d.st==='pub'&&(d.rows||[]).length)}
function bDs(j){const h=j&&j.ds?dsFind(j.ds):null;return h?h.d:null}
function bCount(j){
  const out=j.out||[];let ok=0,bad=0,done=0,pt=0,ct=0,tok=0;
  out.forEach(o=>{if(!o)return;done++;if(o.ok){ok++;if(o.pt)pt+=o.pt;if(o.ct)ct+=o.ct}else bad++});
  tok=pt+ct;
  return {ok:ok,bad:bad,done:done,n:j.n||0,tok:tok,hasTok:!!(pt||ct)};
}
function bPct(j){const c=bCount(j);return c.n?Math.round(c.done/c.n*100):0}
/* 任务名称：2–50 字符，中英数和 - _ .，不能以符号开头（照 bootcamp 09.02 的提示） */
function bNameBad(v){
  const t=String(v||'').trim();
  if(t.length<2||t.length>50)return '任务名称要 2–50 个字符';
  if(!/^[一-龥A-Za-z0-9]/.test(t))return '任务名称不能以符号开头';
  if(!/^[一-龥A-Za-z0-9._-]+$/.test(t))return '只能用中文、英文、数字和 - _ .';
  return '';
}

/* ---- 执行 ---- */
let B_PAINT=0;
function bTick(j){
  const t=now();
  if(t-B_PAINT<220)return;          // 几百条逐条重绘会把页面拖垮，节流到 ~4.5 帧/秒
  B_PAINT=t;j.ms=Math.round(t-j.t0);render();
}
async function bRun(id){
  const j=bFind(id);if(!j)return;
  if(j.st==='run'){toast('这一条正在跑');return}
  /* 系列可能在建完之后被删了。不拦的话 MC.cfg 会回落到后端代理那条，
     于是这一跑抛的是「还没填 API Key」——人会跑去填密钥，而真正的原因是系列没了。 */
  if(j.sid!=='proxy'&&j.sid!=='legacy'&&!msFind(j.sid)){
    j.st='fail';j.err='这条任务用的模型系列已经删掉了，新建一条换个模型';bSave();render();return}
  const d=bDs(j);
  if(!d){j.st='fail';j.err='这份数据集不在了，换一份再跑';bSave();render();return}
  const rows=d.rows||[];
  if(!rows.length){j.st='fail';j.err='这份数据集里一行数据都没有';bSave();render();return}
  if(!(j.col in rows[0])){j.st='fail';j.err='数据集里没有「'+j.col+'」这一列了';bSave();render();return}
  let par=null;
  if((j.par||'').trim()){const v=infParse(j.par.trim());
    if(!v.ok){j.st='fail';j.err='生成参数有问题：'+v.why;bSave();render();return}
    par=v.v}
  j.n=rows.length;j.dropped=0;j.err='';j.stop=false;j.st='run';j.t0=now();
  if(!Array.isArray(j.out))j.out=[];
  /* 重跑只补没成的那几条：已经花掉的 token 不重复花。 */
  const todo=[];
  for(let i=0;i<rows.length;i++){const o=j.out[i];if(!o||!o.ok)todo.push(i)}
  bSave();render();
  const one=async i=>{
    const txt=String(rows[i][j.col]==null?'':rows[i][j.col]);
    if(!txt.trim()){j.out[i]={i:i,ok:0,err:'这一行的「'+j.col+'」是空的，没发请求',ms:0,tries:0};return}
    const msgs=[];
    if((j.sys||'').trim())msgs.push({role:'system',content:j.sys.trim()});
    msgs.push({role:'user',content:txt});
    let last='',k=0;
    for(;k<=j.retry;k++){
      if(j.stop)return;
      const t0=now();
      try{
        /* [LOADING_BY_CALLER] 挂起态在池子起来之前就写好了：
           j.st='run' 之后 render() 过一次，列表那一行是进度条 + 「执行中」。
           这里只负责取数。 */
        const r=await MC.chat(msgs,{on:{sid:j.sid,name:j.mdl},params:par,
          max:900,timeout:j.tmo*1000});
        j.out[i]={i:i,ok:1,t:r.text||'',ms:Math.round(now()-t0),tries:k+1,
          pt:(r.usage&&r.usage.prompt_tokens)||0,ct:(r.usage&&r.usage.completion_tokens)||0};
        return;
      }catch(e){
        last=modelErr(e);
        /* 没密钥、生成参数不对这类，重试一百次还是同一个结果，不白花时间。 */
        if(String(e.message||e)==='NOKEY')break;
      }
    }
    j.out[i]={i:i,ok:0,t:'',err:last||'请求失败',ms:0,tries:k};
  };
  let p=0;
  const conc=Math.max(1,Math.min(B_CONC_MAX,j.conc|0||1));
  const worker=async()=>{
    while(true){
      if(j.stop)return;
      const i=todo[p++];
      if(i===undefined)return;
      await one(i);
      bTick(j);
    }
  };
  await Promise.all(Array.from({length:Math.max(1,Math.min(conc,todo.length))},worker));
  j.ms=Math.round(now()-j.t0);
  const c=bCount(j);
  if(j.stop)j.st='stop';
  else if(c.ok===0)j.st='fail';
  else if(c.bad>0)j.st='part';
  else j.st='done';
  j.stop=false;
  bSave();render();
  toast({done:'已完成，'+c.ok+' 条全部成功',
         part:'已完成，成功 '+c.ok+' 条，失败 '+c.bad+' 条',
         fail:'全部失败，原因见任务详情',
         stop:'已终止，已保留 '+c.ok+' 条结果'}[j.st]);
}
function bStop(id){const j=bFind(id);if(!j||j.st!=='run')return;j.stop=true;toast('正在终止，等待已发出的请求返回')}

/* ---- 结果文件 ---- */
/* 逐行 JSONL：一行一个样本，按真实返回写。失败的那几行单出一个 badcase 文件，
   两个文件合在一起才是这一跑的全部，所以行号（i）两边都留着。 */
function bJsonl(j,kind){
  const d=bDs(j), rows=(d&&d.rows)||[];
  const out=[];
  (j.out||[]).forEach(o=>{
    if(!o)return;
    if(kind==='bad'&&o.ok)return;
    if(kind!=='bad'&&!o.ok)return;
    const rec={i:o.i,input:String((rows[o.i]||{})[j.col]==null?'':(rows[o.i]||{})[j.col])};
    if(o.ok){rec.output=o.t;rec.ms=o.ms;
      if(o.pt||o.ct)rec.usage={prompt_tokens:o.pt||0,completion_tokens:o.ct||0};
      if(o.tries>1)rec.tries=o.tries}
    else{rec.error=o.err||'';rec.tries=o.tries||0}
    out.push(JSON.stringify(rec));
  });
  return out.join('\n')+(out.length?'\n':'');
}
function bDlModal(id){
  const j=bFind(id);if(!j)return;
  const c=bCount(j);
  if(j.dropped){toast('结果未保存（本机存储已满），请重跑');return}
  if(!c.done){toast('还没有结果');return}
  modal('下载推理结果',
    `<div class="col" style="gap:var(--s4)">
      <span class="lbl">选择下载内容</span>
      <label class="row"><input type="radio" name="bdl" value="ok" checked>
        <span>推理结果　<span class="t-sm mut2 num">${c.ok} 行</span></span></label>
      <label class="row"><input type="radio" name="bdl" value="bad"${c.bad?'':' disabled'}>
        <span>Badcase　<span class="t-sm mut2 num">${c.bad} 行</span>${
          c.bad?'':'<span class="t-sm mut2">　没有失败的行</span>'}</span></label>
      <p class="hint" style="margin:0">逐行 JSONL：一行一个样本，带行号、原文和模型返回。</p>
    </div>`,'下载',()=>{
      const d=document.getElementById('dlg');
      const k=(d.querySelector('input[name="bdl"]:checked')||{}).value||'ok';
      const body=bJsonl(j,k);
      if(!body){toast('这一份是空的');return}
      dl(j.name+(k==='bad'?'_badcase':'_result')+'.jsonl',body,'application/x-ndjson')
        .then(r=>{if(r==='saved')toast('下载了 '+(body.split('\n').length-1)+' 行')});
    });
}

/* ---- 列表 ---- */
function batchBody(){
  const q=(S.bq||'').trim().toLowerCase();
  const all=BJ();
  const L=q?all.filter(j=>(j.name+' '+j.id).toLowerCase().indexOf(q)>=0):all;
  const row=j=>{
    const c=bCount(j), st=bSt(j), d=bDs(j);
    const run=j.st==='run';
    return `<tr>
      <td class="c-nm"><div class="col" style="gap:1px">
        <button class="lnk" type="button" data-bjob="${esc(j.id)}"
          style="text-align:left;font-weight:600">${esc(j.name)}</button>
        <span class="t-xs mut2 num">${esc(j.id)}</span>
      </div></td>
      <td><span class="chip ${st[1]}">${esc(st[0])}</span></td>
      <td style="min-width:9rem">${run
        ? `<div class="col" style="gap:4px">
             <div class="pbar"><i style="width:${bPct(j)}%"></i></div>
             <span class="t-xs mut2 num">${c.done} / ${c.n}</span></div>`
        : `<span class="t-sm num">${c.n?(c.ok+' / '+c.n):'—'}</span>`}</td>
      <td class="t-sm num" style="max-width:12rem;word-break:break-all">${esc(j.mdl||'—')}</td>
      <td class="t-sm">${d?esc(d.name)+'<span class="mut2 num">　'+(d.rows||[]).length+' 行</span>'
        :'<span class="c-err">已不在</span>'}</td>
      <td class="t-sm num c-at">${esc(j.at||'—')}</td>
      ${acts([
        {n:'详情',attr:'data-bjob="'+esc(j.id)+'"'},
        j.dropped?{n:'下载结果',off:'结果未保存（本机存储已满），请重跑'}
          :(c.done?{n:'下载结果',attr:'data-bjdl="'+esc(j.id)+'"'}
                  :{n:'下载结果',off:'还没有结果'}),
        run?{n:'终止',attr:'data-bstop="'+esc(j.id)+'"'}
           :{n:j.st==='draft'?'提交':(c.ok&&c.ok<c.n?'接着跑':'重跑'),
             attr:'data-brun="'+esc(j.id)+'"'},
        run?{n:'删除',off:'先终止再删'}:{n:'删除',attr:'data-bdel="'+esc(j.id)+'"'}
      ])}
    </tr>`};
  return `
<div class="col" style="gap:var(--s5)">
  ${all.length?`<div class="card">
    <div class="tbl-wrap is-list">
      <table aria-label="批量推理任务">
        <thead><tr>
          <th scope="col">任务名称 / 编号</th><th scope="col">状态</th>
          <th scope="col">进度</th><th scope="col">模型</th>
          <th scope="col">数据集</th><th scope="col">创建时间</th><th scope="col">操作</th>
        </tr></thead>
        <tbody>${L.map(row).join('')||
          `<tr><td colspan="7"><div class="empty">没有匹配的任务。
            <button class="lnk" type="button" data-act="bqclr">看全部</button></div></td></tr>`}</tbody>

let DLCAP=undefined;
async function dlCap(){
  if(DLCAP!==undefined)return DLCAP;
  try{DLCAP=(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){DLCAP=null}

/* 玻尔对标 B02：文件此前散在四处（上传的 FASTA 在输入页、服务商回传的 CSV 在回流页、
   导出的结果直接下载走了、知识库的文献在项目侧栏），
   研究员问「上周导出的那份候选表在哪」答不上来。
   审计日志记的是**事件**，不是**文件**。
   这里只做一件事：下载是单一出口，每一次都在这儿记一笔。
   文件视图不另起一张表，从这笔记录 + 批次 + 知识库派生（R22）。 */
function dlLog(name,data){
  const size=data instanceof Blob?data.size
    :(typeof data==='string'?new Blob([data]).size:(data&&data.length)||0);
  DB.dls.unshift({name:name,bytes:size,at:nowStamp(),
    pid:S.pid,round:S.round,route:S.route});
  if(DB.dls.length>80)DB.dls.length=80;
}
async function dl(name,data,mime){
  dlLog(name,data);
  const cap=await dlCap();
  if(cap){try{await cap.save({filename:name,data:data});return 'saved'}
    catch(e){const c=e&&e.code;
      if(c==='declined')return 'declined';
      if(c==='rejected_extension'||c==='extension_not_enabled')return 'badext';
      return 'failed'}}
  try{const b=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
    const u=URL.createObjectURL(b);const a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);return 'saved'}catch(e){return 'failed'}
}
/* 最小 ZIP（仅存储，不压缩）*/
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const name of Object.keys(files)){
    const nb=enc.encode(name),db=enc.encode(files[name]),crc=crc32(db);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(crc),...u32(db.length),...u32(db.length),
      ...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nb);
    off+=lh.length+nb.length+db.length;
  }
  const cs=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(central.length),...u16(central.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

/* 必须在**挂进文档之前**调用。

   插进去之后又布局一次——.pg-hd 带着 margin-top:-s6 与 padding，
   下面的内容会整体位移（实测首页的能力卡 445px → 453px）。
   每次 render 都跳这 8px，切项目时就看成了「卡片在闪」。 */
function dressHead(root){
  const p=(root||view).querySelector('.page');
  if(!p||p.classList.contains('research-home'))return;
  /* 有的页面自己就写了 .pg-hd（通知、结果），这时只补返回键，不再包一层 */
  let hd=p.querySelector(':scope > .pg-hd');
  if(!hd){
    const K=[...p.children];
    const hi=K.findIndex(n=>n.tagName==='H1'||n.querySelector('h1'));
    if(hi<0||hi>1)return;               // 标题不在开头，说明这页没有页头，别乱包
    const isHd=n=>n.classList&&['fltrow','tabs','seg','pg-sub','ctl-seg'].some(c=>n.classList.contains(c));
    let end=hi;
    while(end+1<K.length&&isHd(K[end+1]))end++;
    hd=document.createElement('div');
    hd.className='pg-hd';
    p.insertBefore(hd,K[0]);
    for(let i=0;i<=end;i++)hd.appendChild(K[i]);

}

/* 一个元素的稳定标识：id 优先，其次第一个 data-* 属性，再其次同类里的序号。
   用它在重建后找回同一个控件。 */
function focusKey(el){
  if(!el||el===document.body||!view.contains(el))return null;
  if(el.id)return {s:'#'+CSS.escape(el.id)};
  /* 属性值在引号里，只要转义引号与反斜杠；用 CSS.escape 会把空格变成 "\ "，反而匹配不上。
     一个 data-* 往往不唯一（「是 / 否」两颗的 data-pf 相同），所以取到两个为止。 */
  const q=v=>String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const parts=[];
  for(const a of el.attributes){
    if(a.name.indexOf('data-')!==0||a.name==='data-dressed'||a.name==='data-atb')continue;
    parts.push('['+a.name+'="'+q(a.value)+'"]');
    if(parts.length===2)break;
  }
  if(parts.length){
    const sel=parts.join('');
    const L=[...view.querySelectorAll(sel)];
    return {s:sel,i:L.indexOf(el)};
  }
  const cls=(el.className||'').toString().trim().split(/\s+/)[0];
  if(!cls)return null;
  const L2=[...view.querySelectorAll(el.tagName.toLowerCase()+'.'+CSS.escape(cls))];
  const i=L2.indexOf(el);
  return i<0?null:{s:el.tagName.toLowerCase()+'.'+CSS.escape(cls),i:i};
}
function restoreFocus(k,sel){
  let el=null;
  try{el=(k.i==null||k.i<0)?view.querySelector(k.s):(view.querySelectorAll(k.s)[k.i]||view.querySelector(k.s))}
  catch(e){return}
  if(!el||el.disabled)return;
  el.focus({preventScroll:true});
  if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}
}

       面板没出来时 AT.open 是 false，这几个键照常走原来的路。 */
    t.addEventListener('keydown',e=>{
      if(!AT.open||!AT.list.length)return;
      if(e.key==='ArrowDown'){e.preventDefault();AT.pos=t.selectionStart;
        AT.i=(AT.i+1)%AT.list.length;render();
        const n=document.getElementById('ask');if(n)n.focus();return}
      if(e.key==='ArrowUp'){e.preventDefault();AT.pos=t.selectionStart;
        AT.i=(AT.i-1+AT.list.length)%AT.list.length;render();
        const n=document.getElementById('ask');if(n)n.focus();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();atPick(AT.i);return}
      if(e.key==='Escape'){e.preventDefault();AT.open=false;render();
        const n=document.getElementById('ask');if(n)n.focus();return}
    });
    /* 回车发送，Shift+回车换行。
       中文输入法选词的时候也会发一个 Enter：那一下是在确认候选词，不是在发送。
       composing / keyCode 229 就是这一下，放过它，否则每打一个词都会把半句话发出去。 */
    t.addEventListener('keydown',e=>{
      if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.metaKey||e.altKey)return;
      if(e.isComposing||e.keyCode===229)return;
      if(AT.open&&AT.list.length)return;            // 面板开着的时候回车是选技能
      e.preventDefault();
      /* 上一段还在一帧一帧往外放的时候按回车：先让它一次放完，再发新的一句，
         不然两段回答会交叠着长出来。 */
      if(busy())skipAll();
      agentSend();
    });
    /* render() 会把这个 textarea 换成新的，旧的被摘掉时也会触发 blur——
       那不是用户点走了。所以延迟之后再看一眼：焦点还在输入框或面板里，就不关。 */
    t.addEventListener('blur',()=>setTimeout(()=>{
      if(!AT.open)return;
      const a=document.activeElement;
      if(a&&(a.id==='ask'||a.closest&&a.closest('.atbox')))return;
      AT.open=false;render();},160));
    /* 高度跟着内容走：先塌回去再按 scrollHeight 量，否则删字的时候只会越长越高。
       封顶由 CSS 的 max-height 管，到顶之后 textarea 自己滚。 */
    const grow=()=>{if(t.classList.contains('is-fix'))return;
      t.style.height='auto';t.style.height=t.scrollHeight+'px'};
    t.oninput=()=>{S.ask=t.value;grow();atSync(t)};
    t.onclick=()=>atSync(t);
    /* 重渲染之后光标会跑到开头，面板开着的时候要把它放回末尾 */
    if(AT.open){t.focus();
      const pos=AT.pos==null?t.value.length:Math.min(AT.pos,t.value.length);
      t.setSelectionRange(pos,pos)}
    grow();
    if(AT.open)atPlace();
  });

    p.rounds.push({i:5,state:'active',v:96,r:0,mb:'v3',ma:'v4',note:'按 Round 4 回流数据重训后生成'});
    DB.acts.unshift({k:'dry',t:'模型重训完成 v3 → v4，验证集 Spearman 0.68 → 0.73',r:5,p:'Barnase–Barstar 结合界面',at:'刚刚',by:'系统'});
    DB.acts.unshift({k:'wet',t:'回流 96 条 B-2412 测定数据',r:4,p:'Barnase–Barstar 结合界面',at:'刚刚',by:'系统'});
    toast('96 条已回流 · 模型 v3 → v4 · Round 5 已创建');
    setTimeout(()=>go('project',{pid:'p1',round:5}),700);return}
  toast(M[a]||'已执行');
}
/* #view 之外的控件（侧栏、顶栏）render 时绑不到——q() 的作用域是 view。
   这里一次性补上；这些节点是静态的，绑一次就够。 */
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b));
document.querySelectorAll('#side [data-nav],#top [data-nav]').forEach(
  b=>b.onclick=()=>go(b.dataset.nav));
/* 侧栏里的 data-go（左下角的用户名）不在 #view 里，render() 那一轮绑不到它，这里单独绑一次。 */
document.querySelectorAll('#side [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
/* 开页时给每个项目种上数据集：内容就是这个项目自己的变体表——
   真行真列真指纹，不是造出来的数。一份发布（能拿去训），一份留草稿（演示锁定之前的状态）。 */
(function seedDsets(){
  const was=S.pid;
  DB.projects.forEach(p=>{
    S.pid=p.id;
    const all=CANDS(), rN=p.rounds.length;
    const build=(list)=>{
      if(list.length<10)return null;
      const q=parseTable(artVariantsCsv(p.id,list),'variants.csv');
      if(!q.ok)return null;
      const nums=q.cols.filter(x=>x.type==='数值').map(x=>x.k);
      /* 表头带单位（kd_pM、km_μM），字段 key 不带。按前缀认回去，
         认不到就说明这一列全是空值、被当成类别列了，不能当回归目标。 */
      q.pick=projFields(p).map(k=>({k:k,col:nums.find(c=>c===k+'_'+String((FIELD[k].unit||'').trim())||c===k)}))
        .filter(x=>x.col);
      q.nums=nums;return q;
    };
    const mk=(q,name,x,ratio,seed,pub)=>{
      const feats=q.nums.filter(c=>c!==x.col);
      if(!feats.length)return;
      const sp=makeSplit(q.rows.length,ratio,seed);
      const d=addDset(p.id,{name:name,src:'本项目变体表',file:'variants.csv',
        rows:q.rows,cols:q.cols,target:x.col,feats:feats,task:'回归',
        split:sp,ratio:ratio.map(v=>+v.toFixed(2)),seed:seed,fp:q.fp});
      if(pub){d.st='pub';d.pubAt=d.at}
    };
    const rr=(a,b)=>a===b?('R'+a):('R'+a+'–R'+b);   // 只有一轮时别写成 R1–R1
    const qa=build(all);
    if(!qa||!qa.pick.length)return;
    mk(qa,rr(1,rN)+' 实测变体表',qa.pick[0],[0.7,0.15,0.15],20260113,1);
    if(qa.pick[1]){
      mk(qa,rr(1,rN)+' 实测变体表（以 '+FIELD[qa.pick[1].k].n+' 为目标）',
        qa.pick[1],[0.75,0,0.25],20260211,0);
    }else if(rN>1){
      /* 只有一个可建模字段时，第二份换一种切法：末轮整轮留出，
         用前几轮训、拿最新一轮当前瞻测试——这是真实的回流评估方式，
         不是把同一张表换个随机种子再存一遍。 */
      const qb=build(all.filter(c=>(c.firstRound||1)<rN));
      if(qb&&qb.pick.length)
        mk(qb,rr(1,rN-1)+' 实测变体表（末轮留出）',qb.pick[0],[0.8,0.2,0],20260211,0);
    }
  });
  S.pid=was;
})();
/* 开页时给每个项目先训一个模型，免得「我的模型」一进去是空的。
   这里的指标不是编的——真的跑了一遍 trainRun，ρ、RMSE、对基线都是算出来的，
   所以三个项目的数字各不相同，差的项目就是差。 */
(function seedModels(){
  const was=S.pid;
  DB.projects.forEach(p=>{
    S.pid=p.id;
    const pub=DSETS(p.id).filter(d=>d.st==='pub');
    const fs=projFields(p).filter(k=>CANDS().filter(c=>mv(c,k)!=null).length>=8);
    fs.slice(0,2).forEach((k,i)=>{
      const t0=now();
      /* 一份已发布的数据集配一个模型，目标列就是它自己的目标列。
         配不到数据集的，走「项目实测」那条路——两条路都真实存在，
         硬让第二个模型也去用第一份数据集，名字就会和内容对不上。 */
      const d=pub[i]||null;
      const seed=20260113+i;
      const r=d?dsTrain(d,{seed:seed}):trainRun(p.id,k,0.75,null,seed);
      const ms=Math.round(now()-t0);
      if(!r.ok)return;
      const tgt=d?d.target:k;
      addModel(p.id,Object.assign({target:tgt,ds:(d?d.id:null),
        /* 种子和数据来源要跟着模型走。少了它们，这个模型就复现不了，
           而「每个模型都能追溯到它依据的数据集版本」是这个产品立项时写的话。 */
        seed:seed,
        src:d?(d.id+'　'+d.name):('本项目已回流的实测值（'+r.n+' 条）'),
        kind:d?'ds':'proj',
        mu:r.mu,sg:r.sg,featK:r.featK||null,trainIds:r.trainIds||null,lib:true,
        rho:r.rho,rmse:r.rmse,sd:r.sd,
        nTrain:r.nTrain,nTest:r.nTest,lam:r.lam,n:r.n,ms:ms,lamBy:r.lamBy,bl:r.base,
        name:(()=>{const k2=String(tgt).replace(/_[^_]*$/,'');
          return ((FIELD[tgt]||FIELD[k2]||{}).n||k2)+' 打分器'})(),
        desc:d?('训在 '+d.id+'　'+d.name+' 上'):('用 '+p.name+' 已回流的实测值校准计算打分'),
        base:BASE_MODELS[0].n,method:TRAIN_METHOD[0].n,upd:'—',
        w:r.w,sites:r.sites||null,cols:r.cols},verdictOf(r)));
    });
  });
  S.pid=was;
})();
/* ================= 留存：新建的项目与对话，刷新后还在 =================
   存什么：用户自己建的项目（内置的三个不存，代码里的种子变了要能跟上）、
   对话列表、每段对话的消息。存在这台机器的 localStorage 里，键 dy_keep。
   卡片里的下载件带着一个 make 函数，函数存不下来——存的时候把它当场算出的内容
   拍下来（__body），取回来时再包成 make。超过上限的不拍，那一件取回来之后
   下载键是灰的，写着「只有登记」，这是现成的诚实降级。
   还在往外放的回答、还在跑的运行卡不存：刷新会打断它们，存下来就是一张永远在转的卡。
   探针里（navigator.webdriver）默认不开：几十个探针共用一个浏览器上下文、
   每条检查前重载，开着的话上一条建的项目会漏进下一条。要测这一层的探针
   自己写 localStorage.dy_keepTest='1'。 */
const KEEP={ready:0,t:0,maxSess:40,maxBody:60000,maxLen:2600000,
  seed:DB.projects.map(x=>x.id),
  on:(function(){try{return !navigator.webdriver||localStorage.getItem('dy_keepTest')==='1'}catch(e){return false}})()};
function keepPack(o,lim,seen,d){
  if(o==null)return o;
  const t=typeof o;
  if(t==='function'||t==='symbol')return undefined;
  if(t!=='object')return (t==='number'&&!isFinite(o))?null:o;
  if(d>14||seen.has(o))return undefined;
  if(Array.isArray(o)){seen.add(o);const a=[];
    o.forEach(x=>{const v=keepPack(x,lim,seen,d+1);if(v!==undefined)a.push(v)});seen.delete(o);return a}
  if(Object.prototype.toString.call(o)!=='[object Object]')return undefined;
  seen.add(o);const out={};
  Object.keys(o).forEach(k=>{
    if(k==='make'){
      if(typeof o.make==='function'&&lim>0){
        try{const b=String(o.make());if(b.length<=lim)out.__body=b}catch(e){}}
      return}
    if(k==='__body'){if(typeof o.make!=='function'&&typeof o.__body==='string'&&lim>0)out.__body=o.__body;return}
    if(k.charAt(0)==='_')return;
    const v=keepPack(o[k],lim,seen,d+1);if(v!==undefined)out[k]=v});
  seen.delete(o);return out}
function keepWake(o,d){
  if(!o||typeof o!=='object'||d>14)return o;
  if(Array.isArray(o)){o.forEach(x=>keepWake(x,d+1));return o}
  if(typeof o.__body==='string'){const b=o.__body;o.make=()=>b}
  if(typeof o.id==='string'){const m=/^c(\d+)$/.exec(o.id);if(m&&+m[1]>CARD_SEQ)CARD_SEQ=+m[1]}
  Object.keys(o).forEach(k=>{if(k!=='__body')keepWake(o[k],d+1)});return o}
/* 一段对话里能存的部分：放完了的消息，和消息里跑完了的卡 */
function keepMsgs(L){
  return (L||[]).filter(m=>m&&!m._live).map(m=>{
    const c=(m.cards||[]).filter(x=>x&&!x._skel&&!(x.t==='run'&&x.st==='run'));
    return Object.assign({},m,{cards:c})});
}
function keepSnap(lim,nSess){
  const ses=SESSIONS.slice(0,nSess), conv={}, keys={new:1};
  ses.forEach(x=>keys[x.id]=1);
  if(S.sid)keys[S.sid]=1;
  DB.projects.forEach(x=>keys[pjSid(x.id)]=1);
  Object.keys(keys).forEach(k=>{const L=keepMsgs(CONV[k]);if(L.length)conv[k]=L});
  return keepPack({v:1,
    projects:DB.projects.filter(x=>KEEP.seed.indexOf(x.id)<0),
    sessions:ses,conv:conv,sid:S.sid||null,bind:S.bind||null},lim,new Set(),0);
}
function keepNow(){
  if(!KEEP.on||!KEEP.ready)return;
  clearTimeout(KEEP.t);KEEP.t=0;
  /* 写不下就一档一档让：先不拍下载件的内容，再只留最近 10 段对话。
     localStorage 写满是抛异常，LS.set 会把它吞掉，所以这里自己写、自己接。 */
  const tries=[[KEEP.maxBody,KEEP.maxSess],[0,KEEP.maxSess],[0,10]];
  for(let i=0;i<tries.length;i++){
    try{const j=JSON.stringify(keepSnap(tries[i][0],tries[i][1]));
      if(j.length>KEEP.maxLen)continue;
      localStorage.setItem('dy_keep',j);KEEP.fail=0;return}catch(e){}
  }
  if(!KEEP.fail){KEEP.fail=1;toast('这台机器的存储空间不够，刷新后新建的项目和对话不会保留')}
}
function keepSoon(){if(!KEEP.on||!KEEP.ready||KEEP.t)return;KEEP.t=setTimeout(keepNow,400)}
function keepLoad(){
  KEEP.ready=1;
  if(!KEEP.on)return;
  let k=null;
  try{k=JSON.parse(localStorage.getItem('dy_keep')||'null')}catch(e){k=null}
  if(!k||typeof k!=='object'||k.v!==1)return;
  try{
    (Array.isArray(k.projects)?k.projects:[]).forEach(x=>{
      if(!x||typeof x.id!=='string'||typeof x.name!=='string')return;
      if(DB.projects.some(y=>y.id===x.id||y.name===x.name))return;
      if(!Array.isArray(x.rounds)||!x.rounds.length)return;
      if(!Array.isArray(x.fields))x.fields=[];
      ['kb','tools'].forEach(f=>{if(!Array.isArray(x[f]))x[f]=[]});
      DB.projects.push(keepWake(x,0))});
    if(Array.isArray(k.sessions)){
      const ok=k.sessions.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string');
      SESSIONS.length=0;ok.forEach(x=>SESSIONS.push(x))}
    if(k.conv&&typeof k.conv==='object')Object.keys(k.conv).forEach(id=>{
      const L=k.conv[id];if(!Array.isArray(L))return;
      CONV[id]=keepWake(L.filter(m=>m&&typeof m.role==='string').map(m=>{
        if(!Array.isArray(m.cards))m.cards=[];if(typeof m.text!=='string')m.text='';return m}),0)});
    if(typeof k.sid==='string'&&CONV[k.sid]){S.sid=k.sid;
      if(typeof k.bind==='string'&&DB.projects.some(x=>x.id===k.bind))S.bind=k.bind}
  }catch(e){}
}
keepLoad();
window.addEventListener('pagehide',keepNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')keepNow()});
const _h0=location.hash.slice(1);
/* 开页时也归一：旧书签（#pw、#round、#task…）是搬过家，不是不存在。 */
if(_h0){const _t=ROUTE_HOME(bootTab(_h0));S.route=_t;if(_t!==_h0)location.hash=_t;}
bindScroll();
/* 内置坐标先装上，结构视图从第一眼起就有东西可转可点。 */
/* 必须走 loadStruct：直接赋值会跳过 molStats，VW.per 一直是空的，
   于是置信度面板说「结构里没有 B 因子列」，四档占比全是 0.0%。 */
if(!VW.struct)loadStruct(builtinPdb(),'1BRS 链 A · barnase','内置 Cα 轨迹','pdb');
