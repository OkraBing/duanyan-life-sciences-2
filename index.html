/* MSA 是整条链上唯一的长耗时环节，粒度是轮次不是单条序列。
   依据：ColabFold 官方数据，数据库约 195–221 GB，批量检索约 128 GB 内存，
   单条交互式检索至少 768 GB 内存——自建环境下「点一下等着看」这个交互不成立。 */
/* ---- 轮次必须属于当前项目 ----
   S.round 是全局的：7 个改 S.pid 的地方里有 2 个（侧栏的项目链接）没同步它，
   于是从侧栏切到 p2（只有第 1、2 轮）之后，页头仍写着「Round 4 进行中」——
   那一轮在这个项目里不存在，底下按 S.round 过滤的东西也就全是空的。
   不在 7 个调用点逐个补，在每次渲染前夹一次：不变量只写一遍，以后新增入口也不会漏。 */
function fixRound(){
  const pr=DB.projects.find(x=>x.id===S.pid);
  if(!pr||!pr.rounds||!pr.rounds.length)return;
  if(!pr.rounds.some(r=>r.i===S.round))S.round=pr.rounds[pr.rounds.length-1].i;
}

/* ---- MSA 进度是每个项目自己的 ----
   此前 MSA 是一个全局对象：三个项目的结果页显示同一条「34/88 · 队列第 2 位」，
   在 p1 上换个 MSA 模式，p2 与 p3 跟着一起换。
   要比对的条数不另存一份，就是这一轮的候选数——候选变了它跟着变。 */
const MSA_DEF={mode:'batch', queued:2, done:0, eta:'约 40 分钟'};
function msaOf(){
  const pr=DB.projects.find(x=>x.id===S.pid);
  if(!pr)return Object.assign({total:0},MSA_DEF);
  if(!pr.msa)pr.msa=Object.assign({},MSA_DEF);
  const inRound=CANDS(pr.id).filter(c=>c.firstRound===S.round).length;
  pr.msa.total=inRound||CANDS(pr.id).length;
  if(pr.msa.done>pr.msa.total)pr.msa.done=pr.msa.total;
  return pr.msa;
}
const MSA_MODES={
  batch:{n:'自建批量',note:'序列不出本地。整轮一起排队，约 128 GB 内存',priv:'不外流'},
  public:{n:'公共 MSA 服务',note:'免费、零运维，但有限流',priv:'序列发往外部'},
  cached:{n:'复用已有 MSA',note:'同一靶点上一轮算过的直接用',priv:'不外流'}};
function msaPanel(){
  const MSA=msaOf();
  const m=MSA_MODES[MSA.mode];
  const pct=MSA.total?Math.round(MSA.done/MSA.total*100):0;
return `<section class="card" style="border-left:2px solid var(--dry);padding-left:var(--s4)">
  <div class="row wrap" style="gap:var(--s3)">
    <span class="lbl" style="color:var(--dry)">MSA 构建</span>
    <span class="grow"></span>
    <span class="t-sm mut2 num">${MSA.done}/${MSA.total} · 队列第 ${MSA.queued} 位 · ${MSA.eta}</span>
  </div>
  <div class="bar" style="margin-top:var(--s3)"><i style="width:${pct}%;background:var(--dry)"></i></div>
  <div class="row wrap" style="gap:var(--s2);margin-top:var(--s3)">
    ${Object.keys(MSA_MODES).map(k=>`<button class="btn ${MSA.mode===k?'':'btn-gh'}" type="button" data-msa="${k}"
      style="min-height:1.5rem;font-size:0.75rem${MSA.mode===k?';border-color:var(--dry);color:var(--dry-ink);background:var(--dry-soft);font-weight:600':''}">${MSA_MODES[k].n}</button>`).join('')}
  </div>
  <p class="t-sm mut" style="margin-top:var(--s3)">${esc(m.note)}</p>
  ${MSA.mode==='public'?`<p class="hint" style="color:var(--err);margin-top:4px">
    这条路会把序列发到外部，与「序列不外流」的承诺冲突。未发表序列不要走这条。</p>`
   :`<p class="hint" style="margin-top:4px">序列${esc(m.priv)}。</p>`}
</section>`}

/* ---- 提交那一刻的参数，必须当场冻下来 ----
   不冻会出一个很难发现的错：运行记录回落到「当前配置」，

function pfParams(){

    ['输入',PF.seqs.length+' 条链，'+PF.seqs.reduce((a,e)=>a+(e.seq||'').replace(/\s/g,'').length,0)+' 个残基']];

}

function ctxSig(c0){
  const {ctx,src,planned}=ctxOf(c0);
  const parts=[ctx.host,asList(ctx.assay).join('+'),ctx.buffer,ctx.temp].filter(Boolean);
  return {key:(planned?'plan|':'')+(parts.join('|')||'未填'),
    label:parts.length?parts.join(' · '):'未填实验上下文',
    src:src, planned:planned};
}
function groupRows(rows){
  const m=new Map();
  rows.forEach(c=>{const g=ctxSig(c);
    if(!m.has(g.key))m.set(g.key,{label:g.label,src:g.src,planned:g.planned,rows:[]});
    m.get(g.key).rows.push(c)});
  const multi=m.size>1;
  return [...m.values()].map(v=>[{label:v.label,src:v.src,planned:v.planned,warn:multi},v.rows]);
}

/* ---- 内置的真实坐标：barnase（1BRS 链 A）的 Cα 轨迹 ----
   产品没有结构计算后端，网页也取不到 RCSB（接口不允许从网页直接调用）。
   于是结构视图长期是一个空框加一句「取回失败」——研究员第一次点进来就撞墙。

   这里内置一份**真实**的 Cα 坐标：1BRS 链 A 第 3–110 位，共 108 个残基，
   取自 RCSB 的 1BRS.pdb，没有改动。只有主链 Cα，没有侧链，所以它能看轨迹、
   能点残基、能定位到某个位点，但**不能**用来看侧链接触或算界面——

/* 真实渲染：3Dmol.js，不自研 */
let MOLV=null;
function molColorFn(){
  /* 三种着色各自回答一个问题：
     plddt — 这一段结构可不可信（AFDB 四档，事实标准）
     chain — 这是哪一条链
     mut   — 当前变体改了哪些位点（其余压成浅灰，只留位点） */
  if(VW.style==='chain')return {colorscheme:'chainHetatm'};
  if(VW.style==='mut'){
    const sel=[...VW.sel];
    return {colorfunc:a=>sel.indexOf(a.resi)>=0?HILITE:'#C9C9D2'};
  }
  return {colorfunc:a=>plddtColor(a.b==null?100:a.b)};
}
function molRender(){
  const host=document.getElementById('mol');

      <span class="t-sm mut">3Dmol.js 来自 cdnjs，当前网络取不到。序列、置信度与 PAE 不受影响。</span></div>`;
    return}

  const bg=getComputedStyle(document.body).getPropertyValue('--surface-2').trim()||'#ffffff';
  MOLV=$3Dmol.createViewer(host,{backgroundColor:bg});
  MOLV.addModel(VW.struct,VW.fmt||'pdb');
  /* 普通 cartoon 需要主链 N/C 才画得出来；只有 Cα 时必须明确要 trace 样式，
     否则 3Dmol 不报错，只是什么都不画——这正是此前「看不了 3D」的原因。 */
  const st={};st[VW.mode]=VW.mode==='cartoon'&&VW.caOnly
    ? Object.assign({style:'trace'},molColorFn())
    : molColorFn();
  MOLV.setStyle({},st);

}
/* 从结构里取每残基 pLDDT（B 因子列）*/
/* 有些粗粒化模型和低分辨率条目只给 Cα。那种模型画 stick 会是一串断开的短线
   （相邻 Cα 相距约 3.8Å，超出成键距离，连不上），画 sphere 是一串孤立的球。
   注意判据必须是「严格只有 Cα」：只有主链（N/CA/C/O）的模型画 stick 是一条
   连续的主链轨迹，是能用的视图，不该关掉。
   这一条是从文件里数出来的，不是在界面上替用户断言（R17）。 */
function molStats(){
  const per={},order=[];let nCA=0,nOther=0;
  (VW.struct||'').split('\n').forEach(l=>{
    if(l.slice(0,4)!=='ATOM')return;
    const an=l.slice(12,16).trim();
    if(an==='CA')nCA++; else nOther++;
    if(an!=='CA')return;
    const resi=parseInt(l.slice(22,26)),b=parseFloat(l.slice(60,66)),resn=l.slice(17,20).trim(),ch=l.slice(21,22);
    if(isNaN(resi))return;
    if(per[resi]===undefined){per[resi]={b:isNaN(b)?0:b,resn:resn,ch:ch};order.push(resi)}
  });
  VW.per=order.map(r=>({resi:r,b:per[r].b,resn:per[r].resn,ch:per[r].ch}));
  VW.avg=VW.per.length?VW.per.reduce((a,x)=>a+x.b,0)/VW.per.length:0;
  VW.bands=[0,0,0,0];
  VW.per.forEach(x=>{const i=x.b>90?0:x.b>70?1:x.b>50?2:3;VW.bands[i]++});
  VW.caOnly=nCA>0&&nOther===0;
  /* B 因子列全是 0 的结构（晶体 Cα 轨迹常如此）没有逐残基置信度。
     照着画会得出「Very low 100%」——那是在替结构下一个它没说过的判断。 */
  VW.noB=VW.per.length>0&&VW.per.every(x=>x.b===0);
  /* 只有 Cα 时 stick 画不出来（相邻 Cα 约 3.8Å，连不成键），停在 stick 上就是一张空图。
     sphere 画得出来，cartoon 也画得出来——但必须用 trace 样式，普通 cartoon 同样是空的。
     这三条都是量出来的，不是推的。 */
  if(VW.caOnly&&VW.mode==='stick')VW.mode='cartoon';
}

function pae(){

/* ================= M6 设计循环　M7 湿实验 ================= */
/* ---- 孔板是每个项目自己的事 ----
   此前这是一个全局对象：在 p1 上把板型改成 384，p2 与 p3 的板位容量、
   完整批次条数和送检单会一起跟着变——而界面上写着「96 孔 − 8 对照 = 88 孔位」这样的算式，
   看起来像是各自算出来的。三个项目是三套不同的测定，不会共用一张板。
   现在每个项目存自己的一份，默认 96 孔 8 对照；读写都走 plate()，仍然只有一份事实。 */
const PLATE_DEF={fmt:96, ctrl:8};
function plateOf(){            // 名字别叫 plate：下面已经有一个画板子的 plate(rows,cols)
  const pr=DB.projects.find(x=>x.id===S.pid);

const PLATE_FMT={96:[8,12],192:[8,24],384:[16,24]};
/* M6-F04 构成按「生成路径」给，不按「筛选桶」给——裁决：批次由生成产生，不由事后筛选产生。
   多样性来自多路径本身，不设显式多样性项；不确定性参与但权重调低（0.75）。
   四级浓度同一色相：浓度本身编码比重，比换色相好读。 */
const COMPO=[['R4 最优亲本延伸','var(--dry)',41],['R3 退步分支再探','var(--dry-dim)',22],
  ['未试位点起点','color-mix(in srgb,var(--dry) 45%,transparent)',16],
  ['失败样本反向','color-mix(in srgb,var(--dry) 22%,transparent)',9]];
/* M6-F02 裁决后的生成模型：先定容量，再生成；硬约束只排除、不排序，排除后补位。 */
const GEN={paths:16, iters:3, uncWeight:0.75,
  hard:[['非法残基或长度越界',6,false],['自洽 RMSD 不达标',11,false],['游离半胱氨酸',7,true]],
  hamming:2.38, hammingCtl:2.07};
/* M6-F01 零样本只分档，不给精确排名——排名会被当成置信度用。 */
const ZS={bands:[['A 档','前 15%','var(--dry)',13],['B 档','中间 70%','var(--dry-dim)',61],
  ['C 档','后 15%','var(--ink-3)',14]]};
/* 对照有两套，之前混着用了，必须分开：
   our_control  = 我们在板位上安排的实验对照（野生型、空载体…），我们拥有
   positive_control = 服务商结果里的阳性对照标记，服务商拥有
   两者不互相覆盖，也不能互相推断。 */
/* H1 命中判定。来源：Chai-2 技术报告把「命中」定义成一条可执行的仪器判据
   （BLI 信号高于背景 0.1 nm 且达到背景 300% 以上）。
   我们的服务商返回的是拟合后的 KD，不是原始信号，所以判据落在导出量上——
   这一点要说清，不能假装我们在读仪器原始信号。

   没有命中判定，这个闭环就没有成功指标：研究员答不出「第四轮比第三轮好了吗」，
   而 M6-F02 的裁决整条论证都建立在命中率上。 */
/* 野生型基准。ΔTm 是本项目对照孔实测的，KD 不是——
   barnase–barstar 是已知最紧的蛋白质-蛋白质复合物之一，KD ≈ 1×10⁻¹⁴ M，
   远在 SPR 可靠区间之下，拿本项目的 SPR 去"测"它只会得到一个假数。
   所以 KD 的野生型值取文献停流动力学值，并且标明它不是我们测的。 */
const WT={kd:WT_KD_PM, dTm:0,
  src:'B-2411 野生型对照孔实测（仅 ΔTm）',
  kdSrc:'文献值：Schreiber & Fersht 1993 / Hartley 1993，停流动力学，非本项目实测',
  kdNote:'低于 SPR 可靠下限 1 pM，不作为判据基准'};

/* 目标候选画像（Target Candidate Profile，概念取自 Cradle 平台页，E2）：
   一个**主目标**加若干**约束**。命中 = 主目标达成且约束全部满足。
   不做成「几项加权求和」：那等于替研究员定权重，而我们没有依据定（同 M5-F06）。
   分主次的理由很实在：这个项目的目标是「Tm +5℃ 且 KD 不劣于野生型」，
   四轮下来 Tm 在涨而 KD 在掉。单条 AND 规则只给出一个 0%，
   分开给才看得出是哪一项卡住、是不是两个目标在互相拉扯。

   **判据从项目目标推导，不另写一套。** 项目页上那行目标文字以前是装饰——
   写在那里但没有任何判定用它。现在它和判据是同一份数据的两种呈现。 */
/* ===== 字段登记表（C6 结果字段可配置）=====
   把 KD / ΔTm 写死在表格、判据、导出三处，第一个做酶活或表达量筛查的项目就撞墙。
   所有字段登记在这里，只有一份；表格列、命中判据、导出列、详情页全读它。

   两类字段分清楚：
     assay  湿实验测出来的，**不同测定产出不同字段**，按项目声明
     calc   干实验算出来的，所有项目都有（ipTM、自洽 RMSD、可开发性）
   混在一起就会出现「这个项目为什么有 ΔTm 这一列」——因为它根本没做热稳定性测定。 */
const FIELD={
  // —— 测定字段 ——
  dTm:   {n:'ΔTm', unit:' ℃',  better:'high',dec:1,kind:'assay',sign:true, from:['DSF','nanoDSF']},
  /* 单位是 pM 不是 nM。barnase–barstar 野生型 KD ≈ 1×10⁻¹⁴ M（Schreiber & Fersht 1993），
     也就是 0.01 pM；写成 nM 会把这个体系整整挪走五个数量级。
     floor 是 SPR 的可靠下限：比它更紧的亲和力，SPR 给不出可信数值，
     只能报成「< floor」，不能当成一个点值参与平均和判定。 */
  kd:    {n:'KD',  unit:' pM', better:'low', dec:1,kind:'assay',log:true,  sdKey:'kdLogSd', from:['SPR','BLI'],
          floor:1.0, floorWhy:'SPR 对 KD < 1 pM 不可靠：解离太慢，koff 落在基线漂移里'},
  ec50:  {n:'EC50',unit:' nM', better:'low', dec:1,kind:'assay',log:true,  sdKey:'ec50LogSd',from:['ELISA']},
  kcat:  {n:'kcat',unit:' s⁻¹',better:'high',dec:2,kind:'assay',from:['酶活测定']},
  km:    {n:'Km',  unit:' μM', better:'low', dec:1,kind:'assay',from:['酶活测定']},
  titer: {n:'表达量',unit:' mg/L',better:'high',dec:0,kind:'assay',from:['表达量筛查']},
  // —— 计算字段 ——
  iptm:  {n:'ipTM',unit:'',    better:'high',dec:3,kind:'calc'},
  rmsd:  {n:'自洽 RMSD',unit:' Å',better:'low',dec:2,kind:'calc'},
  dev:   {n:'可开发性',unit:'', better:'high',dec:2,kind:'calc'},
  cys:   {n:'游离半胱氨酸',unit:'',better:'low',dec:0,kind:'flag'}};
/* 读一个字段的值。测定字段从 c.m 里取——没测过就是 null，不是 0。 */
function mv(c,k){const f=FIELD[k];if(!f||!c)return null;
  if(k==='cys')return c.cys?1:0;
  if(f.kind!=='assay')return c[k]==null?null:c[k];
  return (c.m&&c.m[k]!=null)?c.m[k]:null}
function sdOf(c,k){const f=FIELD[k];return (f&&f.sdKey&&c.m)?c.m[f.sdKey]:null}
function fmtv(c,k){const v=mv(c,k),f=FIELD[k];if(v==null)return null;
  /* 对数字段跨好几个数量级，固定小数位会把一整段印成 0.0 */
  if(f.log&&Math.abs(v)<1)return v.toPrecision(2)+f.unit;
  return (f.sign&&v>0?'+':'')+v.toFixed(f.dec)+f.unit}
/* 项目声明它测哪些字段。声明与实际测定方法对不上时要能看出来。 */
function projFields(pr){
  const P=(typeof pr==='string'?DB.projects.find(x=>x.id===pr):pr)||PRJ();
  return (P.fields||['dTm','kd']).filter(k=>FIELD[k])}
const asList=v=>v==null||v===''?[]:(Array.isArray(v)?v:String(v).split(/[、,]\s*/).filter(Boolean));
function BATCHES_OF(pid){const id=pid||S.pid;return BATCHES.filter(b=>b.pid===id)}
function assayMethods(pr){const P=pr||PRJ();const out=[];
  P.rounds.forEach(r=>asList(r.plan&&r.plan.assay).forEach(x=>{if(out.indexOf(x)<0)out.push(x)}));
  BATCHES_OF(P.id).forEach(b=>asList(b.ctx&&b.ctx.assay).forEach(x=>{if(out.indexOf(x)<0)out.push(x)}));
  return out}
function fieldMismatch(pr){const P=pr||PRJ();const ms=assayMethods(P);
  if(!ms.length)return [];
  return projFields(P).filter(k=>{const f=FIELD[k];
    return f.from&&!f.from.some(m=>ms.indexOf(m)>=0)})}
const CMP={'>=':'≥','<=':'≤','==':'='};
function ruleOk(r,c){const v=mv(c,r.k);if(v==null)return false;
  return r.cmp==='>='?v>=r.v:r.cmp==='<='?v<=r.v:v===r.v}
function ruleText(r){return `${FIELD[r.k].n} ${CMP[r.cmp]} ${r.v}${FIELD[r.k].unit}`}
function goalText(pr){const t=pr.tcp;if(!t)return pr.goal||'未设定';
  return ruleText(t.primary)+(t.constraints.length?'，且 '+t.constraints.map(ruleText).join('、'):'')}
function tcpOf(pr){return (pr||PRJ()).tcp}
function tcpEval(c,pr){const t=tcpOf(pr);if(!t)return null;
  return {primary:ruleOk(t.primary,c),
    constraints:t.constraints.map(r=>({n:r.n||ruleText(r),ok:ruleOk(r,c),rule:r})),
    allConstraints:t.constraints.every(r=>ruleOk(r,c))}}
function isHit(c,pr){
  if(c.disposition!=='measured')return false;
  const e=tcpEval(c,pr);return !!e&&e.primary&&e.allConstraints}
/* 逐目标达成率。只看有结果的——没测过的既不算达成也不算未达成。 */
function tcpRates(list,pr){const t=tcpOf(pr);const m=list.filter(c=>c.disposition==='measured');
  const rate=f=>m.length?m.filter(f).length/m.length:null;
  const cnt=f=>m.filter(f).length;
  return {n:m.length,
    primary:t?rate(c=>ruleOk(t.primary,c)):null, primaryN:t?cnt(c=>ruleOk(t.primary,c)):0,
    primaryRule:t&&t.primary,
    perConstraint:t?t.constraints.map(r=>({n:r.n||ruleText(r),rule:r,
      rate:rate(c=>ruleOk(r,c)),count:cnt(c=>ruleOk(r,c))})):[]}}
/* 命中率的分母是个坑：按「有结果」算和按「已送检」算不是一个数，
   而两者差的正是测定失败与未测那部分。两个都给出来，并写明分母。 */
function hitStats(list,pr){
  const ordered=list.filter(c=>['ordered','measured','failed','untested'].indexOf(c.disposition)>=0);
  const measured=list.filter(c=>c.disposition==='measured');
  const hits=measured.filter(c=>isHit(c,pr));
  return {hits:hits.length, measured:measured.length, ordered:ordered.length,
    byMeasured:measured.length?hits.length/measured.length:null,
    byOrdered:ordered.length?hits.length/ordered.length:null, list:hits};
}
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';

/* C1 送检前的预期命中。做法上有两条路：训一个校准模型，或者用本项目历史实测外推。
   我们没有校准数据，所以走后者，并且把这件事写在界面上——
   一个来历不明的「预期命中率 18%」比没有更糟。 */
function forecast(n,pr){
  const P=pr||PRJ();
  if(!tcpOf(P))return {basis:'none',rounds:[]};
  const past=P.rounds.map(r=>({i:r.i,st:hitStats(CANDS().filter(c=>c.firstRound===r.i),P),
                               rt:tcpRates(CANDS().filter(c=>c.firstRound===r.i),P)}))
    .filter(x=>x.st.measured>0);
  if(!past.length)return {basis:'none',rounds:[]};
  const rates=past.map(x=>x.st.byMeasured);
  const lo=Math.min.apply(null,rates), hi=Math.max.apply(null,rates);
  const last=rates[rates.length-1];
  return {basis:'empirical', rounds:past,
    lo:lo, hi:hi, last:last,
    nLo:Math.round(n*lo), nHi:Math.round(n*hi), nLast:Math.round(n*last),
    primaryLo:Math.min.apply(null,past.map(x=>x.rt.primary)),
    primaryHi:Math.max.apply(null,past.map(x=>x.rt.primary)),
    /* 「不现实」的判据：某条约束在历史上的满足率低到一个程度，
       再加轮次也很难同时满足它和主目标。这不是预言，是把历史摆出来。 */
    weak:(past[past.length-1].rt.perConstraint||[]).filter(x=>x.rate!=null&&x.rate<0.15)};
}

/* C2 这一轮该继续、重设计，还是收手。
   三个可测信号：边际收益（主目标达成率的轮间变化）、headroom（最好值距目标还差多少）、
   命中数趋势。给建议，不替人做决定——界面上要写清是哪三个数推出来的。 */
function roundAdvice(pr){
  const P=pr||PRJ();const t=tcpOf(P);
  if(!t||!t.primary||!FIELD[t.primary.k])return null;   // 没设目标就不给建议，别崩
  const f=FIELD[t.primary.k], better=f.better;
  const per=P.rounds.map(r=>{const L=CANDS().filter(c=>c.firstRound===r.i);
    const vals=L.filter(c=>c.disposition==='measured').map(c=>mv(c,t.primary.k)).filter(v=>v!=null);
    return {i:r.i, rt:tcpRates(L,P), st:hitStats(L,P),
      best:vals.length?(better==='high'?Math.max.apply(null,vals):Math.min.apply(null,vals)):null}})
    .filter(x=>x.rt.n>0);
  if(per.length<2)return {verdict:'continue',per:per,field:f,primaryRule:t.primary,head:null,
    why:[per.length?'只有一轮有结果，还看不出趋势':'还没有任何结果，先把这一轮跑完']};
  const a=per[per.length-2], b=per[per.length-1];
  const dPrimary=(b.rt.primary||0)-(a.rt.primary||0);
  const reached=b.best!=null&&(better==='high'?b.best>=t.primary.v:b.best<=t.primary.v);
  const head=b.best==null?null:(better==='high'?t.primary.v-b.best:b.best-t.primary.v);
  const totalHits=hitStats(CANDS(),P).hits;
  const conflict=(b.rt.primary||0)>0.1&&b.st.hits===0;
  const plateau=Math.abs(dPrimary)<0.05&&(a.best!=null&&b.best!=null&&Math.abs(b.best-a.best)<0.3);
  let verdict='continue',why=[];
  /* 「停」有两种，不能用一个词盖过去：目标达成了该去验证，和这条路走不通该放弃。 */
  if(totalHits>0&&reached){verdict='verify';
    why.push(`已有 ${totalHits} 条命中，本轮最好值 ${f.n} ${b.best}${f.unit} 已达目标 ${t.primary.v}${f.unit}`);
    why.push('该做的不是再加一轮，是拿这几条去放大表达、做重复验证')}
  else if(conflict){verdict='redesign';
    why.push(`主目标达成 ${pct(b.rt.primary)}，命中却是 0——卡在约束上，不是轮次不够`)}
  else if(plateau){verdict='abandon';
    why.push(`主目标达成率两轮变化 ${(dPrimary*100).toFixed(1)} 个百分点，最好值也几乎没动，已经平台期`);
    why.push('继续投轮次的边际收益接近零')}
  else if(dPrimary>0){verdict='continue';
    why.push(`主目标达成率 ${pct(a.rt.primary)} → ${pct(b.rt.primary)}，还在涨`)}
  else {verdict='redesign';
    why.push(`主目标达成率 ${pct(a.rt.primary)} → ${pct(b.rt.primary)}，掉了`)}
  if(head!=null&&head>0)why.push(`距目标还差 ${head.toFixed(1)}${f.unit}`);
  else if(head!=null)why.push(`最好值已超过目标 ${Math.abs(head).toFixed(1)}${f.unit}`);
  if(b.st.hits)why.push(`本轮命中 ${b.st.hits} 条`);
  return {verdict:verdict,why:why,per:per,head:head,reached:reached,
    dPrimary:dPrimary,primaryRule:t.primary,field:f}}
const ADVICE={continue:['继续下一轮','var(--dry)'],redesign:['重新设计','var(--wet)'],
  verify:['收口去验证','var(--dry)'],abandon:['收手','var(--err)']};
const OUR_CONTROLS=[
 {k:'wt',n:'野生型',why:'所有相对值的基准'},
 {k:'empty',n:'空载体',why:'排除载体本身的信号'},

/* 适配层：未知状态兜底，不崩也不显示原始英文。
   但「静默归一」是运维盲区——服务商把 done 改名成 completed，界面会永远停在「进行中」而没人发现。
   所以兜底照做，同时把原值记下来并在界面上标出来，让人知道这是没认出来的值，不是真的在跑。 */
const UNKNOWN_STATUS=new Set();
function statusOf(raw){
  const k=String(raw==null?'':raw).toLowerCase();
  const f=EXP_STATUS.find(x=>x.k===k);
  if(f)return {n:f.n,phase:f.phase,known:true,raw:k};
  if(k)UNKNOWN_STATUS.add(k);
  /* 不认识的状态原样显示。原先一律返回「进行中」——等于给一个不认识的状态
     编了个看着合理的值，而界面上看不出这是编的。 */
  return {n:k||'未知',phase:'执行',known:false,raw:k};
}
const mapStatus=raw=>statusOf(raw).n;
const WET={type:'affinity', status:'in_production', results:'partial',
  /* 这里曾经有一个 WET.nrep。它和轮次计划里的 reps 是同一件事的两份值：
     孔板容量、可检出效应按轮次计划的 n 算，报价按 WET.nrep 算——
     在送检页把重复数改成 5，报价跟着变，孔板容量却纹丝不动。
     现在送检页的选择器直接改本轮计划，全站只读 repsNow()。 */
  enzyme:'', method:'spr', partial:{n:3,why:'拟合质量不达标'}};
/* 跟踪面板跟的是本项目**在途的那个批次**，不是一个凭空的状态机。
   状态流水、已经走了多久、预计还要多久，全部从这个批次的 log 算。 */
function wetBatch(){
  const L=BATCHES.filter(b=>b.pid===S.pid);
  return L.find(b=>b.status!=='done'&&b.status!=='canceled')||L[L.length-1]||null;
}
/* 预计还要多久：用本项目走完批次的中位周转减去已经走的时间。
   没有走完过批次就给不出——不编一个「预计 14 天」。 */
function wetETA(b){
  const T=turnaround(b?b.pid:S.pid);
  if(!b||b.status==='done'||b.status==='canceled')return null;
  if(!T.n)return {med:null,why:'走完一个批次才有预计时间'};
  const age=batchAgeDays(b), left=T.med-age;
  return {med:T.med,age:age,left:left,n:T.n,min:T.min,max:T.max,
    why:`按本项目 ${T.n} 个走完批次的中位周转 ${fmtDays(T.med)}（${fmtDays(T.min)}–${fmtDays(T.max)}）折算`};
}


function plate(rows,cols,scaled){
  const letters='ABCDEFGHIJKLMNOP';
  const seq=[];
  for(let i=0;i<plateOf().ctrl;i++)seq.push(['我们的对照','var(--wet)']);
  scaled.forEach(([n,c,k])=>{for(let i=0;i<k;i++)seq.push([n,c])});
  const cell=cols>12?12:17;   // 和全局的 9px 像素格同一尺度，不喧宾夺主
  let h=`<div style="overflow-x:auto"><div style="display:grid;gap:3px;width:max-content;
    grid-template-columns:18px repeat(${cols},${cell}px)">`;
  h+='<span></span>';
  for(let c=1;c<=cols;c++)h+=`<span class="t-xs mut2 num" style="text-align:center">${c}</span>`;
  for(let r=0;r<rows;r++){
    h+=`<span class="t-xs mut2 num" style="line-height:1;align-self:center">${letters[r]}</span>`;
    for(let c=0;c<cols;c++){const i=r*cols+c,w=seq[i]||['对照','var(--ink-3)'];
      h+=`<i title="${letters[r]}${c+1}　${w[0]}" style="aspect-ratio:1;border-radius:2px;background:${w[1]}"></i>`}
  }
  return h+'</div></div>';
}

/* ============ 序列检索引擎 ============
   Smith-Waterman 局部比对 + BLOSUM62 + 仿射空位罚分（开 11、延 1，BLAST 蛋白默认）。
   Score 与 Identity 都是这里真算出来的，不是查表写死的。
   不给 E 值：E 值要用 Karlin-Altschul 的 λ 与 K，这两个常数依赖矩阵与空位罚分的统计标定，
   本地这套库没有标定过，照抄一个数就是编造。界面上写明原因。 */
const B62_AA='ARNDCQEGHILKMFPSTWYV';
const B62_ROWS=[
 '4,-1,-2,-2,0,-1,-1,0,-2,-1,-1,-1,-1,-2,-1,1,0,-3,-2,0',
 '-1,5,0,-2,-3,1,0,-2,0,-3,-2,2,-1,-3,-2,-1,-1,-3,-2,-3',
 '-2,0,6,1,-3,0,0,0,1,-3,-3,0,-2,-3,-2,1,0,-4,-2,-3',
 '-2,-2,1,6,-3,0,2,-1,-1,-3,-4,-1,-3,-3,-1,0,-1,-4,-3,-3',
 '0,-3,-3,-3,9,-3,-4,-3,-3,-1,-1,-3,-1,-2,-3,-1,-1,-2,-2,-1',
 '-1,1,0,0,-3,5,2,-2,0,-3,-2,1,0,-3,-1,0,-1,-2,-1,-2',
 '-1,0,0,2,-4,2,5,-2,0,-3,-3,1,-2,-3,-1,0,-1,-3,-2,-2',
 '0,-2,0,-1,-3,-2,-2,6,-2,-4,-4,-2,-3,-3,-2,0,-2,-2,-3,-3',
 '-2,0,1,-1,-3,0,0,-2,8,-3,-3,-1,-2,-1,-2,-1,-2,-2,2,-3',
 '-1,-3,-3,-3,-1,-3,-3,-4,-3,4,2,-3,1,0,-3,-2,-1,-3,-1,3',
 '-1,-2,-3,-4,-1,-2,-3,-4,-3,2,4,-2,2,0,-3,-2,-1,-2,-1,1',
 '-1,2,0,-1,-3,1,1,-2,-1,-3,-2,5,-1,-3,-1,0,-1,-3,-2,-2',
 '-1,-1,-2,-3,-1,0,-2,-3,-2,1,2,-1,5,0,-2,-1,-1,-1,-1,1',
 '-2,-3,-3,-3,-2,-3,-3,-3,-1,0,0,-3,0,6,-4,-2,-2,1,3,-1',
 '-1,-2,-2,-1,-3,-1,-1,-2,-2,-3,-3,-1,-2,-4,7,-1,-1,-4,-3,-2',
 '1,-1,1,0,-1,0,0,0,-1,-2,-2,0,-1,-2,-1,4,1,-3,-2,-2',
 '0,-1,0,-1,-1,-1,-1,-2,-2,-1,-1,-1,-1,-2,-1,1,5,-2,-2,0',
 '-3,-3,-4,-4,-2,-2,-3,-2,-2,-3,-2,-3,-1,1,-4,-3,-2,11,2,-3',
 '-2,-2,-2,-3,-2,-1,-2,-3,2,-1,-1,-2,-1,3,-3,-2,-2,2,7,-1',
 '0,-3,-3,-3,-1,-2,-2,-3,-3,3,1,-2,1,-1,-2,-2,0,-3,-1,4'].map(r=>r.split(',').map(Number));
const B62_IX=(function(){const m={};for(let i=0;i<B62_AA.length;i++)m[B62_AA[i]]=i;return m})();
function b62(a,b){const i=B62_IX[a],j=B62_IX[b];return (i===undefined||j===undefined)?-1:B62_ROWS[i][j];}

const SW_OPEN=11, SW_EXT=1;
/* 带回溯的 Smith-Waterman。长度都在几百以内，全矩阵回溯没有性能问题。 */
function swAlign(q,t){
  const n=q.length,m=t.length,NEG=-1e9;
  const H=new Int32Array((n+1)*(m+1)),E=new Int32Array((n+1)*(m+1)).fill(NEG),
        F=new Int32Array((n+1)*(m+1)).fill(NEG),P=new Uint8Array((n+1)*(m+1));
  let best=0,bi=0,bj=0;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const k=i*(m+1)+j;
    E[k]=Math.max(H[k-1]-SW_OPEN, E[k-1]-SW_EXT);
    F[k]=Math.max(H[k-m-1]-SW_OPEN, F[k-m-1]-SW_EXT);
    const d=H[k-m-2]+b62(q[i-1],t[j-1]);
    let v=0,p=0;
    if(d>v){v=d;p=1}
    if(E[k]>v){v=E[k];p=2}
    if(F[k]>v){v=F[k];p=3}
    H[k]=v;P[k]=p;
    if(v>best){best=v;bi=i;bj=j}
  }
  let i=bi,j=bj,qa='',ta='',mid='',id=0,aln=0;
  while(i>0&&j>0){
    const k=i*(m+1)+j,p=P[k];
    if(!p||!H[k])break;
    if(p===1){const a=q[i-1],b=t[j-1];qa=a+qa;ta=b+ta;
      mid=(a===b?a:(b62(a,b)>0?'+':' '))+mid;if(a===b)id++;aln++;i--;j--}
    else if(p===2){qa='-'+qa;ta=t[j-1]+ta;mid=' '+mid;aln++;j--}
    else{qa=q[i-1]+qa;ta='-'+ta;mid=' '+mid;aln++;i--}
  }
  return {score:best,ident:id,aln:aln,
    pct:aln?id/aln*100:0,
    qs:i+1,qe:bi,ts:j+1,te:bj,qa:qa,ta:ta,mid:mid};
}

/* 可检索的语料只有内置样本——项目里的变体只存突变记法，没有整条序列，
   拼不出序列就没法做相似性比对。这一点在界面上写清楚，不拿空壳充数。 */
function SEEK_CORPUS(){
  const out=[];
  Object.keys(BUILTIN).forEach(id=>{const e=BUILTIN[id];
    e.chains.forEach(c=>out.push({
      key:e.chains.length>1?id+'_'+c.id:id,
      acc:id, chain:c.id, name:e.name, src:e.src, seq:c.seq, len:c.seq.length}))});
  return out;
}
/* 数据库按「它装的是什么数据」分，不按我们的能力分类分——
   研究员找库时问的是「有没有突变效应的实测集」，不是「这个属于功能预测还是结构」。
   取值从每条数据源自己的 mode 字段归一。 */
const DB_KINDS=[['seq','序列'],['struct','结构'],['pred','预测结构'],
  ['mut','突变效应'],['bench','基准'],['ab','抗体'],['own','本项目实测']];
function dbKind(d){const m=d.mode||'';
  if(/抗体/.test(m))return 'ab';
  if(/变体 · 实测|实测/.test(m))return 'own';
  if(/预测结构/.test(m))return 'pred';
  if(/突变/.test(m))return 'mut';
  if(/基准/.test(m))return 'bench';
  if(/结构/.test(m))return 'struct';
  if(/序列/.test(m))return 'seq';
  return 'seq';
}
/* d() 是这个库的一句话说明，只在下拉菜单里出现——
   以前它同时被摆在下拉框旁边当常驻文案，等于把同一句话说两遍，
   而且选中「内置样本库」时那句话还是上一个库的。 */
const SEEK_DBS={
  builtin:{n:'内置样本库',ok:true, d:()=>{const c=SEEK_CORPUS();
    return c.length+' 条 · '+c.reduce((s,x)=>s+x.len,0)+' 残基'}},
  uniprot:{n:'UniProtKB',ok:false,d:()=>'按登录号取回，不做序列相似性比对'},
  pdb:{n:'RCSB PDB', ok:false,d:()=>'按 PDB ID 取回，不做序列相似性比对'}};

const SK={struct:null,phase:'idle',q:'',db:'builtin',stage:0,done:0,total:0,ms:0,hits:[],note:'',sort:'score',open:null,
  mode:'sim',            /* sim 相似性比对 ｜ kw 关键词与登录号 */
  kw:[],kwErr:'',kwMs:0,kwTotal:null,
  fPct:0,fAln:0,fSrc:'全部',  /* N03 结果过滤：一致度下限、比对长度下限、来源 */
  from:null};            /* 从某份已保存检索打开时记下它的 id */
const SK_STAGES=['解析序列','搜索数据库','比对分析','生成结果'];

function seqClean(v){
  /* FASTA 头去掉，空白与数字去掉（很多人直接从 PDB 页面拷带行号的序列）。 */
  const lines=String(v||'').split(/\r?\n/).filter(l=>l.trim()[0]!=='>');
  return lines.join('').replace(/[^A-Za-z]/g,'').toUpperCase();
}
function seekStart(){
  const raw=(S.seek||'').trim();
  const q=seqClean(raw);
  if(!q){toast('先粘贴一条蛋白序列');return}
  const bad=q.split('').filter(c=>B62_IX[c]===undefined);
  if(q.length<10){toast('序列太短，至少 10 个残基才能比对');return}
  if(q.length>4000){toast(`序列 ${q.length} 个残基，超过本机比对上限 4000`);return}
  const db=SEEK_DBS[SK.db];
  if(!db.ok){
    SK.phase='blocked';SK.q=q;render();return}
  const C=SEEK_CORPUS();
  SK.phase='run';SK.q=q;SK.stage=0;SK.done=0;SK.total=C.length;SK.hits=[];SK.open=null;
  SK.note=bad.length?`已忽略 ${[...new Set(bad)].join('')} 等 ${bad.length} 个非标准残基字符`:'';
  const t0=performance.now();
  render();
  /* 进度是真的：每比对完一条推进一格，不是定时器假装。 */
  const step=k=>{
    if(SK.phase!=='run')return;
    if(k>=C.length){
      SK.stage=3;SK.done=C.length;
      SK.hits.sort((a,b)=>b.score-a.score);
      SK.ms=Math.round(performance.now()-t0);
      SK.phase='done';saveSeek();render();return}
    SK.stage=k===0?1:2;
    const e=C[k],a=swAlign(SK.q,e.seq);
    if(a.score>0)SK.hits.push(Object.assign({},e,a));
    SK.done=k+1;render();
    setTimeout(()=>step(k+1),0);
  };
  SK.stage=0;setTimeout(()=>step(0),90);
}
/* 拖滑块时只换命中列表这一块，整页重渲染会把滑块焦点弄丢 */
function bindHits(){
  const q=(sel,f)=>view.querySelectorAll(sel).forEach(f);
  q('[data-hit]',b=>b.onclick=()=>{SK.open=SK.open===b.dataset.hit?null:b.dataset.hit;paintHits()});
  q('[data-seekstruct]',b=>b.onclick=()=>{SK.struct=b.dataset.seekstruct;render();
    setTimeout(()=>{const el=view.querySelector('#scid');if(el){el.value=SK.struct;act('scfetch')}},0)});
  q('[data-hitpred]',b=>b.onclick=()=>{
    /* D10：带着版本化输入走，不让人复制粘贴一遍 */
    const e=SEEK_CORPUS().find(x=>x.key===b.dataset.hitpred);if(!e)return;
    PF.seqs=[{t:'protein',copy:1,seq:e.seq,mods:0}];PF.name=e.key+' 结构预测';PF._n=null;
    go('models');toast(`已填入 ${e.key}，${e.len} 个残基`)});
  q('[data-hitdes]',b=>b.onclick=()=>{

}
function paintHits(){

  box.innerHTML=hitListHTML();
  bindHits();bindCopy();
  const h2=document.querySelector('#view h2 .num');
  if(h2)h2.textContent=hitsPassed().length+(fltOn()&&hitsPassed().length!==SK.hits.length?' / '+SK.hits.length:'');

function seekReset(){SK.phase='idle';SK.hits=[];SK.kw=[];SK.kwErr='';SK.open=null;SK.from=null;
  SK.fPct=0;SK.fAln=0;SK.fSrc='全部';render()}

/* 关键词检索走 UniProtKB 的 search 接口。字段用 fields= 显式点名，
   回来什么就显示什么；取不回来就把真实的错误写在界面上，不编条数。
   RCSB 这一侧本产品只接了按编号取回，没接它的全文检索索引，所以这里不列它。 */
const KW_FIELDS='accession,id,protein_name,organism_name,length';
function kwURL(q,size){
  return 'https://rest.uniprot.org/uniprotkb/search?query='+encodeURIComponent(q)
    +'&format=json&size='+size+'&fields='+KW_FIELDS;
}
async function kwStart(){
  const q=(S.seek||'').trim();
  if(!q){toast('先输入关键词或登录号');return}
  SK.mode='kw';SK.phase='kwrun';SK.q=q;SK.kw=[];SK.kwErr='';SK.kwTotal=null;SK.from=null;render();
  const t0=performance.now();
  try{
    const r=await fetch(kwURL(q,25));
    if(!r.ok)throw new Error('接口返回 HTTP '+r.status+' '+r.statusText);
    const tot=r.headers.get('x-total-results');
    SK.kwTotal=tot===null?null:+tot;
    const j=await r.json();
    SK.kw=(j.results||[]).map(x=>{
      const pd=x.proteinDescription||{},rn=pd.recommendedName||{},
        sub=(pd.submissionNames||[])[0]||{},og=x.organism||{};
      return {acc:x.primaryAccession||'',id:x.uniProtkbId||'',
        name:(rn.fullName||{}).value||(sub.fullName||{}).value||'',
        ec:((rn.ecNumbers||[])[0]||{}).value||'',
        org:og.scientificName||'',tax:og.taxonId||'',
        len:(x.sequence||{}).length||0,
        rev:!/unreviewed/i.test(x.entryType||'')};
    });
  }catch(e){
    SK.kwErr=(e&&e.message)||'请求未发出';
  }
  SK.kwMs=Math.round(performance.now()-t0);
  SK.phase='kwdone';render();
}

/* N03 结果过滤：阈值都来自这次命中的真实区间，不预设一个好看的数。 */
function hitRange(){
  const H=SK.hits;if(!H.length)return {pct:[0,100],aln:[0,0],srcs:[]};
  return {pct:[0,Math.ceil(Math.max.apply(null,H.map(h=>h.pct)))],
    aln:[0,Math.max.apply(null,H.map(h=>h.aln))],
    srcs:[...new Set(H.map(h=>h.src))]};
}
function hitsPassed(){
  return hitsSorted().filter(h=>h.pct>=SK.fPct&&h.aln>=SK.fAln
    &&(SK.fSrc==='全部'||h.src===SK.fSrc));
}
function fltOn(){return SK.fPct>0||SK.fAln>0||SK.fSrc!=='全部'}

/* 命中区域：比对落在查询序列的哪一段。按查询全长折算宽度，不画示意图。 */
function spanBar(h,qlen){
  const L=Math.max(qlen,1),a=(h.qs-1)/L*100,w=Math.max((h.qe-h.qs+1)/L*100,1.2);
  return `<div class="span" role="img"

    <i style="left:${a.toFixed(2)}%;width:${w.toFixed(2)}%"></i></div>`;
}

/* N03 结果保存：存查询、库、过滤条件与命中指标。
   比对串不存（长序列会把 localStorage 撑爆），重开后按原查询就地重算。 */
/* 相对时间：一周以内说「几分钟／几小时／几天前」，再远就给日期，别让人算。 */
function agoTx(ms){
  const d=Date.now()-ms;
  if(d<60e3)return '刚刚';
  if(d<36e5)return Math.floor(d/60e3)+' 分钟前';
  if(d<864e5)return Math.floor(d/36e5)+' 小时前';
  if(d<6048e5)return Math.floor(d/864e5)+' 天前';
  const t=new Date(ms),z=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}`;
}
function SAVED(){return LS.get('seeks',[])}
/* 检索跑完自动记一条，不用人点「保存」——
   这件事产品自己记得住，多一个按钮就是多一件要用户操心的事。 */
function saveSeek(){
  if(SK.phase!=='done')return;
  const L=SAVED().filter(x=>!(x.q===SK.q&&x.db===SK.db));  // 同一条查询只留最近一次
  const id='sv'+Date.now().toString(36);
  L.unshift({id:id,at:Date.now(),q:SK.q,db:SK.db,ms:SK.ms,note:SK.note,
    n:SK.hits.length,
    f:{pct:SK.fPct,aln:SK.fAln,src:SK.fSrc},
    hits:SK.hits.map(h=>({key:h.key,acc:h.acc,chain:h.chain,name:h.name,src:h.src,len:h.len,
      score:h.score,pct:h.pct,ident:h.ident,aln:h.aln,qs:h.qs,qe:h.qe,ts:h.ts,te:h.te}))});
  LS.set('seeks',L.slice(0,20));SK.from=id;
}
function openSaved(id){
  const r=SAVED().find(x=>x.id===id);if(!r)return;
  SK.mode='sim';SK.phase='done';SK.q=r.q;SK.db=r.db;SK.ms=r.ms;SK.note=r.note||'';
  SK.hits=r.hits.slice();SK.total=r.hits.length;SK.open=null;SK.struct=null;SK.from=id;
  SK.fPct=(r.f||{}).pct||0;SK.fAln=(r.f||{}).aln||0;SK.fSrc=(r.f||{}).src||'全部';
  S.seek=r.q;go('library');
}
function delSaved(id){
  LS.set('seeks',SAVED().filter(x=>x.id!==id));
  if(SK.from===id)SK.from=null;
  render();toast('已删除这份检索');
}
/* 重开已保存的检索后，比对串不在本地：按同一条查询就地重算这一条。 */
function hitAln(h){
  if(h.qa)return h;
  const e=SEEK_CORPUS().find(x=>x.key===h.key);
  if(!e)return null;
  return Object.assign({},h,swAlign(SK.q,e.seq));
}
function hitsSorted(){
  const h=SK.hits.slice();
  if(SK.sort==='ident')h.sort((a,b)=>b.pct-a.pct||b.score-a.score);
  else if(SK.sort==='len')h.sort((a,b)=>b.aln-a.aln||b.score-a.score);
  else h.sort((a,b)=>b.score-a.score);
  return h;
}

/* 比对展示：60 列一段，查询在上、目标在下，中间一行标相同（字母）与保守替换（+）。 */
function alnBlock(h){
  const W=60,out=[];
  for(let i=0;i<h.qa.length;i+=W){
    const qseg=h.qa.slice(i,i+W),tseg=h.ta.slice(i,i+W),mseg=h.mid.slice(i,i+W);
    const qn=h.qs+i-(h.qa.slice(0,i).split('-').length-1);
    const tn=h.ts+i-(h.ta.slice(0,i).split('-').length-1);
    out.push(`<div class="aln-b">
      <div><span class="aln-n">查询 ${qn}</span>${esc(qseg)}</div>
      <div><span class="aln-n"></span><span class="aln-m">${esc(mseg).replace(/ /g,'&nbsp;')}</span></div>
      <div><span class="aln-n">目标 ${tn}</span>${esc(tseg)}</div></div>`);
  }
  return out.join('');
}

/* 实验结论：把这一批从发起到回流写成一份能带走的 Markdown。
   每一项都从批次记录里读，没有的写「未回」——这份东西是要贴进实验记录本的，
   编一个数进去比少一项糟得多。 */
function expReport(b){
  const L=[];const w=x=>L.push(x);
  const pr=DB.projects.find(x=>x.id===b.pid)||{};
  const pt=protoAll().find(x=>x.id===b.proto);
  const was=S.pid;S.pid=b.pid;
  const rows=CANDS().filter(c=>c.batch===b.id);
  const fs=projFields(pr);
  w('# 实验结论　'+b.id);
  w('');
  w('- 项目：'+(pr.name||b.pid));
  w('- 轮次：R'+(b.round==null?'—':b.round));
  w('- 配方：'+(pt?(pt.id+'　'+pt.n):(b.proto||'—')));
  w('- 实验室：'+(b.vendor||'—'));
  w('- 送检条数：'+(b.n==null?'—':b.n));
  w('- 状态：'+(statusOf(b.status).n||b.status));
  w('- 结果回流：'+(b.results==='none'?'未回':(RESULTS_STATUS[b.results]||b.results)));
  w('');
  w('## 状态流水');
  (b.log||[]).forEach(([k,t])=>w('- '+t+'　'+((statusOf(k)||{}).n||k)));
  w('');
  w('## 回流数据');
  if(!rows.length){w('这一批还没有回流数据。')}
  else{
    w('共 '+rows.length+' 条。');
    w('');
    const cols=fs.filter(k=>rows.some(c=>mv(c,k)!=null));
    w('| 变体 | '+cols.map(k=>((FIELD[k]||{}).n||k)+(FIELD[k]&&FIELD[k].unit?'（'+String(FIELD[k].unit).trim()+'）':'')).join(' | ')+' |');
    w('|---|'+cols.map(()=>'---').join('|')+'|');
    rows.forEach(c=>w('| '+c.id+' | '+cols.map(k=>{const v=mv(c,k);
      return v==null?'未回':(typeof v==='number'?(+v).toFixed(3):String(v))}).join(' | ')+' |'));
    w('');
    cols.forEach(k=>{
      const v=rows.map(c=>mv(c,k)).filter(x=>typeof x==='number'&&isFinite(x));
      if(v.length<2)return;
      const mu=v.reduce((a,x)=>a+x,0)/v.length;
      const sd=Math.sqrt(v.reduce((t,x)=>t+(x-mu)*(x-mu),0)/v.length);
      w('- '+((FIELD[k]||{}).n||k)+'：n = '+v.length
        +'，均值 '+mu.toFixed(3)+'，标准差 '+sd.toFixed(3)
        +'，范围 '+Math.min.apply(null,v).toFixed(3)+' – '+Math.max.apply(null,v).toFixed(3));
    });
  }
  w('');
  w('导出于 '+nowStamp()+'。数据取自本工作台的批次记录，没有经过二次加工。');
  S.pid=was;
  return L.join('\n');
}
function nextStep(b){
  if(b.status==='draft')      return {who:'你',act:'补全实验上下文并申请排期',go:'wetlab'};
  if(b.status==='quote_sent') return {who:'你',act:'确认排期并提交',go:'wetlab',money:1};
  if(b.status==='waiting_for_materials') return {who:'你',act:'确认材料已寄出',go:'wetlab'};
  if(b.status==='canceled')   return null;
  if(b.status==='done'){
    if(b.results==='all')     return {who:'你',act:'导入结果',go:'wetlab'};
    if(b.results==='partial') return {who:'你',act:'选择重测',go:'wetlab'};
    return {who:'你',act:'联系实验节点确认结果',go:'wetlab'};
  }
  return {who:'实验节点',act:'等待'+(statusOf(b.status).n),go:null};
}

      ${fRow('用途声明',1,`<span class="ctl ctl-sel" style="height:2rem">

/* 置信度不是写死的：结构类任务取该轮候选 ipTM 的中位数，由真实候选数据算出来。
   算不出来的任务就留空，不编一个数填进去。 */
function jobConf(t){
  if(t.cap!=='str'&&t.cap!=='des')return null;
  const L=CANDS(t.pid).filter(c=>c.firstRound===t.r&&typeof c.iptm==='number');
  if(L.length<3)return null;
  const v=L.map(c=>c.iptm).sort((a,b)=>a-b);
  const med=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
  return {k:'ipTM 中位', v:med.toFixed(3), n:L.length};
}

  /* 「完成」还不够：任务要真的记下了产出，才有东西可下。

/* ============ S02 统一工具选择器 ============
   任务配置里的每个节点都从这里选工具：推荐、最近用过、全部适配，
   外加全目录检索与「为什么不适配」。不适配只写得出真实理由——
   用途类型不符是真的，输入格式是否匹配本环境判断不了，就不假装能判断。
   没启用的工具可以在这里当场启用，启用这个动作因此有了去处。 */
const F_LBL={seq:'序列',entities:'分子清单',structure:'结构',backbone:'主链骨架',
  ligand:'配体',constraints:'约束',accession:'登录号',pdb_id:'PDB 编号',mutations:'突变',
  variants:'变体清单',confidence:'置信度',score:'打分',descriptors:'描述符',rmsd:'自洽 RMSD',
  order:'订单',result_file:'结果文件',claim:'结论',annotations:'注释',plate:'板位图',
  writeback:'写回变体库',evidence:'证据链'};
function fLbl(f){return F_LBL[f]||f}
/* 最近用过：按名字记，最多 8 个。 */
function RECENTS(){return LS.get('recents',[])}
function pushRecent(n){const L=RECENTS().filter(x=>x!==n);L.unshift(n);LS.set('recents',L.slice(0,8))}

const TP={cap:null,node:null,cur:'',on:null,tab:'fit',q:'',order:null,orderKey:''};
/* 候选池：Protenix 在 DB.tools 与 VMODELS 里各有一条，按名字去重。 */
function tpPool(){
  const seen={},out=[];
  ALL_TOOLS().forEach(t=>{if(seen[t.n])return;seen[t.n]=1;out.push(t)});
  return out;
}

/* 不适配的原因要具体到字段：说清它吐的是什么、这个节点要什么。 */
function tpWhy(t){
  const nd=TP.node;
  if(!nd)return t.cap!==TP.cap?`用途是「${capName(t.cap)}」，这个节点要「${capName(TP.cap)}」`:'';
  const c=contractOf(t),fi=c.i.map(x=>x.f),fo=c.o.map(x=>x.f);
  if(!nd.give.some(f=>fo.indexOf(f)>=0))
    return `输出是${fo.filter(Boolean).map(fLbl).join('、')||'未归一的东西'}，这一段要的是${nd.give.map(fLbl).join('或')}`;
  if(!nd.need.some(f=>fi.indexOf(f)>=0))
    return `输入要${fi.filter(Boolean).map(fLbl).join('、')||'未归一的东西'}，这一段给得出的是${nd.need.map(fLbl).join('或')}`;
  if(!pubOK(t.n))return '注册表里已停用，新任务不能再选它';
  return '';
}
function tpOK(t){
  return TP.node?(pubOK(t.n)&&nodeFit(TP.node,t)):(t.cap===TP.cap&&pubOK(t.n));
}
function tpList(){
  const P=tpPool(),q=TP.q.trim().toLowerCase();
  const match=t=>!q||((t.n+' '+(t.s||'')+' '+(t.u||'')+' '+(t.kw||[]).join(' ')).toLowerCase().indexOf(q)>=0);
  const fit=P.filter(t=>tpOK(t)&&match(t));
  const R=RECENTS(),E=ENABLED();
  if(TP.tab==='recent')return [R.map(n=>fit.find(t=>t.n===n)).filter(Boolean),[]];
  if(TP.tab==='all')  return [fit,P.filter(t=>!tpOK(t)&&match(t))];
  /* 推荐：已启用的排前面，其次最近用过。
     顺序在打开弹窗（或换页签／改搜索词）时定一次，之后不再变——
     否则拨一下启用开关，那一条就跳到列表顶上，人正在看的位置被抽走。 */
  const score=t=>(E.indexOf(t.n)>=0?2:0)+(R.indexOf(t.n)>=0?1:0);
  const sorted=fit.slice().sort((a,b)=>score(b)-score(a));
  if(!TP.order||TP.orderKey!==TP.tab+'|'+TP.q){
    TP.orderKey=TP.tab+'|'+TP.q;TP.order=sorted.map(t=>t.n);
    return [sorted,[]];
  }
  const ix=n=>{const i=TP.order.indexOf(n);return i<0?999:i};
  return [fit.slice().sort((a,b)=>ix(a.n)-ix(b.n)),[]];
}
function tpRow(t,ok0){
  /* 只登记了接口、没有执行体的，这里一律当选不了——
     让它能被选中，等于让用户编排一条永远跑不起来的链。 */
  const ok=ok0&&t.ok!==0;
  const on=ENABLED().indexOf(t.n)>=0;
  const why=ok?'':(t.ok===0?(t.why||'只登记了接口，执行体还没接'):tpWhy(t));
  return `<div class="tprow${ok?'':' is-off'}${TP.cur===t.n?' is-cur':''}">
    <button class="tprow-m" type="button" ${ok?`data-tppick="${esc(t.n)}"`:'disabled'}>
      <span class="ck">${TP.cur===t.n?CK:''}</span>
      <span class="col" style="gap:2px;min-width:0;align-items:flex-start">
        <span class="row" style="gap:7px">
          <strong class="t-md">${esc(t.n)}</strong>
          <span class="chip c-mut">${esc(t.u||t.k||'')}</span>
          ${on?'<span class="chip c-dry">已启用</span>':''}</span>
        <span class="t-sm mut2 tprow-s">${esc(why||t.s||'')}</span>

      </span>
    </button>
    ${ok?`<button class="sw" type="button" data-tpen="${esc(t.n)}" role="switch"
      aria-checked="${on}" aria-label="启用 ${esc(t.n)}"
      title="${on?'已启用':'未启用'}"><i></i></button>`:''}
  </div>`;
}
function tpBody(){
  const r=tpList(),fit=r[0],bad=r[1];
  const R=RECENTS().length;
  const T=[['fit','推荐',''],['recent','最近用过',R?String(R):''],
           ['all','全部',String(tpPool().filter(tpOK).length)]];
  return `<div class="col" style="gap:var(--s3)">

      ${bad.length?`<div class="lbl" style="padding:var(--s4) 0 var(--s2)">不适配这个节点　${bad.length}</div>

    </div>

}
function tpPaint(){

function tpBind(){
  const d=document.getElementById('dlg');if(!d)return;
  const q=(s,f)=>d.querySelectorAll(s).forEach(f);
  q('#tpq',el=>{el.oninput=()=>{TP.q=el.value;tpPaint();
    const n=document.querySelector('#dlg #tpq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}});
  q('[data-tptab]',b=>b.onclick=e=>{e.preventDefault();TP.tab=b.dataset.tptab;tpPaint()});
  q('[data-tpen]',b=>b.onclick=e=>{e.preventDefault();

    if(ENABLED().indexOf(n)<0)toggleTool(n);      // 选了就启用，不让人再跑一趟工具架
    pushRecent(n);d.close();
    if(TP.on)TP.on(n);});
}
/* 选哪个模型跑这一段，是一次**单选**——用下拉就够了，不必为此开一个弹窗。
   菜单里每条名称下面跟一句它是干什么的，选的时候不用再去工具目录查。
   「启用更多工具」是另一件事（那是改注册表，不是改这一次跑什么），
   所以隔一条分隔线单列在末尾，不和模型混在一起。 */
/* 带搜索的下拉。项目一多，纯列表就得靠眼睛扫——
   打两个字就能定位是更快的路，而且搜索框一出现，「这里可以搜」本身就看得见。
   少于 6 项不给搜索框：那时候搜索框比列表还占地方。 */
const SM={q:'',i:0,list:[],cur:'',on:null,title:'',ph:''};
function searchMenu(anchor,title,ph,list,cur,onPick,min){
  SM.q='';SM.i=Math.max(0,list.findIndex(x=>x.k===cur));
  SM.list=list;SM.cur=cur;SM.on=onPick;SM.title=title;SM.ph=ph||'搜索';
  /* 门槛默认 6；项目选择传 1——用户明确要能搜，不管现在有几个项目。
     而且搜索框一出现，「这里可以搜」本身就看得见。 */
  SM.min=min==null?6:min;
  SM.anchor=anchor;
  menu(anchor,smHTML(),v=>{if(SM.on)SM.on(v)});
  smBind();
}
function smRows(){
  const k=SM.q.trim().toLowerCase();
  return SM.list.filter(x=>!k||((x.n||'')+' '+(x.s||'')).toLowerCase().indexOf(k)>=0);
}
function smHTML(){
  const R=smRows();
  return `<div class="menu-l">${esc(SM.title)}</div>`
    +(SM.list.length>=(SM.min==null?6:SM.min)?`<div class="menu-s"><input id="smq" class="input" value="${esc(SM.q)}"
        placeholder="${esc(SM.ph)}" aria-label="${esc(SM.ph)}"></div>`:'')
    +(R.length?R.map((x,i)=>`<button class="menu-i${i===SM.i?' is-cur':''}" type="button"
        data-pick="${esc(x.k)}" aria-checked="${x.k===SM.cur}">
        <span class="ck">${x.k===SM.cur?CK:''}</span>
        <span><span class="nm">${esc(x.n)}</span>
        ${x.s?`<span class="sb">${esc(x.s)}</span>`:''}</span></button>`).join('')
      :`<div class="menu-i" style="cursor:default"><span class="ck"></span>
         <span><span class="nm">没有匹配的</span>
         <span class="sb">换个词，或清空搜索框</span></span></div>`);
}
function smBind(){
  const m=document.getElementById('menu');if(!m)return;
  const q=m.querySelector('#smq');
  if(q){
    q.oninput=()=>{SM.q=q.value;SM.i=0;smRepaint()};
    q.onkeydown=e=>{
      const R=smRows();
      if(e.key==='ArrowDown'){e.preventDefault();SM.i=(SM.i+1)%Math.max(1,R.length);smRepaint();return}
      if(e.key==='ArrowUp'){e.preventDefault();SM.i=(SM.i-1+R.length)%Math.max(1,R.length);smRepaint();return}
      if(e.key==='Enter'){e.preventDefault();const x=R[SM.i];
        if(x){closeMenu();if(SM.on)SM.on(x.k)}return}
    };
    setTimeout(()=>{const n=document.getElementById('smq');if(n)n.focus()},0);
  }
}
function smRepaint(){
  const m=document.getElementById('menu');if(!m)return;
  const pos=(()=>{const q=document.getElementById('smq');
    return q?q.selectionStart:null})();
  m.innerHTML=smHTML();
  m.querySelectorAll('[data-pick]').forEach(b=>{b.setAttribute('role','menuitemradio');
    b.onclick=()=>{const v=b.dataset.pick;closeMenu();if(SM.on)SM.on(v)}});
  smBind();
  const q=document.getElementById('smq');
  if(q&&pos!=null)q.setSelectionRange(pos,pos);
}
function modelMenu(anchor,list,cur,title,onPick){
  const ck='<svg width="13" height="13" style="width:.8125rem;height:.8125rem" viewBox="0 0 24 24" fill="none">'

    +'stroke-linecap="round" stroke-linejoin="round"/></svg>';

        aria-checked="${t.n===cur?'true':'false'}">

}
function toolPicker(cap,cur,onPick,title,node){
  TP.cap=cap;TP.node=node||null;TP.cur=cur||'';TP.on=onPick;TP.tab='fit';TP.q='';

/* ---- 工具架与任务表单打通 ----
   工具架原先是个死胡同：浏览、启用，然后什么都没发生。
   现在新建任务页的候选列表就是「你启用过的这一类工具」——
   想用列表里没有的，就得去工具架启用。启用这个动作从此有后果。
   Protenix 在 DB.tools 与 VMODELS 里各有一条，按名字去重。 */
function stageTools(cap,modelsOnly){
  const E=ENABLED(),seen={},all=[];
  ALL_TOOLS().forEach(t=>{
    if(t.cap!==cap||seen[t.n])return;
    if(modelsOnly&&!(t.k==='MODEL'||t.u==='模型服务'))return;
    seen[t.n]=1;all.push(t);});
  return {all:all,on:all.filter(t=>E.indexOf(t.n)>=0)};
}
/* ================= 流程节点 =================
   一个设计任务不是「挑几个工具」，是三段按顺序接起来的流程：
     靶点结构 →①骨架生成→ 主链骨架 →②序列设计→ 序列 →③回折复核→ 自洽 RMSD
   每段吃什么、吐什么，契约里已经写了，所以每个节点能挑哪些工具不用再维护一张表：
   按契约筛就行。这也是为什么停用一个工具，它会立刻从对应节点消失。 */
const PIPE={
 str:[{id:'fold',n:'折叠模型',need:['seq','entities'],give:['structure'],
       d:'序列 → 结构 + 置信度'}],
 des:[{id:'bb', n:'骨架生成',need:['structure'],give:['backbone'],opt:1,
       d:'靶点结构 + 约束 → 主链骨架',skip:'从已有结构改序列时跳过',
       /* 跳过它＝直接在已有结构上改序列，这条路本来就不经过主链骨架。
          所以下游不是「缺了一个输入」，是根本不需要它。 */
       skipDrops:['backbone']},
      {id:'inv',n:'序列设计',need:['structure','backbone'],give:['seq'],
       d:'结构 → 序列'},
      {id:'chk',n:'回折复核',need:['seq'],give:['rmsd','confidence'],
       d:'设计序列 → 自洽 RMSD'}],
 /* 步骤名是研究动作（送检下单 / 板位生成 / 结果回流），
    工具名是干这件事的那个东西（委托单生成器 / 孔板排布器 / 回流解析器）。
    两边一字不差的时候，流程卡上「送检下单　用 送检下单」读起来像重复，
    看不出哪个是步骤、哪个是可换的工具。 */
 wet:[{id:'ord',n:'提交实验',need:['variants'],give:['order'],d:'变体清单 → 订单与批次号'},
      {id:'plate',n:'板位生成',need:['variants'],give:['plate'],opt:1,d:'变体清单 → 板位图'},
      {id:'back',n:'结果回流',need:['result_file'],give:['writeback'],d:'实验结果文件 → 写回变体库'}]};
/* 节点的执行主体。蛋白这条闭环里每一段都是「一个节点一个工具」，
   但基因组那条（highthroughput）不是：节点里跑的是 Agent，由它自己决定调哪几个工具。
   节点模型要能装下这件事，否则核酸包一做就会把蛋白这套撑变形。
   现在产品里一个 Agent 都没接，所以 agent 节点会被 pipeBlock 挡住并说明原因——
   不假装有一个（R29：按钮不许说它没做的事）。 */
const NODE_BY={tool:'工具',agent:'Agent'};
const nodeBy=nd=>(nd&&nd.by)||'tool';
function agentsFor(){return []}      // 还没有接入任何 Agent
function pipeNode(cap,id){return (PIPE[cap]||[]).find(x=>x.id===id)||null}
function nodeFit(nd,t){
  if(!nd)return true;
  const c=contractOf(t),fi=c.i.map(x=>x.f),fo=c.o.map(x=>x.f);
  return nd.need.some(f=>fi.indexOf(f)>=0)&&nd.give.some(f=>fo.indexOf(f)>=0);
}
function nodeTools(cap,id){
  const nd=pipeNode(cap,id);
  if(nodeBy(nd)==='agent')return agentsFor(nd);   // Agent 节点不按契约筛单个工具
  const seen={},out=[];
  ALL_TOOLS().forEach(t=>{if(seen[t.n]||!pubOK(t.n)||!nodeFit(nd,t))return;seen[t.n]=1;out.push(t)});
  return out;
}
/* 每个节点选中的工具存本机：换页、刷新都还在，和表单草稿是同一个意思。 */
function PICKS(){return LS.get('nodePick',{})}
function nodePick(cap,id){
  const k=cap+'.'+id,v=PICKS()[k];
  if(v&&nodeTools(cap,id).some(t=>t.n===v))return v;
  const L=nodeTools(cap,id),E=ENABLED();
  const d=L.find(t=>E.indexOf(t.n)>=0)||L[0];
  return d?d.n:'';
}
function setPick(cap,id,n){const P=PICKS();P[cap+'.'+id]=n;LS.set('nodePick',P)}
function nodeSkipped(cap,id){return !!(LS.get('nodeSkip',{})[cap+'.'+id])}
/* 这一段还能不能跑：必经节点里只要有一个挑不到工具，就跑不起来。
   以前节点会老老实实说「注册表里没有能接这一段的工具」，
   但下面的「发起预测」照样可以点——点下去只会建一个永远跑不动的任务。
   工具被停用是真会发生的事（模型下线、换服务商、合规不让用公共服务），
   所以这里要挡住，并且说清楚是卡在哪一个节点。 */
function pipeBlock(cap){
  const L=PIPE[cap]||[];
  for(const nd of L){
    if(nd.fixed)continue;                         // 这一步本来就不需要工具
    if(nd.opt&&nodeSkipped(cap,nd.id))continue;   // 可选且用户已选择跳过
    if(nodeBy(nd)==='agent'&&!agentsFor(nd).length)
      return {nd:nd,why:`「${nd.n}」要由 Agent 执行，而还没有接入任何 Agent`};
    if(!nodeTools(cap,nd.id).length)
      return {nd:nd,why:`「${nd.n}」挑不到工具`};
    if(!nodePick(cap,nd.id))
      return {nd:nd,why:`「${nd.n}」还没选工具`};
  }
  return null;
}
/* 给主按钮用：禁用属性 + title 一起给，别让人对着一个灰按钮猜原因。 */
function pipeGate(cap){const b=pipeBlock(cap);
  return b?` disabled title="${esc(b.why)}，先去工具目录启用一个能接这一段的工具"`:''}
function pipeGateNote(cap){const b=pipeBlock(cap);
  return b?`<p class="hint" style="color:var(--err)">跑不起来：${esc(b.why)}。
    到<strong>工具</strong>目录里启用一个输入输出能接上这一段的工具，这里就会恢复。</p>`:''}
function toggleSkip(cap,id){const P=LS.get('nodeSkip',{});const k=cap+'.'+id;
  P[k]=P[k]?0:1;LS.set('nodeSkip',P)}

/* 流程条：一行一段，写清这段吃什么吐什么、现在用的是谁。
   没有「启用更多」——选工具这个动作本身就会把它启用，不必先去货架上点一遍。 */
/* 高级参数：就地展开，不跳页。
   以前这里叫「完整参数」，点下去跳到另一个表单页——研究员只是想把循环轮数从 10 改成 20，
   却被换了一整页，填到一半的序列还得重新确认在不在。
   「完整」也说错了：那一页不是更完整，是同一件事的另一种摆法。
   改名「高级参数」，并且在原地展开——默认收起，因为大多数时候不用动它。 */
function advToggle(cap){
  const open=!!(S.advOpen||{})[cap];
  return `<button class="advb-t${open?' is-on':''}" type="button" data-advt="${cap}" aria-expanded="${open}">
    <span class="car" aria-hidden="true"></span>高级参数</button>`;
}
/* 输入框下面这一行：左边「高级参数」，右边「预计多久、花多少」。
   预计是按下「发起」之前唯一要做的判断，所以它是这一屏上第二重的东西
   （第一重是你要写的那段输入）；此前它是最底下最淡的一行小字。
   面板在这一行之下展开，所以按钮本身不动——点开点关，视线落点不变。 */
function advRow(cap){
  return `<div class="col" style="gap:var(--s3)">
    <div class="row wrap" style="gap:var(--s3);align-items:baseline">
      ${advToggle(cap)}
      <span class="grow"></span>
      ${runPlan(cap)}
    </div>
    ${advBox(cap)}
  </div>`;
}
function advBox(cap){
  const open=!!(S.advOpen||{})[cap];
  /* 模型的真值只有一处：节点上的选择。advBox 不另读 PF.model，
     否则两边一旦不同步，界面就会同时说两句互相打架的话。 */
  const MD=cap==='str'?nodePick('str','fold'):null;
  const CAPB=cap==='str'?(MDCAP[MD]||{msa:1,tpl:1,recycle:1,diff:1,multi:1}):null;
  /* 三列网格（标签｜输入框｜一长句说明）把四个参数撑成了一整块米色大卡片，
     右边还空出一大片——为了四个数字，读者要扫四行。
     改成一行塞得下的紧凑字段：标签贴在输入框上方，说明收进 title，
     真正要提醒的那两句合成底下一行。面积小了，信息一点没少。 */
  const F=cap==='str'
    ? [['采样条数','pf.samples',PF.samples,'一次出几个构象','3.5rem'],
       ['循环轮数','pf.recycle',PF.recycle,'跑几轮回收。轮数越多越稳，耗时线性增加','3.5rem']]
      .concat(CAPB.diff
        ? [['扩散步数','pf.diff',PF.diff,'扩散采样步数。步数越多越精细，耗时线性增加','3.5rem']] : [])
      .concat([['随机种子','pf.seed',(PF.seeds[0]||''),'留空则每次不同。要复现就写死一个','6rem']])
    : [['采样温度','df.temp',CFG.adv.temp,'越低越保守，越高越敢改。0.1 是常用起点','3.5rem'],
       ['扩散步数','df.steps',CFG.adv.steps,'步数越多越精细，耗时线性增加','3.5rem'],
       ['随机种子','df.seed',CFG.adv.seed,'要复现就写死一个','6rem']];
  const note=cap==='str'
    ? (CAPB.msa?'MSA 更准但要先跑比对；轮数与采样条数线性影响耗时。'
               :'轮数与采样条数线性影响耗时。')
    : '温度越高越敢改；步数线性影响耗时。';
  if(!open)return '';
  return `<div class="advb is-open">
    ${`<div class="advb-b">
      <div class="advb-row">
        ${(cap==='str'&&CAPB.msa)?`<label class="advf">
          <span class="advf-k">用 MSA</span>
          <span class="ctl-seg" role="radiogroup" aria-label="用 MSA">${[['true','是'],['false','否']].map(([k,n])=>
            `<button type="button" class="ctl-segi" data-advmsa="${k}"
              role="radio" aria-checked="${PF.msa===k?'true':'false'}">${n}</button>`).join('')}</span>
        </label>`:''}
        ${F.map(([n,k,v,h,w])=>`<label class="advf" title="${esc(h)}">
          <span class="advf-k">${esc(n)}</span>
          <input class="input num advf-i" style="width:${w}" data-advf="${k}" value="${esc(String(v))}">
        </label>`).join('')}
        <button class="btn btn-gh advf-r" type="button" data-advreset="${cap}">恢复默认</button>
      </div>
      <p class="advb-n">${esc(note)}改完直接发起就按新参数跑，这些值会原样记进任务的运行记录。</p>
    </div>`}
  </div>`;
}

/* ---- 一条流水线长什么样 ----
   这里以前是三个并排的下拉框。下拉框的含义是「从一组值里选一个」，
   而这三行其实是**一条链**：第一段的产物是第二段的输入。
   用三个同样的下拉并排画，读出来就成了「三个互不相干的设置项」，
   而且最该看见的东西——每一段吃什么、出什么——被缩成了副标题里的灰字。

   改成产物当主角：每一段写清「吃什么 → 出什么」，出什么带上它将来的文件格式；
   上游有产物的标「← 上一步」，没有上游的标「要你自己给」。
   工具降级成一个轻量的「用 X ▾」——选工具是次要动作，看清数据怎么流才是主要的。 */
function fieldChip(f,kind){
  const A=ARTS[f], ext=A?('.'+A.ext):'';
  return `<span class="pfld ${kind||''}" title="${esc((A&&A.note)||'')}">${esc(FIELD_N(f))}${
    ext?`<i class="pfld-x">${esc(ext)}</i>`:''}</span>`;
}
/* 被跳过的段落不产出，它独有的那个输入下游也不再需要。
   一处定义，pipeRow 与 pipeBlock 共用——否则画面说不需要、按钮说缺东西。 */
function dropped(cap){
  const out={};
  (PIPE[cap]||[]).forEach(nd=>{
    if(nd.opt&&nodeSkipped(cap,nd.id))(nd.skipDrops||[]).forEach(f=>out[f]=nd.n);
  });
  return out;
}
function needsOf(cap,nd){
  const d=dropped(cap);
  return (nd.need||[]).filter(f=>!d[f]);
}
function pipeRow(cap,opt){
  const L=PIPE[cap]||[];if(!L.length)return '';
  /* asText 里的节点只显示用了哪个工具，不再给第二个控件：
     同一个真值在一屏上出现两个可点的入口，比放错位置更糟。 */
  const asText=(opt&&opt.asText)||[];
  /* 前面几段给出过的字段，就是这一段「来自上一步」的那些 */
  /* 被跳过的那一段不产出，所以它不能出现在「来自上一步」里 */
  const upto=i=>{const g={};L.slice(0,i).forEach(n=>{
    if(n.opt&&nodeSkipped(cap,n.id))return;
    (n.give||[]).forEach(f=>g[f]=n.n)});return g};
  /* 每一段自己是一张卡，包在任务卡里：
     左边是这一段做什么、吃什么出什么（一行小字，不用彩色标签——
     三种颜色并排只是让人去猜颜色的含义，而它们本来就按「吃/出」分好了）；
     右边固定宽度的模型下拉，宽度定死，换模型时整行不会跟着伸缩。 */
  const plain=(f,from)=>{
    const A=ARTS[f], ext=A?('.'+A.ext):'';
    return `<span class="pf">${esc(FIELD_N(f))}${ext?`<i class="pf-x">${esc(ext)}</i>`:''}${
      from?`<i class="pf-s">${esc(from)}</i>`:''}</span>`;
  };
  return `<div class="pipe">${L.map((nd,i)=>{
    const L2=nodeTools(cap,nd.id),cur=nodePick(cap,nd.id),sk=nd.opt&&nodeSkipped(cap,nd.id);
    const up=upto(i);
    /* 来源要能读进句子里：「用 主链骨架 .pdb（来自骨架生成）产出 …」。
       原先是「← 骨架生成」，箭头在一句话中间读不通。 */
    const needs=needsOf(cap,nd).map(f=>
      plain(f, up[f]?('（来自'+up[f]+'）'):fieldSupply(f)==='user'?'（需要你提供）':'（已有产出）'));
    const gives=(nd.give||[]).map(f=>plain(f));
    const t=toolBy(cur);
    /* 只有一段的时候不编号：序号是用来读先后的，「1」会让人以为还有个「2」。
       结构预测就是一段（折叠模型），它不是流水线。 */
    return `<div class="pstep${sk?' is-skip':''}">
      ${L.length>1?`<span class="pipe-i">${i+1}</span>`:''}
      <span class="pstep-b">
        <strong class="t-md">${esc(nd.n)}</strong>
        ${sk?`<span class="t-sm mut2">${esc(nd.skip||'已跳过')}</span>`
          :`<span class="pstep-d">${
            needs.length&&gives.length
              ? `<span class="pio">用 ${needs.join('、')} 产出 ${gives.join('、')}</span>`
            : gives.length ? `<span class="pio">产出 ${gives.join('、')}</span>`
            : needs.length ? `<span class="pio">用 ${needs.join('、')}</span>` : ''
          }</span>`}
      </span>
      <span class="pstep-a">
        ${nd.opt?`<button class="btn btn-gh pipe-skip" type="button" data-nodeskip="${cap}.${nd.id}"
          >${sk?'启用':'跳过'}</button>`:''}
        ${nd.fixed
          ? `<span class="t-sm mut2" title="不需要工具，直接从本项目的轮次与批次算">${esc(nd.fixed)}</span>`
          : sk ? ''
          : asText.indexOf(nd.id)>=0
            ? `<span class="t-sm mut2" title="在上面的「模型」里换">${esc(cur)}</span>`
          : L2.length?`<button class="ctl ctl-dd pipe-tool" type="button" data-nodepick="${cap}.${nd.id}"
              title="换一个模型跑这一段：${esc(cur)}">
              ${ddIc('model')}<span class="ell">${esc(cur)}</span>
              <span class="car" aria-hidden="true"></span></button>`
            :`<span class="t-sm" style="color:var(--err)">注册表里没有能接这一段的工具</span>`}
      </span>
    </div>`}).join('')}</div>${pipeGateNote(cap)}`;
}
function jobMini(L,route){
  if(!L.length)return `<div class="empty" style="padding:var(--s5)">
    <span class="t-sm">还没有任务，在上面发起第一个</span></div>`;
  return `<div class="minis">${L.map(t=>{const[sn,sc]=JOB_ST[t.st]||['—',''];
    return `<button class="mini" type="button" data-task="${esc(t.id)}">
      <span class="jst j-${sc}" style="margin:0"><i></i></span>
      <span class="mini-n">${esc(t.n)}</span>
      <span class="t-sm mut2 num">${esc(t.at)}</span>
      <span class="grow"></span>
      <span class="t-sm mut2">${esc(t.out)}</span>
      <span class="mini-p num">${t.pg}%</span></button>`}).join('')}</div>`;
}
/* ---- 这一次发起要排多久、花多少（玻尔对标 B05）----
   产品原先只在 MSA 面板上写清了模式、内存、队列位置与预计时间，
   其他每一类任务都只有一条进度条。研究员真实会问的是：
   为什么排队、排在第几、预计多久、这次花多少。
   这里把 MSA 那套推广到每一类任务，而且每个数都从真实来源取：
     队列位置 ← 当前 queued 的任务数
     预计时长 ← 本项目同类已完成任务的耗时中位数（没有历史就说没有，不编）
     墨点     ← 按同类历史任务的机时折算
   没有历史的那一类，界面明说「这是本项目第一个这类任务，给不出预计」。 */
function tookMin(t){
  const s=String(t||'');
  if(!/\d/.test(s))return null;                       // 「即时（全部从本项目已有数据算）」这种
  const h=+(/(\d+)\s*小时/.exec(s)||[0,0])[1];
  const m=+(/(\d+)\s*分/.exec(s)||[0,0])[1];
  const sec=+(/(\d+)\s*秒/.exec(s)||[0,0])[1];
  const v=h*60+m+sec/60;
  return v>0?v:null;
}
const fmtMin=v=>v==null?'—':(v<1?Math.round(v*60)+' 秒':v<60?(v<10?v.toFixed(1):Math.round(v))+' 分钟'
  :(v/60<10?(v/60).toFixed(1):Math.round(v/60))+' 小时');
const INK_PER_HOUR=50;   // 与任务配置页同一口径，见 estInk()
function histRun(cap){
  const L=TASKS.filter(t=>t.cap===cap&&t.st==='done'&&t.pid===S.pid)
    .map(t=>tookMin(t.took)).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!L.length)return {n:0};
  const med=L.length%2?L[(L.length-1)/2]:(L[L.length/2-1]+L[L.length/2])/2;
  return {n:L.length,med:med,min:L[0],max:L[L.length-1]};
}
const queueAhead=()=>TASKS.filter(t=>t.st==='queued').length;
const runningNow=()=>TASKS.filter(t=>t.st==='running').length;
function runPlan(cap){
  if(cap==='wet')return '';                   // 湿实验的周期在批次那边算，不是机时
  const H=histRun(cap), q=queueAhead(), run=runningNow();
  /* 只在真有话说的时候才占一行。
     「排队 无排队」「本项目还没有跑完过这一类任务，给不出预计」「跑完一个就有了」——
     这三句都是在用一整行告诉你「没有信息」，读一次就够了，不该每次都摆在那。 */
  const bits=[];
  if(q)bits.push(`排队第 <span class="num">${q+1}</span> 位`);
  const E=cap==='des'?desEst():null;          // 设计类按这一次的候选条数折算
  if(H.n){
    const med=E?E.min:H.med;
    bits.push(`预计 <span class="num">${fmtMin(med)}</span>`);
  }
  if(!bits.length)return '';
  const src=!H.n?''
    :(E&&E.base)?`按本项目${H.n===1?'唯一一个':' '+H.n+' 个'}同类任务的耗时，再按候选条数折算（那一次 ${E.base} 条，这一次 ${dfN()} 条）`
    :H.n===1?'按本项目唯一一个同类任务的耗时'
    :`按本项目 ${H.n} 个同类任务的耗时中位数`;
  /* 来源原先整句写在界面上（「按本项目唯一一个同类任务的耗时，再按候选条数折算
     （那一次 88 条，这一次 12 条）」）——那是算法说明，不是研究员此刻要读的。
     收进 title，鼠标停上去才出现。 */
  return `<span class="runplan" ${src?`title="${esc(src)}"`:''}>
    <span class="runplan-v">${bits.join('　·　')}</span>
  </span>`;
}

/* ---- 文件：派生，不是第四张表 ----
   三个来源，各自已经在产品里存在：
     out  本会话下载过的（DB.dls，由 dl() 统一记）
     in   服务商回传的结果文件（每个有结果的批次一份，时间取它进入「数据分析」的时刻）
     kb   项目知识库里上传的文献与数据
   派生的好处是不会对不上：批次撤销了，它的回传文件自然消失。 */
/* ---- 文件怎么分类 ----
   研究员翻文件时问的是「这是哪一步出来的东西」，不是「它是第几张表」。
   所以类型按**产出它的研究动作**分，而动作本身产品里早就有（任务的 cap），
   不另立一套标签，也就不会出现标签和任务对不上的情况。
   「已下载」这一类只记了它从哪个页面导出，所以按页面反查回能力。 */
const ROUTE_CAP={models:'str',design:'des',wet:'wet',wetlab:'wet',library:'seq',
  config:'func',results:'des',loop:'des',round:null,files:null};
const FTYPE={
  kb: ['资料','上传进知识库的文献与数据'],
  seq:['序列与功能','野生型序列、功能注释与证据'],
  str:['结构预测结果','结构、置信度'],
  des:['蛋白质设计结果','设计序列、变体表'],
  wet:['实验验证结果','板位表、实验回传、写回'],
  rep:['轮次报告','人读的交付件，产出即冻结'],
  etc:['其他','没登记能力的文件']};
function fileType(x){
  if(x.kind==='kb')return 'kb';
  if(x.f==='report')return 'rep';
  if(x.kind==='in')return 'wet';
  const c=x.cap;
  if(c==='seq'||c==='func')return 'seq';
  if(c==='str'||c==='des'||c==='wet')return c;
  return 'etc';
}
const fileExt=x=>((String(x.name||'').split('.').pop()||'').toLowerCase());
const FKIND={arch:['项目归档','var(--ink)'],art:['任务产出','var(--dry)'],
  out:['已下载','var(--ink-3)'],in:['实验回传','var(--wet)'],kb:['上传','var(--ink-4)']};
const fmtBytes=b=>b==null?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
/* 一条文件记录能不能真打开、真下载，取决于它有没有内容生成函数。
   任务产物有（27 条里 21 条）；服务商回传和用户上传的原件没有——
   那两类我们只有登记，手上没有字节。fileBox 会把下载键置灰并说明原因，
   不临时编一份内容出来充数（R3）。 */
function fileMake(e){
  return (e&&e.art&&e.art.make)||(e&&e.arch&&e.arch.make)||(e&&e.make)||null;
}
function FILES(pid){
  const id=pid||null, out=[];
  /* ⓪ 项目归档：冻住的那一份。排在最前面——它是唯一有「当时那一版」的东西。 */
  DB.projects.forEach(p=>(p.arch||[]).forEach(x=>out.push({
    kind:'arch',f:x.f,name:x.name,bytes:x.bytes,at:x.at,pid:p.id,
    cap:(TASKS.find(t=>t.id===(x.from&&x.from.task))||{}).cap||null,
    round:x.from&&x.from.round,from:'归档 '+x.id+(x.from&&x.from.task&&x.from.task!=='—'?'　产自 '+x.from.task:''),
    arch:x})));
  /* ① 任务产物：每个已完成任务按契约声明的输出字段产出。
        这是研究里真正在流转的东西，所以排在最前面，并且带着字段名 f——
        有了 f 才知道它能接到哪个节点上。 */
  TASKS.filter(t=>t.st==='done').forEach(t=>artsOf(t).forEach(a=>out.push({
    kind:'art',f:a.f,name:a.name,bytes:null,at:t.at,pid:t.pid,round:t.r,cap:t.cap,
    from:'任务 '+t.id+'　'+capName(t.cap),tid:t.id,art:a})));
  /* ② 本会话下载过的 */
  (DB.dls||[]).forEach(d=>out.push({kind:'out',name:d.name,bytes:d.bytes,at:d.at,
    pid:d.pid,round:d.round,cap:ROUTE_CAP[d.route]||null,
    from:'在「'+(NAVNAME[d.route]||d.route)+'」导出'}));
  /* ③ 服务商回传 */
  BATCHES.filter(b=>b.results!=='none').forEach(b=>{
    const an=batchEnter(b,'data_analysis')||batchEnter(b,'done');
    out.push({kind:'in',f:'result_file',name:'results_'+b.id+'.csv',bytes:null,cap:'wet',
      at:an?(b.log.find(x=>x[0]==='data_analysis')||b.log.find(x=>x[0]==='done'))[1]:'—',
      pid:b.pid,round:b.round,from:b.vendor+' 回传　'+RESULTS_STATUS[b.results],batch:b.id});
  });
  /* ④ 上传 */
  DB.projects.forEach(p=>(p.kb||[]).forEach(f=>out.push({kind:'kb',name:f,bytes:null,at:'—',
    pid:p.id,round:null,cap:null,from:'上传到「'+p.name+'」的知识库'})));
  const L=id?out.filter(x=>x.pid===id):out;
  return L.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
/* 导航栏列了哪些路由。和 NAVNAME 同源，别另维护一张表。 */

    chats:'全部对话',labnew:'发起新实验',labdet:'实验详情',

/* ---- 文件管理：卡片 + 三条筛选 ----
   表格把每份文件压成一行七格，于是最该一眼看到的三件事
   （这是哪一步的产物 / 还是不是当下这一版 / 能接到哪一步）
   被挤成了并排的灰字。研究员翻文件时的问题是具体的：
     「上周导出给合作者的那份候选表在哪」      → 名字搜 + 时间
     「这一轮的结构预测结果有哪些」            → 类型 + 项目
     「这份能不能直接送去下一步」              → 下游
     「这份是当时那一版还是现在算的」          → 现算 / 归档
     「把这些打包给同事」                      → 按筛出来的结果整批下
   卡片把前四个放进同一张卡，筛选条回答后面两个。 */
/* 文件卡：按网盘的做法——一眼看到的是「这是个什么文件」，
   不是它在流程里的位置。类型图标、名字、类型·大小·时间、来源，然后两个动作。
   原先卡上还有「能接到哪一步」和「接到下一步」：那是任务详情页的事
   （在产物卡上，那里你刚跑完、正要往下接）；在文件管理里翻文件的人

const FICO={

  dat:'<path d="M9 4.2H7.4a2 2 0 0 0-2 2v3.4a2 2 0 0 1-2 2.4 2 2 0 0 1 2 2.4v3.4a2 2 0 0 0 2 2H9"/><path d="M15 4.2h1.6a2 2 0 0 1 2 2v3.4a2 2 0 0 0 2 2.4 2 2 0 0 0-2 2.4v3.4a2 2 0 0 1-2 2H15"/>',
  doc:'<path d="M14 3.4H7.4a2 2 0 0 0-2 2v13.2a2 2 0 0 0 2 2h9.2a2 2 0 0 0 2-2V8z"/><path d="M14 3.4V8h4.6M8.8 13h6.4M8.8 16.6h4.4"/>',
  zip:'<path d="M3.4 8.6h17.2v10a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z"/><path d="M3.4 8.6 5.6 4.2h12.8l2.2 4.4M11 12v3.2M13 12v3.2"/>'};
const FEXT_K={fasta:'seq',a3m:'seq',fa:'seq',cif:'str',pdb:'str',csv:'tab',tsv:'tab',
  xlsx:'tab',json:'dat',md:'doc',txt:'doc',pdf:'doc',zip:'zip'};
function fileIc(ext){

/* ---- 知识库文件预览 ----
   预览必须给真内容：上传时把 File 本身留下（KBFILE），读出来的文本缓存在 KBTEXT。
   种子条目和上个会话留下的名字没有文件可读——那就照实说，不拿占位内容充数。 */
const KBFILE={}, KBTEXT={};
const KB_TEXT_EXT={txt:1,md:1,csv:1,tsv:1,json:1,fasta:1,fa:1,a3m:1,pdb:1,cif:1,log:1,yaml:1,yml:1};
const KB_IMG_EXT={png:1,jpg:1,jpeg:1,gif:1,webp:1,svg:1};
function kbExt(n){return String(n).split('.').pop().toLowerCase()}
function kbIsText(n){return !!KB_TEXT_EXT[kbExt(n)]}
/* 文件类型标签和首页的能力卡同一套：带 icon 的彩色块，不是一截灰字。
   颜色按类别分，同类同色——颜色在这里是分类，不是装饰。 */
const KB_HUE={seq:'dry',str:'dry',tab:'wet',dat:'ink',doc:'ink',zip:'ink'};
/* 一个方块就是一个文件：扩展名写在方块里。
   kbTag 是「图标 + 扩展名小标」两个元素并排，放在列表行里会把文件名挤到第二行。 */
function fileSq(n){
  const ext=kbExt(n), k=FEXT_K[ext]||'doc', t=(ext||'?').toUpperCase();
  /* 以前是 slice(0,4)，于是 fasta 显示成 FAST——截出来的是另一个词，不是缩写。
     改成整个扩展名都放进去，长的把字号压一档；再长（极少见）才截。 */
  return `<span class="fsq is-${KB_HUE[k]||'ink'}${t.length>=5?' is-long':''}"
    >${esc(t.slice(0,6))}</span>`;
}
function kbTag(n){
  const ext=kbExt(n), k=FEXT_K[ext]||'doc';
  return `<span class="kbtag is-${KB_HUE[k]||'ink'}">${fileIc(ext)}<b>${esc(ext||'—')}</b></span>`;

function kbPreview(p,name){
  const k=p.id+'|'+name, f=KBFILE[k], ext=kbExt(name);

      <strong class="t-md">这个会话里没有它的内容</strong>

  }else{

      ? `<div class="row" style="gap:var(--s3)"><span class="skel" style="width:13px;height:0.8125rem;border-radius:50%"></span>
         <span class="t-sm mut">正在读取…</span></div>`

      ? `<span class="t-sm mut">读不出来，文件可能已被移动或撤销授权。</span>`

}
/* 表格按分隔符切开来看，比一整块文本好认。只看前 40 行，够判断「是不是这一份」。 */
function kbTable(t,ext){
  const sep=ext==='tsv'?'\t':',';
  const rows=t.split(/\r?\n/).filter(x=>x.length).slice(0,40).map(r=>csvCells(r,sep));

    <thead><tr>${head.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r=>`<tr>${r.map(c=>`<td class="t-sm">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>${t.split(/\r?\n/).length>41?'<span class="t-xs mut2">只显示前 40 行</span>':''}`;

/* 能删的只有「真的存着一份」的那些：项目归档、本会话的下载记录、知识库上传。

function fileDelKind(x){

function fileDelWhy(x){

/* ---- 分子类型：照 Protenix Server 的七种 ---- */
const MOL=[['protein','蛋白质','粘贴氨基酸单字母序列'],
  ['dna','DNA','粘贴 DNA 序列（A/C/G/T）'],
  ['rna','RNA','粘贴 RNA 序列（A/C/G/U）'],
  ['smiles','配体 SMILES','例：CC(=O)Oc1ccccc1C(=O)O'],
  ['ccd','配体 CCD','PDB 化学组分编号，例：ATP'],
  ['ligfile','配体文件','上传 sdf / mol2'],
  ['ion','离子','元素符号，例：ZN、MG、CA']];
/* 参数不是每个模型都有。ESMFold 本身就不用 MSA，把 MSA 开关摆给它是误导；
   AF2 基础版只折单体，复合物要换模型。按模型收起不适用的字段，并写明原因。 */
/* bond：这个模型吃不吃「共价连接」这种输入。
   AF3 那一路（Protenix / Boltz-2 / Chai-1）把配体、修饰残基与共价键一起当输入；
   AlphaFold2 基础版与 ESMFold 只折多肽链，给它共价键它也没地方放。
   所以这一块不是全局开关，是跟着所选模型走的——选了不支持的模型就收起来并说明原因。 */
/* 共价连接两端的校验。能当场测出来的就当场说，不要等提交之后给一句「参数有误」。 */
function bondWarn(side){
  if(!side)return '';
  const sq=PF.seqs[+side.e];
  if(!sq)return '这条链不存在';
  const L=(sq.seq||'').replace(/\s+/g,'').length;
  const p=+side.p;
  if(side.p!==''&&(!isFinite(p)||p<1))return '残基号从 1 起';
  if(side.p!==''&&L&&p>L)return `这条链只有 ${L} 个残基`;
  if(side.p!==''&&!L)return '这条链还没填序列，校验不了残基号';
  if(side.a&&!/^[A-Za-z][A-Za-z0-9'"*]{0,3}$/.test(side.a))return '原子名如 SG、ND2、C1';
  return '';
}
const MDCAP={
 'AlphaFold2':{msa:1,tpl:1,recycle:1,diff:0,multi:0,bond:0,
   why:'基础版只折单体，复合物需换用多链模型',
   bondWhy:'基础版只折多肽链，不接受配体与共价连接'},
 'ESMFold'   :{msa:0,tpl:0,recycle:1,diff:0,multi:0,bond:0,
   why:'单序列直接折叠，不检索 MSA，也不用模板',
   bondWhy:'单序列折叠模型，没有配体与共价连接这一层输入'},
 'Protenix'  :{msa:1,tpl:1,recycle:1,diff:1,multi:1,bond:1,why:''},
 'Boltz-2'   :{msa:1,tpl:1,recycle:1,diff:1,multi:1,bond:1,why:''},
 'Chai-1'    :{msa:1,tpl:1,recycle:1,diff:1,multi:1,bond:1,why:''}};
function rid(n){let s='';const h='0123456789abcdef';for(let i=0;i<n;i++)s+=h[(Math.random()*16)|0];return s}
/* 字段规范：类型、取值范围、允许的字符集。界面上写明约束，
   提交时逐项校验并指到具体字段，而不是一句「参数有误」。
   各分子类型的字符集是真实的：蛋白 20 种标准氨基酸，DNA 是 ACGT，RNA 是 ACGU，
   CCD 是 PDB 化学组分编号。 */
const MOL_OK={
  protein:{re:/^[ACDEFGHIKLMNPQRSTVWY]+$/i,say:'20 种标准氨基酸单字母'},
  dna:    {re:/^[ACGT]+$/i,                say:'只接受 A / C / G / T'},
  rna:    {re:/^[ACGU]+$/i,                say:'只接受 A / C / G / U'},
  smiles: {re:/^\S+$/,                     say:'SMILES 串，不含空格'},
  ccd:    {re:/^[A-Za-z0-9]{1,5}$/,        say:'1–5 位 PDB 化学组分编号'},
  ligfile:{re:/^.+$/,                      say:'上传 sdf / mol2 文件'},
  ion:    {re:/^[A-Za-z]{1,2}[0-9]{0,2}$/, say:'元素符号，如 ZN、MG、CA'}};
const PF_NUM={
  samples:{n:'采样数',min:1,max:25},
  recycle:{n:'recycle 次数',min:1,max:20},
  diff:   {n:'扩散步数',min:10,max:500},
  copy:   {n:'拷贝数',min:1,max:24},
  seed:   {n:'随机种子',min:0,max:2147483647}};
const numHint=k=>`整数 ${PF_NUM[k].min}–${PF_NUM[k].max}`;
function clampNum(k,v,dflt){const S2=PF_NUM[k];const n=parseInt(v,10);
  if(!isFinite(n))return dflt;return Math.max(S2.min,Math.min(S2.max,n))}
/* 返回第一条不合规，没有就返回 null */
function pfCheck(){
  for(let i=0;i<PF.seqs.length;i++){
    const e=PF.seqs[i],raw=(e.seq||'').trim();
    if(!raw)return {i:i,msg:`序列 ${i+1} 还是空的`};
    const spec=MOL_OK[e.t]||MOL_OK.protein;
    const v=(e.t==='protein'||e.t==='dna'||e.t==='rna')?raw.replace(/\s+/g,''):raw;
    if(!spec.re.test(v)){
      const bad=(e.t==='protein'||e.t==='dna'||e.t==='rna')
        ? v.split('').findIndex(c=>!spec.re.test(c)) : -1;
      return {i:i,msg:`序列 ${i+1} 不符合${(MOL.find(m=>m[0]===e.t)||MOL[0])[1]}的格式：${spec.say}`
        +(bad>=0?`。第 ${bad+1} 位是「${v[bad]}」`:'')};
    }
    if((e.t==='protein'||e.t==='dna'||e.t==='rna')&&v.length<10)
      return {i:i,msg:`序列 ${i+1} 只有 ${v.length} 个残基，至少 10 个`};
  }
  return null;
}

/* ---- 发射台上的模型选择器 ----
   以前这里没有：模型只能进「完整表单」才选得到，而发射台上按一下「发起预测」
   就直接拿当前的模型跑了——研究员在不知道用哪个模型的情况下提交了一次任务。
   Protenix Server 把模型摆在提交按钮上方，这里照同一个位置。
   它读写的是流程里那一段的同一个真值 nodePick('str','fold')，
   所以不会出现两个各自为政的「模型」；流程图里那一段因此只显示名字，不再给第二个控件。 */
function strModelBtn(){
  const L=nodeTools('str','fold'), cur=nodePick('str','fold');
  if(!L.length)return `<span class="t-sm" style="color:var(--err)">注册表里没有能折叠的模型</span>`;
  return `<button class="ctl ctl-dd" type="button" data-nodepick="str.fold"
    title="换一个模型跑：${esc(cur)}">
    ${ddIc('model')}<span class="dd-v ell">${esc(cur)}</span>
    <span class="car" aria-hidden="true"></span></button>`;
}
/* 模型的说明只占一行：它回答「这个模型跟别的差在哪」和「这个框装不下什么」，
   两句都短，接在一起比摞成一段好读。完整表单做成这句话里的链接——
   它是这句话的去处，不是工具栏右端一个没有归属的按钮。 */
function strModelNote(){
  const L=nodeTools('str','fold'), cur=nodePick('str','fold');
  if(!L.length)return '';
  const C=MDCAP[cur]||{};
  const a=C.msa?'要先检索 MSA，比单序列折叠慢，可在高级参数里关掉':(C.why||'');
  return `<p class="qnote">${a?esc(a)+'　·　':''}这里只接一条序列，多链、配体与共价连接${
    C.multi?'':'（'+esc(cur)+' 也不支持）'}请用<button class="lnk" type="button" data-jnew="models">完整表单</button>。</p>`;
}
const DF={name:'',acc:'',mode:'preview',blen:80,seeds:[''],hot:'',n:0};  // n=0 表示跟着模式走
function dfName(){return DF.name||('design_'+(DF._n||(DF._n=rid(8))))}
/* ---- 两个模式的差异必须是算出来的 ----
   这两张卡原先只换一行字：DF.mode 只出现在拼任务描述的那句里，
   候选条数、耗时、墨点、板位一个都不变。卡上却写着
   「少量候选，只过一道过滤器」与「按板位容量产出，双重过滤」——
   后半句还是编的：产品里只有**一道**准入闸门（ipTM ≥ S.gate），
   结果页上那四个（排半胱氨酸 / 一致度下限 / 来源 / 只看通过）是研究员自己点的筛选，
   不是流程里的过滤级数。按钮不许说它没做的事（R0），数也不许编（R3）。

   现在两个模式只差一件能算出来的事：这一批出多少条。条数一变，
   耗时与墨点按任务配置页同一口径线性跟着变。
     快速预览 ← 让闸门之上期望有 3 条所需的最小生成量 = ⌈3 ÷ 本项目闸门通过率⌉
     完整批次 ← 板位容量 = (板型 − 对照孔) ÷ 重复数
   没有闸门数据的项目不给预览条数，照实说算不出，让研究员自己填。 */
const PREVIEW_HITS=3;      // 预览问的是「闸门之上有几条可看」，不是「生成几条」
function gateRate(pid){
  const a=CANDS(pid||S.pid);if(!a.length)return null;
  const q=a.filter(c=>typeof c.iptm==='number');if(!q.length)return null;
  const ps=q.filter(c=>c.iptm>=S.gate).length;
  return ps?{n:q.length,pass:ps,r:ps/q.length}:null;
}
function dfPreviewN(){const g=gateRate();return g?Math.ceil(PREVIEW_HITS/g.r):null}
function dfModeN(k){return k==='preview'?dfPreviewN():plateCap()}
function dfN(){return DF.n||dfModeN(DF.mode)||plateCap()}
/* 设计任务的耗时与候选条数成正比，所以历史耗时要按这一次的条数折算，
   否则 12 条的快速预览与 29 条的完整批次会在同一个发射台上显示同一个预计值。
   折算的基数是历史任务自己记下来的候选数，不是估的；记不到候选数就不折算。
   这里不另立公式：发射台上的预计一直是「本项目同类任务的耗时中位数」，
   再多一个 0.077 小时/条 的常数就成了同一屏上两个互相打架的估算器。 */
function desBaseN(){
  const ns=TASKS.filter(t=>t.cap==='des'&&t.st==='done'&&t.pid===S.pid&&tookMin(t.took)!=null)
    .map(t=>{const r=(t.out2||[]).find(x=>x[0]==='候选数');
             return r?parseInt(String(r[1]).replace(/\D/g,''),10):0})
    .filter(x=>x>0);
  return ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length):null;
}
function desEst(){
  const H=histRun('des');if(!H.n)return null;
  const base=desBaseN(), min=base?H.med*dfN()/base:H.med;
  return {min:min,ink:Math.max(1,Math.round(min/60*INK_PER_HOUR)),base:base,n:H.n};
}

/* M2-F02 公共库取回。先走真实接口，失败再回落到内置样本；错误区分三类 */
/* PDB 取序列走 data.rcsb.org，不走 www.rcsb.org/fasta/entry/。
   2026-11-12 从一个 GitHub Pages 托管页实测：四个公共接口里只有 www.rcsb.org 不发
   CORS 头，托管页面调它必然 TypeError；data.rcsb.org、files.rcsb.org、rest.uniprot.org
   都放行。换接口比在界面上解释「线上用不了」正确。
   代价：要两跳（entry 拿实体号，再逐个实体拿序列），而且得自己拼 FASTA。 */
/* 加载态在调用方：这是取数助手，挂起指示由发起取数的页面给。[LOADING_BY_CALLER] */
async function pdbFasta(id){
  const e=await fetch(`https://data.rcsb.org/rest/v1/core/entry/${id}`);
  if(e.status===404)return {missing:true};
  if(!e.ok)throw new Error('HTTP '+e.status);
  const ej=await e.json();
  const ids=(ej.rcsb_entry_container_identifiers||{}).polymer_entity_ids||[];
  if(!ids.length)return {missing:true};
  const parts=[];
  for(const n of ids){
    const r=await fetch(`https://data.rcsb.org/rest/v1/core/polymer_entity/${id}/${n}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const seq=(j.entity_poly||{}).pdbx_seq_one_letter_code_can;
    if(!seq)continue;
    const ch=((j.rcsb_polymer_entity_container_identifiers||{}).auth_asym_ids||[n]).join(',');
    const name=(j.rcsb_polymer_entity||{}).pdbx_description||id;
    parts.push('>'+ch+'|'+name+'\n'+seq.replace(/\s+/g,''));
  }
  if(!parts.length)return {missing:true};
  return {fasta:parts.join('\n')};
}

async function fetchAcc(){
  const v=(IN.acc||'').trim(), t=idType(v);
  IN.err=null;
  if(!t){IN.err={kind:'标识符格式不对',
    msg:`「${v}」不符合任何一个库的编号规则。`,
    hint:'PDB 是四位且首位为数字（1BRS）；UniProt 形如 P00644；AFDB 形如 AF-P00644-F1。'};
    render();return}
  IN.busy=true;render();
  const urls={UniProt:`https://rest.uniprot.org/uniprotkb/${v.toUpperCase()}.fasta`,
    AFDB:`https://rest.uniprot.org/uniprotkb/${(v.match(/^AF-([A-Z0-9]+)-F\d+$/i)||[,''])[1].toUpperCase()}.fasta`};
  let txt=null,netErr=null,missing=false;
  try{
    if(t==='PDB'){const r=await pdbFasta(v.toUpperCase());
      if(r.missing)missing=true;else txt=r.fasta;}
    else{
      const res=await fetch(urls[t],{headers:{Accept:'text/plain'}});
      if(res.status===404)missing=true;
      else if(!res.ok)netErr='HTTP '+res.status;
      else txt=await res.text();}
  }catch(e){netErr=e.message||'请求未发出'}
  IN.busy=false;
  const key=Object.keys(BUILTIN).find(k=>k.toUpperCase()===v.toUpperCase());
  if(!txt&&key){
    const B=BUILTIN[key];
    IN.parsed=parseSeq(B.chains.map(c=>'>'+c.id+'|'+B.name+'\n'+c.seq).join('\n'));
    IN.parsed.pdb=key;IN.rawSeq=IN.parsed.raw;IN.confirmed=false;IN.sel=new Set();
    IN.err=netErr?{kind:'用的是内置样本',
      msg:`连不上 ${B.src}（${netErr}），已改用内置的这条记录。`,
      hint:'放不放行由对方接口决定，不是托管页面一律被拦。可改用「粘贴序列」直接贴入。'}:null;
    render();toast(`已载入 ${key}：${B.chains.length} 条链`);return;
  }
  if(missing){IN.err={kind:'库里没有这条',
    msg:`${t} 中不存在 ${v}。`,hint:'检查编号是否打错，或该条目是否已被撤销合并。'};render();return}
  if(netErr){IN.err={kind:'取回失败',
    msg:`请求 ${t} 时出错：${netErr}。`,
    hint:'可能是网络不通，也可能是对方接口不允许从网页直接调用。可改用「粘贴序列」直接贴入，或先试内置样本。'};render();return}
  IN.parsed=parseSeq(txt);IN.parsed.pdb=v.toUpperCase();IN.rawSeq=txt;
  IN.parsed.rawResp=txt;IN.confirmed=false;IN.sel=new Set();render();
  toast(`已从 ${t} 取回：${IN.parsed.chains.length} 条链 ${IN.parsed.total} 个残基`);
}
