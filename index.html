.fbox-dl:hover{border-color:var(--ink-4);color:var(--ink);background:var(--surface-2)}
.fbox-dl:disabled{opacity:.45;cursor:not-allowed}
/* 移除：一颗 ✖，不写字。「换一个」说的是下一步想干什么，
   这颗按钮做的事是把已选的去掉——名字要对得上动作。 */
.icx{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:1.75rem;height:1.75rem;border:0;border-radius:var(--r1);background:transparent;
  color:var(--ink-4);cursor:pointer;transition:color .14s,background .14s}
.icx:hover{color:var(--err);background:var(--err-soft)}
/* 中性的图标钮。.icx 悬停变红，那是「关掉 / 删掉」的反馈；
   打开一个设置抽屉不是删东西，不能借它那套颜色。 */
.icb{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:1.75rem;height:1.75rem;border:0;border-radius:var(--r1);background:transparent;
  color:var(--ink-4);cursor:pointer;transition:color .14s,background .14s}
.icb:hover{color:var(--ink);background:var(--surface)}
.icb[data-on]{color:var(--dry)}
/* 产出条里的那一列：下载在行内，一步到位，不走展开 */
.fbox.is-inline{display:flex;align-items:center}
.fbox.is-inline .fbox-r{cursor:default}
.fbox.is-inline .fbox-r:hover{background:transparent}
.fbox-dl.is-row{margin-right:var(--s3);border-color:transparent;background:transparent}
.fbox-dl.is-row:hover{border-color:var(--line);background:var(--surface-2)}
/* 选好的文件：**容器本身就是那张文件卡**，里面不再放一个带色的方块。
   扩展名已经写在文件名末尾了，色块只是把同一件事说第二遍；
   而且那块橙色的分量压过文件名本身，第一眼看过去先看到色，后看到名字。
   去掉之后这一行才有层次可言：名字 14/600，元信息 12/400，✖ 在右端。 */
.fbox.is-pick{display:flex;align-items:center;gap:0}
.fbox.is-pick:hover{border-color:var(--line)}
.fbox.is-pick .fbox-r{cursor:default}
.fbox.is-pick .fbox-r:hover{background:transparent}
/* 行数、列数、指纹、还有「这是随机抽的」这类话要看全，不能截断 */
.fbox.is-pick .fbox-m{white-space:normal;overflow:visible;text-overflow:clip}
.fbox.is-pick .icx{margin-right:var(--s2)}

/* 说明类的折叠：一枚标签，不是一张卡。展开的正文也不进卡壳——
   它是一段注解，和底下那张数据表不是同一个分量。 */
.hlp-t{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  min-height:1.75rem;padding:0 10px 0 7px;border:1px solid var(--line);
  border-radius:999px;background:transparent;color:var(--ink-3);cursor:pointer;
  font-size:0.75rem;transition:border-color .14s,color .14s,background .14s}
.hlp-t:hover{border-color:var(--ink-4);color:var(--ink)}
.hlp-t.is-on{color:var(--ink);border-color:var(--ink-4);background:var(--surface-2)}
.hlp-t svg{transition:transform .18s}
.hlp-t.is-on svg{transform:rotate(180deg)}
.hlp-b{padding:var(--s4);border:1px solid var(--line-2);border-radius:.75rem;background:var(--surface)}
.pjx-f-x{flex:0 0 auto;display:inline-flex;align-items:center;min-height:1.5rem;
  font-size:0.6875rem;color:var(--ink-4);opacity:0;padding:0 8px;border-radius:var(--r1)}
.pjx-f:hover .pjx-f-x,.pjx-f-x:focus-visible{opacity:1}
.pjx-f-x:hover{color:var(--err);background:var(--err-soft)}

/* ---- 手机上的点击范围 ----
   桌面上 24px 高的次级按钮点得中，手指点不中。
   但把它们在桌面上也改大，整套密度就散了——这是两种输入设备的事，不是同一件。
   所以只在窄屏把「可点范围」往上下撑到 44px，看上去还是那么大。
   只撑上下不撑左右：左右撑开会压到旁边那颗。
   用 ::after 的那几个（导航、页签、阶段条）排除掉，它们的伪元素另有用处。 */
@media(max-width:480px){
  #view button,#side button,#view [role="button"]{position:relative}
  #view button:not(.nav):not(.rail-link):not(.pjx-tab):not(.stg):not(.pcard)::after,
  #side button:not(.nav):not(.rail-link)::after,
  #view [role="button"]:not(.chip):not(.pcard)::after{
    content:"";position:absolute;left:0;right:0;top:50%;
    transform:translateY(-50%);height:2.75rem;pointer-events:auto}
  #view td button::after,#view th button::after{display:none}
  #view td button,#view th button{min-height:2rem!important;padding-inline:10px!important}
  .nav-more-b{width:2rem;height:2rem}
  .pjx-f-x{opacity:1;padding:6px 8px}
  .sw{height:1.75rem;flex-basis:3rem;width:3rem}
  .sw>i{top:3px;left:3px;width:1.25rem;height:1.25rem}
  .sw[aria-checked="true"]>i{transform:translateX(1.25rem)}
}
.pjx-empty{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:var(--s8) var(--s4);text-align:center}
.pjx-empty-ic{transform:scale(1.6);margin-bottom:var(--s4);opacity:.75}
.pjx-chat{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.pjx-doc{flex:0 0 auto;max-height:45%;overflow:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:var(--s3);
  padding:var(--s4) max(var(--s5),calc((100% - 50rem)/2));
  border-bottom:1px solid var(--line);background:var(--surface)}
.pjx-chat-h{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);color:var(--ink)}
.pjx-flow{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:var(--s5);
  padding:var(--s6) max(var(--s5),calc((100% - 50rem)/2)) var(--s4)}
.pjx-flow.is-empty{align-items:center;justify-content:center;gap:8px;text-align:center}
.pjx-ask{flex:0 0 auto;padding:0 max(var(--s5),calc((100% - 50rem)/2)) var(--s5);
  background:var(--paper)}
@media(max-width:860px){
  .pjx-b{flex-direction:column}
  .pjx-grip{display:none}      /* 堆叠之后没有左右可拖；它探出去的 3px 会把整页撑宽 */
  .pjx-side{flex:0 0 auto;width:100%;max-height:40%;border-right:0;border-bottom:1px solid var(--line)}
}
.pw-left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  background:var(--surface)}
.pw-tabs{display:flex;gap:var(--s5);padding:0 var(--s5);border-bottom:1px solid var(--line);flex:0 0 auto}
.pw-tab{border:0;background:transparent;padding:13px 0;cursor:pointer;color:var(--ink-3);
  font-size:0.78125rem;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.pw-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--dry)}
.pw-leftb{flex:1;min-height:0;overflow:auto;padding:0 var(--s5) var(--s5)}
.pw-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.pw-head{flex:0 0 auto;padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);
  background:var(--surface)}
.pw-chat{flex:1;min-height:0;overflow:auto;padding:var(--s5)}
.pw-empty{align-items:center;justify-content:center;height:100%;text-align:center}
.pw-ask{flex:0 0 auto;padding:0 var(--s5) var(--s5)}
.pw-ask .ask{margin:0}
.msg{display:flex;margin-bottom:var(--s4)}
.msg.me{justify-content:flex-end}
.bub{max-width:min(78%,720px);padding:var(--s3) var(--s4);border-radius:var(--r3);
  background:var(--surface);border:1px solid var(--line);font-size:0.8125rem;line-height:1.7}
.msg.me .bub{background:var(--dry);color:var(--on-dry);border-color:var(--dry)}
@media(max-width:900px){.pw{grid-template-columns:1fr;height:auto}
  .pw-left{border-right:0;border-bottom:1px solid var(--line)}}
/* 工作台：输入框是主体，示例在它下面。示例不是导航，是可以直接提交的句子，
   所以每张卡给的是一句具体的话，不是一个能力名加一句说明。 */
.home{max-width:54rem;margin-inline:auto;gap:var(--s5);
  min-height:calc(100vh - var(--s9) - 56px);justify-content:center}
.home-hd{text-align:center;align-items:center;margin-bottom:var(--s2)}
/* 五个例子是五条独立的示例提问，不是一张表的五行——连成一个带分隔线的列表，
   读起来像设置项。拆成各自独立的小卡片，三列排。
   卡里真正要读的是那句提问，所以提问当主内容，能力名降成上面的小标签。 */
.caps{display:grid;gap:9px;grid-template-columns:repeat(5,minmax(0,1fr))}
/* 五个能力一行排开，各占一格、等高。卡做小、倒角做大，
   它们是入口不是内容——面积让给输入框，气质上也离"按钮"更近一点。 */
.cap-row{display:flex;flex-direction:column;align-items:stretch;
  gap:7px;width:100%;min-width:0;height:8.5rem;box-sizing:border-box;
  padding:13px 13px 12px;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);
  transition:border-color .14s,box-shadow .14s,background .14s}
.cap-row:hover{border-color:var(--ink-4);box-shadow:var(--sh-2)}
.cap-row[aria-pressed="true"]{border-color:var(--dry);background:var(--dry-soft)}
.cap-row.is-wet[aria-pressed="true"]{border-color:var(--wet);background:var(--wet-soft)}
.cap-h{display:flex;align-items:center;gap:8px;min-width:0}
.cap-ic{display:grid;place-items:center;width:24px;height:1.5rem;flex:0 0 24px;
  background:transparent;color:var(--ink-4)}
.cap-ic svg{width:0.9375rem;height:0.9375rem}
.cap-ic.sm{width:22px;height:1.375rem;flex-basis:22px;border-radius:var(--r1)}
.cap-ic.sm svg{width:0.9375rem;height:0.9375rem}
/* 文件类型标签：和首页能力卡同一套做法——彩色底的 icon 块 + 扩展名。
   同类同色（序列与结构走「计算」的蓝，表格走「实验」的赭，其余走墨色）。 */
.kbtag{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px 2px 3px;border-radius:var(--r1);font-size:0.6875rem;font-weight:600;
  font-family:var(--mono);letter-spacing:0}
.kbtag .fico{display:grid;place-items:center}
.kbtag .fico svg{width:0.875rem;height:0.875rem}
.kbtag.is-dry{background:var(--dry-soft);color:var(--dry-ink)}
.kbtag.is-wet{background:var(--wet-soft);color:var(--wet-ink)}
.kbtag.is-ink{background:var(--surface-3);color:var(--ink-3)}
.pwcard.is-kb{cursor:pointer}
.pwcard.is-kb.is-on{border-color:var(--ink);box-shadow:inset 3px 0 0 0 var(--ink)}
.kbprev{box-shadow:none}
.kbpre{margin:0;max-height:26rem;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-family:var(--mono);font-size:0.71875rem;line-height:1.6;color:var(--ink-2);
  background:var(--surface-2);border-radius:var(--r2);padding:var(--s3)}
.cap-row.is-wet .cap-ic,.pickchip.is-wet .cap-ic{background:var(--wet-soft);color:var(--wet)}
.cap-n{font-size:0.78125rem;font-weight:600;color:var(--ink);letter-spacing:-.005em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-row[aria-pressed="true"] .cap-n{color:var(--dry-ink)}
.cap-row.is-wet[aria-pressed="true"] .cap-n{color:var(--wet-ink)}
.cap-q{font-size:0.71875rem;line-height:1.5;color:var(--ink-4);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;min-width:0}
@media(max-width:1000px){.caps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.caps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){.caps{grid-template-columns:1fr}.cap-row{height:auto}}

/* 选中之后只留一枚芯片。把同一张卡在屏幕上画两次是纯粹的重复。 */
/* 对话流里选中的能力卡，和首页示例卡同一套比例：图标 24、名称 11、说明 12.5 单行。 */
.pickchip{display:inline-flex;align-items:center;gap:7px;padding:3px 3px 3px 4px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface-2);align-self:flex-start}
/* 输入框上沿的作用域条 */
/* 在线推理：一张网格，不是 N 个各自滚动的列。
   并排对比要能**横着读**：同一个问题下面，几家的答复必须对齐在同一行。
   做成几列各自的聊天框就对不齐了——左边答得长，右边第二问就跑到了左边第一问的高度上，
   人得来回找。所以问句占满一整行，答复按列落在它下面。
   列头粘在顶上：往下读到第五轮，还得知道哪一列是谁。 */
.inf{display:flex;flex-direction:column;gap:var(--s4)}
.inf-bar{display:flex;align-items:center;gap:var(--s4);min-height:1.75rem}
.inf-add{display:inline-flex;align-items:center;gap:4px;min-height:1.5rem;font-weight:600}
.inf-add[disabled]{color:var(--ink-4);cursor:not-allowed}
.inf-g{display:grid;gap:var(--s4);align-items:stretch}
.inf-col{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);
  border-radius:.75rem;background:var(--surface-2);overflow:hidden}
.inf-h{display:flex;align-items:center;gap:var(--s2);min-width:0;padding:var(--s2) var(--s3);
  background:var(--surface);border-bottom:1px solid var(--line-2)}
.inf-h>.ctl-sel{flex:0 1 20rem;min-width:0;margin-right:auto}
.inf-h .ctl-dd{width:100%}
.inf-h .ctl-dd .dd-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf-body{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);
  height:max(14rem,calc(100vh - 27rem));overflow-y:auto;overscroll-behavior:contain}
.inf-wait{margin:auto;display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  color:var(--ink-4);font-size:0.8125rem}
.inf-q{align-self:flex-end;max-width:85%;padding:var(--s2) var(--s4);border-radius:.75rem .75rem .25rem .75rem;
  background:var(--dry-soft);color:var(--dry-ink);font-size:0.84375rem;line-height:1.65;
  white-space:pre-wrap;word-break:break-word}
.inf-a{align-self:flex-start;max-width:100%;min-width:0;display:flex;flex-direction:column;
  padding:var(--s3) var(--s4);border:1px solid var(--line-2);border-radius:.75rem .75rem .75rem .25rem;
  background:var(--surface);font-size:0.84375rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.inf-a.is-err{border-color:var(--err);background:var(--err-soft)}
.inf-a.is-wait,.inf-a.is-none{color:var(--ink-4);border-style:dashed;background:transparent}
.inf-u{font-size:0.6875rem;color:var(--ink-4);margin-top:auto;padding-top:10px}
/* 竖排之后列头都挤在最上面，答复一条条往下排，哪条是谁的就看不出来了。
   窄屏给每一格补一个模型名；宽屏靠列头，这一行是多余的。 */
.inf-foot{margin:0;text-align:center;font-size:0.71875rem;color:var(--ink-4)}
@media(max-width:900px){
  .inf-g{grid-template-columns:minmax(0,1fr)!important}
  .inf-h{position:static}
  .inf-n{display:block}
  .inf-q{margin-top:var(--s4)}}
.ask-top{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;min-width:0}
/* 项目工作台左栏的卡片：栏宽只有 ~230px，所以是窄卡——
   一行一个要点，不挤成并排的灰字。 */
.pwcard{display:flex;flex-direction:column;gap:5px;min-width:0;padding:var(--s3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  text-align:left;transition:border-color .14s,box-shadow .14s}
.pwcard[role="button"]{cursor:pointer}
.pwcard:hover{border-color:var(--ink-4);box-shadow:var(--sh-2)}
.pwcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pwcard-a{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding-top:6px;border-top:1px solid var(--line-2)}
.pwcard-a .btn{min-height:1.5rem;padding:0 8px;font-size:0.6875rem}
/* ---- 关联任务卡 ----
   三件事：高度一致、不要横线、下载悬停才出现。
   等高用「标题最多两行 + 固定最小高」做，不靠每张卡碰巧一样高；
   横线去掉之后，下载不再是卡底的一栏，而是浮在右下角的一颗按钮——
   它是这张卡的次要动作，平时不该占位置。 */
.pwcard.is-task{position:relative;min-height:7.25rem;padding-right:var(--s3)}
.pwcard.is-task .pwc-n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.35}
.pwcard-dl{position:absolute;right:var(--s3);bottom:var(--s3);
  opacity:0;transform:translateY(2px);transition:opacity .14s,transform .14s;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  box-shadow:var(--sh-2)}
.pwcard-dl .btn{min-height:1.5rem;padding:0 9px;font-size:0.6875rem;border:0;background:transparent}
.pwcard.is-task:hover .pwcard-dl,
.pwcard.is-task:focus-within .pwcard-dl{opacity:1;transform:none}
/* 触摸屏没有悬停这一说，直接露出来，否则这颗按钮等于不存在 */
@media (hover:none){.pwcard-dl{opacity:1;transform:none}}
.pw-top{display:flex;align-items:center;gap:var(--s2);min-width:0;
  padding:var(--s3) 0 var(--s2)}
.pw-top>strong{min-width:0}
.ask-top .pickchip{align-self:center}
.asktop-b{height:1.75rem;padding:0 9px;gap:6px;border-style:dashed;color:var(--ink-3);max-width:15rem}
.asktop-b .dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asktop-b:hover{border-style:solid}

.pickchip .x{border:0;background:transparent;cursor:pointer;color:var(--ink-3);
  width:20px;height:1.25rem;border-radius:50%;font-size:0.6875rem;line-height:1}
.pickchip .x:hover{background:var(--surface-3);color:var(--ink)}
/* 输入区：一块面，不再是卡里套卡。 */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);
  box-shadow:var(--sh-2);transition:box-shadow .18s,border-color .18s}
.ask:focus-within{border-color:var(--dry-dim);box-shadow:0 0 0 4px var(--dry-soft)}
.ask-b{position:relative;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3) var(--s4)}
/* 项目选择器待在工具条上，和附件、发送同一行：
   单独占一行的时候，空输入框要 183px 高，比它自己装得下的内容还高。 */
/* 模型名**不能截**：两个 id 都以 deepseek- 开头，从左边截掉尾巴之后
   「deeps…」谁也分不出是哪个，而这正是这个控件唯一要回答的问题。
   所以让它按内容撑开，窄屏的挤压交给项目选择器去吸收——
   项目名截一截还看得出是哪个课题，而且项目在页面别处也写着。 */
.ask-bar>.ctl-mdl{flex:0 0 auto;min-width:0}
.ctl-mdl .dd-v{overflow:visible;text-overflow:clip;white-space:nowrap}
.ask-bar>.ctl-proj{flex:1 1 4rem;min-width:2.5rem}
/* 窄栏里先让「打 @ 唤起技能」那句提示让位：它是可有可无的提示，
   模型选择是一个真要改的控件。 */
.ctl-proj{width:17rem;flex:0 1 17rem;min-width:0;border-style:dashed;color:var(--ink-3)}
.ctl-proj:hover{border-style:solid}
.ctl-proj .dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 空的结果容器照样是 flex 子项，会在工具条下面留出一条空带 */
#planOut:empty{display:none}
/* 不给拖拽手柄：高度由内容决定，不由鼠标决定。
   一行起步，随内容长，到 --ask-max 为止，再多就自己滚。 */
.ask-t{width:100%;border:0;background:transparent;color:inherit;resize:none;
  font:inherit;font-size:0.84375rem;line-height:1.7;min-height:1.5rem;padding:0;
  max-height:var(--ask-max,320px);overflow-y:auto}
/* 首页那一个定高：它是这一屏的主体，边打字边长高会把下面那排快捷指令一路往下推。
   进了对话之后才按内容长——那时它在底部，长高不会推动别的东西。 */
.ask-t.is-fix{height:4.5rem;min-height:4.5rem;max-height:4.5rem;overflow-y:auto}
.ask-t:focus{outline:0}
.ask-t::placeholder{color:var(--ink-4)}
/* 工具条：一种高度、一种圆角、一种边。左边是输入的来源，右边是输出的去向。 */
/* 工具条一行到底。放不下时让能力下拉自己变窄，而不是整条换行——
   换行会把输入框撑高两倍，正文区跟着缩。 */
.ask-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  row-gap:var(--s2);min-width:0}
.ask-bar>.ctl-ic,.ask-bar>.ctl-go,.ask-bar>.ctl-seg{flex:0 0 auto}
/* 换行之后「发送」要还在最右边，不是跟着前一个控件走 */
.ask-bar>.ctl-go{margin-left:auto}
.ask-bar>.ctl-dd{flex:0 1 auto;min-width:0}
.ask-bar>.ctl-dd .dd-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 手机宽度下这几个控件塞不进一行。与其把模型名截成「deeps…」，不如让工具条换行：
   什么都不截，什么都不溢出，代价只是多占一行。 */
@media (max-width:30rem){
  .ask-bar{flex-wrap:wrap;row-gap:var(--s2)}
  .ask-bar>.ctl-proj{flex:1 1 8rem}
  .ask-bar>.grow{flex-basis:100%;height:0}
}
/* 能力芯片多，窄栏里会把工具条挤成两行。让它们自己横向滚动，工具条始终一行。 */
.capbar{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.capbar::-webkit-scrollbar{display:none}
.capbar>.ctl{flex:0 0 auto}
.ctl{display:inline-flex;align-items:center;gap:6px;height:1.75rem;padding:0 10px;
  border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);
  color:var(--ink-2);font-size:0.75rem;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:border-color .14s,background .14s,color .14s}
.ctl:hover{border-color:var(--ink-4);color:var(--ink)}
/* 图标在按钮里的体量：15px 图标配 28px 框只占 54%，看着像个空框。
   提到 17px，和文字控件的视觉重量对齐。 */
.ctl-ic{width:28px;padding:0;justify-content:center;font-size:0.96875rem;font-weight:600}
.ctl-ic svg{width:1.0625rem;height:1.0625rem}
.ctl-pick{border-color:var(--ink);background:var(--ink);color:var(--on-pri);font-weight:600}
.ctl-go{background:var(--ink);border-color:var(--ink);color:var(--on-pri);padding:0 14px}
.ctl-go svg{width:1.125rem;height:1.125rem;flex:0 0 auto}
.pjx-ask .ctl-go{width:2.25rem;min-width:2.25rem;padding:0;justify-content:center}
.ctl-go:hover{background:var(--ink-2);border-color:var(--ink-2);color:var(--on-pri)}
.ctl-seg{display:inline-flex;height:1.75rem;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--surface-2);padding:2px;gap:2px}
.ctl-segi{border:0;border-radius:var(--r1);background:transparent;cursor:pointer;
  padding:0 10px;min-height:1.5rem;font-size:0.75rem;font-weight:500;color:var(--ink-3)}
.ctl-segi[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:var(--sh-1)}
.ctl-seg.is-lg{height:2.25rem}
.ctl-seg.is-lg .ctl-segi{min-height:2rem;padding:0 14px;font-size:0.8125rem}
.ctl .dot{width:6px;height:0.375rem;border-radius:50%;background:var(--ink-4)}
.ctl .dot.on{background:var(--dry)}
/* 小三角原先只在 .ctl 里才有形状，而 as-input 那一类下拉不是 .ctl，
   于是全产品这类下拉都只是一个方框，看不出能点开。 */
.ctl .car,.ctl-dd .car{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;
  border-top:4px solid var(--ink-4);margin-left:2px}
/* 原生 select 的外观跟这套控件不是一种语言，去掉它自己的壳 */
/* 下拉框统一三档宽度：标准 11.5rem，窄 8rem（表格里的），宽 18rem（内容本来就长的）。
   同一个控件在不同页面长得不一样，人每次都得重新认一遍。 */
.ctl-dd,.ctl-sel{width:11.5rem;min-width:11.5rem;justify-content:flex-start}
.ctl-dd.is-sm,.ctl-sel.is-sm{width:8rem;min-width:8rem}
.ctl-dd.is-lg,.ctl-sel.is-lg{width:18rem;min-width:18rem}
.ctl-dd.is-auto,.ctl-sel.is-auto{width:auto;min-width:0}
.ctl-dd>.dd-v,.ctl-sel .dd-v{flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ctl-dd>.car,.ctl-sel>.car{flex:0 0 auto;margin-left:auto}
.dd-ic{flex:0 0 auto;display:inline-flex;align-items:center;color:var(--ink-4);margin-right:6px}
.ctl-dd:hover .dd-ic{color:var(--ink-3)}
.ctl-sel{position:relative;padding-right:24px}
.ctl-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;
  color:inherit;font:inherit;font-size:0.75rem;font-weight:500;cursor:pointer;
  padding:0;max-width:150px;text-overflow:ellipsis}
.ctl-sel select:focus{outline:0}
.ctl-sel .car{position:absolute;right:9px;top:50%;margin-top:-2px}
/* 换成本产品下拉之后，原生 select 留在 DOM 里只当数据源，不再出现在画面上 */
/* 被替换掉的原生 select 必须真的缩到 1px：它常常同时带着 .input，
   而 select.input{width:100%} 的特异性比 .sel-raw 高，于是在某些页面上
   它仍有上千像素宽，隐身却照样把容器顶宽。这里用同等特异性压回去。 */
select.sel-raw,.sel-raw{position:absolute!important;width:1px!important;height:1px!important;padding:0;margin:0;
  opacity:0;pointer-events:none;clip-path:inset(50%);overflow:hidden}
.ctl-sel.dressed{display:flex;border:0;background:transparent;padding:0;height:auto;min-width:0}
.ctl-sel.dressed>.car{display:none}
.ctl-sel.dressed .ctl-dd{flex:1 1 auto;min-width:0}
.ctl-dd{display:inline-flex;align-items:center;gap:6px;height:1.75rem;padding:0 9px 0 10px;
  border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:0.75rem;font-weight:500;cursor:pointer;
  transition:border-color .14s,color .14s}
.ctl-dd:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink)}
.ctl-dd:disabled{opacity:.5;cursor:not-allowed}
.ctl-dd .dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* .ctl-sel .car 是绝对定位的（给原生 select 用），它会同时命中按钮里的箭头，
   把箭头压到文字上。按钮里的箭头走正常文档流。 */
.ctl-dd .car{position:static;flex:0 0 auto;margin-left:auto}
/* 工具条上的下拉定宽：值一长一短，整条工具条就会跳位。超出的用省略号。 */
.ask-bar .ctl-dd{width:150px;flex:0 0 150px}
.ask-bar [data-act="bindproj"]{max-width:min(17rem,45%);overflow:hidden}
.ask-bar [data-act="bindproj"] .dd-v{min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ctl-dd.as-input{height:2rem;min-height:2rem;border-radius:var(--r1);font-size:0.78125rem;
  color:var(--ink);padding:0 10px}
.menu-i.is-off{opacity:.45;cursor:not-allowed}

/* 区块标题：不用全大写小标签。那是通用模板的标记，不是信息。 */
.res-pv{outline:2px solid var(--dry);outline-offset:-1px;background:var(--dry-soft)!important}
.tk{display:flex;flex-direction:column;gap:1px}
.stt{display:inline-flex;align-items:center;gap:var(--s2)}
.stt .bar{flex:0 0 44px}
.sec{display:flex;align-items:center;gap:var(--s3);padding-bottom:2px}
/* 区块标题和内容之间原先是 0——.page 的 gap 只作用在 .page 的直接子节点上，
   section 内部不受它管。 */
.page>section{display:flex;flex-direction:column;gap:var(--s3)}
.page>section.card{gap:0}
.sec-h{display:flex;align-items:center;gap:var(--s3)}
.sec h2{font-size:0.8125rem;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.ta-r{text-align:right}
td.ta-r{text-align:right}
.hero{background:transparent;box-shadow:none;border:0;overflow:visible}

@media(max-width:860px){
  #app{flex-direction:column}
  #side{position:static;height:auto;flex-basis:auto;width:100%;flex-direction:row;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--s3);gap:var(--s1);align-items:center}
  #main{border-left:0}
  #side .brand,#side .side-foot,#side .lbl{display:none}
  #side .nav-group{flex-direction:row;padding:0;margin:0}
  .nav{white-space:nowrap}
  .nav[aria-current="page"]::before{display:none}
  .nav[aria-current="page"]{background:var(--dry-soft)}
}

/* 滑块：细轨道，实心把手 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;
  height:1.75rem;max-width:26rem;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-track{height:3px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1rem;height:1rem;
  margin-top:-0.40625rem;border-radius:50%;
  background:var(--dry);border:2px solid var(--surface);box-shadow:var(--sh-2);margin-top:-5.5px;transition:transform .12s}
input[type=range]::-moz-range-thumb{width:1rem;height:1rem;border-radius:50%;background:var(--dry);
  border:2px solid var(--surface);box-shadow:var(--sh-2)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(.96)}

/* 勾选框 */
input[type=checkbox],input[type=radio]{accent-color:var(--dry);width:14px;height:0.875rem;cursor:pointer}

.btn-pri[disabled]{background:var(--surface);border-color:var(--line);color:var(--ink-3);box-shadow:none;opacity:1}

/* 项目页两栏：左边项目本身，右边对话产出的文档。
   文档属于项目而不属于某一段对话，所以它在项目页，不在对话里。 */
.page.pj{display:grid;gap:var(--s6);grid-template-columns:minmax(0,1fr) 19rem;align-items:start}
.pj-main{gap:var(--s6);min-width:0}
.pj-rail{gap:var(--s3);position:sticky;top:var(--s5);min-width:0}
@media(max-width:1100px){.page.pj{grid-template-columns:1fr}.pj-rail{position:static}}
/* ================= Agent 对话面 =================
   读法参照终端里的助手：所有内容贴同一条左边界，自上而下一条流。
   用户说的话不做成右对齐气泡——气泡是聊天软件的做法，会把视线来回拉；
   这里用一个窄的引导符起头，和助手的回答同宽、同左。
   工具跑出来的东西是「结果块」，不是卡片：细边、无阴影、标题压成一行，
   不跟正文抢。 */
/* 只能有一个滚动容器。原先 #view 和 .chat-flow 各滚各的，
   内容卡在两层滚动条之间，总有一截够不着——这就是「显示不完整」。
   现在整条流跟着 #view 滚，输入框 sticky 贴底。 */
.page.chat{display:flex;flex-direction:column;gap:0;min-height:100%;padding-bottom:0}
.chat-flow{flex:1 1 auto;display:flex;flex-direction:column;
  gap:var(--s5);padding:var(--s6) 0 var(--s4)}
/* 输入框压在流上，中间要有交代：上沿一段渐隐，让内容是「滚到它下面去」，
   而不是被它切掉一截。 */
/* #view 给所有页面留了 --s8 的底边，对话页不要：输入框得真的贴到底，
   否则它浮在半空，下面空一条和纸同色的带子。
   粘性元素到不了容器内边距以下，所以得把内边距本身去掉。 */
body[data-route="chat"] #view{padding-bottom:0}
.chat-ask{flex:0 0 auto;position:sticky;bottom:0;z-index:5;
  padding-bottom:var(--s4);background:var(--paper)}
/* ---- 落地态：输入框居中，下面一排小指令 ---- */
/* ---- 右上角的产出文件 ---- */
.outbar{position:sticky;top:0;z-index:7;display:flex;flex-direction:column;
  align-items:flex-end;padding-top:var(--s4)}
.outbar-b{display:inline-flex;align-items:center;gap:6px;min-height:1.875rem;
  padding:0 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink-2);cursor:pointer;
  font:inherit;font-size:0.75rem;box-shadow:var(--sh-1)}
.outbar-b:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-4);color:var(--ink)}
.outbar-b:disabled{opacity:.5;cursor:default}
.outbar-b:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.outbar-b .num{padding:0 6px;border-radius:999px;background:var(--surface-3);
  color:var(--ink-3);font-family:var(--mono);font-size:0.6875rem;line-height:1.0625rem}
.outbar-p{width:min(30rem,calc(100vw - 2rem));margin-top:6px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--pop);box-shadow:var(--sh-3);overflow:hidden}
/* 一行一个文件：图标 + 名字（可换行）在上，两颗按钮在下靠右。
   原先图标、名字、两颗按钮挤在同一行，26rem 宽装不下，名字被挤成断行、按钮掉到下一行，
   读起来像三样不相干的东西。 */
.out-r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2) var(--s3);
  align-items:start;padding:var(--s3);border-top:1px solid var(--line-2)}
.out-r:first-child{border-top:0}
.out-r:hover{background:var(--surface-2)}
.out-r>.out-a{grid-column:2;display:flex;gap:var(--s2);justify-content:flex-start}
.outbar-h{display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);border-bottom:1px solid var(--line-2)}
.outbar-l{max-height:17rem;overflow-y:auto;overscroll-behavior:contain}

.page.chat.is-land{display:grid;grid-template-rows:auto 1fr;align-items:center;gap:var(--s6);
  max-width:none;padding-top:var(--s4);padding-bottom:var(--s8)}
.land{display:flex;flex-direction:column;gap:var(--s3);align-items:center;text-align:center;
  width:100%;max-width:44rem;margin-inline:auto}
.land>p{text-align:center}
.land-ask{width:100%;margin-top:var(--s5)}
/* 一个 icon 加一条指令，不写例句——例句点下去就看得到，摆出来只是把行撑高。 */
.qks{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;margin-top:var(--s2)}
.qk{display:inline-flex;align-items:center;gap:7px;min-height:2rem;padding:0 12px 0 9px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--ink-2);cursor:pointer;font:inherit;font-size:0.78125rem;white-space:nowrap;
  transition:background .14s,border-color .14s,color .14s}
.qk:hover{background:var(--surface-2);border-color:var(--ink-4);color:var(--ink)}
.qk:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* 图标不再铺底色块。干/湿的语义留在笔画颜色上——
   一屏十个淡蓝方块是「通用后台」最明显的那一层。 */
.qk-ic{display:grid;place-items:center;width:1.25rem;height:1.25rem;flex:0 0 1.25rem;
  background:transparent;color:var(--ink-4)}
.qk-ic.is-wet{background:transparent;color:var(--wet)}
.qk-ic svg{width:0.8125rem;height:0.8125rem}
@media(max-width:640px){.greet{font-size:1.875rem!important}.qks{gap:6px}.qk{font-size:0.71875rem;min-height:1.875rem}}

.chat-ask::before{content:"";position:absolute;left:0;right:0;top:calc(-1 * var(--s5));
  height:var(--s5);background:linear-gradient(to bottom,transparent,var(--paper));
  pointer-events:none}

/* 产出条：贴在输入框上方，收起时只有一行，不抢对话的地方。 */
.chat-empty{gap:var(--s3);padding:var(--s7) 0 var(--s5);max-width:52ch}

/* 一轮：左边一列窄引导符，右边是内容。两种角色共用这条网格，左边界因此永远对齐。 */
.turn{display:grid;grid-template-columns:1.25rem minmax(0,1fr);gap:var(--s3);align-items:start}
.turn-g{font-family:var(--mono);font-size:0.8125rem;line-height:1.7;color:var(--dry);
  text-align:center;user-select:none}
.turn-b{min-width:0}

.dsteps{display:grid;gap:var(--s5);grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.dsteps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.dsteps{grid-template-columns:1fr}}
.dstep{position:relative;display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start;min-width:0}
.dstep-i{flex:0 0 auto;font-family:var(--mono);font-size:0.6875rem;font-weight:600;color:var(--dry);
  letter-spacing:.04em}
.dstep-i::before{content:"0"}
@media(min-width:1101px){.dstep+.dstep{padding-left:var(--s5);border-left:1px solid var(--line-2)}}
/* ---- 预测 vs 实测 ---- */
.scat{display:block;width:100%;height:auto;max-width:28rem;
  border-radius:var(--r2);background:var(--surface-2)}
.scat.is-wide{max-width:40rem}
.sc-k{display:inline-block;width:0.75rem;height:0;border-top:1px dashed var(--ink-4);
  margin-right:5px;vertical-align:middle}
.sc-k.is-m{border-top:1px solid var(--wet-dim)}
.vk{display:inline-block;width:0.5rem;height:0.5rem;border-radius:50%;
  margin-right:5px;vertical-align:baseline}
tbody tr.is-me>td{background:var(--dry-soft);font-weight:600}
.kadv-t .num{padding:0 6px;border-radius:999px;background:var(--surface-3);
  color:var(--ink-3);font-family:var(--mono);font-size:0.6875rem;line-height:1.0625rem}
@media (prefers-reduced-motion:reduce){.kadv-t .car{transition:none}}
.kstat{display:flex;flex-wrap:wrap;gap:var(--s5)}
.kstat>span{display:flex;flex-direction:column;gap:1px}
.kstat .sv{font-size:1.1875rem;font-weight:500;letter-spacing:-.025em;line-height:1.15;color:var(--ink);
  font-variant-numeric:tabular-nums}
.kstat .sk{font-size:0.65625rem;color:var(--ink-4);font-weight:450}
/* 跑的过程按行走，每行一个勾——像看着它一步步做完，不是一根进度条 */
.klog{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:0.71875rem;
  line-height:1.7;color:var(--ink-4)}
.klog i{font-style:normal;color:var(--ok);margin-right:6px}
.klog .cur{color:var(--ink-2)}
.klog .cur i{color:var(--dry)}
.rmchip{display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 9px;
  border-radius:999px;background:var(--dry-soft);color:var(--dry-ink);
  font-size:0.71875rem;font-weight:500}
.rmchip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:0.875rem;
  line-height:1;padding:0 4px;min-height:1.5rem;min-width:1.5rem}
@media(max-width:720px){.kform{grid-template-columns:1fr}}


/* =====================================================================
   墨砚实验台（2026-11-17 视觉重做）
   方向：深墨侧栏 + 暖白纸面；主色墨蓝（干 = 计算），朱砂是唯一的暖强调（湿 = 实验）；
   标题回到宋体——砚台的文气只给大标题和品牌，数据、表格、控件仍是无衬线和等宽。
   颜色的值全在 :root 的 token 里；这一层只管结构：侧栏、页头、卡片、表格、标签、首页。
   错误色从朱红改成胭脂（偏紫的深红）：朱砂已经给了「湿」，警示不能再借它。
   ===================================================================== */

/* ---------- 外壳：侧栏是一整块墨，内容区是压在上面的一张纸 ---------- */
#app{background:var(--surface-2)}
#side{background:var(--surface-2);color:var(--ink-2)}
#main{border-left:0;border-radius:.875rem 0 0 .875rem;
  box-shadow:0 0 0 1px var(--line)}
@media (max-width:40rem){#main{border-radius:0}}
.brand{padding:var(--s5) var(--s4) var(--s4)}
.brand-home:hover{background:var(--surface-3)}
.brand-mark{width:1.875rem;height:1.875rem;flex:0 0 1.875rem;border-radius:0;color:inherit}
.brand-mark svg{display:block;width:1.875rem;height:1.875rem}
/* 一滴墨，里面是双螺旋的留白；旁边一点朱砂。 */
.bm-a{fill:var(--ink)}.bm-b{fill:var(--seal)}.bm-s{stroke:var(--paper);fill:none}
.brand-n{font-size:1.125rem;line-height:1.15;
  font-weight:700;color:var(--ink);letter-spacing:.04em}
.brand-s{font-size:0.6875rem;line-height:1.2;color:var(--ink-3);letter-spacing:.12em;font-weight:500}
.nav-group .lbl{color:var(--ink-4);letter-spacing:.08em;font-weight:500}
.nav{min-height:2.0625rem;border-radius:.5rem;font-size:0.8125rem;font-weight:450}
.nav svg{flex:0 0 1rem;width:1rem;height:1rem;opacity:.8}
.nav[aria-current="page"]{color:var(--ink);background:var(--surface-3);font-weight:600}
.nav[aria-current="page"]::before{left:0;top:.5rem;bottom:.5rem;width:3px;border-radius:0 3px 3px 0;
  background:var(--dry)}
#side[data-collapsed="1"] .nav[aria-current="page"]::before{left:0}
.nav-more{color:var(--ink-3)}
.nav-n{background:var(--seal);color:var(--seal-on)}
:root[data-theme="dark"] #side .nav-n{background:var(--seal);color:var(--seal-on)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #side .nav-n{background:var(--seal);color:var(--seal-on)}}
#side .avatar{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
#navH::-webkit-scrollbar-thumb{background:var(--line)}

/* ---------- 按钮 ---------- */
.btn{border-radius:.5rem;font-weight:500}
.btn-pri{background:var(--ink);border-color:var(--ink);font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 1px 2px rgba(11,15,20,.18)}
.btn-pri:hover:not([disabled]){background:var(--dry);border-color:var(--dry)}
.ctl-go{border-radius:.5rem;font-weight:600}
.ctl-go:hover{background:var(--dry);border-color:var(--dry)}

/* ---------- 卡片：头是一条带子，身是纸，脚是操作条 ---------- */
.card{border-radius:.75rem;box-shadow:0 1px 0 rgba(11,15,20,.03),0 1px 3px rgba(11,15,20,.04);overflow:hidden}
.card>.card-h{border-bottom:1px solid var(--line-2)}
.card .card{box-shadow:none}
dialog{border-radius:.875rem}

/* ---------- 表格：表头不铺底色，只靠一条线和小一号的字 ---------- */
thead th{color:var(--ink-3);font-weight:600;font-size:0.71875rem;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--surface-2)}
/* 操作列钉在右边，会盖住横向滚过来的内容：左边留出一格，链接不贴着前一列的字。 */
.tbl-wrap.is-list th:last-child,.tbl-wrap.is-list td:last-child{padding-left:var(--s5)}

/* ---------- 状态标签：有底色的小牌，颜色只说状态 ---------- */
.chip.c-dry,.chip.c-wet,.chip.c-ok,.chip.c-err,.chip.c-mut{padding:1px 8px;border-radius:999px;
  font-size:0.6875rem;font-weight:600;line-height:1.5}
.chip.c-dry{background:var(--dry-soft);color:var(--dry-ink)}
.chip.c-wet{background:var(--wet-soft);color:var(--wet-ink)}
.chip.c-ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.c-err{background:var(--err-soft);color:var(--err)}
.chip.c-mut{background:var(--surface-3);color:var(--ink-3)}

/* ---------- 页签 ---------- */
.tab{font-size:0.84375rem}
.tab.is-on{color:var(--ink);border-bottom-color:var(--dry);font-weight:600}

/* ---------- 输入 ---------- */
.input,select.input{border-radius:.5rem;background:var(--surface)}
.ask{border-radius:.875rem;box-shadow:0 1px 2px rgba(11,15,20,.05),0 10px 28px -14px rgba(11,15,20,.22)}
.ask:focus-within{border-color:var(--dry);
  box-shadow:0 0 0 3px var(--dry-soft),0 10px 28px -14px rgba(11,15,20,.22)}
.empty{color:var(--ink-3)}

/* ---------- 首页：布局与比例照原样，只换胶囊的着色 ---------- */
.qk{border-radius:999px;background:var(--surface)}
.qk:hover{border-color:var(--dry);background:var(--dry-soft);color:var(--dry-ink)}
.qk-ic{color:var(--dry)}
.qk-ic.is-wet{color:var(--wet)}

/* 对话：用户那一句是一块浅底，回答是纸上的字 */
.turn-me .turn-b{background:var(--surface-2);border:1px solid var(--line-2);border-radius:.75rem;
  padding:var(--s2) var(--s4);color:var(--ink)}
.turn-me .turn-g{color:var(--dry);line-height:2.4}

/* ---------- 项目页 ---------- */
.pjx-new{min-height:1.875rem;padding:0 12px;font-size:0.78125rem;white-space:nowrap}
.outbar.is-inline{position:relative;top:auto;padding-top:0;flex:0 0 auto;z-index:8}
.outbar.is-inline .outbar-p{position:absolute;right:0;top:100%;z-index:20}
.pjx-conv{display:inline-flex;align-items:center;gap:var(--s2);min-width:0;max-width:100%;
  min-height:1.875rem;padding:0 8px 0 10px;border:1px solid transparent;border-radius:.5rem;
  background:transparent;cursor:pointer;font:inherit;color:var(--ink)}
.pjx-conv:hover{background:var(--surface-2);border-color:var(--line)}
.pjx-conv:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pjx-conv-n{font-size:0.84375rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pjx-conv svg{flex:0 0 auto;color:var(--ink-4)}
.pjx-exps{gap:var(--s2);padding-top:var(--s3)}
.pjx-sec{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0 2px}
.pjx-sec:first-child{padding-top:0}
.pjx-none{padding:var(--s2) 0 var(--s3)}
.pjx-card{display:flex;flex-direction:column;gap:var(--s2);width:100%;text-align:left;
  padding:var(--s3);border:1px solid var(--line);border-radius:.625rem;background:var(--surface);
  cursor:pointer;font:inherit;color:inherit;transition:border-color .14s,box-shadow .14s}
.pjx-card:hover{border-color:var(--dry);box-shadow:0 4px 14px -8px rgba(11,15,20,.28)}
.pjx-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pjx-card.is-wait{border-color:var(--wet-dim);background:color-mix(in srgb,var(--wet-soft) 40%,var(--surface))}
.pjx-card-h{display:flex;align-items:center;gap:var(--s2);min-width:0}
.pjx-card-ic{display:grid;place-items:center;flex:0 0 1.5rem;width:1.5rem;height:1.5rem;border-radius:.4375rem}
.pjx-card-ic.is-dry{background:var(--dry-soft);color:var(--dry-ink)}
.pjx-card-ic.is-wet{background:var(--wet-soft);color:var(--wet-ink)}
.pjx-card-n{flex:1 1 auto;min-width:0;font-size:0.8125rem;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pjx-card-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.25rem,1fr));gap:4px var(--s3)}
.pjx-card-kv>span{display:flex;flex-direction:column;min-width:0}
.pjx-card-kv i{font-style:normal;font-size:0.65625rem;color:var(--ink-4)}
.pjx-card-kv b{font-size:0.75rem;font-weight:500;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 模型接入 / 推理 ---------- */
.prov-mk{display:grid;place-items:center;flex:0 0 2rem;width:2rem;height:2rem;border-radius:.5rem;
  background:var(--surface-3);color:var(--ink-2);font-weight:650;font-size:0.8125rem}
.prov-mk.is-sm{flex-basis:1.625rem;width:1.625rem;height:1.625rem;font-size:0.71875rem;border-radius:.4375rem}
.provs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.prov{position:relative;display:flex;align-items:center;gap:var(--s3);min-width:0;padding:var(--s3);
  border:1px solid var(--line);border-radius:.625rem;background:var(--surface);cursor:pointer}
.prov:hover{border-color:var(--ink-4)}
.prov input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.prov:has(input:checked){border-color:var(--dry);background:var(--dry-soft)}
.prov:has(input:checked) .prov-mk{background:var(--dry);color:var(--on-dry)}
.prov:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.prov-u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:30rem){.provs{grid-template-columns:1fr}}
.pick{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border:1px solid var(--line);
  border-radius:.625rem;background:var(--surface-2)}
.pick-add{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
  min-height:2.75rem;border:1px dashed var(--ink-4);border-radius:.625rem;background:transparent;
  color:var(--dry);font:inherit;font-weight:600;font-size:0.8125rem;cursor:pointer}
.pick-add:hover{border-color:var(--dry);background:var(--dry-soft)}
.pick-add:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.picks{display:flex;flex-direction:column;gap:6px;max-height:19rem;overflow-y:auto;overscroll-behavior:contain}
.pickr{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);min-height:2.75rem;
  border:1px solid var(--line);border-radius:.5rem;cursor:pointer}
.pickr:hover{border-color:var(--ink-4)}
.pickr:has(input:checked){border-color:var(--dry);background:var(--dry-soft)}
.pickr[hidden]{display:none}
.hist{display:flex;align-items:center;gap:var(--s3);padding:2px var(--s2) 2px 0;
  border:1px solid var(--line);border-radius:.5rem}
.hist[hidden]{display:none}
.hist:hover{border-color:var(--ink-4);background:var(--surface-2)}
.hist-b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;
  padding:var(--s2) var(--s3);border:0;background:transparent;cursor:pointer;font:inherit;color:inherit}
.hist-b:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:.375rem}
.hist-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* ---- 第二遍修正 ---- */
.scard{border-radius:.75rem}
.scard-ic{border-radius:.625rem;background:var(--dry-soft);color:var(--dry-ink)}
.scard-ic.is-wet{background:var(--wet-soft);color:var(--wet-ink)}
.scard.is-on .scard-ic{background:var(--dry-soft);color:var(--dry-ink)}
.scard .dstats{grid-template-columns:repeat(auto-fit,minmax(4.5rem,1fr));width:100%}
.scard{min-width:0}
.scard-h{min-width:0;max-width:100%}
.scard-h>.bchips{flex:0 0 auto;flex-direction:column;align-items:flex-end}
.bchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;min-width:0;flex:0 1 auto}

/* 页头副标题只占一行：折行会把下面的页签挤下去，各页签的内容起点就不齐了 */
.pg-sub{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs{gap:var(--s6)}
/* 工具卡：开关和标签同一行，卡片不再为它单留一条 */
.scard-tags.has-sw{padding-right:3.5rem}
.scard>.scard-f.is-solo{margin-top:-1.875rem;padding-top:0;pointer-events:none;min-height:1.5rem}
.scard-f.is-solo>*{pointer-events:auto}
/* 账户行 / 系统设置 */
.acct-b{display:flex;align-items:center;gap:var(--s2);flex:1 1 auto;min-width:0;padding:4px 6px;margin:-4px -6px;
  border:0;border-radius:.5rem;background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left}
.acct-b:hover{background:var(--surface-3)}
.acct-b:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
body[data-route="me"] .acct-b{background:var(--surface-3)}
#side[data-collapsed="1"] .acct-b{flex:0 0 auto;margin:0;padding:4px}
.set-r{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line-2)}
.set-r:first-child{border-top:0;padding-top:0}
.set-r:last-child{padding-bottom:0}

.page.me{max-width:44rem;margin-inline:auto;width:100%;padding-top:var(--s8);gap:var(--s3)}
.me-hd{display:flex;align-items:center;gap:var(--s5);margin-bottom:var(--s4)}
.me-av{display:grid;place-items:center;flex:0 0 4.5rem;width:4.5rem;height:4.5rem;border-radius:50%;
  background:var(--dry);color:var(--on-dry);font-size:1.75rem;font-weight:650;
  box-shadow:0 10px 24px -10px color-mix(in srgb,var(--dry) 70%,transparent)}
.me-n{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.me-lbl{margin-top:var(--s4);font-size:0.75rem}
.me .set-r{padding:var(--s4) 0}
.me .set-r:first-child{padding-top:0}.me .set-r:last-child{padding-bottom:0}
.me-ic{display:grid;place-items:center;flex:0 0 2rem;width:2rem;height:2rem;border-radius:.5rem;
  background:var(--surface-2);color:var(--ink-3)}
.me-k{flex:0 0 6rem;color:var(--ink-2)}
.me-l{min-height:1.5rem;display:inline-flex;align-items:center;font-weight:600}
.me-danger{border-color:color-mix(in srgb,var(--err) 30%,var(--line));background:var(--err-soft)}
.me-wipe{border-color:var(--err);color:var(--err);background:var(--surface);font-weight:600}
.me-wipe:hover:not([disabled]){background:var(--err);border-color:var(--err);color:#fff}

/* 对话页顶栏 */
.outbar:not(.is-inline){flex-direction:row;align-items:center;gap:var(--s2);flex-wrap:wrap}
.outbar:not(.is-inline) .outbar-p{flex:0 0 100%;margin-left:auto}
.outbar-back{min-height:1.875rem;padding:0 10px;font-size:0.75rem}
.outbar-new{min-height:1.875rem;padding:0 12px;font-size:0.78125rem;white-space:nowrap}
/* 输入框顶上的一排卡片 */
.askchips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:var(--s2)}
.rmchip{padding:3px 4px 3px 8px;border-radius:.5rem;border:1px solid var(--dry-dim);font-weight:600}
.rmchip i{font-style:normal;font-family:var(--mono);opacity:.65}
.rmchip.is-doc{background:var(--wet-soft);color:var(--wet-ink);border-color:var(--wet-dim)}
.rmchip.is-file{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.rmchip button{border-radius:.375rem}
.rmchip button:hover{background:color-mix(in srgb,currentColor 14%,transparent)}

/* 抽屉底部的操作条：钉在底边 */
.dw-f{position:sticky;bottom:calc(var(--s5) * -1);display:flex;align-items:center;gap:var(--s3);
  margin:var(--s3) calc(var(--s5) * -1) calc(var(--s5) * -1);padding:var(--s3) var(--s5);
  background:var(--surface);border-top:1px solid var(--line-2)}
/* 页签等宽：带不带数字都占同样的一格 */
.tabs{gap:var(--s2)}
.tabs .tab{flex:0 0 auto;min-width:7rem;justify-content:center}
.pjx-tabs{gap:0;padding:0}
.pjx-tab{flex:1 1 0;text-align:center}
/* 项目概况抽屉 */
.pdw-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-2);
  border:1px solid var(--line-2);border-radius:.625rem;overflow:hidden}
.pdw-s{display:flex;flex-direction:column;gap:2px;padding:var(--s3) var(--s4);background:var(--surface)}
.pdw-s b{font-size:1.25rem;font-weight:600;line-height:1.2}
.pdw-s span{font-size:0.71875rem;color:var(--ink-3)}

/* 项目页两边的顶栏同高 */
.pjx-tabs,.pjx-chat-h{height:2.75rem;box-sizing:border-box;align-items:stretch}
.pjx-chat-h{align-items:center;padding-block:0}
.pjx-tab{padding-block:0}
/* 筛选条 */
.fbar-sel{flex:0 0 auto;width:auto;max-width:100%}
.fbar-sel .ctl-dd{min-height:2rem;min-width:11rem;max-width:18rem;border-radius:.5rem}
.fbar-q{display:inline-flex;align-items:center;gap:var(--s2);height:2rem;padding:0 var(--s3);
  width:min(18rem,100%);border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink-4)}
.fbar-q:hover{border-color:var(--ink-4)}
.fbar-q:focus-within{border-color:var(--dry);box-shadow:0 0 0 3px var(--dry-soft)}
.fbar-q input{flex:1 1 auto;min-width:0;height:100%;min-height:1.75rem;border:0;outline:0;background:transparent;color:var(--ink);font-size:0.78125rem}
.fbar-q input::placeholder{color:var(--ink-4)}

/* 全部对话：一段一行，时间统一靠右 */
.chcards{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:.75rem;
  background:var(--surface);overflow:hidden}

   前者是有信息的负样本参与重训，后者什么都不是。 */
const DISPOSITION={
  designed:{n:'已设计',train:false,note:'生成出来了，本轮没选上'},
  deduped:{n:'查重排除',train:false,note:'与历史重复，不占板位也不花钱'},
  selected:{n:'已入选',train:false,note:'选上了，还没排板'},
  plated:{n:'已排板',train:false,note:'占了孔位，还没送检'},
  ordered:{n:'已送检',train:false,note:'在实验节点执行'},
  measured:{n:'有结果',train:true,note:'有有效数值，参与重训'},
  failed:{n:'测定失败',train:true,note:'有信息的负样本，参与重训'},
  untested:{n:'未测',train:false,note:'没有任何信息，不参与重训'}};
/* 失败是有类型的；「未测」没有类型，因为它不是一种结果 */
const FAIL_REASON={
  no_expression:'表达量为零',aggregation:'聚集',purification:'纯化失败',
  degraded:'蛋白降解',no_binding:'无结合信号',bad_fit:'拟合质量不达标',
  other:'其他（见备注）'};
/* 从服务商返回的质量字段推断缺失原因——接口里没有 missing_reason，这是我们的推断 */
function inferFailure(r){
  if(r.expression==='none'||r.expression==='low')return {k:'no_expression',by:'expression 字段'};
  if(r.fit_quality==='poor')return {k:'bad_fit',by:'fit_quality 字段'};
  if(r.rmse>30)return {k:'bad_fit',by:'rmse_max_signal_pct > 30'};
  if(r.binding==='none')return {k:'no_binding',by:'binding 字段'};
  return null;
}
/* 变体按项目生成。此前 DB.cands 是一个全局列表，切项目看到的是同一批变体——
   项目页说 p2 有 48 条，变体库却摆着 p1 的 96 条。
   测定值放在 c.m 里，**按该项目实际测的字段**生成：
   Barstar 亲和力改造 只做亲和力就只有 KD，酶活项目就只有 kcat / Km。 */
/* 当前项目的变体。读变体一律走这个，不要直接读 DB.cands——

function CANDS(pid){const id=pid||S.pid;return DB.cands.filter(c=>c.pid===id)}
/* 变体谱系。定向进化里最有价值的结构就是谱系：V-081(K27A/R59E) 是从 V-034(K27A) 长出来的，
   这个关系决定了「哪条路走通了、哪条路走死了」。设计页已经在说「最优亲本延伸」，
   说了亲本就必须存亲本，否则口径和数据对不上。
   规则：亲本只能从更早轮次里**有结果**的变体里挑——没测过的不能当亲本，
   因为那等于拿一条不知道好坏的序列当起点。 */
function variantById(id){return DB.cands.find(c=>c.id===id)||null}
/* 从野生型到这条变体的完整路径。环路保护：坏数据不该让界面崩。 */
function lineageOf(c){const out=[];let cur=c,guard=0;
  while(cur&&guard++<12){out.unshift(cur);cur=cur.parent?variantById(cur.parent):null}
  return out}
/* KD 跨好几个数量级，线性平均没有意义——服务商返回 kd_mean 与 kd_log_std，
   并给 KineticInterval{value, ci_low, ci_high}。这里照同样的口径算。 */
function kdCI(c){
  if(mv(c,'kd')==null)return null;
  const lg=Math.log10(mv(c,'kd')), sd=sdOf(c,'kd')||0.15;
  return {lo:Math.pow(10,lg-1.96*sd), hi:Math.pow(10,lg+1.96*sd)};
}
/* KD 从 0.001 pM 到几百 pM，固定一位小数会把一整段都印成 0.0。 */
const kdNum=n=>n==null?'—':(n>=100?String(Math.round(n)):n>=10?n.toFixed(1):n>=1?n.toFixed(2):n.toPrecision(2));
/* 低于 SPR 可靠下限的不是一个点值，是一条「小于」的信息。 */
const kdCensored=c=>{const n=mv(c,'kd');return n!=null&&FIELD.kd.floor!=null&&n<FIELD.kd.floor};
const kdFmt=c=>{const n=mv(c,'kd');if(n==null)return '—';
  return kdCensored(c)?('< '+FIELD.kd.floor.toFixed(1)):kdNum(n)};
function kdCell(c){const ci=kdCI(c);
  if(!ci)return `<span class="col" style="gap:0"><span class="num mut2">—</span>
    <span class="t-xs mut2">${DISPOSITION[c.disposition].n}</span></span>`;
  if(kdCensored(c))return `<span class="col" style="gap:0">
    <span class="num">&lt; ${FIELD.kd.floor.toFixed(1)}${FIELD.kd.unit}</span>
    <span class="t-xs mut2" title="${esc(FIELD.kd.floorWhy)}">低于 SPR 可靠下限</span></span>`;
  return `<span class="col" style="gap:0"><span class="num">${kdFmt(c)}${FIELD.kd.unit}</span>
    <span class="t-xs mut2 num">${kdNum(ci.lo)}–${kdNum(ci.hi)}</span></span>`}
/* 几何平均：对数空间求均值再还原 */
function kdGeoMean(list){
  const L=list.filter(c=>mv(c,'kd')!=null&&!kdCensored(c));
  if(!L.length)return 0;
  const m=L.reduce((a,c)=>a+Math.log10(mv(c,'kd')),0)/L.length;
  return Math.pow(10,m);
}
/* 被下限截断的条数要报出来，不然平均值看起来比实际偏弱。 */
const kdCensoredCount=list=>list.filter(c=>kdCensored(c)).length;

/* 输入框里「已经挑好的东西」只有一种长相：一枚 chip，带一个去掉它的 ✕。
   首页和项目里用同一个函数，不再一边卡片一边 chip，也不再让下拉和卡片
   把同一个能力说两遍——选择器只管选，chip 管显示。 */
/* ---- 输入框上沿：这段话的作用域 ----
   参考 Codex 的做法：绑哪个项目、调哪些工具，是动笔之前要定的事。
   原先「绑定到项目」摆在输入框下沿的工具条里，和「提交」「模型」挤在一起——
   那一条是「写完之后干什么」，作用域放进去，等于写完才想起来问自己写给谁。 */
/* 这一句用哪个模型，放在输入框里而不是设置页里——因为这个选择是**按句**发生的：
   随手问一句 flash 就够，要它读一长段再答才值得切 pro。
   埋进设置页的话，没人会为了一句话专门跑一趟。
   名字用接口里的原名，不另起简称：设置页、这里、报错信息里说的得是同一个东西。 */
/* 全站「选一个模型」用的同一份清单：系列 × 模型。
   模型接入改成按系列管之后，这个下拉落在了后面——它还只列 DS_MODELS，
   于是接了 Qwen 也选不到。清单从 MSERIES() 推，接几家就有几家。 */
function msPairs(){
  const out=[];
  MSERIES().forEach(x=>(x.models||[]).forEach(m=>
    out.push({sid:x.id,name:m.name,label:x.label+'・'+m.name,st:m.st})));
  /* 旧的直连配置（legacy）不在 MSERIES 里，但它可能正是当前在用的那一条。
     不补进来，下拉会显示成另一个模型，而发请求走的还是它。 */
  const a=mActive();
  if(a.name&&!out.some(x=>x.sid===a.sid&&x.name===a.name))
    out.unshift({sid:a.sid,name:a.name,label:a.series.label+'・'+a.name,st:'untested'});
  return out;
}
/* ---- harness：这一句交给哪套智能体框架执行 ----
   模型只是会说话的那一半，另一半是装着它的那套框架：有哪些工具、怎么调、
   在什么沙盒里跑、算完按什么格式收回来。各家把自己的那一套放了出来
   （Claude Code、Codex、Kimi Code、DeepSeek Harness……），于是框架和模型
   成了两个分开选的东西——同一个模型换一套框架，能做的事和稳不稳都不一样。

   为什么摆在模型**前面**：先定用哪套框架，模型清单才有意义。顺序反过来，
   人会先挑一个眼熟的模型，再发现这套框架根本带不动它。

   下面这张表是**登记出来的适配关系，不是实测成绩**：各家的框架先适配自家模型，
   别家的模型要另行适配。没登记的照样列在模型下拉里、标明未适配且选不中——
   免得有人在一个跑不起来的组合上干等结果。适配按模型名的前缀认，
   这样后面接进来的新模型不用回来改这张表。 */
const HARNESS=[
 {id:'dy',n:'端砚 Harness',pre:null},
 {id:'claude',n:'Claude Code',pre:['claude']},
 {id:'codex',n:'Codex',pre:['gpt','o3','o4','codex']},
 {id:'kimi',n:'Kimi Code',pre:['kimi','moonshot']},
 {id:'ds',n:'DeepSeek Harness',pre:['deepseek']}];
const HS_OF=id=>HARNESS.find(h=>h.id===id)||HARNESS[0];
function hsCur(){return HS_OF(LS.get('harness','dy'))}
function hsUse(id){LS.set('harness',id)}
function hsFit(h,name){const n=String(name||'').toLowerCase();
  return !h.pre||h.pre.some(p=>n.indexOf(p)===0)}
/* 这套框架下还剩几个模型能用。一个都不剩时要说出来，不能让下拉空着。 */
function hsFitPairs(h){return msPairs().filter(x=>hsFit(h,x.name))}
function hsBtn(){
  const cur=hsCur();
  return `<span class="ctl ctl-sel ctl-mdl">
    <select id="askhs" aria-label="这一句交给哪套框架执行" data-ic="grid">${HARNESS.map(h=>
      `<option value="${esc(h.id)}"${h.id===cur.id?' selected':''}
        >${esc(h.n)}</option>`).join('')}</select>
    <span class="car" aria-hidden="true"></span></span>`;
}
function mdlBtn(){
  const a=mActive(), ps=msPairs(), h=hsCur();
  /* 用产品自己的下拉外壳 .ctl-sel：页面上有一段 JS（dressSelects）会把原生 select
     换成自家按钮。不套这个壳的话，它会被当成孤立的 select 套上 .as-input——
     那个样式是给表单里的整行输入用的，184px 宽，在 360px 的屏上直接把工具条撑破。 */
  const opt=x=>`<option value="${esc(x.sid+'|'+x.name)}"${(x.sid===a.sid&&x.name===a.name)?' selected':''}
        >${esc(x.name)}</option>`;
  const fit=ps.filter(x=>hsFit(h,x.name)), un=h.pre?ps.filter(x=>!hsFit(h,x.name)):[];
  /* 一个适配的都没有时不能把没适配的那些也灰掉：灰完这个下拉就空了，
     而发请求走的还是 mActive() 里那一个——屏幕上没有模型、实际却在用一个模型。
     这种时候照常列出来、照常可选，未适配在名字后面写明，由人自己决定。 */
  const body=fit.length
    ? fit.map(opt).join('')
      /* 分组名只有原生 select 会显示：产品自己的下拉把选项拍平成一列，
         optgroup 的标签在那一列里不见了——灰掉的几条就成了没有理由的灰。
         所以理由也写进这一条自己的名字里，两种渲染下都读得到。 */
      +(un.length?`<optgroup label="未适配${esc(h.n)}">`+un.map(x=>
          `<option value="${esc(x.sid+'|'+x.name)}" disabled
            >${esc(x.name)}（未适配 ${esc(h.n)}）</option>`).join('')+'</optgroup>':'')
    : ps.map(x=>`<option value="${esc(x.sid+'|'+x.name)}"${(x.sid===a.sid&&x.name===a.name)?' selected':''}
        >${esc(x.name)}${h.pre?'（未适配）':''}</option>`).join('');
  return `<span class="ctl ctl-sel ctl-mdl">
    <select id="askmdl" aria-label="这一句用哪个模型" data-ic="model">${body}</select>
    <span class="car" aria-hidden="true"></span></span>`;
}

/* 输入类型是 Neurosnap 四维筛里我们缺的一维。研究员的问题常常是
   「吃结构的工具有哪些」，而不是「计算工具有哪些」。从工具自己的输入字段归一。 */
const IN_KINDS=[['seq','序列',/序列|登录号|FASTA/],['struct','结构',/结构|PDB|骨架|配体/],
  ['mut','突变',/突变/],['list','变体清单',/变体清单|清单/],
  ['file','结果文件',/文件|结果/],['claim','结论',/结论/]];
function inKind(t){const x=(t.i||'')+'';
  const hits=IN_KINDS.filter(([,,re])=>re.test(x)).map(([k])=>k);
  return hits.length?hits:['other'];}

/* 卡头：画这个库里真正装的东西，不贴通用图片。
   CSP 不让加载外站图片，而且一张实验室照片也说不清 SKEMPI 和 PDB 的区别。
   八种模态各画一个：序列特征轨、结构带、pLDDT 配色的预测结构、突变矩阵、
   基准散点、抗体 Y 形、抗体序列比对、板位图。都是按模态画，不是按库名编的。
   pLDDT 那张用的是 AlphaFold 官方四色（和结构页图例同一套常量）。 */
/* 底色跟着调冷：wet 原来是暖棕 #6B4420，配赭石那一版的湿色。
   现在湿色是紫，整页也再没有别的暖口，就剩这一块棕色卡着。 */
const DCOV_BG={seq:'#141A24',func:'#1A2536',str:'#0D3361',des:'#232A3C',wet:'#332560'};
function dcov(d){
  const m=d.mode||'',w=320,h=104,ink='rgba(250,250,251,.92)',dim='rgba(250,250,251,.34)';
  /* 每个库一组固定的随机数：种子取库名全部字符，否则两个同样长的名字会画出一模一样的图 */
  let sd=0;for(let i=0;i<d.n.length;i++)sd=(sd*31+d.n.charCodeAt(i))%9973;
  const rnd=(i,a,b)=>{const x=Math.sin(i*12.9898+sd*0.7853)*43758.5453;
    return a+(x-Math.floor(x))*(b-a)};
  let g='';
  /* 分支按「用途类型」（cap）判，不按 mode 字串。
     原来判的是 '序列 · 注释' / '^结构$' / '预测结构' 这些模态值，
     而库里真实的 mode 是 '蛋白质'、'疾病 · 药物'、'细胞 · 基因' 这种，
     14 个库里只有 2 个命中，其余全落到 96 孔板。
     一个蛋白质序列库画成 96 孔板是说错话。cap 才是稳的那一轴。 */
  const C=d.cap||'';
  if(/序列 · 注释/.test(m)||C==='seq'){
    /* UniProt：一条序列轨 + 下面几段特征（结构域、位点） */
    g=`<rect x="20" y="40" width="280" height="7" rx="3.5" fill="${dim}"/>
      ${[[32,62],[104,44],[172,38],[226,52]].map((b,i)=>
        `<rect x="${b[0]}" y="40" width="${b[1]}" height="7" rx="3.5" fill="${ink}"/>`).join('')}
      ${[[52,0],[120,1],[188,0],[244,1]].map(([x,k])=>
        `<path d="M${x} 53v8" stroke="${ink}" stroke-width="2" stroke-linecap="round" opacity="${k?.5:.85}"/>`).join('')}
      ${[[32,62],[104,44],[172,38]].map(([x,wd],i)=>
        `<rect x="${x}" y="68" width="${wd}" height="5" rx="2.5" fill="${dim}"/>`).join('')}`;
  }else if(C==='str'&&/预测|AlphaFold|AFDB/i.test(d.n)){
    /* AFDB：同一条带，按 pLDDT 四色分段——配色就是结构页图例那一套 */
    const seg=[[20,62,0],[82,58,0],[140,54,1],[194,46,2],[240,60,3]];
    g=seg.map(([x,wd,b])=>`<rect x="${x}" y="45" width="${wd}" height="14" rx="7"
        fill="${PLDDT_BANDS[b][1]}"/>`).join('');
  }else if(C==='str'){
    /* PDB：两段螺旋 + 一组 β 片 */
    g=`<path d="M22 70c10-26 22 26 32 0s22 26 32 0" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      ${[0,1,2].map(i=>`<path d="M${120+i*26} 76l18-22 6 5-18 22z" fill="${ink}" opacity="${.9-i*.16}"/>`).join('')}
      <path d="M206 54c12 0 12 22 24 22s12-22 24-22 12 22 24 22" stroke="${dim}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  }else if(/突变/.test(m)||C==='des'){
    /* SKEMPI / ΔTm：突变矩阵，深浅代表效应大小 */
    g=[...Array(7)].map((_,r)=>[...Array(16)].map((_,c)=>{
      const v=rnd(r*16+c,0,1);
      return `<rect x="${22+c*17}" y="${24+r*8}" width="14" height="6" rx="1.5"
        fill="${ink}" opacity="${(.1+v*.82).toFixed(2)}"/>`}).join('')).join('');
  }else if(/基准/.test(m)){
    /* 基准集：预测 vs 实测散点，带对角线 */
    g=`<path d="M22 84L298 22" stroke="${dim}" stroke-width="1.5" stroke-dasharray="4 4"/>
      ${[...Array(26)].map((_,i)=>{const x=24+i*10.6,y=84-(x-22)*0.225+rnd(i,-11,11);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${ink}" opacity="${rnd(i+9,.45,1).toFixed(2)}"/>`}).join('')}`;
  }else if(/抗体结构/.test(m)){
    g=`<path d="M160 86V58M160 58 126 30M160 58l34-28" stroke="${ink}" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
      <path d="M126 30l-16-6M194 30l16-6" stroke="${dim}" stroke-width="4.5" stroke-linecap="round"/>`;
  }else if(/抗体序列/.test(m)){
    g=[...Array(5)].map((_,r)=>`<rect x="22" y="${28+r*12}" width="276" height="6" rx="3" fill="${dim}"/>
      ${[[70,26],[132,34],[206,22]].map(([x,wd])=>
        `<rect x="${x}" y="${28+r*12}" width="${wd}" height="6" rx="3" fill="${ink}"
          opacity="${(.55+r*.1).toFixed(2)}"/>`).join('')}`).join('');
  }else if(C==='func'){
    /* 通路 / 关联网络：CPDB、OTP、TCGA、WHO-TB、CELLxGENE 都是「谁和谁有关」的库。
       节点位置走同一组种子，所以每个库的网长得不一样，但自己每次都一样。 */
    const N=[...Array(11)].map((_,i)=>({x:34+rnd(i,0,1)*252,y:24+rnd(i+40,0,1)*58}));
    g=N.map((a,i)=>N.slice(i+1).map((b2,j)=>{
        const dx=a.x-b2.x,dy=a.y-b2.y;
        if(dx*dx+dy*dy>5200)return '';
        return `<path d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}L${b2.x.toFixed(1)} ${b2.y.toFixed(1)}"
          stroke="${dim}" stroke-width="1.2"/>`}).join('')).join('')
      +N.map((a,i)=>`<circle cx="${a.x.toFixed(1)}" cy="${a.y.toFixed(1)}"
          r="${(3+rnd(i+70,0,3)).toFixed(1)}" fill="${ink}"
          opacity="${rnd(i+12,.55,1).toFixed(2)}"/>`).join('');
  }else{
    /* 变体 · 实测：96 孔板 */
    g=[...Array(6)].map((_,r)=>[...Array(12)].map((_,c)=>
      `<circle cx="${34+c*22}" cy="${28+r*11}" r="4"
        fill="${rnd(r*12+c,0,1)>.42?ink:'none'}" stroke="${dim}" stroke-width="1"
        opacity="${rnd(r*12+c+3,.5,1).toFixed(2)}"/>`).join('')).join('');
  }
  return `<svg class="dcov-g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"
    role="img" aria-label="${esc(d.n)}：${esc(m)}">${g}</svg>`;
}

/* 一个位点的四类证据 + 本项目历史。全部从现有数据推，推不出来就说推不出来。 */
function siteEvidence(pid,pos){
  const P=DB.projects.find(x=>x.id===pid)||PRJ();
  const ann=(SITE_ANN[pid]||{})[pos]||{};
  const L=CANDS(pid).filter(c=>(c.muts||[c.mut]).some(m=>posOfMut(m)===pos));
  const M=L.filter(c=>c.disposition==='measured');
  const pk=(tcpOf(P)&&tcpOf(P).primary.k)||(P.fields||[])[0];
  const good=pk?M.filter(c=>{const t=tcpOf(P);return t&&tcpEval(c)&&tcpEval(c).primary}).length:0;

  const out=[];
  /* 1 序列：保守性要有同源序列比对才算得出，本环境没有 MSA */
  out.push({k:'序列',lv:'none',
    say:'保守性要在同源序列比对上算，本环境没有可用 MSA。先接上 MSA 构建，这一列才有值'});
  /* 2 结构：已发表的界面注释 */
  out.push(ann.struct?{k:'结构',lv:'yes',say:ann.struct,src:ann.src}
    :{k:'结构',lv:'none',say:'这个位点没有已发表的界面或结构注释'});
  /* 3 功能：禁改区。先看 UniProt 的特征表，再退回手工注释。 */
  const uf=unipFeats(pid,pos), U=UNIP[pid];
  if(uf.length){
    const hard=uf.some(f=>f.t==='ACT_SITE'||f.t==='BINDING');
    out.push({k:'功能',lv:hard?'no':'yes',
      say:uf.map(f=>`${FEAT_N[f.t]||f.t}：${f.d}`).join('；')
        +(hard?'。改这里会动到催化或配体结合本身，不只是界面':''),
      src:`UniProt ${U.acc} 特征表（前体编号 ${uf.map(f=>f.at).join('/')}，成熟链 ${pos}，偏移 ${unipOffset(pid)}），取回于 ${UNIP_AT}`});
  }else if(ann.func){
    out.push({k:'功能',lv:'no',say:ann.func,src:ann.funcSrc});
  }else{
    out.push({k:'功能',lv:'none',
      say:U?`UniProt ${U.acc} 的特征表里，这个位点没有活性位点、配体结合或已发表突变记录`
          :'没有这个位点的功能注释。要判断能不能改，需要活性位点与结合位点数据',
      src:U?`查的是 UniProt ${U.acc}，取回于 ${UNIP_AT}`:''});
  }
  /* 4 进化：天然变异来自 UniProt 的 VARIANT；位点频率仍然要 MSA。
     两件事分开说——「查过了没有」和「根本没查」不是一回事。 */
  const vr=uf.filter(f=>f.t==='VARIANT');
  out.push(vr.length
    ?{k:'进化',lv:'yes',say:'天然变异：'+vr.map(f=>f.d).join('；')
       +'。位点在同源序列里的频率仍需 MSA',src:`UniProt ${U.acc}，取回于 ${UNIP_AT}`}
    :{k:'进化',lv:'none',
      say:U?`UniProt ${U.acc} 没有这个位点的天然变异条目；位点在同源序列里的频率要接上 MSA 才算得出`
          :'位点频率与天然变异分布要查同源序列或变异库，两者都未接入',
      src:U?`已查 UniProt ${U.acc}（取回于 ${UNIP_AT}），未查 MSA`:''});
  /* 5 本项目历史：这一列是我们自己有的 */
  out.push(M.length
    ?{k:'本项目历史',lv:good?'yes':'no',
      say:`这个位点做过 ${L.length} 条设计，${M.length} 条有结果，${good} 条达成主目标`}
    :{k:'本项目历史',lv:'none',
      say:L.length?`这个位点做过 ${L.length} 条设计，但一条结果都还没回来`:'这个位点还没有设计过'});
  return out;
}
function siteRows(pid){
  const id=pid||S.pid, P=DB.projects.find(x=>x.id===id)||PRJ();
  const wt=(PRJ_WT[id]||'');
  /* 位点来源：已发表注释里的，加上本项目已经改过的 */
  const fromAnn=Object.keys(SITE_ANN[id]||{}).map(Number);
  const fromHist=[...new Set(CANDS(id).flatMap(c=>(c.muts||[c.mut]).map(posOfMut)))];
  const pos=[...new Set(fromAnn.concat(fromHist))].sort((a,b)=>a-b);
  return pos.map(x=>{
    const ev=siteEvidence(id,x);
    return {pos:x, wt:wt[x-1]||'?', ev:ev,
      yes:ev.filter(e=>e.lv==='yes').length,
      no:ev.filter(e=>e.lv==='no').length,
      none:ev.filter(e=>e.lv==='none').length};
  });
}

/* ================= 路线对比 =================
   参考流程第 3 步：围绕「理性设计 vs 定向进化」形成候选路线并给推荐。
   七个维度里有四个能从本项目自己的历史算出来——这才是我们该给的东西，
   而不是一张写死的教科书对照表。算不出来的如实写算不出来，并说明要测什么才算得出。 */
const ROUTES=[
 {k:'rational', n:'纯理性设计', d:'只按结构与机理挑位点，一次做几十条'},
 {k:'semi',     n:'半理性设计', d:'结构与机理框定范围，范围内做饱和或组合突变'},
 {k:'directed', n:'纯定向进化', d:'大库随机突变 + 高通量筛选，不预设位点'},
 {k:'combo',    n:'组合路线',   d:'先定向进化探边界，再理性设计收敛'}];
/* 本项目实际走的是哪条——命中率这类数只对自己走过的路线算得出来 */
const ROUTE_OF={p1:'semi',p2:'semi',p3:'semi'};

function routeMatrix(pid){
  const id=pid||S.pid, P=DB.projects.find(x=>x.id===id)||PRJ();
  const mine=ROUTE_OF[id]||'semi';
  const all=CANDS(id), st=hitStats(all,P);
  const t=tcpOf(P), pk=t?t.primary.k:null;
  const det=pk?detectable(pk,3):null;
  const nSel=all.filter(c=>c.disposition==='measured'||c.disposition==='failed').length;
  const rounds=(P.rounds||[]).filter(r=>r.state==='done').length;

  /* 每一格标明它是哪来的：
     calc  从本项目数据算出来的；def 路线本身的定义，不是对我们数据的断言；
     none  算不出，并说清要测什么才算得出。 */
  const calc=(v,from)=>({v:v,kind:'calc',from:from});
  const def =(v,from)=>({v:v,kind:'def', from:from});
  const none=(why)  =>({v:null,kind:'none',from:why});
  const NOTRUN='本项目没有走过这条路线。这一格要有数，得真做一轮并把结果回流回来';
  const row=(r)=>{
    const self=r.k===mine;
    return {
     r:r,self:self,
     cells:[
      {n:'命中率', ...(self&&st.measured
        ? calc(pct(st.byMeasured),`本项目 ${st.measured} 条有结果里命中 ${st.hits} 条`)
        : none(NOTRUN))},
      {n:'样本规模', ...(self&&st.byMeasured>0
        ? calc(Math.ceil(1/st.byMeasured)+' 条 / 命中 1 条',`按本项目命中率 ${pct(st.byMeasured)} 折算`)
        : none(NOTRUN))},
      {n:'可分辨效应', ...(self&&det&&det.sigma!=null
        ? calc((det.log?('×'+det.fold.toFixed(2)):('±'+det.delta.toFixed(2)+(FIELD[pk].unit||''))),
               `主目标 ${FIELD[pk].n}，σ 取自本项目重复测量，n=3，α=0.05 双侧，功效 80%`)
        : self?none((det&&det.why)||'要算可分辨效应，先得有重复测量'):none(NOTRUN))},
      {n:'单轮板数', ...(self&&nSel
        ? calc(Math.ceil(nSel*3/88)+' 块 96 孔板',
               `本项目已送检 ${nSel} 条 × n=3，每板 88 个可用孔`)
        : none(self?'还没有送检记录'
                   :'板数随样本规模走，样本规模算不出，板数也算不出'))},
      {n:'周期', ...(function(){
        if(!self)return none(NOTRUN);
        const T=turnaround(id);
        if(!T.n)return none('走完一个批次才有周转数据');
        const run=BATCHES.filter(b=>b.pid===id&&b.status!=='done'&&b.status!=='canceled');
        const tail=run.length?`；在途 ${run.length} 个，最久的已走 ${fmtDays(Math.max.apply(null,run.map(batchAgeDays)))}`:'';
        return calc(fmtDays(T.med)+' / 轮',
          `本项目 ${T.n} 个走完的批次，建单到出结果的中位数（${fmtDays(T.min)}–${fmtDays(T.max)}）${tail}`);
      })()},
      {n:'数据依赖', ...(r.k==='directed'
        ? def('不依赖已有数据','随机库不预设位点，这是这条路线的定义')
        : def('需要结构与位点证据','要先知道改哪里，这是这条路线的定义'))},
      {n:'实验资源', ...(self
        ? calc((P.rounds[0]&&P.rounds[0].plan&&P.rounds[0].plan.assay||[]).join(' / ')||'—',
               '取自本项目轮次计划里登记的测定方法')
        : r.k==='directed'||r.k==='combo'
          ? none('高通量筛选平台的产能与排期这里没有，要问实验室')
          : none(NOTRUN))}
     ]};
  };
  return {mine:mine, rows:ROUTES.map(row), rounds:rounds, st:st, pk:pk};
}

let _menuOff=null;
/* 菜单挂在 body 上，而 render() 会把它的锚点整个换掉，所以每次重渲都要先收起来。
   问题是：卡片是一张一张放出来的，每放一张就重渲一次——
   在流还没放完的时候点开「换一个模型跑这一段」，下一张卡一到，菜单就自己没了。
   所以记住它挂在哪个节点上（按 data-* 找得回来），重渲完再按原样挂回去。 */
let _menuRe=null;
function anchorKey(el){
  if(!el||!el.dataset)return null;
  for(const k in el.dataset){const v=el.dataset[k];
    if(v!=null&&v!=='')return '[data-'+k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())
      +'="'+String(v).replace(/"/g,'\\"')+'"]';}
  return null;
}
function closeMenu(keep){
  if(!keep)_menuRe=null;

    document.removeEventListener('keydown',_menuOff,true);_menuOff=null}
}
function remenu(){
  if(!_menuRe)return;

function menu(anchor,html,onPick,again){
  closeMenu(1);
  if(!again)_menuRe=null;
  const key=anchorKey(anchor);
  if(key)_menuRe={sel:key,html:html,onPick:onPick};
  const m=document.createElement('div');
  m.className='menu';m.id='menu';m.setAttribute('role','menu');m.innerHTML=html;
  m.style.visibility='hidden';document.body.appendChild(m);
  const r=anchor.getBoundingClientRect(),b=m.getBoundingClientRect();
  let top=r.bottom+6,left=r.left;
  if(top+b.height>innerHeight-10)top=Math.max(10,r.top-b.height-6);
  if(left+b.width>innerWidth-10)left=Math.max(10,innerWidth-b.width-10);
  m.style.top=top+'px';m.style.left=left+'px';m.style.visibility='';
  m.querySelectorAll('[data-pick]').forEach(b2=>{b2.setAttribute('role','menuitemradio');
    b2.onclick=()=>{const v=b2.dataset.pick;closeMenu();onPick(v)}});
  /* 跳转项不是单选项：它没有勾选位，角色是 menuitem 不是 menuitemradio，
     属性也换一个——共用 data-pick 的话，凡是按「有没有 data-pick」判断可选项的地方
     （键盘、读屏、测试）都会把它算成一个模型。 */
  m.querySelectorAll('[data-go]').forEach(b2=>{b2.setAttribute('role','menuitem');
    b2.onclick=()=>{const v=b2.dataset.go;closeMenu();onPick(v)}});
  _menuOff=e=>{
    if(e.type==='keydown'){if(e.key==='Escape'){closeMenu();anchor.focus()}return}
    if(!m.contains(e.target))closeMenu();
  };
  setTimeout(()=>{if(!_menuOff)return;
    document.addEventListener('mousedown',_menuOff,true);
    document.addEventListener('keydown',_menuOff,true)},0);
  const f=m.querySelector('.menu-i');if(f)f.focus();
}

function ddIc(k){
  const d=DDIC[k];if(!d)return '';
  return `<span class="dd-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
    aria-hidden="true" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`;

function dressSelects(root){
  root.querySelectorAll('select:not([data-dressed])').forEach(sel=>{
    sel.dataset.dressed='1';
    /* 原生 select 被下面这颗按钮代替了，但它自己还留在 Tab 序里：
       1×1、透明、看不见，而键盘会停在它上面——用键盘的人等于在页面上踩空一格。
       把它移出 Tab 序，可见的那颗按钮就是唯一的入口。 */
    sel.setAttribute('tabindex','-1');
    sel.setAttribute('aria-hidden','true');
    const wrap=sel.closest('.ctl-sel');
    if(wrap)wrap.classList.add('dressed');
    const lab=sel.getAttribute('aria-label')
      ||((sel.labels&&sel.labels[0])?sel.labels[0].textContent.trim():'');
    const btn=document.createElement('button');
    btn.type='button';btn.className='ctl-dd'+(wrap?'':' as-input');
    btn.setAttribute('aria-haspopup','menu');
    if(lab)btn.setAttribute('aria-label',lab);
    if(!wrap){const st=sel.getAttribute('style');if(st)btn.setAttribute('style',st);}
    const paint=()=>{
      const o=sel.selectedOptions[0];
      btn.innerHTML=(sel.dataset.ic?ddIc(sel.dataset.ic):'')
        +'<span class="dd-v"></span><span class="car" aria-hidden="true"></span>';
      btn.querySelector('.dd-v').textContent=o?o.textContent.trim():'—';
      btn.disabled=sel.disabled;
      btn.title=o?o.textContent.trim():'';
    };
    paint();
    btn.onclick=()=>{
      const O=[].slice.call(sel.options);
      menu(btn,(lab?`<div class="menu-l">${esc(lab)}</div>`:'')
        +O.map((o,i)=>o.disabled
          ? `<span class="menu-i is-off"><span class="ck"></span>
               <span><span class="nm">${esc(o.textContent.trim())}</span></span></span>`
          : `<button class="menu-i" type="button" data-pick="${i}" aria-checked="${o.selected}">
               <span class="ck">${o.selected?CK:''}</span>
               <span><span class="nm">${esc(o.textContent.trim())}</span></span></button>`).join(''),
        v=>{sel.selectedIndex=+v;paint();
            sel.dispatchEvent(new Event('change',{bubbles:true}));});
    };
    sel.parentNode.insertBefore(btn,sel);
    sel.classList.add('sel-raw');
  });
}

function drawer(o){

function modal(title,bodyHTML,okText,onOk){
  const d=document.getElementById('dlg');
  d.innerHTML=`<form method="dialog"><div class="card-h"><strong>${esc(title)}</strong></div>
    <div class="card-b">${bodyHTML}</div>
    <div class="card-h" style="border-top:1px solid var(--line-2);border-bottom:0;justify-content:flex-end">
      <button class="btn" value="cancel" type="submit">取消</button>
      <button class="btn btn-pri" value="ok" type="submit">${esc(okText)}</button></div></form>`;
  /* 校验要能拦住关闭。原先在 onclose 里做校验，等于先把弹窗关掉、把用户填的东西丢掉，
     再弹一句「必填项还空着」——那时已经没地方改了。
     约定：onOk 返回 false 表示校验未过，弹窗保持打开。 */
  dressSelects(d);
  /* 字数只在人真的在打字的时候给，而且只在快到上限时才给。
     「0 / 50」常驻在每个标签右边，等于每一行都挂着一个此刻没有意义的数。 */
  d.querySelectorAll('[data-count]').forEach(c=>{
    const el=d.querySelector('#'+c.dataset.count);if(!el)return;
    const max=+el.getAttribute('maxlength');
    const upd=()=>{const left=max-el.value.length;
      c.textContent=(el.value.length&&left<=Math.max(10,Math.round(max*0.2)))
        ?('还能打 '+left+' 个字'):''};
    el.addEventListener('input',upd);el.addEventListener('blur',upd);upd();});
  const okBtn=d.querySelector('[value="ok"]');
  okBtn.onclick=e=>{if(onOk&&onOk()===false){e.preventDefault();return false}};
  d.onclose=null;
  d.showModal();
  dressSelects(d);
  const first=d.querySelector('.card-b input,.card-b textarea')||okBtn;
  if(first)first.focus();
}

function litRows(pid){

const ABIL_OF=id=>ABIL.find(a=>a.id===id)||null;

/* 路由：先按关键词数胜负。只有在打平或都没命中时才问模型，
   而且模型只能在上面这几个 id 里选一个——它负责归类，不负责生成内容。 */
function routeIntent(t){
  const s=String(t||'').toLowerCase();
  /* 按命中个数算分会打平：「实测数据训一个打分模型」在实验和训练上各中两个词，
     结果靠前的那条赢。改成按命中词的长度计分——更具体的词更有分量；
     并且丢掉被更长命中词包住的那些（命中了「实测」就不该再给「测」记一分）。 */
  /* 一组词命中之后，被更长命中词包住的那些不再单独记分
     （命中了「实测」就不该再给「测」记一分）。 */
  /* 短的英文词要卡词边界：'tm' 直接做子串匹配的话，
     「我想知道 ipTM 是什么意思」里的 ipTM 会把它算成一次命中，整句判成引物设计。
     中文没有这个问题（没有词间空白，卡边界反而会漏），所以只对纯 ASCII 的短词卡。 */
  const hitIn=k=>{
    if(!/^[a-z0-9-]{1,4}$/.test(k))return s.indexOf(k)>=0;
    return new RegExp('(^|[^a-z0-9])'+k.replace(/[-]/g,'\\-')+'([^a-z0-9]|$)').test(s);
  };
  const pick=L=>{const h=L.filter(hitIn);
    return h.filter(k=>!h.some(o=>o!==k&&o.indexOf(k)>=0))};
  const score=a=>{
    const o=pick(a.obj||[]), k=pick(a.kw||[]);
    return {o:o.reduce((n,x)=>n+x.length,0), k:k.reduce((n,x)=>n+x.length,0),
            obj:o, verb:k};
  };
  /* 先比对象分，对象分相同再比动作分；都相同时留住先命中的那条。 */
  let best=null,br=null;
  ABIL.forEach(a=>{const r=score(a);
    if(!r.o&&!r.k)return;
    if(!best||r.o>br.o||(r.o===br.o&&r.k>br.k)){best=a;br=r}});
  const fields=grab(t);
  if(!best)return {cap:null,fields:fields,sure:false,hit:[],obj:[],verb:[]};
  return {cap:best.id,fields:fields,sure:true,
          hit:br.obj.concat(br.verb),obj:br.obj,verb:br.verb};
}
/* 从这句话里捞出能直接用的东西：登录号、PDB 号、贴进来的序列。
   捞不到就留空，让卡片去问，不猜。 */
function grab(t){
  const s=String(t||'');
  const out={};
  const pdb=s.match(/\b([1-9][A-Za-z0-9]{3})\b/);
  const acc=s.match(/\b([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})\b/);
  const seq=s.match(/[ACDEFGHIKLMNPQRSTVWY]{25,}/);
  if(acc)out.acc=acc[1];
  else if(pdb&&/pdb|结构|1brs|取回/i.test(s))out.pdb=pdb[1].toUpperCase();
  if(seq)out.seq=seq[0];
  const n=s.match(/(\d+)\s*条/);if(n)out.n=+n[1];
  /* DS-001 这样的编号是用户在点名一个数据集，点了名就别再问一遍 */
  const ds=s.match(/\bDS[-_ ]?(\d{1,4})\b/i);
  if(ds)out.ds='DS-'+ds[1].padStart(3,'0');
  /* 1BRS 这样的四位编号会被上面的 pdb 规则吃掉，DS 开头的不会，顺序无所谓 */
  return out;
}

/* ---- 一段对话 ---- */
const CONV={};
function convOf(sid){const k=sid||S.sid||'new';if(!CONV[k])CONV[k]=[];return CONV[k]}
function push(m){convOf().push(Object.assign({at:nowStamp()},m));}
function lastCard(t){const L=convOf();
  for(let i=L.length-1;i>=0;i--){const c=(L[i].cards||[]).filter(x=>x.t===t);if(c.length)return c[c.length-1]}
  return null}
/* 卡片要能被点中改状态，所以每张卡有自己的 id，不靠下标 */
let CARD_SEQ=0;
function mkCard(t,o){return Object.assign({t:t,id:'c'+(++CARD_SEQ)},o||{})}
function cardById(id){const L=convOf();
  for(const m of L){
    /* 思考过程挂在消息上，不在 cards 里（它要排在回答前面），一起找 */
    if(m.cot&&m.cot.id===id)return m.cot;
    for(const c of (m.cards||[]))if(c.id===id)return c}
  return null}

/* ================= 卡片 =================
   卡片是对话流里长出来的可交互部件，不是聊天气泡里的文字。
   每一类卡只干一件事：说明 / 确认要跑什么 / 填参数 / 跑 / 给结果 / 留文档。 */
const CARD={};

CARD.note=c=>`<div class="kard-b col" style="gap:4px">
  ${c.title?`<strong class="t-md">${esc(c.title)}</strong>`:''}

/* 「我打算这么做」：跑之前把步骤摊开，每段能换模型、能跳过。
   这是对话版的流程卡——原先它在发射台上，现在长在回答里。 */
CARD.steps=c=>`<div class="kard-h"><strong>${esc(c.title||'打算这么跑')}</strong>
    <span class="grow"></span><span class="t-xs mut2">${esc(c.note||'')}</span></div>
  <div class="kard-b col" style="gap:2px">
    ${c.steps.map((st,i)=>`<div class="kstep${st.skip?' is-skip':''}">
      <span class="kstep-i">${c.steps.length>1?(i+1):'·'}</span>
      <span class="col grow" style="gap:1px;min-width:0">
        <span class="row wrap" style="gap:var(--s2);align-items:baseline">
          <strong class="t-md">${esc(st.n)}</strong>
          ${st.tool?`<button class="lnk" type="button" data-ktool="${c.id}.${i}"
            title="换一个模型跑这一段">${esc(st.tool)}</button>`:''}
          ${st.opt?`<button class="lnk" type="button" data-kskip="${c.id}.${i}"
            style="color:var(--ink-4)">${st.skip?'启用':'跳过'}</button>`:''}
        </span>
        <span class="t-xs mut">${esc(st.d||'')}</span></span>
    </div>`).join('')}
  </div>`;

/* 参数表单：原先是一整页，现在是回答里的一张卡，填完就地发起。 */
/* ================= 字段形态 =================
   一个字段用哪种控件，看这个值本身是什么样的东西，不看它排第几个：
   能列出来的别让人打字，跨数量级的别给线性滑块，成对的上下界别拆成两个框。
   每种形态下面都写了它适用于什么，用错了就该换一种，而不是加说明文字。 */
const FLD={};
/* 登录号、基因名、任务名——枚举不出来的东西才用输入框 */
FLD.text=(c,f)=>`<input class="input${f.num?' num':''}" data-kf="${c.id}.${f.k}"
  value="${esc(f.v==null?'':f.v)}" placeholder="${esc(f.ph||'')}"

/* 序列、FASTA、长注释——要看得出换行 */
FLD.area=(c,f)=>`<textarea class="input" rows="${f.rows||3}" data-kf="${c.id}.${f.k}"
  placeholder="${esc(f.ph||'')}" style="font-family:var(--mono);font-size:0.75rem"
  >${esc(f.v||'')}</textarea>`;
/* 闭集且只选一个：PAM、物种、折叠模型、配方 */
FLD.sel=(c,f)=>`<span class="ctl ctl-sel"><select data-kf="${c.id}.${f.k}">${(f.opts||[]).map(o=>
    `<option value="${esc(o)}" ${String(f.v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>
  <span class="car" aria-hidden="true"></span></span>`;
/* 闭集里挑几个：要算哪些性质、测哪几项 */
FLD.chips=(c,f)=>{const on=[].concat(f.v||[]);
  return `<div class="chips">${(f.opts||[]).map(o=>
    `<button class="ch${on.indexOf(o)>=0?' on':''}" type="button"
      aria-pressed="${on.indexOf(o)>=0}" data-kchip="${c.id}|${f.k}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`};
/* 小整数，心里有确切值：返回几对、重复几次 */
FLD.step=(c,f)=>`<div class="stepper">
  <button type="button" data-kstep="${c.id}|${f.k}|-1" aria-label="减一">−</button>
  <span class="v num">${esc(f.v)}</span>
  <button type="button" data-kstep="${c.id}|${f.k}|1" aria-label="加一">＋</button></div>`;
/* 连续有界，要感觉「往哪边走意味着什么」。
   读数必须可编辑：研究员常常知道确切值（0.20），拖是拖不准的。 */
FLD.range=(c,f)=>`<div class="rngrow">
  <input type="range" data-krange="${c.id}|${f.k}" min="${f.min}" max="${f.max}"
    step="${f.stepv||0.01}" value="${f.v}">
  <input class="input num rd" data-kf="${c.id}.${f.k}" value="${esc(f.v)}" inputmode="decimal">
  ${f.unit?`<span class="t-xs mut2">${esc(f.unit)}</span>`:''}</div>`;
/* 上下界成对出现，而且要看它们挨得多近：Tm 范围、GC% 范围、产物长度 */
FLD.dual=(c,f)=>{const v=[].concat(f.v||[f.min,f.max]),sp=f.max-f.min;
  const l=(v[0]-f.min)/sp*100, r=(f.max-v[1])/sp*100;
  return `<div class="dual"><div class="trk"></div>
    <div class="fill" style="left:${l.toFixed(1)}%;right:${r.toFixed(1)}%"></div>
    <input type="range" data-kdual="${c.id}|${f.k}|0" min="${f.min}" max="${f.max}"
      step="${f.stepv||1}" value="${v[0]}" aria-label="${esc(f.label)} 下界">
    <input type="range" data-kdual="${c.id}|${f.k}|1" min="${f.min}" max="${f.max}"
      step="${f.stepv||1}" value="${v[1]}" aria-label="${esc(f.label)} 上界"></div>
  <div class="rngrow"><span class="rd num">${esc(v[0])}</span>
    <span class="t-xs mut2">到</span><span class="rd num">${esc(v[1])}</span>
    <span class="grow"></span>${f.note?`<span class="t-xs mut2">${esc(f.note)}</span>`:''}</div>`};
/* 跨数量级的阈值：padj、p 值、浓度。线性滑块在最有用的那一段里几乎拖不动。 */
/* 两边都转成字符串再比。opts 里是数字 0.05，f.v 也是数字 0.05，
   但 indexOf(String(0.05)) 在数字数组里永远是 -1——于是选中的档位永远显示成「自定义」。 */
FLD.tier=(c,f)=>{const cus=(f.opts||[]).map(String).indexOf(String(f.v))<0;
  return `<div class="chips">${(f.opts||[]).map(o=>
    `<button class="ch${String(f.v)===String(o)?' on':''}" type="button"
      aria-pressed="${String(f.v)===String(o)}"
      data-ktier="${c.id}|${f.k}|${esc(o)}">${esc(o)}</button>`).join('')}
    <button class="ch${cus?' on':''}" type="button" aria-pressed="${cus}"
      data-ktier="${c.id}|${f.k}|__cus">自定义</button></div>
  ${cus?`<input class="input num" data-kf="${c.id}.${f.k}" value="${esc(f.v)}"
    inputmode="decimal" style="margin-top:var(--s2)">`:''}`};
/* 只有开和关，而且默认值有道理：LFC shrink、独立过滤、限定编码区 */
FLD.switch=(c,f)=>`<div class="rngrow">
  <button class="sw${f.v?' on':''}" type="button" role="switch" aria-checked="${!!f.v}"
    data-ksw="${c.id}|${f.k}"><i></i></button>

/* 矩阵、VCF、图像。拖进来之后第一件事是认文件，不是填参数。 */
/* 选好之后，这一行就是一张文件卡：名字在上，行列和指纹在下，右端一颗 ✖。
   元信息（f.hint）收进卡里——它说的是这份文件，不是这个字段，

FLD.file=(c,f)=>f.v
  ? `<div class="fbox is-pick">
     <span class="fbox-r"><span class="fbox-t">
       <span class="fbox-n">${esc(f.v)}</span>
       ${f.hint?`<span class="fbox-m">${esc(f.hint)}</span>`:''}</span></span>
     <button class="icx" type="button" data-kfx="${c.id}|${f.k}" aria-label="移掉 ${esc(f.v)}" title="移掉这个文件">
       <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         ><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg></button></div>`
  /* 拖拽区原来把 f.ph 整个当正文渲染。而数据集那个字段的 ph 是

           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           ><path d="M12 15V3M12 3 8 7M12 3l4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>
       <span class="drop-t">把文件拖到这里，或点击选择${f.accept?`（${esc(f.accept.replace(/,/g,' / '))}）`:''}</span>

/* 两边都是数据里来的，要对上：列→分组、结果字段→变体库字段。
   左边那列是读文件读出来的，不是写死的，所以普通表单做不了。 */
FLD.map=(c,f)=>{const v=f.v||{};
  return `<div class="maprows">${(f.rows||[]).map(r=>`<span class="a num">${esc(r)}</span>
    <span class="ar" aria-hidden="true">→</span>
