CARD.struct3=c=>`<div class="kard-h"><strong class="t-md">${esc(c.title)}</strong>
    <span class="grow"></span>${vwModeSel()}</div>
  <div class="kard-b col" style="gap:var(--s3)">
    <div id="mol" style="position:relative;width:100%;height:20rem;border-radius:var(--r2);
      overflow:hidden;background:var(--surface-2);border:1px solid var(--line)"></div>
    <span class="t-xs mut2">${esc(VW.name||'')}　·　${esc(VW.src||'')}　·　${(VW.per||[]).length} 个残基</span>
  </div>`;

/* 输不给基线，原因不止一种，结论也不一样，所以要按数去分，不能统一写一句
   「样本太少或者特征没用」——那两件事的下一步动作是相反的。 */
/* 结论只算一次。列表上的结论和指标卡上的结论必须是同一套判法，
   不然同一个模型在两个地方会给出两种说法。 */
/* 一个模型能不能给当前这批候选打分，取决于它的特征算不算得出来。
   项目内打分器的特征就是候选身上的那些量，所以能；
   上传数据集训的那些，特征是别人表里的列名，候选身上没有，所以不能——
   这种时候要说清楚为什么，而不是把它从列表里悄悄拿掉。 */
/* 两种打分器，两套特征，不能混：
     kind 'proj'——特征从序列和突变位点算出来，任何候选都能算。
     kind 'ds'  ——特征是你在上传表里挑的那几个数值列。这些列不是算出来的，
                  是测出来的，所以只有当这条候选把那几列都测过，才打得了分。
   测不全就返回 null，不拿均值糊上去充数。 */
function canScore(m){
  if(!m||!m.w||!m.mu||!m.sg)return false;
  if(m.kind==='proj')return !!m.sites;
  if(m.kind==='ds')return !!(m.featK&&m.featK.length);
  return false;
}
/* 上传表的列名和项目字段常常只差一个单位后缀（dTm_℃ ↔ dTm、kd_pM ↔ kd）。
   按前缀对，长字段优先，不然 kd 会把 kdApp 也认领走。 */
/* 有几列不是测量值，是候选自身的属性，而且两边名字不一样。
   只列真的对得上的那几个：对不上就让它打不了分，
   也不拿一个「差不多」的列顶上去——顶错了分数照样出得来，错得还看不出来。 */
const COL_ALIAS={round:'firstRound'};
function fieldOfCol(col){
  const c=String(col||'').toLowerCase();
  return Object.keys(FIELD).filter(k=>c.indexOf(String(k).toLowerCase())===0)
    .sort((a,b)=>b.length-a.length)[0]||null;
}
/* 这个打分器为什么用不了——要能说出口，不能只是在界面上少一行。 */
function whyNoScore(m){
  if(!m)return '没有这个模型';
  if(m.st==='failed')return m.why||'训练失败';
  if(!m.w)return '没有权重，训练没走完';
  if(m.kind==='ds'&&!(m.featK&&m.featK.length))
    return '这是用上传数据集训的，但没记下用了哪几列特征，补不回来';
  if(m.kind!=='proj'&&m.kind!=='ds')return '训练方式没记全，认不出该怎么取特征';
  return m.why||'缺少打分需要的参数';
}
/* 自己训出来的模型，启用之后就是一个可调用的打分器：
   对话里 @ 得到，设计任务排序时也能选它。
   能启用的前提是它真的能打分（canScore）——没有权重的模型挂上去只是个名字。
   启用状态单独存一份，不混进工具表和数据源表（R124：别让一个名字指两样东西）。 */
function MDL_ON(){return LS.get('mdlon',[])}
function mdlOn(id){return MDL_ON().indexOf(id)>=0}
function toggleMdl(id){const L=MDL_ON(),i=L.indexOf(id);
  if(i>=0)L.splice(i,1);else L.push(id);
  LS.set('mdlon',L);return i<0}
/* 跨项目把已启用、且真能打分的模型取出来 */
function MY_TOOLS(){
  const out=[];
  DB.projects.forEach(p=>PMODELS(p.id).forEach(m=>{
    if(mdlOn(m.id)&&canScore(m))out.push(Object.assign({_pid:p.id,_pn:p.name},m));
  }));
  return out;
}
function scoreWith(m,c){
  if(!canScore(m))return null;
  if(m.kind==='ds'){
    const v=[1];
    for(const k of m.featK){
      const f=fieldOfCol(k);
      let x=f?mv(c,f):null;
      if(x==null&&c&&c[k]!=null)x=c[k];
      if(x==null&&c&&COL_ALIAS[k]&&c[COL_ALIAS[k]]!=null)x=c[COL_ALIAS[k]];
      if(x==null||!isFinite(+x))return null;      // 测不全就不打分
      v.push(+x);
    }
    if(v.length!==m.w.length)return null;
    let t=0;
    for(let j=0;j<v.length;j++){
      const zz=j?(v[j]-m.mu[j])/(m.sg[j]||1):1;
      if(!isFinite(zz))return null;
      t+=zz*m.w[j];
    }
    return isFinite(t)?t:null;
  }
  const wt=PRJ_WT[m.pid||S.pid]||PRJ_WT[S.pid]||'';
  /* featOf 返回的就是特征数组本身。trainRun 里把它装进 {base:...} 是那边的包装，
     这里别跟着多取一层——取错了只会在打分时炸，训练时看不出来。 */
  const f=featOf(c,wt); if(!f)return null;
  const ms=mutsOf(c).map(parseMut).filter(m=>m&&isFinite(m.pos));
  const v=f.slice();
  m.sites.forEach(pp=>v.push(ms.some(x=>x.pos===pp)?1:0));
  v.push(ms.some(x=>m.sites.indexOf(x.pos)<0)?1:0);
  if(v.length!==m.w.length)return null;
  let t=0;
  for(let k=0;k<v.length;k++){
    const zz=k?(v[k]-m.mu[k])/(m.sg[k]||1):1;
    if(!isFinite(zz))return null;
    t+=zz*m.w[k];
  }
  return isFinite(t)?t:null;
}
function verdictOf(r){
  const bs=r.base||[];
  if(!bs.length)return {winR:null,winS:null,vd:'没比基线'};
  const best=Math.min.apply(null,bs.map(b=>b.rmse));
  const bestRho=Math.max.apply(null,[0].concat(bs.filter(b=>b.rho!=null).map(b=>Math.abs(b.rho))));
  const winR=r.rmse<best, winS=Math.abs(r.rho)>bestRho;
  return {winR:winR,winS:winS,
    vd:winR&&winS?'都赢了':winS?'排序赢':winR?'误差赢':'没赢基线'};
}
function diagOf(r){
  const b1=(r.base||[]).find(x=>x.rho!=null);
  const D=(r.cols||[]).length, ratio=r.nTrain?(D/r.nTrain):0;
  if(b1&&b1.rmse<r.rmse&&Math.abs(b1.rho)>Math.abs(r.rho)){
    return `但特征本身不是没用：只用 ${esc((b1.n.match(/（(.+?)，/)||[])[1]||'单个特征')} 一个`
      +`就能到 ρ=${b1.rho.toFixed(3)}、RMSE=${b1.rmse.toFixed(3)}，都比这个模型好。`
      +`${D} 个特征配 ${r.nTrain} 条训练样本（${ratio.toFixed(2)} 个特征/条），`
      +`多出来的那些特征是在学噪声。先减特征或者把 λ 往上调，别急着加数据。`;
  }
  if(b1&&Math.abs(b1.rho)<0.2){
    return `最好的单特征也只有 ρ=${b1.rho.toFixed(3)}，说明现有这几个计算量和 `
      +`${esc(r.target)} 之间本来就没什么关系。换特征，或者换一个更接近计算量的预测目标。`;
  }
  return `现在只有 ${r.n} 条带实测值的候选，${r.nTest} 条在留出集里——`
    +`这个规模下留出指标本身的波动就很大。先回流一批实测再训。`;
}

CARD.metric=c=>{
  const r=c.r, bs=r.base||[];
  const best=bs.length?Math.min.apply(null,bs.map(b=>b.rmse)):Infinity;
  const bestRho=Math.max.apply(null,[0].concat(bs.filter(b=>b.rho!=null).map(b=>Math.abs(b.rho))));
  /* 排序赢没赢、误差赢没赢，是两件事。拿它去挑下一批候选，看的是排序；
     拿它去预报一个数，看的才是误差。所以分开判，不合成一个「好/不好」。 */
  const winR=r.rmse<best, winS=Math.abs(r.rho)>bestRho, win=winR&&winS;
  const row=(n,rmse,rho,me)=>`<tr${me?' class="is-me"':''}>
    <td class="t-sm">${esc(n)}</td>
    <td class="t-sm num">${rmse.toFixed(3)}</td>
    <td class="t-sm num">${r.sd?(rmse/r.sd).toFixed(2):'—'}</td>
    <td class="t-sm num">${rho==null?'—':rho.toFixed(3)}</td></tr>`;
  return `<div class="kard-h"><strong class="t-md">留出集上的表现</strong>
    <span class="grow"></span><span class="t-xs mut2 num">${r.nTrain} 训 / ${r.nTest} 留出</span></div>
  <div class="kard-b col" style="gap:var(--s4)">
    <div class="kstat">
      <span><b class="sv num">${r.rho.toFixed(3)}</b><b class="sk">Spearman ρ</b></span>
      <span><b class="sv num">${r.rmse.toFixed(3)}</b><b class="sk">RMSE</b></span>
      <span><b class="sv num">${r.n}</b><b class="sk">可用样本</b></span>
      <span><b class="sv num">${r.lam}</b><b class="sk">λ${
        r.lamBy?'（'+esc(r.lamBy.replace(/（.*/,''))+'）':(r.cv?'（交叉验证选）':'（手填）')}</b></span>
    </div>
    ${r.base&&r.base.length?`<div class="col" style="gap:var(--s2)">
      <span class="lbl">和基线比</span>
      <div class="tbl-wrap is-prev"><table><caption class="vh">模型与基线在同一个留出集上的对比</caption>
        <thead><tr><th scope="col">模型</th><th scope="col">RMSE</th>
          <th scope="col">÷留出集 SD</th><th scope="col">ρ</th></tr></thead>
        <tbody>${row('这次训的模型',r.rmse,r.rho,1)}
          ${r.base.map(b=>row(b.n,b.rmse,b.rho,0)).join('')}</tbody></table></div>
      <p class="t-sm ${win||winS?'mut':''}" style="margin:0${win||winS?'':';color:var(--err)'}">
        ${win
          ?`它在排序和误差上都赢过了两条基线。RMSE 是留出集标准差的 ${(r.rmse/r.sd).toFixed(2)} 倍，`
            +`${r.rmse<r.sd?'低于 1，说明确实学到了东西。':'仍然不低于 1，提升有限。'}`
          :winS
          ?`<b>排序赢了，误差没赢。</b>ρ=${r.rho.toFixed(3)} 高过最好的基线（${bestRho.toFixed(3)}），`
            +`但 RMSE ${r.rmse.toFixed(3)} 还高于基线的 ${best.toFixed(3)}。`
            +`这两件事用途不同：拿它<b>排候选、挑下一批送检</b>是可以的，排序本来就只看相对高低；`
            +`拿它<b>预报某一条具体能到多少</b>还不行，数值会偏。`
          :winR
          ?`<b>误差赢了，排序没赢。</b>RMSE 比基线低，但 ρ=${r.rho.toFixed(3)} 没超过基线的 `
            +`${bestRho.toFixed(3)}——它把值压向均值，所以误差小，但分不出高低。挑候选别用它。`
          :`<b>它没有赢过基线。</b>RMSE 是留出集标准差的 ${(r.rmse/r.sd).toFixed(2)} 倍，`
            +`这个 ρ 不能当成「模型有用」的依据。${diagOf(r)}`}</p>
    </div>`:''}
    <span class="t-xs mut2">${r.featNote||('学的是「用实测值校准计算打分」：特征是候选身上已有的 ipTM、自洽 RMSD、'
      +'可开发性，加上突变的理化变化量（Kyte–Doolittle 疏水性、Zamyatnin 体积、净电荷），'
      +'再加 '+r.nSite+' 个高频位点的身份——位点表只从训练集统计，不然留出集的信息会提前漏进模型。')}</span>
  </div>`};

/* 这张图说明什么，取决于点真的落在哪儿——所以这句话是算出来的，不是写死的。 */
function scatNote(P,A){
  const sdOf=v=>{const m=v.reduce((a,b)=>a+b,0)/v.length;
    return Math.sqrt(v.reduce((t,x)=>t+(x-m)*(x-m),0)/v.length)};
  const sp=sdOf(P), sa=sdOf(A);
  if(!(sa>0))return '留出集里这个字段的实测值全都一样，这张图看不出东西。';
  const k=sp/sa;
  if(k<0.35)return `预测值的离散度只有实测的 ${(k*100).toFixed(0)}%——点挤在竖线附近，`
    +`模型把每一条都预测成差不多的值，排序上几乎没有分辨力。`;
  if(k>1.6)return `预测值的离散度是实测的 ${k.toFixed(2)} 倍——模型把差异放大了，`
    +`极端值会被高估。看点有没有系统性地偏在虚线的某一侧。`;
  return `预测值的离散度和实测相当（${k.toFixed(2)} 倍）。`
    +`点离虚线越近越准；成片偏在虚线一侧就是系统性高估或低估，那是 ρ 看不出来的。`;
}

/* 火山图。每个点都是算出来的：x 是 log2FC，y 是 −log10(p)。
   两条阈值线要画出来——没有它们，读者看不出「显著」是按什么划的。
   被独立过滤剔掉的基因不画：它们没有 padj，混在里面会让人以为它们只是不显著。 */
CARD.vol=c=>{
  const A=(c.all||[]).filter(x=>x.q!=null&&isFinite(x.lfc)&&x.p>0);
  if(!A.length)return '';
  const lf=A.map(x=>x.lfc), ly=A.map(x=>-Math.log10(x.p));
  /* 一个离群点能把横轴撑到 ±6，其余几百个点全挤在中间一条缝里。
     按 99 分位定轴，超出的点画在边界上并标出来——不是把它们藏掉，
     是不让一个点决定所有点的可读性。 */
  const absS=lf.map(Math.abs).sort((a,b)=>a-b);
  const p99=absS[Math.min(absS.length-1,Math.floor(absS.length*0.99))];
  let xm=Math.max(c.lfcT*1.4,p99);
  xm=Math.max(1,Math.ceil(xm*10)/10);
  const over=lf.filter(v=>Math.abs(v)>xm).length;
  const clamp=v=>Math.max(-xm,Math.min(xm,v));
  const ymax=Math.max(1,Math.max.apply(null,ly));
  /* 几百个点挤在 28rem 里看不出聚簇，这张图要占满卡片。
     底边留 32：刻度和轴标题两行字要放得下，不能贴着画布边缘。 */
  const W=420,H=230,ML=34,MB=32;
  const sx=v=>ML+(v+xm)/(2*xm)*(W-ML-8);
  const sy=v=>H-MB-(v/ymax)*(H-MB-10);
  const sig=x=>x.q<c.padj&&Math.abs(x.lfc)>=c.lfcT;
  const pt=x=>{const s2=sig(x), out=Math.abs(x.lfc)>xm;
    return `<circle cx="${sx(clamp(x.lfc)).toFixed(1)}" cy="${sy(-Math.log10(x.p)).toFixed(1)}"
      r="${s2?2.6:2}" fill="${s2?(x.lfc>0?'var(--err)':'var(--dry)'):'var(--ink-4)'}"
      fill-opacity="${s2?.72:.28}"${out?' stroke="var(--ink-3)" stroke-width=".8"':''}/>`};
  /* p 阈值那条横线：取显著里最大的 p，也就是 padj 刚好压线的那个位置 */
  const atP=A.filter(sig).reduce((m,x)=>Math.max(m,x.p),0);
  const yline=atP>0?sy(-Math.log10(atP)):null;
  /* 最边上那两个刻度用 start / end 对齐，居中会把字顶到画布外面裁掉。
     v 必须是数字：传格式化过的字符串进来，"-2.1"+xm 会变成字符串拼接，
     算出 NaN，两个刻度就一起画到了 x=0。 */
  const tick=(v,an)=>`<text x="${sx(+v).toFixed(1)}" y="${H-MB+14}" font-size="9"
    fill="var(--ink-4)" text-anchor="${an||'middle'}">${(+v).toFixed(1)}</text>`;
  return `<div class="kard-h"><strong class="t-md">火山图</strong>
    <span class="t-xs mut2">对照 ${c.nC} vs 处理 ${c.nT}</span>
    <span class="grow"></span><span class="t-xs mut2 num">${A.length} 个基因</span></div>
  <div class="kard-b col" style="gap:var(--s3)">
    <svg viewBox="0 0 ${W} ${H}" class="scat is-wide" role="img"
      aria-label="火山图：横轴 log2 倍数变化，纵轴 −log10 p 值，两条虚线是显著性阈值">
      <line x1="${ML}" y1="${H-MB}" x2="${W-8}" y2="${H-MB}" stroke="var(--line)"/>
      <line x1="${ML}" y1="${H-MB}" x2="${ML}" y2="10" stroke="var(--line)"/>
      ${[-c.lfcT,c.lfcT].filter(v=>Math.abs(v)<=xm&&c.lfcT>0).map(v=>
        `<line x1="${sx(v).toFixed(1)}" y1="10" x2="${sx(v).toFixed(1)}" y2="${H-MB}"
          stroke="var(--ink-4)" stroke-dasharray="3 3" opacity=".5"/>`).join('')}
      ${yline!=null?`<line x1="${ML}" y1="${yline.toFixed(1)}" x2="${W-8}" y2="${yline.toFixed(1)}"
        stroke="var(--ink-4)" stroke-dasharray="3 3" opacity=".5"/>`:''}
      ${A.map(pt).join('')}
      ${tick(-xm,'start')}${tick(0)}${tick(xm,'end')}
      <text x="${(W/2).toFixed(0)}" y="${H-5}" font-size="9" fill="var(--ink-3)"
        text-anchor="middle">log2 倍数变化（处理 ÷ 对照）</text>
      <text transform="translate(11 ${((H-MB)/2).toFixed(0)}) rotate(-90)" font-size="9"
        fill="var(--ink-3)" text-anchor="middle">−log10 p</text>
    </svg>
    <div class="row wrap t-xs mut2" style="gap:var(--s4)">
      <span><i class="vk" style="background:var(--err)"></i>上调 ${c.up}</span>
      <span><i class="vk" style="background:var(--dry)"></i>下调 ${c.down}</span>
      <span><i class="vk" style="background:var(--ink-4);opacity:.4"></i>不显著</span>
      <span class="grow"></span>
      <span>${yline!=null?`虚线＝padj &lt; ${c.padj} 与 |log2FC| ≥ ${c.lfcT}`
        :`没有基因过 padj &lt; ${c.padj}，所以画不出那条横线`}</span></div>
    <span class="t-xs mut2">图上只画进了 BH 校正的 ${c.kept} 个基因。
      被过滤的基因没有 padj，不在图中。
      ${over?`横轴按 99 分位定在 ±${xm.toFixed(1)}，有 ${over} 个点的 |log2FC| 超出这个范围，
        画在边界上并描了一圈边——它们的真值在产出文件里。`:''}</span>
  </div>`;
};

/* 预测 vs 实测。对角线必须画：没有它，一张看着挺挤的散点可以掩盖系统性高估。
   点是留出集上真算出来的，不是示意。 */
CARD.scat=c=>{
  const P=c.pred||[], A=c.act||[];
  if(!P.length)return '';
  const all=P.concat(A);
  let lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  if(!(hi>lo)){hi=lo+1}
  const pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  const W=320,H=200,M=28;
  const sx=v=>M+(v-lo)/(hi-lo)*(W-M-6);
  const sy=v=>H-M-(v-lo)/(hi-lo)*(H-M-6);
  const pts=P.map((v,i)=>`<circle cx="${sx(v).toFixed(1)}" cy="${sy(A[i]).toFixed(1)}" r="3"
    fill="var(--dry)" fill-opacity=".45" stroke="var(--dry)" stroke-opacity=".7" stroke-width="1"/>`).join('');
  const tick=v=>`<text x="${sx(v).toFixed(1)}" y="${H-M+13}" font-size="9"
      fill="var(--ink-4)" text-anchor="middle">${v.toFixed(1)}</text>
    <text x="${M-5}" y="${(sy(v)+3).toFixed(1)}" font-size="9"
      fill="var(--ink-4)" text-anchor="end">${v.toFixed(1)}</text>`;
  const t1=lo+(hi-lo)*0.15, t2=lo+(hi-lo)*0.5, t3=lo+(hi-lo)*0.85;
  return `<div class="kard-h"><strong class="t-md">预测 vs 实测（留出集）</strong>
    <span class="grow"></span><span class="t-xs mut2 num">${P.length} 点</span></div>
  <div class="kard-b col" style="gap:var(--s3)">
    <svg viewBox="0 0 ${W} ${H}" class="scat" role="img"
      aria-label="留出集上每个样本的预测值与实测值，对角线是完全准确的参考线">
      <line x1="${M}" y1="${H-M}" x2="${W-6}" y2="${H-M}" stroke="var(--line)" stroke-width="1"/>
      <line x1="${M}" y1="${H-M}" x2="${M}" y2="6" stroke="var(--line)" stroke-width="1"/>
      <line x1="${sx(lo).toFixed(1)}" y1="${sy(lo).toFixed(1)}"
            x2="${sx(hi).toFixed(1)}" y2="${sy(hi).toFixed(1)}"
            stroke="var(--ink-4)" stroke-dasharray="4 4" stroke-width="1" opacity=".65"/>
      ${c.mean!=null?`<line x1="${sx(c.mean).toFixed(1)}" y1="6"
            x2="${sx(c.mean).toFixed(1)}" y2="${H-M}"
            stroke="var(--wet-dim)" stroke-width="1" opacity=".8"/>`:''}
      ${pts}${tick(t1)}${tick(t2)}${tick(t3)}
      <text x="${(W/2).toFixed(0)}" y="${H-4}" font-size="9" fill="var(--ink-3)"
        text-anchor="middle">预测 ${esc(c.target||'')}</text>
      <text x="10" y="14" font-size="9" fill="var(--ink-3)">实测</text>
    </svg>
    <div class="row wrap t-xs mut2" style="gap:var(--s4)">
      <span><i class="sc-k is-d"></i>虚线＝完全准确</span>
      ${c.mean!=null?`<span><i class="sc-k is-m"></i>竖线＝训练集均值（常数基线预测的就是它）</span>`:''}
    </div>
    <span class="t-xs mut2">${scatNote(P,A)}</span>
  </div>`;
};

CARD.batch=c=>`<div class="kard-h"><strong class="t-md">送检批次</strong>
    <span class="grow"></span><span class="chip c-wet">待提交</span></div>
  <div class="kard-b col" style="gap:var(--s3)">
    <div class="kstat">
      <span><b class="sv num">${c.n}</b><b class="sk">送检条数</b></span>
      <span><b class="sv" style="font-size:0.875rem">${esc(c.reps)}</b><b class="sk">重复</b></span>
      <span><b class="sv" style="font-size:0.875rem">${esc(c.proto.days)}</b><b class="sk">周期</b></span>
    </div>
    <div class="col" style="gap:4px"><span class="lbl">配方必填项</span>
      ${c.proto.need.map(x=>`<span class="t-sm mut">· ${esc(x)}</span>`).join('')}</div>
    <span class="t-xs mut2">${esc(c.proto.d)}</span>
  </div>`;

/* ================= 发送 =================
   一句话进来：先路由，再按剧本出卡。路由不确定时才问模型，
   而且只让它在六条能力里选一个，选不出就照实说「没看懂」。 */
/* 思考过程。写的是**真的发生了什么**：
   路由是按关键词长度打分选出来的，所以这里列的就是命中的那几个词和分数；
   要填什么是 FLOW 自己定的，所以这里数的就是它真的要几项。
   不编一段「我在仔细考虑」的话——那种 CoT 只是把一次确定性查表说得像在思考。 */
/* ---- 一次回答的执行轨迹 ----
   照 Claude Code 那套：一次回答是一串可以展开的步骤，每一步自己说自己做了什么。
   三条规矩，和这个产品其它地方一致：
   1. 步骤**跑完才写**，不是先画五步再逐个点亮。没发生的步骤不出现。
   2. 没跑成的那一步留在原地，写明停在哪儿；不是整段消失。
   3. 数字只在「计算」那一步产生。模型那一步只把话说顺，不产生任何数字。
   耗时是 now() 真量的，不是估的（R17）。 */
const TRACE={cur:null};
function traceBegin(){TRACE.cur={steps:[],t0:now()};return TRACE.cur}
/* k：think 判断 / ctx 上下文 / model 模型 / tool 工具 / calc 计算 / write 成稿
   st：ok / err / skip　io：[[名,值],…]　ms：真量到的毫秒 */
function traceStep(o){if(TRACE.cur)TRACE.cur.steps.push(o);return o}
/* 取走当前轨迹做成一张卡。没有步骤就不出卡——空壳比没有更糟。 */
function traceTake(){
  const t=TRACE.cur;TRACE.cur=null;
  if(!t||!t.steps.length)return null;
  return mkCard('cot',{steps:t.steps});
}
/* 表头上的总时长＝各步真量到的耗时之和。
   不用墙上时间：运行卡那几秒分步动画是故意放慢给人看的，
   把它算进去等于把一段人为的等待说成计算开销。 */
function traceMs(st){let k=0,has=0;
  (st||[]).forEach(x=>{if(x&&typeof x.ms==='number'){k+=x.ms;has=1}});
  return has?k:null}
/* 前缀只在它真的多说了一件事的时候才给。「成稿 · 成稿」是把同一个词念两遍。 */
const TRACE_K={think:'判断',exec:'执行',ctx:'上下文',model:'模型',tool:'工具',
  calc:'计算',out:'',write:''};
/* 绑定的课题此刻有什么。这一步是真的去数的，不是复述提示词。 */
function traceCtx(){
  const pid=S.bind||S.pid, p=DB.projects.find(x=>x.id===pid);
  const t0=now();
  if(!p){traceStep({k:'ctx',n:'读取上下文',st:'skip',ms:Math.round(now()-t0),
    d:'没有绑定课题，只能答和课题无关的部分'});return}
  const was=S.pid;S.pid=p.id;
  const cs=CANDS(), fs=projFields(p);
  const withY=cs.filter(c=>fs.some(k=>mv(c,k)!=null)).length;
  const mdl=PMODELS(p.id).filter(m=>m.st!=='failed').length;
  S.pid=was;
  traceStep({k:'ctx',n:'读取上下文',st:'ok',ms:Math.round(now()-t0),
    d:p.name+'　第 '+p.rounds.length+' 轮',
    io:[['候选',cs.length+' 条，其中 '+withY+' 条有实测值'],
        ['模型',mdl?mdl+' 个训好的':'还没有训好的模型']]});
}
function cotOf(txt,r,cap,forced,pinned,stray){
  const a=ABIL_OF(cap);if(!a)return null;
  const t0=now();
  let why;
  if(forced)why='你在输入框里挂了「'+forced.n+'」，所以不走关键词路由';
  else if(pinned)why='「'+pinned.n+'」只接在「'+(ABIL_OF(pinned.cap)||{}).n
    +'」的「'+pinned.node.n+'」这一段上，所以走这条，并且这一段用它跑';
  else if(stray)why='挂的「'+stray+'」不是多段流程里的某一段，改不了路由，'
    +'这句话还是按它自己归类';
  else if(r.obj&&r.obj.length)why='认出对象 '+r.obj.map(k=>'「'+k+'」').join('')
    +(r.verb&&r.verb.length?'，动作 '+r.verb.map(k=>'「'+k+'」').join(''):'');
  else if(r.verb&&r.verb.length)why='只认出动作 '
    +r.verb.map(k=>'「'+k+'」').join('')+'，没有点名对象';
  else why='没有命中关键词';
  const g=r.fields||{};
  const got=Object.keys(g).filter(k=>g[k]!=null&&g[k]!=='');
  traceStep({k:'think',n:'归到「'+a.n+'」',st:'ok',ms:Math.round(now()-t0),d:why,
    io:[['捞到',got.length
      ?got.map(k=>({acc:'登录号',pdb:'PDB 号',seq:'序列',n:'条数',ds:'数据集'}[k]||k)
        +' '+String(g[k]).slice(0,24)).join('　')
      :'这句话里没有能直接用的字段，下面的表单会问']]});
  traceCtx();
  /* 挂了一个执行体还没接的工具：这一步不会跑。说出来，别假装调过。 */
  if(pinned){const tt=toolBy(pinned.n);
    if(tt&&tt.ok===0)traceStep({k:'tool',n:pinned.n,st:'skip',
      d:tt.why||'只登记了接口，执行体还没接，这一步不会真的跑'});}
  return null;
}
/* 旧格式是 [名,值] 的二元组，新格式是对象。老消息不重画，所以两种都要认。 */
function cotRow(x){
  if(Array.isArray(x))return `<div class="cot-r">
    <span class="t-xs mut2">${esc(x[0])}</span>
    <span class="t-sm">${esc(x[1])}</span></div>`;
  const st=x.st==='err'?' is-err':x.st==='skip'?' is-skip':'';
  const ms=x.st==='skip'?'跳过':(x.ms==null?'':x.ms+' ms');
  return `<div class="cot-s${st}">
    <span class="cot-i" aria-hidden="true"></span>
    <span class="cot-n"><span class="cot-k">${esc(TRACE_K[x.k]||'')}</span>${esc(x.n)}</span>
    <span class="cot-ms num">${esc(ms)}</span>
    ${x.d||(x.io&&x.io.length)?`<span class="cot-x">
      ${x.d?`<span class="t-sm mut">${esc(x.d)}</span>`:''}
      ${(x.io||[]).filter(p=>p&&p[1]!=null&&p[1]!=='').map(p=>`<span class="cot-io">
        <span class="t-xs mut2">${esc(p[0])}</span>
        <span class="t-xs num">${esc(String(p[1]))}</span></span>`).join('')}
    </span>`:''}
  </div>`;
}
CARD.cot=c=>`<div class="cot">
  <button class="cot-t" type="button" data-act="cottoggle" data-id="${c.id}"
    aria-expanded="${c.open?'true':'false'}">
    <span class="car" aria-hidden="true"></span>执行过程
    <span class="t-xs mut2">${c.steps.length} 步${(()=>{const t=traceMs(c.steps);
      return t==null?'':'　'+t+' ms'})()}</span></button>
  ${c.open?`<div class="cot-b">${c.steps.map(cotRow).join('')}</div>`:''}
</div>`;
/* @ 挂上来的可能是一条能力，也可能是注册表里的一个工具。
   能力直接决定走哪条路；工具不是一条路，它是某条路里的某一段——
   所以要找出它能接在哪条流程的哪一段上，把那一段钉成它。
   接不上的（比如 UniProt 取序，它不在任何一条多段流程里）就老实说没改路由。 */
function abilForTool(n){
  if(!toolBy(n))return null;
  const keys=Object.keys(PIPE||{});
  for(let i=0;i<keys.length;i++){
    const cap=keys[i],nodes=PIPE[cap]||[];
    for(let j=0;j<nodes.length;j++){
      if(nodeTools(cap,nodes[j].id).some(t=>t.n===n))return {cap:cap,node:nodes[j]};
    }
  }
  return null;
}
/* ---------------- 给模型的话 ----------------
   两处用到模型：给这句话归类、以及归不了类时直接回答。两处共用一段「你是谁」。
   开头那三条是这个产品和一个通用聊天机器人的全部区别，所以放最前面。

   **提示词现场从 ABIL 拼，不手写副本。**
   手写副本的下场已经吃过两次（R142、R153）：加一条能力、改一个名字，
   提示词还停在上一版，模型按旧清单分类，错得还很自信。
   所以「什么时候该选这条」那句话长在 ABIL 的 when 字段上——
   加能力的人必须顺手写它，否则提示词里那一条就是空的，一眼看得见。

   排列顺序也是有意的：一成不变的那一大段在前，随课题变的那一行在最后。
   DeepSeek 对命中缓存的前缀便宜一个数量级，这么排等于每一轮少花一笔钱。 */
const SYS_BASE=
 '你是「端砚 · 生命科学」里的科研助手，面对的是正在做蛋白工程的研究员。\n'
+'三条硬规矩：\n'
+'1. 所有数字、统计量、打分结果都由本机程序算出。你不产生任何数字。\n'
+'2. 不知道就说不知道，并指出要先做哪一步才会知道。不推测，不补文献。\n'
+'3. 你不替研究员做决定，只把情况讲清楚。';

/* 路由提示词。这是个**分类器**，不是聊天——所以温度必须是 0。
   0.2 的温度下同一句话会落到不同能力上，用户看到的就是「定位点变来变去」。 */
function sysRoute(){
  return SYS_BASE+researchAgentContext()+'\n\n'
   +'现在只做一件事：把研究员这句话归到下面 '+ABIL.length+' 条能力中的一条，或者归到 none。\n\n'
   +ABIL.map(a=>'  '+a.id+'（'+a.n+'）：'+(a.when||'【这条能力还没写 when，按名字判】')
       +'　例：「'+a.eg+'」').join('\n')+'\n'
   +'  none：这句话不是要做上面任何一件事，而是在问这个课题现在怎么样、'
   +'下一步该干什么、某个结果说明了什么。\n\n'
   +'容易混的几对，按这几条判：\n'
   +'  · 亲和力、热稳、KD、Tm 是要测的性质。出现它们通常是 lab（拿去测），不是 des（设计）。\n'
   +'  · 「候选」出现在送检、排期、测一测这类句子里，指的是实验材料，不是要设计新的。\n'
   +'  · 「数据集」「训练集」是对象，归 dset；「训一个」「微调」是动作，归 train。\n'
   +'  · deg 是比较两组表达量，des 是生成新序列，dset 是把表格建成数据集。三者不要混。\n'
   +'  · 问「有哪些文件」「把它下下来」归 file；问「这个课题现在怎么样」归 none。\n'
   +'  · 拿不准的时候选 none。选错一条能力会弹出一张用不上的表单，\n'
   +'    选 none 只是改成直接回答，代价小得多。\n\n'
   +'只输出一个词：上面 '+ABIL.length+' 个 id 之一，或者 none。不要解释，不要标点，不要引号。';
}

/* 归不了类的那一句，交给模型直接答。
   和分类器用同一段人设，但多给它两样东西：本机算好的事实，以及能力清单——
   研究员问的往往其实是「这件事能不能做」，答得出来就该顺手告诉他走哪条。 */
function sysAsk(){
  return SYS_BASE+researchAgentContext()+'\n\n'
   +'研究员这句话不对应任何一条流程，由你直接回答。\n'
   +'下面是这个课题此刻的真实数据，全部由本机算出。只许根据这些数据回答；\n'
   +'数据里没有的，直接说这里没有这个数，并指出要先做哪一步才会有。\n'
   +'如果他其实是想做某件事，告诉他可以走哪条能力：'+ABIL.map(a=>a.n).join('、')+'。\n'
   +'用中文，三到六句，不要列表，不要复述问题，不要客套话。\n\n'
   +'【这个课题此刻的数据】\n'+ctxBrief();
}
/* 上一轮停在哪条能力上。「再跑一次」「换个参数」要靠它才有指代。 */
function lastCap(){
  const L=convOf();
  /* 从最后一轮往回找，只翻到上一句用户发言为止——
     再往前就是另一个话题了，拿它当指代反而把人带偏。 */
  for(let i=L.length-1;i>=0;i--){
    if(L[i].role==='ai'&&L[i].cap&&ABIL_OF(L[i].cap))return ABIL_OF(L[i].cap);
    if(L[i].role==='me'&&i<L.length-1)break;
  }
  return null;
}

function agentSend(){
  const ta=document.getElementById('ask');
  let txt=((ta&&ta.value)||S.ask||'').trim();
  if(!txt){toast('请输入内容');if(ta)ta.focus();return}
  /* @ 引用的资料接在这句话后面一起带出去 */
  if((S.useDocs||[]).length)txt+='　'+S.useDocs.map(n=>'「'+n+'」').join('');
  S.useDocs=[];
  push({role:'me',text:txt});
  /* 挂在输入框上的技能要先读出来再清空。反过来写的话，
     @ 挂的技能永远是空的，挂了等于没挂。 */
  const picked=(S.useTools||[]).slice();
  const forced=picked.map(n=>ABIL.find(a=>a.n===n)).filter(Boolean)[0];
  /* 挂的是工具而不是能力：找出它接在哪条流程的哪一段上 */
  let pinned=null;
  if(!forced)picked.forEach(n=>{if(pinned)return;const f=abilForTool(n);
    if(f){pinned={n:n,cap:f.cap,node:f.node};setNodePick(f.cap,f.node.id,n)}});
  const stray=(!forced&&!pinned)?picked.filter(n=>toolBy(n))[0]:null;
  S.ask='';S.useTools=[];
  traceBegin();
  const r=routeIntent(txt);
  const cap=forced?forced.id:(pinned?pinned.cap:r.cap);
  if(cap&&FLOW[cap]){
    const a=ABIL_OF(cap);
    render();scrollEnd();
    cotOf(txt,r,cap,forced,pinned,stray);
    const cards=FLOW[cap](r.fields);
    traceStep({k:'out',n:'出表单',st:'ok',
      d:'要填的项由这条能力自己定，不是我现编的',
      io:[['产出',(cards||[]).length+' 张卡']]});
    say(a.say,cards,null,traceTake()).cap=cap;
    return;
  }
  /* 关键词没分出胜负，才去问模型这句话归哪一类。 */
  traceStep({k:'think',n:'关键词没分出胜负',st:'ok',
    d:'没有一条能力明显命中，交给模型归类'});
  traceCtx();
  const tr0=TRACE.cur;
  push({role:'ai',text:'让我想一下这句话该归到哪条能力…'});
  render();scrollEnd();
  const lc=lastCap();
  MC.chat([{role:'system',content:sysRoute()
      +(lc?'\n\n（上一步他在做：'+lc.n+'。「再跑一次」「换个参数」多半还指这件事。）':'')},
    {role:'user',content:txt}],{max:8,temp:0}).then(res=>{
    const L=convOf();L.pop();
    TRACE.cur=tr0;
    const k=String(res.text||'').trim().toLowerCase().replace(/[^a-z]/g,'');
    const a=ABIL_OF(k);
    if(a&&FLOW[a.id]){
      traceStep({k:'think',n:'归到「'+a.n+'」',st:'ok',d:'模型给的归类'});
      say(a.say,FLOW[a.id](r.fields)).cap=a.id;
    }
    else freeAsk(txt,stray);
  }).catch(e=>{
    const L=convOf();L.pop();
    TRACE.cur=tr0;
    /* 这里不把 Failed to fetch 原样端出来：用户修不了它，
       他需要知道的是「我这句话没被送出去」和「换种说法还能走」。 */
    const hint='可以直接说要做的事，比如「检索和这条序列同源的条目」「从 R'+(S.round||1)+' 选 24 条送去测」「用实测数据训一个打分模型」。';
    if(String(e.message||e)==='NOKEY'){say(modelErr(e)+hint);return}
    say((stray?'已选的「'+stray+'」不属于任何流程步骤，不影响任务分配。':'')
      +'这句话没送出去：模型服务暂时无法连接，未执行任何操作。'+hint);
  });
}

/* ---- 不走流程的那一句话 ----
   研究员真正常问的是「这一轮还能不能再往上推」「哪条最值得送检」「KD 掉了多少」——
   这些不对应某个按钮，但答案就在已经算出来的数里。
   所以把本机算好的事实整理成一段文本喂给模型，让它只用这些数回答：
   **数全是本机算的，模型只负责把它们说成人话**；
   给不出来就说给不出来，不许补一个数字进去（R3）。 */
function ctxBrief(){
  const pid=S.bind||S.pid;
  const p=DB.projects.find(x=>x.id===pid);
  if(!p)return '现在没有绑定课题。工作空间里的课题有：'
    +DB.projects.map(x=>x.name).join('、')+'。';
  const was=S.pid;S.pid=p.id;
  const cs=CANDS(), fs=projFields(p), L=[];
  L.push('课题：'+p.name+'（研究对象 '+p.target+'，走到第 '+p.rounds.length+' 轮）');
  L.push('立项目标：'+goalText(p));
  L.push('候选：'+cs.length+' 条，其中 '+cs.filter(c=>fs.some(k=>mv(c,k)!=null)).length+' 条有实测值');
  fs.forEach(k=>{
    const f=FIELD[k]||{}, d=f.dec==null?2:f.dec;
    const v=cs.map(c=>mv(c,k)).filter(x=>x!=null).sort((a,b)=>a-b);
    if(!v.length){L.push((f.n||k)+'：一条实测都还没有');return}
    const med=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
    const best=f.better==='low'?v[0]:v[v.length-1];
    L.push((f.n||k)+'：'+v.length+' 条实测，中位 '+med.toFixed(d)+(f.unit||'')
      +'，最好 '+best.toFixed(d)+(f.unit||'')
      +(f.better==='low'?'（越小越好）':'（越大越好）'));
  });
  BATCHES.filter(b=>b.pid===p.id).forEach(b=>{
    const n=nextStep(b);
    L.push('批次 '+b.id+'（R'+b.round+'，'+b.n+' 条，'+b.vendor+'）：'+statusOf(b.status).n
      +(n?('，下一步「'+n.act+'」在'+n.who):'，没有下一步'));
  });
  PMODELS(p.id).forEach(m=>{
    L.push('打分器 '+(m.name||m.id)+'：'+(canScore(m)
      ?('可用，留出集 Spearman ρ '+(typeof m.rho==='number'?m.rho.toFixed(3):'未评'))
      :'还训不出可用的打分器'));
  });
  S.pid=was;
  return L.join('\n');
}
function freeAsk(txt,stray){
  if(!TRACE.cur)traceBegin();
  traceStep({k:'think',n:'不走流程，直接答',st:'ok',
    d:'这句话不对应任何一条能力，拿本机算好的事实回答'});
  if(!TRACE.cur.steps.some(x=>x.k==='ctx'))traceCtx();
  const tr0=TRACE.cur;
  push({role:'ai',text:'这句话不走某一条流程，我拿这个课题现有的数答一下…'});
  render();scrollEnd();
  MC.chat([{role:'system',content:sysAsk()},
    {role:'user',content:txt}],{max:520,temp:0.1}).then(res=>{
    const L=convOf();L.pop();
    TRACE.cur=tr0;
    const t=String(res.text||'').trim();
    if(!t){say('模型没有返回内容。可以换个说法，或直接说要做的事：'
      +ABIL.map(x=>x.n).join('、')+'。');return}
    say(t);
  }).catch(e=>{
    const L=convOf();L.pop();
    TRACE.cur=tr0;
    const m=String(e.message||e);
    if(m==='NOKEY'){say(modelErr(e)+'也可以直接说要做的事：'
      +ABIL.map(x=>x.n).join('、')+'。');return}
    say((stray?'已选的「'+stray+'」不属于任何流程步骤，不影响任务分配；':'')
      +'这句话没送出去：模型服务暂时无法连接，未执行任何操作。'
      +'可以直接说要做的事：'+ABIL.map(x=>x.n).join('、')+'。');
  });
}

/* ---- 节点选的模型要能写回去，流程卡换模型才算数 ---- */
function setNodePick(cap,id,n){const P=LS.get('nodePick',{});P[cap+'.'+id]=n;LS.set('nodePick',P)}

function PLIST(){
  /* 只按关键词找。项目的状态是从轮次与批次推出来的结果，不是一个要用户去拨的筛选条件——
     研究员不会问「哪些项目是送检中」，他问的是「XX 那个项目在哪」。 */
  const q=(S.pq||'').trim().toLowerCase();
  return DB.projects.filter(p=>{
    if(!q)return true;
    return (p.name+' '+(p.target||'')+' '+goalText(p)+' '+(p.desc||'')).toLowerCase().indexOf(q)>=0;
  });
}
/* 一张项目卡只回答四件事：这是什么项目、它在做什么、手上有什么资源、挂着多少任务。
   以前卡上摆的是 变体 / 已回流 / 当前轮 / 模型——那是项目**内部**的进度读数，
   在列表页看它没有用：要看进度就该点进去。列表页要回答的是「哪个项目是我要的」。 */
function grid(){
  return `<div class="pgrid">`+
  PLIST().map(p=>{const[st,cc]=stateOf(p.state);
    const res=[[(p.kb||[]).length,'资料'],[(p.tools||[]).length,'工具'],
               [(p.arch||[]).length,'归档']].filter(x=>x[0]);
    const nt=TASKS.filter(t=>t.pid===p.id).length;
    return `<button class="pcard ${cc}" type="button" data-proj="${p.id}">
      <span class="pcard-t">
        <strong>${esc(p.name)}</strong>
        <span class="tag">${esc(domOf(p).n)}</span>
        <span class="pcard-st">${st}</span></span>
      <span class="pcard-g">${esc(p.desc||goalText(p))}</span>
      <span class="pcard-f">
        <span class="t-sm mut2">${res.length?res.map(x=>'<b class="num">'+x[0]+'</b> '+x[1]).join(' · '):'还没有资源'}</span>
        <span class="grow"></span>
        <span class="t-sm mut2"><b class="num">${nt}</b> 个任务</span>
      </span>
    </button>`}).join('')+`</div>`;
}

/* ---- 项目页：左边是这个课题攒下来的东西，右边是在这个课题上问的话 ----
   原先这一页是个仪表盘：KPI、轮次、假设、设计、结果、送检堆成一列，
   1440 宽要滚 3400px，中间任何一段都得靠滚找。
   进到一个课题里，研究员真正做的只有两件事：翻这个课题的资料，和就这个课题问一句。
   所以改成两栏，两件事各占一栏，谁也不用滚去找谁。
   右栏不是另一个对话页：它就是这个课题自己的那一段对话（sid = pj:<项目号>），
   换一天回来还在，跟项目走，不跟会话走。 */
function pjSid(pid){return 'pj:'+(pid||S.pid)}
/* 进项目的第一句话。
   它不是问候语——问候语说完人还是不知道从哪下手。
   这一句报的是这个课题此刻真实的状态：第几轮、有几个批次在等谁、
   多少条已回流、有没有能用的打分器，然后给两条真的点得下去的下一步。
   每一条都是数出来的；数不出来的就不说。
   它不进 CONV：状态会变，存下来的开场白第二天就是错的。 */
function pjOpener(p){
  const was=S.pid;S.pid=p.id;
  const cs=CANDS(), fs=projFields(p);
  const meas=cs.filter(c=>fs.some(k=>mv(c,k)!=null)).length;
  const bs=BATCHES.filter(b=>b.pid===p.id);
  const waitMe=bs.filter(b=>{const n=nextStep(b);return n&&n.who==='你'});
  const running=bs.filter(b=>b.status!=='done'&&b.status!=='canceled'&&b.status!=='draft');
  const ms=PMODELS(p.id).filter(canScore);
  const best=ms.slice().sort((a,b)=>Math.abs(b.rho)-Math.abs(a.rho))[0];
  const r=p.rounds.length;
  S.pid=was;
  const bits=[];
  bits.push('现在在 R'+r+'，'+cs.length+' 条候选里有 '+meas+' 条带实测值');
  if(running.length)bits.push(running.length+' 个批次在跑');
  if(waitMe.length)bits.push(waitMe.length+' 个批次等你处理（'+esc(waitMe[0].id)+'　'+esc((nextStep(waitMe[0])||{}).act||'')+'）');
  if(best)bits.push('有一个能用的打分器 '+esc(best.name||best.id)
    +'（留出 ρ '+best.rho.toFixed(3)+(best.rho<=0?'，排序方向相反，暂不建议用于筛选':
      best.rho<0.3?'，偏弱':'')+'）');
  const asks=[];
  if(waitMe.length)asks.push('把 '+waitMe[0].id+' 的结果导进来');
  if(meas>=8)asks.push('R'+r+' 这批里挑 24 条送去测'+((FIELD[fs[0]]||{}).n?'　'+FIELD[fs[0]].n:''));
  if(best&&best.rho>0.3)asks.push('用 '+(best.name||best.id)+' 给现在的候选排个序');
  asks.push('这一轮还能不能再往上推');
  return `<div class="turn turn-ai"><span class="turn-g" aria-hidden="true"></span>
    <div class="turn-b">
      <p class="turn-p">${esc(p.name)}，${esc(bits.join('；'))}。从哪一步开始？</p>
      <div class="row wrap" style="gap:6px;margin-top:var(--s3)">
        ${asks.slice(0,3).map(a=>`<button class="ch" type="button" data-askthis="${esc(a)}"
          >${esc(a)}</button>`).join('')}
      </div>
    </div></div>`;
}

/* ---- 批次时间：全部从 log 算，不另记 ---- */
const NOW=new Date('2026-11-12T19:00:00+08:00');
function tParse(s){return new Date(String(s).replace(' ','T')+'+08:00')}
function batchEnter(b,k){const e=(b.log||[]).find(x=>x[0]===k);return e?tParse(e[1]):null}
function batchStart(b){const L=b.log||[];return L.length?tParse(L[0][1]):null}
function batchEnd(b){const d=batchEnter(b,'done');return d}
/* 周转：从建单到出结果。在途批次没有周转，只有「已经走了多久」。 */
function batchSpanDays(b){const a=batchStart(b),z=batchEnd(b);
  return (a&&z)?((z-a)/864e5):null}
function batchAgeDays(b){const a=batchStart(b);
  return a?((NOW-a)/864e5):null}
/* 每一段花了多久：相邻两次状态变更之差；最后一段到现在。 */
function batchLegs(b){const L=b.log||[];
  return L.map((x,i)=>{
    const st=EXP_STATUS.find(y=>y.k===x[0])||{n:x[0],phase:'—'};
    /* 终态没有「停留了多久」，它是终点不是一段。在途的最后一段算到现在。 */
    const term=st.phase==='终态';
    const t0=tParse(x[1]), t1=i+1<L.length?tParse(L[i+1][1]):NOW;
    return {k:x[0],n:st.n,phase:st.phase,at:x[1],
      days:term?null:(t1-t0)/864e5, open:i===L.length-1&&!term}})}
const fmtDays=d=>d==null?'—':(d<1?Math.max(1,Math.round(d*24))+' 小时':(d<10?d.toFixed(1):Math.round(d))+' 天');
/* 本项目历史周转的中位数。只数真正走完的批次——在途的那条算进去会把中位数拉低。 */
function turnaround(pid){
  const L=BATCHES.filter(b=>b.pid===(pid||S.pid)&&b.status==='done')
    .map(batchSpanDays).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!L.length)return {n:0,med:null,min:null,max:null};
  const m=L.length%2?L[(L.length-1)/2]:(L[L.length/2-1]+L[L.length/2])/2;
  return {n:L.length,med:m,min:L[0],max:L[L.length-1]};
}
/* 重训尝试：可能失败、可能退步回滚。一轮是一次尝试。 */

const RETRAINS=[

  failed:['训练失败','c-err'],running:['训练中','c-dry']};

/* 轮次状态是推导态，不是手工态。
   方向只有一个：服务商 → 批次 → 轮次。不存在反过来改。 */
const ROUND_LABEL={active:'进行中',assay:'送检中',reflux:'回流中',done:'已归档'};
function deriveRound(roundNo,archived){
  if(archived)return {state:'done',why:'用户已确认收口'};
  const bs=BATCHES_OF().filter(b=>b.round===roundNo);
  if(!bs.length)return {state:'active',why:'尚无送检批次'};
  if(bs.every(b=>b.status==='draft'))return {state:'active',why:'批次都还是草稿'};
  if(!bs.every(b=>b.status==='done'))
    return {state:'assay',why:`${bs.filter(b=>b.status!=='done').length} 个批次未完成`};
  const rt=RETRAINS.find(r=>r.round===roundNo);
  if(!rt)return {state:'reflux',why:'批次都完成了，还没重训'};
  return {state:'reflux',why:'重训已完成，等待人工确认收口'};

/* 卡片页脚三个数字由轮次实时聚合，不手填 */
function aggregate(p){
  return {rounds:p.rounds.length,

    returned:p.rounds.reduce((a,r)=>a+r.r,0)};
}
/* 证据链：计算类必须带模型版本，实验类必须带批次与 n */
/* 证据链六要素，口径对齐端砚（E2，上海 AI 实验室官方发布）：
   文献、数据、代码、工具调用、计算结果、实验记录。
   之前这里只有 计算 / 实验 / 文献 三类——少了 数据、代码、工具调用。
   少的那三类恰好是「能不能重跑」的关键：没有输入数据和代码，结论就只是一句话。
   所以不但要能挂这三类，还要把缺哪一类**显式标出来**，不能靠「有四条证据」糊过去。 */
const EV_KINDS=[
  ['文献','c-mut',  e=>!!e.ref,                  'ref',  '需出处'],
  ['数据','c-mut',  e=>!!(e.dataset&&e.rows),    'dataset','需数据集与条数'],
  ['代码','c-dry',  e=>!!(e.repo&&e.commit),     'repo', '需仓库与 commit'],
  ['工具调用','c-dry',e=>!!(e.tool&&e.ver),      'tool', '需工具名与版本'],
  ['计算','c-dry',  e=>!!e.model,                'model','需模型版本'],
  ['实验','c-wet',  e=>!!(e.batch&&e.n),         'batch','需批次号与 n 值']];
const EV_MAP={};EV_KINDS.forEach(k=>EV_MAP[k[0]]=k);
function evValid(e){const k=EV_MAP[e.k];return k?k[2](e):false}
function evDetail(e){
  if(e.k==='计算')return `任务 ${e.task} · 模型 ${e.model}`;
  if(e.k==='实验')return `批次 ${e.batch} · n=${e.n} · 宿主 ${e.host}`;
  if(e.k==='数据')return `${e.dataset} · ${e.rows} 条`;
  if(e.k==='代码')return `${e.repo} @ ${e.commit}`;
  if(e.k==='工具调用')return `${e.tool} ${e.ver}`;
  return e.ref||'';
}
/* 六要素覆盖：哪几类有、哪几类缺。缺的要点名。 */
function evCoverage(c){
  const have=new Set(c.ev.filter(evValid).map(e=>e.k));
  return {have:have, missing:EV_KINDS.map(k=>k[0]).filter(n=>!have.has(n))};
}
/* 评审七维，口径对齐端砚的评审智能体（E2）：
   需求完成度、正确性、证据与来源、可复现性、产物质量、工具执行、历史审查。

   为什么要在产品里立这个面板：这个项目到现在没有任何第三方评审——
   实现、验收、走查都是同一方做的。平台恰好有一个独立评审能力，
   那就应该把它的七个维度摆在产品里，而不是自己另造一套「自验证」。

   四项我们能在本地自查，三项不能——不能的那三项**明说需要端砚的评审智能体**，
   不拿自查去冒充评审。 */
const REVIEW_DIMS=[
 {k:'need', n:'需求完成度', what:'目标达成到什么程度', local:true},
 {k:'correct', n:'正确性', what:'结论能否被独立重新推出来', local:false},
 {k:'evidence',n:'证据与来源', what:'每条结论的六要素是否齐全', local:true},
 {k:'repro', n:'可复现性', what:'复现包是否能在相同条件下重跑', local:true},
 {k:'artifact',n:'产物质量', what:'导出物能否被下游直接用', local:false},
 {k:'tool', n:'工具执行', what:'工具调用是否真的成功过', local:true},
 {k:'history',n:'历史审查', what:'上一轮遗留问题是否复查', local:false}];
function reviewSelfCheck(){
  const P=PRJ(), st=hitStats(CANDS(),P), t=tcpOf(P);
  const goal=t&&t.primary?ruleText(t.primary):'（本项目未设结构化目标）';
  const cov=CLAIMS.map(evCoverage);
  const full=cov.filter(x=>!x.missing.length).length;
  const keyKinds=['数据','代码'];
  const reproOk=CLAIMS.every(c=>keyKinds.every(k=>evCoverage(c).have.has(k)));
  return {
    need:{ok:st.hits>0,
      say:st.hits>0?`已有 ${st.hits} 条命中（${goal} 且约束全满足）`
                   :`命中 0 条，主目标 ${goal} 尚未与约束同时满足`},
    evidence:{ok:full===CLAIMS.length,
      say:`${full}/${CLAIMS.length} 条结论六要素齐全`+
        (full<CLAIMS.length?`；缺口：${cov.filter(x=>x.missing.length).map(x=>x.missing.join('、')).join('｜')}`:'')},
    repro:{ok:reproOk,
      say:reproOk?'每条结论都挂了数据与代码，复现包三件套齐全'
                 :'有结论没挂数据或代码，相同条件下重跑不出来'},
    /* 「没报错」不等于「成功过」。从没调用过的工具不能算自查通过——
       那正是把空白当成绿色，和被预先勾好的质检框一个毛病。 */
    tool:(function(){
      const st=LS.get('mstat',null);          // {ok:bool, at:'…', msg:'…'}，连通性测试写入
      if(!st)return {ok:false,say:'还没成功调用过基础模型——到「模型接入」里测一次'};
      return {ok:!!st.ok, say:st.ok?`最近一次调用成功（${st.at}）`:`最近一次调用失败：${st.msg||'未知错误'}`};
    })()
  };
}
/* ================= M9 假设与实验设计 =================
   研究员关心的是：我有一个想法，怎么佐证它、怎么验它、这批实验能不能验得出来。
   而这个产品在加这一块之前只回答「怎么让这个数变大」——它是个优化引擎，不是科研仪器。
   数据模型里原本只有「结论」（CLAIMS，事后的），**没有「假设」**。

   一条假设是可证伪的陈述 + 它覆盖哪些位点 + 预期效应的方向与大小。 */
const HYPO=[

  pre:{support:0.20,refute:0.05,lockedAt:'2026-11-05 09:12',by:'我'},

 {id:'H-02',pid:'p1',round:3,
  text:'H102 位点任何突变都会破坏界面',
  sites:[102],effect:{k:'iptm',dir:'<=',v:0.5},

  text:'R83 与 R87 的双突变有正向上位效应',

  pre:null,state:'draft'}];
function hypoOf(pid,round){return HYPO.filter(h=>h.pid===(pid||S.pid)&&(round==null||h.round===round))}
const HYPO_STATE={draft:['草稿','',  '判据还没锁，锁定之后才能算验证'],
  testing:['验证中','c-dry','判据已锁，等数据'],
  supported:['被支持','c-ok','达到预先声明的支持线'],
  refuted:['被推翻','c-err','低于预先声明的推翻线'],
  inconclusive:['不确定','c-wet','落在支持线与推翻线之间，这一批分不出来']};
const posOfMut=m=>+String(m).replace(/^[A-Z]/,'').replace(/[A-Z]$/,'');
function hitsSite(c,sites){return (c.muts||[c.mut]).some(m=>sites.indexOf(posOfMut(m))>=0)}

/* ---- 佐证：一个想法在花钱之前有什么支持 ----
   四类，每类给「支持 / 不支持 / 无信息」，并把实际数字摆出来。
   全部来自本环境已有的数据，不编。 */
function evidenceFor(h){
  const rel=CANDS(h.pid).filter(c=>hitsSite(c,h.sites));
  const measured=rel.filter(c=>c.disposition==='measured');
  const out=[];
  // 1 文献
  const lit=rel.filter(c=>c.src==='文献推断'&&c.ref);
  out.push({k:'文献',v:lit.length?'支持':'无信息',
    say:lit.length?`${lit.length} 条同位点变体来自文献推断，出处 ${[...new Set(lit.map(c=>c.ref))].slice(0,2).join('；')}`
                  :'没有这些位点的文献记录',
    n:lit.length});
  // 2 进化保守性：越保守越不该随便改
  const con=measured.length?measured.reduce((a,c)=>a+c.dims.con,0)/measured.length:null;
  out.push({k:'进化保守性',v:con==null?'无信息':(con<0.5?'支持':con>0.75?'不支持':'无信息'),
    say:con==null?'这些位点还没有有结果的变体':
      `这些位点的平均保守性 ${con.toFixed(2)}` +
      (con<0.5?'，不保守，容忍突变':con>0.75?'，高度保守，改动风险大':'，中等，看不出倾向'),
    n:measured.length});
  // 3 结构：折得出来吗
  const fold=rel.filter(c=>c.iptm>=S.gate).length;
  out.push({k:'结构',v:rel.length?(fold/rel.length>=0.5?'支持':'不支持'):'无信息',
    say:rel.length?`${rel.length} 条里 ${fold} 条过准入闸门（${pct(fold/rel.length)}）`:'还没有这些位点的设计',
    n:rel.length});
  // 4 本项目历史
  const k=h.effect.k;
  const good=measured.filter(c=>ruleOk({k:k,cmp:h.effect.dir,v:h.effect.v},c)).length;
  out.push({k:'本项目历史',v:!measured.length?'无信息':(good/measured.length>=0.15?'支持':'不支持'),
    say:measured.length?`${measured.length} 条有结果，其中 ${good} 条达到 ${ruleText({k:k,cmp:h.effect.dir,v:h.effect.v})}（${pct(good/measured.length)}）`
                       :'这些位点还没有回流数据',

/* ---- 验证：按预先声明的判据判定，不事后改判据 ---- */
function hypoVerdict(h){
  if(!h.pre)return {state:'draft',rate:null,n:0};
  const rel=CANDS(h.pid).filter(c=>hitsSite(c,h.sites)&&c.disposition==='measured');
  if(!rel.length)return {state:'testing',rate:null,n:0};
  const rule={k:h.effect.k,cmp:h.effect.dir,v:h.effect.v};
  const good=rel.filter(c=>ruleOk(rule,c)).length;
  const rate=good/rel.length;
  const st=rate>=h.pre.support?'supported':rate<h.pre.refute?'refuted':'inconclusive';
  return {state:st,rate:rate,n:rel.length,good:good,rule:rule};
}

/* ---- 设计实验（一）：可检出效应 ----
   两样本均值比较，α=0.05 双侧，功效 80%：δ = 2.80 · σ · √(2/n)
   σ 必须来自本项目自己的重复数据。没有重复数据就给不出来——
   这时候要说「先测重复」，而不是编一个 σ。 */
function detectable(k,nrep){
  const f=FIELD[k];if(!f)return null;
  const L=CANDS().filter(c=>c.disposition==='measured'&&sdOf(c,k)!=null);
  if(!L.length)return {sigma:null,k:k,
    why:`本项目的 ${f.n} 没有重复测量的标准差，算不出可检出效应。先在一批里对同一条变体做重复，才知道这个测定能分辨多小的差。`};
  const sd=L.map(c=>sdOf(c,k)).sort((a,b)=>a-b);
  const sigma=sd[Math.floor(sd.length/2)];
  const n=Math.max(1,nrep||3);
  const delta=2.802*sigma*Math.sqrt(2/n);
  return {sigma:sigma,n:n,delta:delta,k:k,log:!!f.log,
    fold:f.log?Math.pow(10,delta):null,nFor:(d)=>Math.ceil(2*Math.pow(2.802*sigma/d,2))};
}

/* ---- 设计实验（二）：这板子能不能分辨主效应 ----
   依据：部分因子设计那篇（bioRxiv 298273）。七个位点两水平全因子 128 条，
   1/8 部分因子 16 条就能估主效应，工作量降为 1/8；
   代价是二因子效应之间部分混杂，必须说清谁和谁混。 */
function designReview(list,history){
  const sets=list.map(c=>(c.muts||[c.mut]).map(posOfMut));
  const pos=[...new Set([].concat.apply([],sets))].sort((a,b)=>a-b);
  /* 主效应能不能分辨，要看整个项目的历史——单突变可能来自更早的轮次，
     那时候测过的单点效应现在仍然算数。只看这一板会得出「什么都分辨不了」的错结论。 */
  const hist=(history||list).map(c=>(c.muts||[c.mut]).map(posOfMut));
  const aloneOf={};pos.forEach(p=>{aloneOf[p]=hist.filter(s=>s.length===1&&s[0]===p).length});
  const noAlone=pos.filter(p=>!aloneOf[p]);
  const conf=[];
  for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
    const a=pos[i],b=pos[j];
    const tog=sets.filter(s=>s.indexOf(a)>=0&&s.indexOf(b)>=0).length;
    if(tog>0&&!aloneOf[a]&&!aloneOf[b])conf.push([a,b,tog]);
  }
  return {n:list.length,pos:pos,aloneOf:aloneOf,noAlone:noAlone,conf:conf,histN:hist.length,
    full:pos.length?Math.pow(2,pos.length):0,
    maxOrder:sets.length?Math.max.apply(null,sets.map(s=>s.length)):0};
}

      latS   共享潜变量，承载"这个突变是不是好突变"，与 ipTM 相关 RHO
      latOf() 每个测定字段自己的潜变量 = LAM·latS + 噪声
    于是 corr(预测, 实测) = A·LAM = RHO，corr(实测, 实测) = LAM² ≈ 0.30，
    既不是独立也不是同一个数——和真实的 ΔTm / KD 耦合程度量级一致。 */
 const RHO=0.35, K=Math.sqrt(1-RHO*RHO);
 const LAM=0.55, A=RHO/LAM, KA=Math.sqrt(1-A*A), KL=Math.sqrt(1-LAM*LAM);
 /* 进化保守性是**位点**的属性，不是变体的属性：
    同一个位点的两条变体必须给出同一个保守性，否则并排一看就露馅。 */
 const CONS={};
 const consOf=(pid,pos)=>{const k=pid+':'+pos;
   if(CONS[k]==null)CONS[k]=Math.round(clamp(.55+gauss()*.20,.05,1)*100)/100;
   return CONS[k]};
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

 const WT=PRJ_WT;
 /* [项目, 条数, 测定字段, 工程位点, 各轮次] */
 const PLAN=[['p1',96,['dTm','kd'],  [27,58,59,60,62,73,83,87,102,103],[2,3,4,4,5]],
             ['p2',24,['kd'],        [29,35,38,39,42,44],               [1,1,2,2]],
             ['p3',36,['kcat','km'], [21,43,66,87,112,143],             [6,6,6,6]]];
 let no=0;
 PLAN.forEach(([pid,n,fields,sites,rounds])=>{
 const wt=WT[pid]||'';
 for(let i=0;i<n;i++){
  const pos=sites[Math.floor(r()*sites.length)];
  const from=wt[pos-1]||'A';
  /* 突变必须真的换掉残基：抽到和野生型相同就重抽 */
  let to=aa[Math.floor(r()*20)];
  let guard=0;while(to===from&&guard++<40)to=aa[Math.floor(r()*20)];
  const mut=from+pos+to;
  const seqv=applyMuts(wt,[mut]);

  /* 预测侧三个量各有各的来源，不是同一个数的三种变换：
     ipTM 来自复合物预测，自洽 RMSD 来自回折（和 ipTM 弱相关，ρ≈−0.45），
     可开发性从序列直接算。 */
  const ip=Math.round(clamp(.62+gauss()*.14,.30,.97)*1000)/1000;
  const zip=(ip-.62)/.14;
  const rmsd=Math.round(clamp(1.7-0.45*zip*0.9+gauss()*0.8,0.5,6.5)*100)/100;
  const dev=devScore(seqv,wt);
  const L=liabScan(seqv), LA=liabAdded(seqv,wt);

  /* 实测侧：共享潜变量 latS 与 ipTM 相关 A，每个字段再各自摊一层噪声 */
  const latS=A*zip+KA*gauss();
  const latOf=()=>LAM*latS+KL*gauss();
  const latT=latOf(), latA=latOf(), latE=latOf();
  const lat=latS;
  const lit=r()>.75;
  const m={};
  if(fields.indexOf('dTm')>=0)m.dTm=Math.round(clamp(2.0+2.6*latT,-5.5,11.5)*10)/10;
  if(fields.indexOf('kd')>=0){
    /* 界面突变基本只会把这个复合物做松，不会做得比 10 fM 更紧：
       热点残基的单点丙氨酸替换在文献上值 2–5 kcal/mol，约 10²–10⁴ 倍。
       所以生成的是**相对野生型的倍数**，再乘野生型得到 pM 值。 */
    /* 倍数而非绝对值：热点残基的单点替换在文献上值 2–5 kcal/mol，约 10²–10⁴ 倍。
       中心放在 ~250×，于是中位 KD 落在 SPR 可靠下限之上一点——
       被下限截断的大约三成，既不是全都测得到（那不真实），
       也不是全都测不到（那这一列就没用了）。
       下限只放到 0.5×：比 10 fM 再紧一个数量级，这个体系里没有文献支持。 */
    const fold=Math.pow(10,clamp(2.4-0.85*latA,-0.3,4.5));
    m.kd=+(WT_KD_PM*fold).toPrecision(2);
    m.kdLogSd=Math.round((.08+r()*.22)*100)/100}
  /* kcat 与 Km 各走各的潜变量。上一版两个都是 lat 的仿射变换，
     相关系数恰好 −1.000：没有一条变体能同时 kcat 高、Km 也高，
     而 kcat–Km 的取舍恰恰是酶工程里最该看的那一张图。 */
  if(fields.indexOf('kcat')>=0)m.kcat=Math.round(clamp(4.2+2.1*latE,0.3,14)*100)/100;
  if(fields.indexOf('km')>=0)m.km=Math.round(clamp(78-26*latOf(),6,260)*10)/10;

  /* newPos / newFrom / newTo 描述的是「这条变体在亲本之上**新加**的那一个突变」，
     不是这条变体的全部。lineage() 跑完之后 mut 会变成 'H102E/E73M' 这样的合集，
     而这三个字段仍然只说新加的那一个。此前它们叫 pos / from / to，
     名字看上去像是在描述整条变体——156 条里 85 条的 pos 和 muts[0] 对不上。 */
  DB.cands.push({pid:pid,id:'V-'+String(++no).padStart(3,'0'),mut:mut,newPos:pos,newTo:to,newFrom:from,
   seq:seqv,                                            // 变体全长序列，liability 与复制都用它
   iptm:ip,rmsd:rmsd,dev:dev,liab:L,liabNew:LA,
   cys:LA.some(x=>x.k==='freecys'),                      // 这个突变新引入的游离 Cys，从序列查出来的
   m:m,                                                  // 测定值；没测的字段根本不存在，不是 0
   src:lit?'文献推断':'本项目计算',
   ref:lit?REFS[Math.floor(r()*REFS.length)]:null,
   firstRound:rounds[Math.floor(r()*rounds.length)],
   batch:null,
   origin:lit?'reuse':'new',
   selection:['high','high','uncertain','cover','complement'][Math.floor(r()*5)],
   disposition:(function(){const x=r();
     return x<.62?'measured':x<.74?'failed':x<.80?'untested':x<.86?'deduped':'designed'})(),
   qual:(function(){const x=r();
     return x<.30?{expression:'none',fit_quality:'ok',rmse:8,binding:'yes'}
          :x<.52?{expression:'ok',fit_quality:'poor',rmse:12,binding:'yes'}
          :x<.70?{expression:'ok',fit_quality:'ok',rmse:41,binding:'yes'}
          :x<.86?{expression:'ok',fit_quality:'ok',rmse:9,binding:'none'}
                :{expression:'low',fit_quality:'ok',rmse:7,binding:'yes'}})(),
   /* 五个维度各有各的来源。此前 str 与 dev 都是 ipTM 的线性变换，
      相关系数 0.999——产品一边说「五维独立所以不给总分」，一边给了三个同一个数。 */
   /* 界面上每一维都写了它从哪来，那它就得真的和那个东西有关系：
        str 自称是 ThermoMPNN 的 ΔΔG → 必须能预测实测 ΔTm（这里 ρ≈0.40）
        aff 自称是界面接触能变化   → 必须能预测实测 KD（ρ≈−0.35，KD 越低越好）
        con 自称是位点的 MSA 频率   → 按位点取，与任何一次测定都不直接相关（它预测的是
                                      "这个位点能不能动"，不是某个测定的高低），这一点写在界面上
        seq 自称是逆折叠对数似然    → 预测可折叠性，同样不对单个测定负责
      上一版 str / aff / con 三维都是纯噪声，而产品把它们标成这几个量的来源。 */
   dims:{seq:Math.round(clamp(.62+gauss()*.16,.05,1)*100)/100,
         str:Math.round(clamp(.58+.18*(0.40*latT+0.917*gauss()),.05,1)*100)/100,
         con:consOf(pid,pos),
         aff:Math.round(clamp(.50+.18*(0.35*latA+0.937*gauss()),.05,1)*100)/100,
         dev:dev}});}});})();

/* 下面几段都在 seed 之后跑：谱系、查重、批次归属、失败归因
   都要读 DB.cands，seed 没填完之前它们只会在空数组上空转。 */
(function lineage(){
 /* 必须按项目分组再按轮次：p1 是 barnase、p2 是 barstar，
    跨项目认亲本会把别人蛋白的位点搬进来——V-001 身上出现 barstar 的 W38G 就是这么来的。 */
 const byP={};DB.cands.forEach(c=>(byP[c.pid]=byP[c.pid]||[]).push(c));
 Object.keys(byP).forEach(pid=>{
  const byR={};byP[pid].forEach(c=>(byR[c.firstRound]=byR[c.firstRound]||[]).push(c));
  const rounds=Object.keys(byR).map(Number).sort((a,b)=>a-b);
  rounds.forEach((rn,i)=>{
    if(i===0){byR[rn].forEach(c=>{c.parent=null;c.muts=[c.mut]});return}
    const pool=rounds.slice(0,i).reduce((a,x)=>a.concat(byR[x]),[])
      .filter(c=>c.disposition==='measured');
    byR[rn].forEach((c,j)=>{
      const pa=pool.length?pool[(j*7+rn*3)%pool.length]:null;
      c.parent=pa?pa.id:null;
      /* 同一个位点被改第二次是覆盖，不是并列：R59Q 之后再改成 R，写出来是 R59K，
         不能写成 R59Q/R59K——那读起来像两个突变。 */
      const base=pa?pa.muts.slice():[];
      const posOf=m=>m.replace(/^[A-Z]/,'').replace(/[A-Z]$/,'');
      const k=base.findIndex(m=>posOf(m)===String(c.newPos));
      if(k>=0)base[k]=c.mut; else base.push(c.mut);
      c.muts=base;
    });
  });
 });
 DB.cands.forEach(c=>{if(!c.muts)c.muts=[c.mut];c.mut=c.muts.join('/')});
})();
/* 查重。「查重排除」这个处置一直存在，但数据里有两条变体突变集完全相同却都没被标出来——
   一个声称会查重的产品里躺着没查出来的重复，比不查更糟。
   口径：突变集相同（与顺序无关）即为重复，保留第一条，其余标 deduped 并指向保留的那条。 */
(function dedupe(){
  const seen=new Map();
  DB.cands.forEach(c=>{
    const key=c.pid+'|'+c.muts.slice().sort().join('+');
    if(!seen.has(key)){seen.set(key,c);c.dupOf=null;return}
    const first=seen.get(key);
    c.dupOf=first.id;
    if(c.disposition!=='deduped'){c.disposition='deduped';c.m={}}
  });
})();
/* 变体归到批次：R3 → B-2409；R4 的一半到 B-2411、一半到 B-2412（这两个批次宿主不同，
   正好让「跨上下文不可直接比」在界面上真的出现）。R2 的批次不在本环境的跟踪列表里，
   R5 还没下单——这两种都没有批次，分组时退回该轮的计划上下文并标明是计划。 */
DB.cands.forEach((c,i)=>{
  if(c.firstRound===3)c.batch='B-2409';
  else if(c.firstRound===4)c.batch=(i%2?'B-2412':'B-2411')});
/* 失败类型由质量字段推导，不预存。界面上的「推断依据」就是 inferFailure 实际用到的那一条。 */
DB.cands.forEach(c=>{const f=inferFailure(c.qual);
  c.failKind=f?f.k:'no_binding'; c.failBy=f?f.by:'实验节点备注 + 人工确认'});


/* M2-F02 标识符类型识别 */
function idType(v){
  v=v.trim();
  if(/^AF-[A-Z0-9]+-F\d+$/i.test(v))return 'AFDB';
  if(/^[0-9][A-Za-z0-9]{3}$/.test(v))return 'PDB';
  if(/^([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$/i.test(v))return 'UniProt';
  return null;
}
/* M2-F01 三种格式解析：FASTA / 带编号 / 裸序列 */
function parseSeq(raw){
  const txt=String(raw||'').trim();
  if(!txt)return {ok:false,err:'空输入'};
  let fmt,chains=[];
  if(/^\s*>/.test(txt)){
    fmt='FASTA';
    txt.split(/^>/m).filter(x=>x.trim()).forEach((blk,i)=>{
      const nl=blk.indexOf('\n');
      const hdr=(nl<0?blk:blk.slice(0,nl)).trim();
      const body=(nl<0?'':blk.slice(nl)).replace(/[\s\d]/g,'').toUpperCase();
      chains.push({id:hdr.split(/[|\s]/)[0]||String.fromCharCode(65+i),seq:body,hdr:hdr})});
  }else if(/^\s*\d+\s+[A-Za-z]/.test(txt)||/[A-Za-z]{5,}\s+\d+\s*$/m.test(txt)){
    fmt='带编号';
    chains=[{id:'A',seq:txt.replace(/[\s\d]/g,'').toUpperCase()}];
  }else{
    fmt='裸序列';
    chains=[{id:'A',seq:txt.replace(/[\s\d]/g,'').toUpperCase()}];
  }
  chains=chains.filter(c=>c.seq.length);
  if(!chains.length)return {ok:false,err:'没有解析出任何残基',fmt:fmt};
  /* 非标准与非法残基逐个定位 */
  const ns=[],bad=[];
  chains.forEach(c=>{for(let i=0;i<c.seq.length;i++){const ch=c.seq[i];
    if(AA20.indexOf(ch)>=0)continue;
    (NONSTD[ch]?ns:bad).push({chain:c.id,pos:i+1,ch:ch})}});
  const tooLong=chains.filter(c=>c.seq.length>MAX_SEQ_LEN);
  return {ok:bad.length===0&&!tooLong.length,fmt:fmt,chains:chains,ns:ns,bad:bad,raw:txt,
    tooLong:tooLong.map(c=>({id:c.id,len:c.seq.length})),
    total:chains.reduce((a,c)=>a+c.seq.length,0)};
}
/* M2-F03 批量导入：CSV / FASTA，输出接受 / 拒绝 / 重复 */
function parseBatch(raw,max){
  max=max||384;
  const txt=String(raw||'').trim();
  const acc=[],rej=[],dup=[];const seen=new Set();
  if(!txt)return {acc:acc,rej:rej,dup:dup,fmt:'—'};
  if(/^\s*>/.test(txt)){
    const r=parseSeq(txt);
    (r.chains||[]).forEach((c,i)=>{
      const key=c.seq;
      if(!c.seq.length){rej.push({line:i+1,id:c.id,why:'序列为空'});return}
      const ill=[...c.seq].filter(x=>AA20.indexOf(x)<0&&!NONSTD[x]);
      if(ill.length){rej.push({line:i+1,id:c.id,why:`含非法字符 ${[...new Set(ill)].join('')}`});return}
      if(seen.has(key)){dup.push({line:i+1,id:c.id,why:'与前面某条序列完全相同'});return}
      seen.add(key);acc.push({id:c.id,seq:c.seq,line:i+1})});
    return {acc:acc,rej:rej,dup:dup,fmt:'FASTA'};
  }
  const lines=txt.split(/\r?\n/);
  let start=0;
  if(/[a-z_]/i.test(lines[0])&&/(id|name|seq|sequence|变体|序列)/i.test(lines[0])&&lines[0].indexOf(',')>=0)start=1;
  for(let i=start;i<lines.length;i++){
    const ln=lines[i].trim();const no=i+1;
    if(!ln)continue;
    const cells=ln.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(cells.length<2){rej.push({line:no,id:cells[0]||'—',why:'列数不足，至少需要 变体名,序列'});continue}
    const id=cells[0],seq=(cells[1]||'').toUpperCase().replace(/\s/g,'');
    if(!id){rej.push({line:no,id:'—',why:'变体名为空'});continue}
    if(!seq){rej.push({line:no,id:id,why:'序列为空'});continue}
    const ill=[...seq].filter(x=>AA20.indexOf(x)<0&&!NONSTD[x]);
    if(ill.length){rej.push({line:no,id:id,why:`第 ${seq.indexOf(ill[0])+1} 位是非法字符「${ill[0]}」`});continue}
    if(seq.length>MAX_SEQ_LEN){rej.push({line:no,id:id,why:`长度 ${seq.length} 超过单条上限 ${MAX_SEQ_LEN}`});continue}
    if(seen.has(seq)){dup.push({line:no,id:id,why:'序列与前面某条重复'});continue}
    if(acc.length>=max){rej.push({line:no,id:id,why:`超出单次上限 ${max} 条`});continue}
    seen.add(seq);acc.push({id:id,seq:seq,line:no});
  }
  return {acc:acc,rej:rej,dup:dup,fmt:'CSV'};
}
/* M2-F05 残基选择：区间与单点混写 */
function parseRanges(str,maxLen){
  const out=new Set(),bad=[];
  String(str||'').split(/[,，;；]/).forEach(tok=>{
    tok=tok.trim();if(!tok)return;
    const m=tok.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
    if(m){let a=+m[1],b=+m[2];if(a>b){const t=a;a=b;b=t}
      if(maxLen&&b>maxLen){bad.push(tok+'（超出序列长度）');return}
      for(let i=a;i<=b;i++)out.add(i);return}
    if(/^\d+$/.test(tok)){const n=+tok;
      if(maxLen&&n>maxLen){bad.push(tok+'（超出序列长度）');return}
      out.add(n);return}
    bad.push(tok+'（认不出格式）');
  });
  return {set:out,bad:bad};
}
function fmtRanges(set){
  const a=[...set].sort((x,y)=>x-y);if(!a.length)return '';
  const out=[];let s0=a[0],prev=a[0];
  for(let i=1;i<=a.length;i++){const v=a[i];
    if(v===prev+1){prev=v;continue}
    out.push(s0===prev?String(s0):s0+'-'+prev);s0=v;prev=v}
  return out.join(', ');
}

/* ================= N05 工具治理 ================= */
/* 一份工具在产品里有两种开关，分开记：
   「启用」是用户自己的货架，只影响他能不能在表单里挑到它（ENABLED）；
   「发布 / 停用」是注册表级别的状态，停用之后谁都挑不到新任务，
   但已经跑过的任务保留它当时的版本——所以停用不回头改历史。 */
function TGOV(){return LS.get('toolGov',{})}
function tgov(n){const g=TGOV()[n]||{};return {pub:g.pub===0?0:1,rev:g.rev||1,at:g.at||null,why:g.why||''}}
function setGov(n,patch){
  const g=TGOV();const cur=tgov(n);
  g[n]=Object.assign({},cur,patch,{at:Date.now()});
  LS.set('toolGov',g);
}
function toolBy(n){return ALL_TOOLS().find(t=>t.n===n)||null}
function pubOK(n){return tgov(n).pub===1}

/* 输入输出契约：拿工具自己声明的输入／输出串，按同一张归一表切成字段。
   表是全站共用的那一张（表单校验用的也是它），所以契约和实际校验不会各说一套；
   没有规则覆盖的词，如实标成「还没有归一规则」，不硬凑一个字段名。 */
const C_RULES=[
 [/^序列$|蛋白序列|设计序列/, {f:'seq',t:'string',n:'蛋白序列',v:'20 种标准氨基酸单字母，长度 10–4000'}],
 [/登录号|FASTA/,             {f:'accession',t:'string',n:'登录号',v:'UniProt 登录号，如 P61626'}],
 [/PDB 编号/,                 {f:'pdb_id',t:'string',n:'PDB 编号',v:'4 位，如 1BRS'}],
 [/复合物定义/,               {f:'entities',t:'array<entity>',n:'分子清单',v:'每项：分子类型 + 序列或编号 + 拷贝数'}],
 [/靶点结构|结构文件|^结构$/, {f:'structure',t:'file',n:'结构',v:'mmCIF 或 PDB'}],
 [/抗体结构/,                 {f:'structure',t:'file',n:'抗体结构',v:'mmCIF 或 PDB，需含重链与轻链'}],
 [/主链骨架|骨架/,            {f:'backbone',t:'file',n:'主链骨架',v:'只含主链原子的 PDB'}],
 [/配体/,                     {f:'ligand',t:'file|string',n:'配体',v:'SDF / MOL2 文件，或 PDB 化学组分编号'}],
 [/约束/,                     {f:'constraints',t:'array<string>',n:'约束',v:'残基位点或距离约束，每条一行'}],
 [/突变/,                     {f:'mutations',t:'array<string>',n:'突变',v:'记法如 R59K，一条一项'}],
 [/变体清单|清单/,            {f:'variants',t:'array<variant>',n:'变体清单',v:'每项：变体号 + 序列或突变记法'}],
 [/置信度/,                   {f:'confidence',t:'object',n:'置信度',v:'pLDDT、ipTM、PAE'}],
 [/突变效应评分|零样本打分|评分|打分/,{f:'score',t:'number',n:'打分',v:'模型原始输出，未归一到 0–1'}],
 [/描述符数值/,               {f:'descriptors',t:'object',n:'描述符',v:'净电荷、理论 pI、疏水斑块面积、聚集倾向'}],
 [/RMSD/,                     {f:'rmsd',t:'number',n:'自洽 RMSD',v:'单位埃'}],
 [/订单与批次号/,             {f:'order',t:'object',n:'订单',v:'实验节点、批次号、条数、排期'}],
 [/结果文件|^文件$/,          {f:'result_file',t:'file',n:'结果文件',v:'CSV 或实验节点回传的原始表'}],
 [/结论/,                     {f:'claim',t:'string',n:'结论',v:'一句话判断，随附依据链接'}],
 [/注释/,                     {f:'annotations',t:'object',n:'注释',v:'功能、结构域、已知位点'}],
 [/板位图/,                   {f:'plate',t:'object',n:'板位图',v:'96 孔板的孔位分配'}],
 [/写回变体库/,               {f:'writeback',t:'ref',n:'写回变体库',v:'按变体号把实测值并进变体库'}],
 [/证据链/,                   {f:'evidence',t:'array<ref>',n:'证据链',v:'每项：来源、年份、链接'}],
 [/突变效应|功能预测/,        {f:'score',t:'number',n:'打分',v:'模型原始输出，未归一到 0–1'}]];
function cTokens(x){return String(x||'').split(/\s*[\/\+、，,]\s*/).map(v=>v.trim()).filter(Boolean)}
function contractOf(t){
  const one=side=>cTokens(side).map(tok=>{
    const hit=C_RULES.find(([re])=>re.test(tok));
    return hit?Object.assign({tok:tok},hit[1]):{tok:tok,f:null};
  });
  return {i:one(t.i),o:one(t.o)};
}
function cOK(t){const c=contractOf(t);return c.i.concat(c.o).every(x=>x.f)}

/* ================= 产物 =================
   以前工具有类型化的契约（上面那张 C_RULES），任务的产物却只是一句字符串：
   out:'1 条链 · pLDDT 中位 91.4'。后果是研究里真正流转的东西——
   一个结构、一组序列、一张板位表、一份回传表——在产品里**没有对象**。
   于是下不了、复用不了、留不下。

   这里把产物补成一级对象。产物的字段名 f 就是契约里的输出字段，
   所以「谁能吃这个产物」不需要再维护一张表：nodeFit 已经知道（R22）。

   格式不是我们发明的，是这个领域已经在用的，下载下来要能直接喂给
   PyMOL / ColabFold / 实验室的脚本：
     结构    PDBx/mmCIF（.cif）。wwPDB 自 2014 起的归档格式；
             旧 PDB 格式 2012-11-21 起冻结，且装不下 >99999 原子或 >62 条链
     置信度  单独的 JSON（PAE / pTM / ipTM），pLDDT 按惯例写在结构文件的 B-factor 列
     比对    .a3m
     序列    .fasta
     表格    .csv
     运行记录 .json
*/
const ARTS={
 seq:        {n:'序列',    ext:'fasta',mime:'text/plain',
   note:'每条一个 > 头，序列按 60 列折行。20 种标准氨基酸单字母。'},
 variants:   {n:'变体表',  ext:'csv',  mime:'text/csv',
   note:'一行一条变体，突变用 R59K 记法，实测值带单位写在列名里。'},
 confidence: {n:'置信度',  ext:'json', mime:'application/json',
   note:'ipTM / pTM / 自洽 RMSD。逐残基 pLDDT 按惯例写在结构文件的 B-factor 列，不另给一列。'},
 structure:  {n:'结构',    ext:'cif',  mime:'chemical/x-mmcif',
   note:'PDBx/mmCIF。wwPDB 自 2014 起的归档格式；旧 PDB 格式自 2012-11-21 冻结，'
       +'且装不下超过 99999 个原子或 62 条链的结构。'},
 backbone:   {n:'主链骨架',ext:'pdb', mime:'chemical/x-pdb',
   note:'只含主链原子（N / CA / C / O）的 PDB，没有侧链。侧链是下一步序列设计要填的。'},
 msa:        {n:'多序列比对',ext:'a3m', mime:'text/plain',
   note:'a3m：小写字母表示相对查询序列的插入。'},
 plate:      {n:'板位表',  ext:'csv',  mime:'text/csv',
   note:'一行一个孔，孔位、内容、重复组。实验节点按这张表排板。'},
 result_file:{n:'回传结果',ext:'csv',  mime:'text/csv',
   note:'实验节点回传的原始表，原样留存。'},
 annotations:{n:'功能注释',ext:'json', mime:'application/json',
   note:'位点级注释与它的出处、编号基准。'},
 evidence:   {n:'证据链',  ext:'json', mime:'application/json',
   note:'一条结论 + 支撑它的来源清单。'},
 report:     {n:'轮次报告',ext:'md',  mime:'text/markdown',
   note:'人读的交付件。每一节都标明数据来自哪里，算不出的照实写「算不出」。'
       +'报告记录的是一次决策，所以它是快照：产出即归档，不随数据变。'},
 run:        {n:'运行记录',ext:'json', mime:'application/json',
   note:'这一次跑了什么：工具与版本、参数、随机种子、输入产物的指纹。'}};

const wrap60=s=>String(s).replace(/(.{60})/g,'$1\n');
const slug=s=>String(s||'').replace(/[^\w\u4e00-\u9fa5-]+/g,'_')
  .replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40);

/* 产物的内容到下载那一刻才算。清单只拿名字、格式和关键字段。 */
function artOf(f,name,meta,make,opt){
  const A=ARTS[f]||{n:f,ext:'txt',mime:'text/plain',note:''};
  return Object.assign({f:f,n:A.n,ext:A.ext,mime:A.mime,note:A.note,
    name:name+'.'+A.ext,meta:meta||[],make:make},opt||{});
}

/* ---- 各类产物的真实生成器。没有的数据不编，缺什么就在产物里写明缺什么。 ---- */
function artSeqFasta(pid){
  const p=DB.projects.find(x=>x.id===pid)||{},wt=PRJ_WT[pid]||'';
  const u=UNIP[pid]||{};
  return '>'+(u.acc||pid)+' '+(u.name||p.name||'')+' | 野生型 | '+wt.length+' aa\n'+wrap60(wt)+'\n';
}
function artDesignFasta(pid,list){
  const wt=PRJ_WT[pid]||'';
  /* 头里放的是**本产品自己有的字段**，名字也用本产品的名字。
     真正的 ProteinMPNN 头还会带 score= / global_score= / seq_recovery=
     （平均负对数概率与序列回收率）——这一版没有接推理后端，没有这三个值，
     所以不写，也不拿别的数去冒充。缺了什么写在同名的 .json 里。 */
  return list.map(c=>{
    const muts=(c.muts||[c.mut]).filter(x=>x&&x!=='—');
    const sq=muts.length?applyMuts(wt,muts):wt;
    return '>'+c.id+' muts='+(muts.join('/')||'none')
      +' round='+(c.firstRound||'-')
      +(typeof c.iptm==='number'?' iptm='+c.iptm.toFixed(3):'')
      +(c.batch?' batch='+c.batch:'')
      +'\n'+wrap60(sq);
  }).join('\n')+'\n';
}
/* CSV 一行。只有含分隔符、引号或换行的字段才加引号——
   见字段就包的话，预览和 Excel 里会到处是引号。 */
function csvRow(a){return a.map(x=>{const v=String(x==null?'':x);
  return /[,"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}
/* 解析一行 CSV：带引号的字段里可以有逗号，所以不能直接 split。 */
function csvCells(line,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){out.push(cur);cur=''}
    else cur+=c}
  out.push(cur);return out;
}
function artVariantsCsv(pid,list){
  const F=projFields(pid), head=['variant','muts','round','batch','disposition','iptm','rmsd']
    .concat(F.map(k=>k+(FIELD[k]&&FIELD[k].unit?'_'+FIELD[k].unit.trim():'')));
  const rows=list.map(c=>[c.id,(c.muts||[c.mut]).join('/'),c.firstRound||'',c.batch||'',
    c.disposition||'',typeof c.iptm==='number'?c.iptm:'',typeof c.rmsd==='number'?c.rmsd:'']
    .concat(F.map(k=>{const v=mv(c,k);return v==null?'':v})));
  return [head].concat(rows).map(csvRow).join('\n')+'\n';
}
function artConfJson(pid,list){
  const L=list.filter(c=>typeof c.iptm==='number');
  return JSON.stringify({
    project:pid, generated_at:nowStamp(), n:L.length,
    note:'逐残基 pLDDT 按惯例写在结构文件的 B-factor 列；这一版没有结构坐标，所以没有 pLDDT。',
    missing:['plddt（需结构坐标）','pae（需推理后端返回的 PAE 矩阵）','ptm（同上）'],
    items:L.map(c=>({variant:c.id,iptm:c.iptm,
      rmsd:typeof c.rmsd==='number'?c.rmsd:null}))},null,1);
}
function artRunJson(t){
  return JSON.stringify({
    task:t.id, name:t.n, capability:capName(t.cap),
    project:t.pid||null, round:t.r||null,
    created_at:t.at, took:t.took||null, status:t.st,
    /* 没有记下参数的任务，这里就空着并说明——
       拿「当前配置」顶上会让三个月后的人以为那次就是这么跑的。 */
    provenance:t.params?Object.fromEntries(t.params.map(x=>[String(x[0]),String(x[1])])):null,
    provenance_note:t.params?null:'这个任务没留参数记录，复现不了。',
    inputs:t.in||null, outputs:t.out||null,
    note:'这一份是运行记录，不是结果。复现要连同输入产物一起带走。'},null,1);
}
function artAnnJson(pid){
  const u=UNIP[pid];if(!u)return JSON.stringify({note:'没有登记 UniProt 记录'},null,1);
  const off=unipOffset(pid);
  return JSON.stringify({

      chain:u.chain, offset:off,
      how:'成熟链编号 = UniProt 编号 − '+off+'。偏移取自 CHAIN 特征，不是估的。'},
    features:(u.feats||[]).map(f=>({type:f.t,label:FEAT_N[f.t]||f.t,
      uniprot_position:f.at, mature_position:f.at-off, description:f.d}))},null,1);
}
/* 结构：这一版没有推理后端，也没有坐标。产物是一个**引用**，不是一个文件。
   把真实的取回地址给出来，比给一份编出来的坐标诚实得多。 */
function artStructRef(pid,acc){
  const a=acc||((UNIP[pid]||{}).acc)||'';
  const isPdb=/^[0-9][A-Za-z0-9]{3}$/.test(a);
  return JSON.stringify({
    kind:'structure-reference', accession:a,
    format:'PDBx/mmCIF',
    download:isPdb?('https://files.rcsb.org/download/'+a.toUpperCase()+'.cif')
                  :('https://alphafold.ebi.ac.uk/files/AF-'+a+'-F1-model_v4.cif'),
    plddt:'若为 AlphaFold 预测结构，逐残基 pLDDT 在 mmCIF 的 B-factor 列',
    note:'上面的地址是真实可取的，取回之后可以在「结构预测」里载入。'},null,1);
}

/* 板位表：排板与导出共用这一份，不在两处各排一次（R22）。
   一行一个孔，每个孔都有归属，重复组写出来——服务商按这张表排板。 */
function platesCsv(){
  const [rows,cols]=PLATE_FMT[plateOf().fmt];
  const usable=plateCap(), reps=repsNow();
  const sum=COMPO.reduce((x,c)=>x+c[2],0);
  const scaled=COMPO.map(([n,c,v])=>[n,Math.round(v/sum*usable)]);
  scaled[0][1]+=usable-scaled.reduce((x,y)=>x+y[1],0);
  /* 一条变体占 reps 个孔：先排对照，再按组铺变体，每条连排 reps 个。 */
  const seq=[];
  for(let i=0;i<plateOf().ctrl;i++)seq.push(['CTRL','对照',0]);
  let k=0;
  scaled.forEach(([g,cnt])=>{for(let i=0;i<cnt;i++){k++;
    const id='V-'+String(k).padStart(3,'0');
    for(let r=1;r<=reps;r++)seq.push([id,g,r])}});
  const L='ABCDEFGHIJKLMNOP',out=['well,variant,group,replicate,plate_format,round'];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const w=seq[r*cols+c]||['EMPTY','空孔',0];
    out.push(`${L[r]}${c+1},${w[0]},${w[1]},${w[2]||''},${plateOf().fmt},Round ${S.round}`)}
  return out.join('\n')+'\n';
}

/* ---- 这个产物能被谁吃 ----
   不另维护一张「谁能接谁」的表：节点的 need 已经声明了它要哪些字段（R22）。
   所以产物 f 一旦确定，下游是算出来的，不是配出来的。 */
function artConsumers(f){
  const out=[];
  Object.keys(PIPE).forEach(cap=>(PIPE[cap]||[]).forEach(nd=>{
    if((nd.need||[]).indexOf(f)>=0)out.push({cap:cap,nd:nd,route:CAP_ROUTE[cap]});
  }));
  return out;
}
/* 节点之外，产品自己的几个界面也在读这些字段。
   这不是把节点契约抄第二遍（R22）：节点是工具步骤，这里是产品界面，
   两种去向性质不同。但对研究员来说都是「这份东西会流到哪」，所以一起列。 */
const FIELD_SINK={
 confidence:[['results','结果页的准入闸门按 ipTM 卡'],['viewer','结构视图按置信度着色']],
 variants:  [['results','候选表与筛选'],['wetlab','送检清单']],
 seq:       [['library','序列检索的输入'],['viewer','序列轨道']],
 annotations:[['design','候选位点表的「功能」列']],
 result_file:[['wetlab','回流的字段映射与质量校验']],
 plate:     [['wetlab','排板与提交实验']],
 evidence:  [['hypo','假设的依据']],
 run:       [['task','复现包与运行出处']],
 structure: [['viewer','结构视图']]};
function artSinks(f){return (FIELD_SINK[f]||[]).map(x=>({route:x[0],n:x[1]}))}
/* 一个字段从哪来：上一个节点给的、某个任务的产物、还是只能你自己填。
   这不是另一张表——三种来源都是从已有声明里算出来的。
   答案为 'user' 的那些要写在节点上：研究员得知道这一步卡在「我还没给它东西」，
   而不是以为系统会自己接上。 */
function fieldSupply(f){
  const byNode=Object.keys(PIPE).some(c=>(PIPE[c]||[]).some(n=>(n.give||[]).indexOf(f)>=0));
  if(byNode)return 'node';
  const byArt=TASKS.some(t=>{if(t.st!=='done')return false;
    try{return artsOf(t).some(a=>a.f===f)}catch(e){return false}});
  return byArt?'artifact':'user';
}
const FIELD_N=f=>{const r=C_RULES.find(x=>x[1].f===f);return r?r[1].n:f};
function artUseCount(f){return artConsumers(f).length+artSinks(f).length}
/* 交接：把产物挂到下一个功能的输入上。只记引用，不复制内容——
   内容在产物那边，复制一份就会有两份会分叉的事实。 */
function artHandoff(a,fromTask){
  /* 记下它是在哪个项目里接上的。此前不记：在 p1 上把结构接到设计，
     切到 p2 的设计页仍然显示「输入已接上」，而那是 p1 的结构——
     按下发起设计就是拿另一个项目的结构跑这个项目，不报错，只出错的结果。 */
  S.feed={f:a.f,name:a.name,from:fromTask,at:nowStamp(),pid:S.pid};
}
function feedNote(cap){
  const fd=S.feed;if(!fd)return '';
  if(fd.pid&&fd.pid!==S.pid)return '';     // 别的项目接上的输入，不在这里露面
  const want=(PIPE[cap]||[]).some(nd=>(nd.need||[]).indexOf(fd.f)>=0);
  if(!want)return '';
  return `<div class="row wrap" style="gap:var(--s3);align-items:baseline;
      padding:var(--s3) var(--s4);border:1px solid var(--dry);border-radius:var(--r2);
      background:var(--dry-soft)">
    <span class="lbl" style="color:var(--dry)">输入已接上</span>
    <span class="t-sm num grow">${esc(fd.name)}</span>
    <span class="t-sm mut2">来自 ${esc(fd.from)}　${esc(fd.at)}</span>
    <button class="btn btn-gh" type="button" data-act="feedclr"
      style="min-height:1.5rem;padding:0 8px;font-size:0.71875rem">断开</button>
  </div>`;
}

/* 产物卡：一个任务的产物摆在这里，每个能下载、能交接给下一个功能。
   「交给谁」是从节点的 need 算出来的，不是写死的清单。 */
function artCard(t){
  const A=artsOf(t);
  if(!A.length)return t.st==='done'
    ? `<section class="card"><div class="card-h"><strong>产物</strong></div>
       <div class="card-b"><p class="t-sm mut" style="margin:0">这个任务没有登记产物。
         产物的字段要在工具契约的输出里声明，声明了才会在这里出现。</p></div></section>` : '';
  return `<section class="card"><div class="card-h"><strong>产物</strong>
    <span class="grow"></span>
    <span class="t-sm mut2">${A.length} 个</span>
    <button class="btn btn-gh" type="button" data-artzip="${esc(t.id)}"
      style="min-height:1.5rem;padding:0 8px;font-size:0.71875rem">全部打包</button></div>
    ${/* 这里原先有一段讲「下载是现算的、存入项目是冻住的」。
         两颗按钮各自的 title 已经说了这件事，正文再讲一遍是旁白：
         它解释产品怎么运作，而不是帮人做下一步。 */''}
    <div class="card-b col" style="gap:0;padding-block:0">
    ${A.map((a,i)=>{
      const cons=artConsumers(a.f);
      return `<div class="col" style="gap:var(--s2);padding:var(--s4) 0;${i<A.length-1?'border-bottom:1px solid var(--line-2)':''}">
        <div class="row wrap" style="gap:var(--s3);align-items:baseline">
          <span class="num t-md grow" style="min-width:0;word-break:break-all">${esc(a.name)}</span>
          <span class="chip">${esc(a.n)}</span>
          <button class="btn btn-gh" type="button" data-artdl="${esc(t.id)}|${i}"
            title="现在按当前数据算一份，下到的是最新那一版"
            style="min-height:1.5rem;padding:0 8px;font-size:0.71875rem">下载</button>
          ${(function(){const rec=archRecOf(a,t);
            const S1='style="min-height:1.5rem;padding:0 8px;font-size:0.71875rem"';
            return rec
              ?`<button class="btn btn-gh" type="button" data-archgo="${esc(rec.id)}" ${S1}
                  title="${esc(rec.at)} 存入，指纹 ${esc(String(rec.hash))}"
                  >已存入 ${esc(rec.id)}</button>`
              :`<button class="btn btn-gh" type="button" data-artarch="${esc(t.id)}|${i}"
                  title="把这一刻的内容冻住，挂到项目上——报告、送检单这类要留证据的，存一份"
                  ${S1}>存入项目</button>`})()}
        </div>
        <div class="row wrap" style="gap:var(--s3)">
          ${a.meta.map(m=>`<span class="t-sm mut2">${esc(m[0])} <span class="num">${esc(String(m[1]))}</span></span>`).join('')}
        </div>
        <span class="t-sm mut2" style="line-height:1.6">${esc(a.note)}</span>
        ${a.warn?`<span class="t-sm" style="color:var(--wet)">${esc(a.warn)}</span>`:''}
        ${cons.length?`<div class="row wrap" style="gap:var(--s2);align-items:baseline">
          <span class="lbl">接到下一步</span>
          ${cons.map(c=>`<button class="btn btn-gh" type="button"
            data-artuse="${esc(t.id)}|${i}|${esc(c.cap)}"
            style="min-height:1.5rem;padding:0 8px;font-size:0.71875rem"
            title="把这个产物接到「${esc(c.nd.n)}」的输入上">${esc(capName(c.cap))} · ${esc(c.nd.n)}</button>`).join('')}
        </div>`:''}
        ${artSinks(a.f).length?`<div class="row wrap" style="gap:var(--s2);align-items:baseline">
          <span class="lbl">产品里读它的地方</span>
          ${artSinks(a.f).map(x=>`<span class="t-sm mut2">${esc(NAVNAME[x.route]||x.route)}：${esc(x.n)}</span>`).join('　')}
        </div>`:''}
        ${!cons.length&&!artSinks(a.f).length
          ?`<span class="t-sm mut2">没有任何节点或界面声明要「${esc(a.f)}」这个字段，所以它只能下载，流不到下一步。</span>`:''}
      </div>`}).join('')}
    </div></section>`;
}

/* ================= 归档：把产物绑进项目 =================
   产物有两种，两种都要，而且不能混：

     现算（derived）  内容在点下载那一刻从当前数据算出来。
                      好处是永远最新；代价是**上周那一版算不回来了**。
     归档（archived） 内容在存入那一刻冻住，挂在项目上，带出处与指纹。
                      好处是可追溯；代价是会过期。

   研究里这两件事都真实存在：一份报告发给合作者之后就必须是不变的，
   而一张变体表你希望它永远是最新的那一版。
   所以不替用户选，两个动作并排给：「下载」和「存入项目」。

   报告、送检单、复现包这一类天生是快照——它们记录的是一次决策或一次交付，
   所以产出时直接归档，不走现算。 */
function fnv1a(str){
  /* 不是密码学哈希，只用来认出两份内容是不是同一份。界面上也这么写。 */
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return h.toString(16).padStart(8,'0');
}
function archOf(pid){return (DB.projects.find(x=>x.id===(pid||S.pid))||{}).arch||[]}
/* 存过的产物要在产物那一行就看得出来。
   原先点「存入项目」之后，变化只发生在项目页，这一行毫无反应，
   人会以为没生效再点一次——第二次才被告知「已经有一份」。
   产物内容是冻结的（同一任务同一产物重复存会撞指纹），
   所以这里按「出处任务 + 产物名」就能认出已存的那条，不必为了显示去重算一遍内容。 */
function archRecOf(a,t){
  const p=t&&DB.projects.find(x=>x.id===t.pid);
  if(!p||!p.arch)return null;
  return p.arch.find(x=>x.from&&x.from.task===t.id&&x.name===a.name)||null;
}
function archive(a,from,note){
  /* 这里曾经写成 x.id===(from&&from.pid)||S.pid：
     JS 把它读成 (x.id===from.pid) || S.pid，而 S.pid 是非空字符串、恒为真，
     于是 find 永远返回第一个项目——「存入项目」会把产物存进别人的项目里，
     而且界面上什么都看不出来。括号必须括在取值上，不是比较上。 */
  const p=DB.projects.find(x=>x.id===((from&&from.pid)||S.pid))||PRJ();
  if(!p)return null;
  p.arch=p.arch||[];
  let body;try{body=a.make()}catch(e){return null}
  const h=fnv1a(String(body));
  const dup=p.arch.find(x=>x.hash===h&&x.name===a.name);
  if(dup)return {dup:dup};
  const rec={id:'A-'+String(p.arch.length+1).padStart(3,'0'),
    name:a.name,f:a.f,n:a.n,mime:a.mime,note:note||'',
    at:nowStamp(),by:'我',hash:h,bytes:new Blob([body]).size,body:body,
    from:from?{task:from.id,cap:from.cap,round:from.r}:null};
  p.arch.unshift(rec);
  return {rec:rec};
}

/* ---- 轮次报告：研究员真正要交出去的那一份 ----
   全部从本项目的真实数据算。算不出的那几项照实写「算不出」，
   因为一份把局限藏起来的报告，比没有报告更糟。 */
function artReportMd(pid,round){
  const P=DB.projects.find(x=>x.id===pid)||PRJ(); if(!P)return '';
  const r=P.rounds.find(x=>x.i===round)||P.rounds[P.rounds.length-1];
  const t=tcpOf(P), F=FIELD[t&&t.primary&&t.primary.k]||{n:'—',unit:''};
  const L=CANDS(P.id).filter(c=>c.firstRound===r.i);
  const meas=L.filter(c=>c.disposition==='measured');
  const hs=hypoOf(P.id,r.i);
  const adv=roundAdvice(P);
  const T=turnaround(P.id);
  const bs=BATCHES.filter(b=>b.pid===P.id&&b.round===r.i);
  const rules=[t&&t.primary].concat((t&&t.constraints)||[]).filter(Boolean);
  const reps=parseInt(String((r.plan||{}).reps||'n = 3').replace(/\D/g,''),10)||3;
  const det=t&&t.primary?detectable(t.primary.k,reps):null;
  const L8=[];
  const w=x=>L8.push(x);

  w('# '+P.name+' · Round '+r.i+' 轮次报告');
  w('');
  w('生成于 '+nowStamp()+'　项目 '+P.id+'　靶点 '+(P.target||'—'));
  w('');
  w('> 这份报告由产品从本项目的数据现算后冻存。每一节都标明数据来自哪里；');
  w('> 算不出的照实写「算不出」，并说明缺什么。');
  w('');
  w('## 一 · 这一轮要回答什么');
  w('');
  if(hs.length)hs.forEach(h=>{
    w('**'+h.id+'**　'+h.text);
    w('');
    w('- 涉及位点：'+(h.sites||[]).join('、'));
    if(h.pre)w('- 预先锁定的判据：支持 ≥ '+h.pre.support+'，推翻 ≤ '+h.pre.refute
      +'（锁定于 '+h.pre.lockedAt+'，by '+h.pre.by+'）');
    w('- 状态：'+(h.state||'—'));
    w('');
  }); else w('这一轮没有写下假设。一个没有问题的实验，拿到任何结果都解释得通。\n');

  w('## 二 · 目标与判据');
  w('');
  w('| | 字段 | 判据 | 这一轮达成 |');
  w('|---|---|---|---|');
  rules.forEach((c,i)=>{
    const f=FIELD[c.k]||{n:c.k,unit:''};
    const ok=meas.filter(x=>ruleOk(c,x)).length;
    const nn=meas.filter(x=>mv(x,c.k)!=null).length;
    w('| '+(i?'约束':'**主目标**')+' | '+f.n+' | '+(c.n||(c.cmp+' '+c.v+f.unit))+' | '
      +(nn?ok+' / '+nn:'没有实测值')+' |');
  });
  w('');
  if(det)w(det.delta!=null
    ? ('可检出效应：这一轮 n = '+reps+'，'+F.n+' 上能分辨的最小差异约 '
       +(det.log&&det.fold?(det.fold.toFixed(1)+' 倍'):(det.delta.toFixed(2)+F.unit))
       +'（α=0.05 双侧，功效 80%，重复测量 σ='+det.sigma.toFixed(3)+'）。')
    : ('可检出效应：算不出。'+det.why));
  w('');

  w('## 三 · 候选与筛选');
  w('');
  w('- 本轮生成 **'+L.length+'** 条候选，其中 **'+meas.length+'** 条有实测值');
  w('- 准入闸门：ipTM ≥ '+S.gate.toFixed(2)+'（闸门，不是排序器）');
  const dup=L.filter(c=>c.dupOf).length;
  if(dup)w('- 查重排除 '+dup+' 条（与历史变体突变组合相同）');
  const fk={};L.filter(c=>c.disposition==='failed').forEach(c=>{fk[c.failKind]=(fk[c.failKind]||0)+1});
  if(Object.keys(fk).length)w('- 测定失败 '+Object.values(fk).reduce((a,b)=>a+b,0)+' 条：'
    +Object.keys(fk).map(k=>(FAIL_REASON[k]||k)+' '+fk[k]).join('、')
    +'（失败不是缺失，进训练集但与成功数据分开标记）');
  w('');

  w('## 四 · 湿实验');
  w('');
  if(bs.length){
    w('| 批次 | 实验节点 | 条数 | 宿主 | 测定 | 重复 | 状态 | 周转 |');
    w('|---|---|---|---|---|---|---|---|');
    bs.forEach(b=>{const d=batchSpanDays(b);
      w('| '+b.id+' | '+b.vendor+' | '+b.n+' | '+(b.ctx||{}).host+' | '
        +((b.ctx||{}).assay||[]).join(' / ')+' | '+(b.ctx||{}).reps+' | '
        +(EXP_STATUS.find(x=>x.k===b.status)||{n:b.status}).n+' | '
        +(d!=null?fmtDays(d):'在途 '+fmtDays(batchAgeDays(b)))+' |')});
    w('');
    w('孔板：'+plateNote()+'，可放 '+plateCap()+' 条变体。');
  }else w('这一轮还没有批次。');
  w('');
  if(T.n)w('本项目历史周转中位 '+fmtDays(T.med)+'（'+fmtDays(T.min)+'–'+fmtDays(T.max)+'，'+T.n+' 个走完的批次）。');
  w('');

  w('## 五 · 结果');
  w('');
  if(meas.length){
    const key=t&&t.primary?t.primary.k:null;
    const vals=key?meas.map(c=>mv(c,key)).filter(v=>v!=null):[];
    if(vals.length){const f=FIELD[key];
      const best=f.better==='high'?Math.max.apply(null,vals):Math.min.apply(null,vals);
      w('- '+f.n+' 最好值 **'+best+f.unit+'**，目标 '+t.primary.v+f.unit);}
    if(projFields(P).indexOf('kd')>=0){
      const K=meas.filter(c=>mv(c,'kd')!=null);
      const z=K.filter(kdCensored).length;
      w('- KD 几何平均 '+kdNum(kdGeoMean(K))+FIELD.kd.unit
        +(z?('；另有 '+z+' 条低于 SPR 可靠下限（< '+FIELD.kd.floor.toFixed(1)+FIELD.kd.unit
            +'），没有并进这个平均——加重复救不回来，要换停流动力学'):''));}
  }else w('这一轮还没有实测值。');
  w('');

  /* 裁决是**项目级**的：它比的是最近两个有结果的轮次，不一定就是这一轮。
     不说清楚，上面「最好值 6.8℃ 已达标」和下面「距目标还差 0.7℃」会看起来自相矛盾。 */
  const cmpR=adv&&adv.per&&adv.per.length>=2
    ? adv.per.slice(-2).map(x=>'R'+x.i).join(' → ') : null;
  w('## 六 · 裁决'+(cmpR?'（项目级，按最近两个有结果的轮次 '+cmpR+'）':''));
  w('');
  if(adv){
    w('**'+(ADVICE[adv.verdict]||['—'])[0]+'**');
    w('');
    (adv.why||[]).forEach(x=>w('- '+x));
    if(cmpR&&adv.per.slice(-1)[0].i!==r.i)
      w('\n> 注意：这条裁决比的是 '+cmpR+'，不是本报告的 Round '+r.i+'。'
        +'上面第五节给的是 Round '+r.i+' 自己的结果。');
  }else w('目标还没设，给不出裁决。');
  w('');

  w('## 七 · 这一次用了什么');
  w('');
  runProv().forEach(x=>w('- '+x[0]+'：'+x[1]));
  const U=UNIP[P.id];
  if(U)w('- 功能注释：UniProt '+U.acc+'，取回于 '+UNIP_AT+'（成熟链编号 = UniProt 编号 − '+unipOffset(P.id)+'）');
  w('');

  w('## 八 · 这份报告不做的事');
  w('');
  w('- 不给「按置信度排序的推荐顺序」。置信度作为闸门有效，作为同一界面内的排序器无效。');
  w('- 不给五维的总分。五维来源不同、量纲不同，加权成一个数会把取舍藏起来。');
  const U2=UNIP[P.id];
  if(U2&&unipClash(P.id).length){
    const hard=unipClash(P.id).filter(x=>x.f.t==='ACT_SITE'||x.f.t==='BINDING');
    if(hard.length)w('- 本项目有 '+hard.length+' 个位点改在功能注释上（'
      +hard.map(x=>x.mature).join('、')+'）。这些变体还有没有原来的活性要单独测，不能从结合数据里推。');
  }
  w('- 免疫原性、糖基化位点变化、体内寡聚：当前环境没有可用模型，未预测。');
  w('');
  return L8.join('\n');
}

/* ---- 一个任务产出了哪些产物 ---- */
function artsOf(t){
  if(!t||t.st!=='done')return [];
  const pid=t.pid, L=pid?CANDS(pid):[], tag=slug(t.id);
  const out=[];
  if(t.cap==='str'){
    out.push(artOf('structure',tag+'_structure_ref',
      [['格式','PDBx/mmCIF'],['内容','条目编号与取回地址']],()=>artStructRef(pid,t.ref),
      {ext:'json',mime:'application/json',name:tag+'_structure_ref.json'}));
    out.push(artOf('confidence',tag+'_confidence',
      [['条数',String(L.filter(c=>typeof c.iptm==='number').length)]],()=>artConfJson(pid,L)));
  }
  if(t.cap==='des'){
    const D=L.filter(c=>(c.muts||[]).length);
    out.push(artOf('seq',tag+'_designs',
      [['条数',String(D.length)],['含野生型','否']],()=>artDesignFasta(pid,D)));
    out.push(artOf('variants',tag+'_variants',
      [['条数',String(D.length)],['列',String(7+projFields(pid).length)]],()=>artVariantsCsv(pid,D)));
  }
  if(t.cap==='seq'||t.cap==='func'){
    out.push(artOf('seq',tag+'_wildtype',[['长度',(PRJ_WT[pid]||'').length+' aa']],()=>artSeqFasta(pid)));
    if(UNIP[pid])out.push(artOf('annotations',tag+'_annotations',
      [['来源','UniProt '+UNIP[pid].acc],['取回',UNIP_AT]],()=>artAnnJson(pid)));
  }
  if(t.cap==='wet'){
    const b=BATCHES.find(x=>x.pid===pid&&x.results!=='none');
    out.push(artOf('plate',tag+'_plate',[['板型',plateOf().fmt+' 孔'],['重复数','n = '+repsNow()]],
      ()=>platesCsv()));
    if(b)out.push(artOf('result_file',tag+'_'+slug(b.id)+'_raw',
      [['批次',b.id],['结果',RESULTS_STATUS[b.results]]],
      ()=>artVariantsCsv(pid,L.filter(c=>c.batch===b.id)),
      {warn:'这是从变体库回算的，不是实验节点回传的原始表'}));
  }
  out.push(artOf('run',tag+'_run',[['任务',t.id],['状态',(JOB_ST[t.st]||['—'])[0]]],()=>artRunJson(t)));
  return out;
}

/* 可用性不写断言，只写测出来的东西。有端点的就真打一次，
   把 HTTP 状态和耗时原样放出来；没接端点的说没接，这是注册表的事实。 */
const TOOL_EP={
 'UniProt 取序':{n:'rest.uniprot.org',u:'https://rest.uniprot.org/uniprotkb/P61626.json'},
 'PDB 取结构': {n:'data.rcsb.org', u:'https://data.rcsb.org/rest/v1/core/entry/1BRS'}};
const AV={};
async function probe(n){
  const ep=TOOL_EP[n];if(!ep)return;
  AV[n]={st:'run'};render();
  const t0=performance.now();
  try{
    const r=await fetch(ep.u,{method:'GET'});
    AV[n]={st:r.ok?'ok':'bad',code:r.status+' '+r.statusText,
      ms:Math.round(performance.now()-t0),at:Date.now()};
  }catch(e){
    AV[n]={st:'err',code:(e&&e.message)||'请求未发出',
      ms:Math.round(performance.now()-t0),at:Date.now()};
  }
  render();
}

/* 可直接运行的例子：从契约里的第一个输入字段挑一个真实存在的值。
   凑不出来的就说凑不出来，不放一个跑不通的例子。 */
function toolEg(t){
  const c=contractOf(t),f=(c.i[0]||{}).f;
  if(f==='seq')      return {v:SEEK_EG[0][2],lbl:'示例序列（'+SEEK_EG[0][0]+'）',go:'seq'};
